<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<!-- No maximum-scale: capping zoom breaks accessibility for low-vision users. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Speedy Delivery Inc. · Complete accounting workflow</title>
<meta name="description" content="Short explanations, clear diagrams, then real accounting work. Build the tabular summary, journalize, and assemble financial statements yourself." />
<meta name="theme-color" content="#080B10" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledgerly" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
/* ============================================================
   Ledgerly design system
   ============================================================ */
:root {
  --bg: #080b10;
  --bg-2: #0c1219;
  --surface: #121a23;
  --surface-2: #18232f;
  --surface-3: #1f2c3a;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #e9f1f8;
  --text-dim: #a8bacb;
  --muted: #7d92a6;

  --brand: #3ddc97;
  --brand-deep: #12b981;
  --brand-soft: rgba(61, 220, 151, 0.14);
  --cyan: #62e0f5;
  --violet: #9d8cff;
  --violet-soft: rgba(157, 140, 255, 0.14);
  --amber: #ffc46b;
  --amber-soft: rgba(255, 196, 107, 0.14);
  --rose: #ff7a85;
  --rose-soft: rgba(255, 122, 133, 0.14);
  --on-brand: #04140d;

  --asset: #62e0f5;
  --liability: #ffc46b;
  --equity: #9d8cff;
  /* Annotation orange: a distinct role, never a semantic state. */
  --anno: #ff8a4c;
  --anno-soft: rgba(255, 138, 76, 0.16);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  /* Neutral elevation only. Coloured haloes read as decoration, not depth. */
  --shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.75);
  --shadow-lift: 0 14px 34px -16px rgba(0, 0, 0, 0.85);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bar-h: 76px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="light"] {
  --bg: #f4f7fa;
  --bg-2: #eaeff5;
  --surface: #ffffff;
  --surface-2: #f2f6fa;
  --surface-3: #e6edf4;
  --line: rgba(11, 20, 32, 0.09);
  --line-strong: rgba(11, 20, 32, 0.18);
  --text: #0b1420;
  --text-dim: #3d4d5f;
  --muted: #61748a;

  --brand: #0d9b6c;
  --brand-deep: #067a54;
  --brand-soft: rgba(13, 155, 108, 0.12);
  --cyan: #0d8fb3;
  --violet: #6a55e8;
  --violet-soft: rgba(106, 85, 232, 0.12);
  --amber: #a9720b;
  --amber-soft: rgba(169, 114, 11, 0.14);
  --rose: #d63a52;
  --rose-soft: rgba(214, 58, 82, 0.12);
  --on-brand: #ffffff;

  --asset: #0d8fb3;
  --liability: #a9720b;
  --equity: #6a55e8;
  --anno: #d2560a;
  --anno-soft: rgba(210, 86, 10, 0.14);
  --shadow: 0 16px 36px -24px rgba(11, 20, 32, 0.5);
  --shadow-lift: 0 22px 50px -26px rgba(11, 20, 32, 0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(70% 45% at 12% -6%, rgba(61, 220, 151, 0.12), transparent 68%),
    radial-gradient(60% 40% at 92% 4%, rgba(157, 140, 255, 0.11), transparent 66%);
}
html[data-theme="light"] body::before {
  background:
    radial-gradient(70% 45% at 12% -6%, rgba(13, 155, 108, 0.09), transparent 68%),
    radial-gradient(60% 40% at 92% 4%, rgba(106, 85, 232, 0.08), transparent 66%);
}

h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--brand); }

/* Keyboard focus must stay visible everywhere. tap-highlight is suppressed
   above for touch, which would otherwise leave keyboard users with nothing. */
:focus-visible {
  outline: 2px solid var(--ring, var(--brand));
  outline-offset: 3px;
  border-radius: 6px;
}
.opt:focus-visible, .sortrow:focus-visible, .seqitem:focus-visible,
.mission:focus-visible, .hero:focus-visible { outline-offset: 2px; }

.app {
  position: relative;
  z-index: 1;
  /* vh first as a fallback for WebViews without dvh support — without a
     resolved height the scroll containers below would collapse. */
  height: 100vh;
  max-height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.wrap {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 0 18px;
}

.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.is-active { display: flex; animation: screen-in 0.34s var(--ease); }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.scroller {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-top: max(14px, env(safe-area-inset-top));
  padding-bottom: 26px;
}
.screen > .scroller:last-child { padding-bottom: calc(26px + env(safe-area-inset-bottom)); }

/* ---------- typography helpers ---------- */
.eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
}
.display { font-size: 30px; line-height: 1.14; font-weight: 760; letter-spacing: -0.028em; }
.title { font-size: 22px; line-height: 1.22; font-weight: 720; letter-spacing: -0.02em; }
.subtitle { font-size: 17px; font-weight: 680; letter-spacing: -0.012em; }
.body { color: var(--text-dim); font-size: 15.5px; line-height: 1.62; }
.small { font-size: 13px; color: var(--muted); line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.pos { color: var(--brand); }
.neg { color: var(--rose); }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 20px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--line);
  transition: transform 0.16s var(--ease), opacity 0.16s, background 0.16s;
}
.btn:active { transform: scale(0.975); }
.btn[disabled] { opacity: 0.42; pointer-events: none; }
.btn-primary {
  background: linear-gradient(180deg, var(--brand), var(--brand-deep));
  color: var(--on-brand);
  border-color: transparent;
  box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.55);
}
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 640; }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; font-size: 14px; padding: 0 14px; border-radius: 11px; }

/* ---------- bottom action bar ---------- */
.actionbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, var(--bg) 34%);
}
.actionbar-inner {
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
.actionbar-inner .btn-primary, .actionbar-inner .grow { flex: 1; }

/* ---------- tab bar ---------- */
.tabbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1;
  max-width: 130px;
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 7px 4px;
  border-radius: 13px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.01em;
  transition: color 0.18s, background 0.18s;
}
.tab svg { width: 21px; height: 21px; }
.tab.is-active { color: var(--brand); background: var(--brand-soft); }

/* ---------- diagrams ---------- */
.figure {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
}
.figure-cap { font-size: 11.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); margin-bottom: 13px; }

.eqbar { display: grid; gap: 8px; }
.eqbar-row { display: flex; align-items: stretch; gap: 8px; }
.eqbar-seg {
  border-radius: var(--r-sm);
  padding: 11px 12px;
  display: grid;
  gap: 2px;
  align-content: center;
  border: 1px solid;
  min-height: 62px;
}
.eqbar-seg b { font-size: 14.5px; font-weight: 740; letter-spacing: -0.01em; }
.eqbar-seg span { font-size: 11.5px; opacity: 0.82; line-height: 1.35; }
.seg-asset { background: color-mix(in srgb, var(--asset) 15%, transparent); border-color: color-mix(in srgb, var(--asset) 40%, transparent); color: var(--asset); }
.seg-liability { background: color-mix(in srgb, var(--liability) 15%, transparent); border-color: color-mix(in srgb, var(--liability) 40%, transparent); color: var(--liability); }
.seg-equity { background: color-mix(in srgb, var(--equity) 15%, transparent); border-color: color-mix(in srgb, var(--equity) 40%, transparent); color: var(--equity); }
.eq-op { display: grid; place-items: center; font-size: 19px; font-weight: 800; color: var(--muted); padding: 0 2px; }

.flow { display: grid; gap: 8px; }
.flow-node {
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  padding: 12px 14px;
}
.flow-node b { font-size: 14.5px; font-weight: 720; display: block; }
.flow-node span { font-size: 12.5px; color: var(--muted); }
.flow-arrow { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--brand); font-size: 12px; font-weight: 640; line-height: 1; }
.flow-arrow svg { width: 16px; height: 16px; }

.tgrid { display: grid; grid-template-columns: 1fr 1fr; }
.taccount { border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.taccount-name { padding: 9px 12px; font-weight: 720; font-size: 14px; text-align: center; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); }
.taccount-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 92px; }
.taccount-col { padding: 9px 10px; display: grid; gap: 5px; align-content: start; }
.taccount-col:first-child { border-right: 1px solid var(--line-strong); }
.taccount-head { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.taccount-val { font-family: var(--mono); font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.taccount-total { border-top: 1px solid var(--line-strong); padding-top: 5px; font-weight: 700; }

.rulegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.rule {
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
}
.rule b { display: block; font-size: 12.5px; font-weight: 760; margin-bottom: 3px; }
.rule span { font-size: 12px; color: var(--muted); line-height: 1.45; }

.cyclewheel { display: grid; gap: 7px; }
.cyclephase {
  display: flex; gap: 11px; align-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
}
.cyclephase i {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 9px;
  display: grid; place-items: center; font-style: normal;
  font-size: 12px; font-weight: 800;
  background: var(--brand-soft); color: var(--brand);
}
.cyclephase b { font-size: 13.5px; font-weight: 720; display: block; }
.cyclephase span { font-size: 12px; color: var(--muted); }

/* ============================================================
   Accounting document language
   Ruled paper, source documents, and statements set the way an
   accountant sets them: right-aligned tabular figures, a single
   rule above a subtotal, a double rule under a final total.
   ============================================================ */

/* --- source documents (receipt, invoice, note) --- */
.doc {
  position: relative;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  padding: 14px 16px 16px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.7;
  font-variant-numeric: tabular-nums;
}
.doc::before {
  content: "";
  position: absolute; inset: 0 0 auto 0; height: 3px;
  border-radius: 4px 4px 0 0;
  background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px);
}
.doc-kind {
  font-family: var(--font);
  font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.doc-issuer { font-weight: 700; color: var(--text); }
.doc-row { display: flex; justify-content: space-between; gap: 14px; }
.doc-row span:last-child { white-space: nowrap; }
.doc-total {
  display: flex; justify-content: space-between; gap: 14px;
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--line-strong);
  font-weight: 700; color: var(--text);
}
.doc-note { font-family: var(--font); font-size: 12px; color: var(--muted); margin-top: 9px; font-style: italic; }

/* --- financial statements in proper form --- */
.stmt {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 16px 14px;
  font-variant-numeric: tabular-nums;
}
.stmt-head { text-align: center; margin-bottom: 14px; }
.stmt-head b { display: block; font-size: 13.5px; font-weight: 780; letter-spacing: 0.02em; }
.stmt-head span { display: block; font-size: 12.5px; color: var(--text-dim); }
.stmt-head i { display: block; font-size: 11.5px; color: var(--muted); font-style: normal; }
.stmt-line { display: flex; align-items: baseline; gap: 10px; font-size: 13px; padding: 2px 0; }
.stmt-line .lbl { flex: 1; min-width: 0; }
.stmt-line .amt { font-family: var(--mono); text-align: right; white-space: nowrap; min-width: 74px; }
.stmt-line.indent .lbl { padding-left: 16px; }
.stmt-line.head-line { font-weight: 700; }
.stmt-line.total { font-weight: 700; }
.stmt-line.total .amt { border-top: 1px solid var(--line-strong); padding-top: 3px; }
.stmt-line.grand .amt {
  border-top: 1px solid var(--line-strong);
  border-bottom: 3px double var(--line-strong);
  padding: 3px 0;
  font-weight: 780;
}
.stmt-gap { height: 9px; }
.stmt-tie {
  margin-top: 12px; padding: 9px 11px;
  border-radius: var(--r-sm);
  background: var(--brand-soft);
  border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent);
  font-size: 12.5px; color: var(--text-dim);
}
.stmt-tie b { color: var(--brand); }

/* --- running summary strip --- */

/* --- guided walkthrough --- */
.wt-source { margin-bottom: 4px; }
.wt-steps { display: grid; gap: 10px; margin-top: 14px; }
.wt-step {
  border: 1px solid var(--line);
  border-left: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  padding: 13px 14px;
}
.wt-step.is-locked { opacity: 0.42; pointer-events: none; }
.wt-step.is-done { border-color: color-mix(in srgb, var(--brand) 42%, transparent); }
.wt-head { display: flex; gap: 10px; align-items: flex-start; }
.wt-no {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
  background: var(--surface-3); color: var(--text-dim);
}
.wt-step.is-done .wt-no { background: var(--brand); color: var(--on-brand); }
.wt-no svg { width: 13px; height: 13px; }
.wt-ask { font-size: 14.5px; font-weight: 640; line-height: 1.42; flex: 1; }
.wt-body { margin-top: 11px; }
.wt-opts { display: flex; flex-wrap: wrap; gap: 7px; }
.wt-opt {
  padding: 0 13px; min-height: 44px;
  border-radius: 11px;
  border: 1.5px solid var(--line-strong);
  background: var(--surface);
  font-size: 13.5px; font-weight: 620;
  transition: border-color 0.16s, background 0.16s, transform 0.16s var(--ease);
}
.wt-opt:active { transform: scale(0.98); }
.wt-opt.picked { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.wt-opt.right { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.wt-opt.wrong { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); }
.wt-why {
  margin-top: 11px; padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-size: 13px; line-height: 1.55; color: var(--text-dim);
  animation: pop 0.26s var(--ease);
}
.wt-why b { color: var(--text); }
.wt-why.miss { background: var(--rose-soft); border-color: color-mix(in srgb, var(--rose) 32%, transparent); }
.wt-post {
  margin-top: 12px; padding: 11px 13px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--brand) 36%, transparent);
  background: var(--brand-soft);
  font-size: 13.5px; line-height: 1.5;
}
.wt-post b { color: var(--brand); }

/* Source data the task needs, shown with the task. */
.task-context {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  padding: 13px 14px;
}
.task-context .facts { margin-top: 0; }
.task-context .ctx-cap {
  font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}

/* Blank amount slot on an unfilled statement form. */
.amt-blank {
  display: inline-block;
  width: 58px;
  border-bottom: 1px dotted var(--line-strong);
  height: 1em;
  vertical-align: -0.15em;
}

.reveal { margin-top: 14px; animation: pop 0.32s var(--ease); }

/* ============================================================
   Workflow guide
   Numbered steps down a rail. Each step frames the accounting
   artefact it acts on and rings the exact cell it fills.
   ============================================================ */
.wf-head {
  position: sticky; top: 0; z-index: 15;
  padding: max(12px, env(safe-area-inset-top)) 18px 12px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.wf-head-inner { max-width: 660px; margin: 0 auto; display: flex; align-items: center; gap: 11px; }
.wf-head-title { flex: 1; min-width: 0; }
.wf-head-title b { display: block; font-size: 14.5px; font-weight: 740; letter-spacing: -0.015em; }
.wf-head-title span { display: block; font-size: 12px; color: var(--muted); }

.wf-phase {
  display: flex; align-items: center; gap: 11px;
  margin: 26px 0 14px;
}
.wf-phase b { font-size: 12px; font-weight: 800; letter-spacing: 0.11em; text-transform: uppercase; color: var(--brand); }
.wf-phase i {
  flex: 1; height: 1px; font-style: normal;
  background: linear-gradient(90deg, color-mix(in srgb, var(--brand) 40%, transparent), transparent);
}

.wf-step { position: relative; display: flex; gap: 14px; padding-bottom: 18px; }
/* The rail reads the list as a sequence rather than a stack of cards. */
.wf-step::before {
  content: ""; position: absolute; left: 15px; top: 34px; bottom: 0;
  width: 2px; background: var(--line);
}
.wf-step:last-child::before { display: none; }
.wf-badge {
  position: relative; z-index: 1;
  flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  background: var(--surface-3); color: var(--text-dim);
  border: 2px solid var(--bg);
}
.wf-step.is-key .wf-badge { background: var(--brand); color: var(--on-brand); }
.wf-main { flex: 1; min-width: 0; padding-top: 4px; }
.wf-do { font-size: 15.5px; font-weight: 660; line-height: 1.4; letter-spacing: -0.012em; }
.wf-note { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-top: 6px; }
.wf-note b { color: var(--text-dim); }

/* Framed artefact, the way Scribe frames a screenshot. */
.shot {
  margin-top: 12px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.shot-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted);
}
.shot-dots { display: flex; gap: 4px; }
.shot-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.shot-body { padding: 0; }
.shot-body .wp-table { font-size: 11.5px; }
.shot-body .stmt { border: 0; border-radius: 0; }
.shot-body .doc { border: 0; border-radius: 0; }
.shot-body .doc::before { display: none; }
.shot .balance-line { border-radius: 0; }

/* The ring. One annotation role, one colour, never semantic. */
.wp-table td.anno, .stmt-line.anno .amt { position: relative; color: var(--anno) !important; font-weight: 700; }
.wp-table td.anno::after {
  content: ""; position: absolute; inset: -2px 0;
  border: 2px solid var(--anno); border-radius: 50%;
  pointer-events: none;
}
.stmt-line.anno { background: var(--anno-soft); border-radius: 5px; }
.stmt-line.anno .lbl { color: var(--anno); font-weight: 700; }
.wp-table tr.anno-row td { background: var(--anno-soft); }
.wp-table col.anno-col { background: var(--anno-soft); }

.wf-tag {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--anno-soft);
  color: var(--anno);
  font-size: 12px; font-weight: 700;
}
.wf-tag svg { width: 13px; height: 13px; }

.wf-result {
  margin-top: 12px; padding: 11px 13px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--brand) 34%, transparent);
  background: var(--brand-soft);
  font-size: 13.5px; line-height: 1.5; color: var(--text-dim);
}
.wf-result b { color: var(--brand); }

/* --- What / Why / How --- */
.wwh { display: grid; gap: 12px; }
.wwh-block {
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 15px 16px;
}
.wwh-tag {
  display: inline-block;
  font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
  margin-bottom: 7px;
}
.wwh-what .wwh-tag { color: var(--asset); }
.wwh-why .wwh-tag { color: var(--liability); }
.wwh-how .wwh-tag { color: var(--equity); }
.wwh-block p { font-size: 15px; line-height: 1.6; color: var(--text-dim); }
.wwh-block p + p { margin-top: 10px; }
.wwh-block strong { color: var(--text); font-weight: 700; }
.howlist { display: grid; gap: 9px; counter-reset: how; margin-top: 2px; }
.howstep { display: flex; gap: 11px; font-size: 14.5px; line-height: 1.5; color: var(--text-dim); }
.howstep i {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;
  display: grid; place-items: center; font-style: normal;
  font-size: 11px; font-weight: 800;
  background: var(--violet-soft); color: var(--violet);
}

/* ---------- misc ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 720px) {
  .display { font-size: 34px; }
  .wrap { max-width: 660px; }
  .actionbar-inner, .lesson-head-inner { max-width: 660px; }
  .rulegrid { grid-template-columns: repeat(2, 1fr); }
  .effect-line { flex-wrap: nowrap; }
}
@media (max-width: 360px) {
  .amount-wrap { flex-basis: 96px; }
  .display { font-size: 26px; }
}


/* ---------- the tabular summary ---------- */
.wp-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.wp-table {
  border-collapse: collapse;
  width: max-content; min-width: 100%;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.wp-table th, .wp-table td { padding: 7px 9px; text-align: right; white-space: nowrap; }
.wp-table thead th {
  font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--line-strong);
  font-family: var(--font);
}
.wp-table th.group { text-align: center; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.wp-table .c-asset { color: var(--asset); }
.wp-table .c-liability { color: var(--liability); }
.wp-table .c-equity { color: var(--equity); }
.wp-table tfoot td { border-top: 1.5px solid var(--line-strong); font-weight: 700; padding-top: 8px; }
.wp-table td.rowlabel, .wp-table th.rowlabel {
  text-align: left; color: var(--muted);
  font-family: var(--font); font-size: 11px;
  position: sticky; left: 0; background: var(--surface);
}
.wp-table td.sep, .wp-table th.sep { border-left: 1px solid var(--line); }
.wp-table td.zero { color: var(--line-strong); }

.balance-line {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px 12px;
  border-top: 1px solid var(--line-strong);
  background: var(--surface-2);
  font-family: var(--mono); font-size: 13.5px;
  font-variant-numeric: tabular-nums; font-weight: 700;
}
.balance-line.ok { color: var(--brand); background: var(--brand-soft); }
.balance-line svg { width: 15px; height: 15px; vertical-align: -2px; }
.bal-ok { display: inline-flex; align-items: center; }

/* ---------- app chrome ---------- */
.brand-dot {
  flex: 0 0 auto;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--brand), var(--cyan));
  color: var(--on-brand);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.icon-btn {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 13px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-dim);
}
.icon-btn svg { width: 18px; height: 18px; }

.wf-progress { max-width: 660px; margin: 10px auto 0; height: 3px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.wf-progress i { display: block; height: 100%; width: 100%; border-radius: 999px; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, var(--brand), var(--cyan)); transition: transform 0.45s var(--ease); }

.phase-nav {
  position: sticky; top: 0; z-index: 14;
  display: flex; gap: 7px;
  padding: 11px 18px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  background: color-mix(in srgb, var(--bg) 92%, transparent);

  border-bottom: 1px solid var(--line);
}
.phase-nav::-webkit-scrollbar { display: none; }
.pchip {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font-size: 13px; font-weight: 700;
  white-space: nowrap;
  transition: color 0.18s, background 0.18s, border-color 0.18s;
}
.pchip.on { color: var(--brand); background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 40%, transparent); }

/* ---------- intro ---------- */
#intro { padding: 26px 0 4px; }
.lede { font-size: 15px; color: var(--muted); margin-top: 7px; }
.deliver {
  margin-top: 16px;
  display: flex; gap: 11px;
  padding: 13px 15px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--amber) 32%, transparent);
  background: var(--amber-soft);
}
.deliver svg { flex: 0 0 auto; width: 17px; height: 17px; color: var(--amber); margin-top: 2px; }
.deliver p { font-size: 14.5px; line-height: 1.55; color: var(--text-dim); }
.deliver b { color: var(--text); }

.meta { font-size: 13px; color: var(--muted); }
.meta b { font-size: 17px; font-weight: 760; color: var(--text); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* ---------- problem facts ---------- */
.factbox {
  margin-top: 12px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--surface);
  padding: 14px 15px;
}
.ctx-cap { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }
.facts { display: grid; gap: 9px; }
.fact { display: flex; gap: 11px; font-size: 14px; line-height: 1.45; color: var(--text-dim); }
.fact i {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 7px;
  display: grid; place-items: center; font-style: normal;
  font-size: 11px; font-weight: 800;
  background: var(--violet-soft); color: var(--violet);
}

/* ---------- transaction effect strip ---------- */
.fx {
  display: flex; align-items: stretch; gap: 9px;
  margin-top: 12px;
  padding: 12px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.fx-side { flex: 1; min-width: 0; display: grid; gap: 5px; align-content: start; }
.fx-side:last-child { text-align: right; justify-items: end; }
.fx-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.fx-item { font-size: 13px; font-weight: 620; line-height: 1.35; }
.fx-item b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
.fx-eq { display: grid; place-items: center; font-size: 17px; font-weight: 800; color: var(--muted); }

/* ---------- warning callout ---------- */
.wf-warn {
  display: flex; gap: 10px;
  margin-top: 12px; padding: 11px 13px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--rose) 34%, transparent);
  background: var(--rose-soft);
}
.wf-warn svg { flex: 0 0 auto; width: 16px; height: 16px; color: var(--rose); margin-top: 2px; }
.wf-warn p { font-size: 13.5px; line-height: 1.5; color: var(--text-dim); }

/* ---------- step tick ---------- */
.wf-badge { cursor: pointer; }
/* Visual circle stays 32px; the hit area is padded out to the 44px floor. */
.wf-badge::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
.wf-badge svg { display: none; width: 15px; height: 15px; }
.wf-step.is-done .wf-badge { background: var(--brand); color: var(--on-brand); }
.wf-step.is-done .wf-badge .wf-n { display: none; }
.wf-step.is-done .wf-badge svg { display: block; }
.wf-step.is-done .wf-do { color: var(--muted); }
.wf-phase-block { scroll-margin-top: 78px; }
.wf-blurb { font-size: 14px; color: var(--muted); margin: -6px 0 16px; line-height: 1.5; }

.foot { display: grid; gap: 14px; justify-items: start; padding: 22px 0 8px; margin-top: 12px; border-top: 1px solid var(--line); }

</style>
</head>
<body>
<div class="app" id="app">

  <header class="wf-head">
    <div class="wf-head-inner">
      <div class="brand-dot" style="width:34px;height:34px;border-radius:11px;font-size:16px">L</div>
      <div class="wf-head-title">

</div>
<script>
/* ============================================================
   THE COMPREHENSIVE PROBLEM — one source of truth.
   The workpaper, every annotated snapshot and all three
   statements derive from this, so they cannot disagree.
   ============================================================ */
var EQ_ACCOUNTS = [
  { k: 'cash',  n: 'Cash',                g: 'asset',     abbr: 'Cash' },

];

var SVG = {

  ring:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>',
  bulb:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18h5M11 21h2"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6h5.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>',
  warn:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  sun:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};

var SPEEDY = {
  company: 'Speedy Delivery Inc.',
  period: 'For the Month Ended July 31, 2025',
  asAt: 'July 31, 2025',
  rows: [
    { no: '1',  text: 'Stockholders invested $10,000 cash in exchange for common stock.', fx: [['cash', 1, 10000], ['cs', 1, 10000]] },
    { no: '2',  text: 'Paid $800 for July rent.',                                          fx: [['cash', -1, 800], ['exp', 1, 800]] },
    { no: '3',  text: 'Purchased office equipment on account, $3,000.',                    fx: [['equip', 1, 3000], ['ap', 1, 3000]] },
    { no: '4',  text: 'Performed delivery services for clients for cash, $1,500.',         fx: [['cash', 1, 1500], ['rev', 1, 1500]] },
    { no: '5',  text: 'Borrowed $700 cash from a bank on a note payable.',                 fx: [['cash', 1, 700], ['np', 1, 700]] },
    { no: '6',  text: 'Performed delivery services for a client on account, $2,000.',      fx: [['ar', 1, 2000], ['rev', 1, 2000]] },
    { no: '7a', text: 'Paid salaries, $500.',                                              fx: [['cash', -1, 500], ['exp', 1, 500]] },
    { no: '7b', text: 'Paid utilities, $300.',                                             fx: [['cash', -1, 300], ['exp', 1, 300]] },
    { no: '7c', text: 'Paid advertising, $100.',                                           fx: [['cash', -1, 100], ['exp', 1, 100]] }
  ]
};

var PROBLEM_FACTS = [
  'Stockholders invested $10,000 cash in exchange for common stock.',
  'Paid $800 for July rent.',
  'Purchased office equipment on account, $3,000.',
  'Performed delivery services for clients for cash, $1,500.',
  'Borrowed $700 cash from a bank on a note payable.',
  'Performed delivery services for a client on account, $2,000.',
  'Paid monthly expenses: salaries $500, utilities $300, and advertising $100.'
];

function speedyBalances(upto) {
  var bal = {};
  EQ_ACCOUNTS.forEach(function (a) { bal[a.k] = 0; });
  SPEEDY.rows.slice(0, upto).forEach(function (r) {
    r.fx.forEach(function (e) { bal[e[0]] += e[1] * e[2]; });
  });
  return bal;
}
function assetsOf(b) { return b.cash + b.ar + b.equip; }
function claimsOf(b) { return b.np + b.ap + b.cs + b.rev - b.exp - b.div; }
function num(n) { return Math.abs(n).toLocaleString('en-US'); }

/* ---------- accounting artefacts ---------- */

function docFig(kind, issuer, rows, total, note) {
  return '<div class="doc"><div class="doc-kind">' + kind + '</div>' +
    '<div class="doc-issuer">' + issuer + '</div>' +
    rows.map(function (r) {
      return '<div class="doc-row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
    }).join('') +
    (total ? '<div class="doc-total"><span>' + total[0] + '</span><span>' + total[1] + '</span></div>' : '') +
    (note ? '<div class="doc-note">' + note + '</div>' : '') + '</div>';
}

function stmtFig(name, dateline, lines) {
  return '<div class="stmt">' +
    '<div class="stmt-head"><b>' + SPEEDY.company + '</b><span>' + name + '</span><i>' + dateline + '</i></div>' +
    lines.map(function (l) {
      if (l === 'gap') return '<div class="stmt-gap"></div>';
      return '<div class="stmt-line ' + (l[2] || '') + '"><span class="lbl">' + l[0] + '</span>' +
        '<span class="amt">' + l[1] + '</span></div>';
    }).join('') + '</div>';
}

var STMT = {
  income: {
    name: 'Income Statement', dateline: SPEEDY.period,
    lines: [
      ['Revenues', '', 'head-line'],
      ['Service revenue', '$3,500', 'indent'],
      'gap',
      ['Expenses', '', 'head-line'],
      ['Rent expense', '800', 'indent'],
      ['Salaries and wages expense', '500', 'indent'],

      ['Total expenses', '1,700', 'total'],

      ['Add: Net income', '1,800', ''],
      ['', '1,800', 'total'],
      ['Less: Dividends', '0', ''],
      ['Retained earnings, July 31', '$1,800', 'grand']
    ]
  },
  balance: {
    name: 'Balance Sheet', dateline: SPEEDY.asAt,
    lines: [
      ['Assets', '', 'head-line'],
      ['Cash', '$10,500', 'indent'],
      ['Accounts receivable', '2,000', 'indent'],
      ['Equipment', '3,000', 'indent'],
      ['Total assets', '$15,500', 'grand'],
      'gap',
      ['Liabilities and Stockholders&rsquo; Equity', '', 'head-line'],
      ['Notes payable', '$700', 'indent'],
      ['Accounts payable', '3,000', 'indent'],
      ['Total liabilities', '3,700', 'total'],
      'gap',
      ['Common stock', '10,000', 'indent'],
      ['Retained earnings', '1,800', 'indent'],
      ['Total stockholders&rsquo; equity', '11,800', 'total'],
      'gap',
      ['Total liabilities and equity', '$15,500', 'grand']
    ]
  }
};

/* A framed artefact, the way a guide frames a screenshot. */
function shot(cap, inner) {
  return '<div class="shot"><div class="shot-bar"><span class="shot-dots"><i></i><i></i><i></i></span>' +
    cap + '</div><div class="shot-body">' + inner + '</div></div>';
}

/* marks address a cell as [rowIndex, accountKey]; 'T' is the totals row. */
function wpShot(upto, marks, cap) {
  marks = marks || [];
  var has = function (r, k) {
    return marks.some(function (m) { return String(m[0]) === String(r) && m[1] === k; });
  };
  var bal = speedyBalances(upto);
  var groups = '<tr><th class="rowlabel"></th>' +
    '<th class="group c-asset" colspan="3">Assets</th>' +
    '<th class="group c-liability sep" colspan="2">Liabilities</th>' +
    '<th class="group c-equity sep" colspan="4">Stockholders&rsquo; Equity</th></tr>';
  var heads = '<tr><th class="rowlabel">Txn</th>' + EQ_ACCOUNTS.map(function (a) {
    var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
    return '<th class="' + cls + ((a.k === 'np' || a.k === 'cs') ? ' sep' : '') + '">' + a.abbr + '</th>';
  }).join('') + '</tr>';

  var body = SPEEDY.rows.slice(0, upto).map(function (r, ri) {
    var line = {};
    r.fx.forEach(function (e) { line[e[0]] = (line[e[0]] || 0) + e[1] * e[2]; });
    var cells = EQ_ACCOUNTS.map(function (a) {
      var v = line[a.k];
      var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
      var anno = has(ri, a.k) ? ' anno' : '';
      if (!v) return '<td class="zero' + sep + anno + '">&middot;</td>';
      var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
      return '<td class="' + cls + sep + anno + '">' + (v < 0 ? '&minus;' : '+') + num(v) + '</td>';
    }).join('');
    return '<tr><td class="rowlabel">(' + r.no + ')</td>' + cells + '</tr>';
  }).join('');

  var foot = '<tr><td class="rowlabel">Total</td>' + EQ_ACCOUNTS.map(function (a) {
    var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
    var anno = has('T', a.k) ? ' anno' : '';
    var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
    return '<td class="' + cls + sep + anno + '">' + (bal[a.k] ? num(bal[a.k]) : '&mdash;') + '</td>';
  }).join('') + '</tr>';

  var A = assetsOf(bal), C = claimsOf(bal);
  var table = '<div class="wp-scroll"><table class="wp-table"><thead>' + groups + heads + '</thead>' +
    '<tbody>' + body + '</tbody>' + (upto ? '<tfoot>' + foot + '</tfoot>' : '') + '</table></div>' +
    (upto ? '<div class="balance-line ok">$' + num(A) + '&nbsp; = &nbsp;$' + num(C) +
      ' <span class="bal-ok">' + SVG.check + '</span></div>' : '');
  return shot(cap || 'Tabular summary', table);
}

function stmtShot(key, markLabels, cap) {
  markLabels = markLabels || [];
  var d = STMT[key];
  var lines = d.lines.map(function (l) {
    if (l === 'gap') return l;
    return markLabels.indexOf(l[0]) !== -1 ? [l[0], l[1], (l[2] || '') + ' anno'] : l;
  });
  return shot(cap || d.name, stmtFig(d.name, d.dateline, lines));
}

function docShot(kind, issuer, rows, total, note) {
  return shot('Source document', docFig(kind, issuer, rows, total, note));
}

/* The equation restated for a single transaction. */
function fxStrip(left, right) {
  function side(cap, items) {
    return '<div class="fx-side"><span class="fx-cap">' + cap + '</span>' +
      items.map(function (i) {
        return '<span class="fx-item c-' + i[2] + '">' + i[0] + ' <b>' + i[1] + '</b></span>';
      }).join('') + '</div>';
  }
  return '<div class="fx">' + side('Assets', left) + '<div class="fx-eq">=</div>' +
    side('Liabilities + Equity', right) + '</div>';
}

/* ============================================================
   THE WORKFLOW
   Speedy Delivery's first month, worked end to end. Each step

   ============================================================ */

</script>
<script>
/* ============================================================
   APP SHELL
   One screen: the workflow guide. Steps can be ticked off as you
   follow along, and the tick state is all that persists.
   ============================================================ */
(function () {
  var STORE = 'ledgerly.flow.v1';
  var state = { done: {}, theme: '' };
  var TOTAL = 0;

  function $(id) { return document.getElementById(id); }

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') { state.done = p.done || {}; state.theme = p.theme || ''; }
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- build ---------- */
  function render() {
    var n = 0;
    WORKFLOW.phases.forEach(function (ph) { ph.steps.forEach(function () { n++; }); });
    TOTAL = n;

    $('intro').innerHTML =
      '<h1 class="display">' + WORKFLOW.company + '</h1>' +
      '<p class="lede">' + WORKFLOW.subtitle + '</p>' +
      '<div class="deliver">' + SVG.bulb + '<p><b>The task.</b> ' + WORKFLOW.deliverable + '</p></div>' +
      '<div class="meta-row">' +
      '<span class="meta"><b>' + TOTAL + '</b> steps</span>' +
      '<span class="meta"><b>' + WORKFLOW.phases.length + '</b> phases</span>' +
      '<span class="meta"><b>9</b> workpaper rows</span>' +
      '</div>';

    $('phase-nav').innerHTML = WORKFLOW.phases.map(function (ph, i) {
      return '<button class="pchip" data-jump="' + ph.id + '">' + (i + 1) + '. ' + ph.name + '</button>';
    }).join('');

    var step = 0;
    $('flow-slot').innerHTML = WORKFLOW.phases.map(function (ph) {
      return '<section class="wf-phase-block" id="ph-' + ph.id + '" data-phase="' + ph.id + '">' +
        '<div class="wf-phase"><b>' + ph.name + '</b><i></i></div>' +
        '<p class="wf-blurb">' + ph.blurb + '</p>' +
        ph.steps.map(function (st) {
          step++;
          var id = 's' + step;
          return '<div class="wf-step' + (st.key ? ' is-key' : '') + (state.done[id] ? ' is-done' : '') + '" data-step="' + id + '">' +
            '<button class="wf-badge" data-tick="' + id + '" aria-pressed="' + (!!state.done[id]) + '" ' +
            'aria-label="Mark step ' + step + ' complete"><span class="wf-n">' + step + '</span>' + SVG.check + '</button>' +
            '<div class="wf-main">' +
            '<div class="wf-do">' + st.do + '</div>' +
            (st.note ? '<p class="wf-note">' + st.note + '</p>' : '') +
            (st.fx ? fxStrip(st.fx[0], st.fx[1]) : '') +
            (st.warn ? '<div class="wf-warn">' + SVG.warn + '<p>' + st.warn + '</p></div>' : '') +
            (st.ring ? '<span class="wf-tag">' + SVG.ring + st.ring + '</span>' : '') +
            (st.art || []).join('') +
            (st.result ? '<div class="wf-result"><b>Result.</b> ' + st.result + '</div>' : '') +
            '</div></div>';
        }).join('') +
        '</section>';
    }).join('');

    $('wf-foot').innerHTML =
      '<div class="foot"><p class="small">Every figure on this page is derived from the nine transactions above, so the workpaper, the snapshots and the three statements can never disagree.</p>' +
      '<button class="btn btn-ghost btn-sm" id="reset">Clear ticks</button></div>';

    $('reset').addEventListener('click', function () {
      state.done = {}; save(); render(); bind(); updateProgress();
    });
  }

  /* ---------- interaction ---------- */
  function bind() {
    $('flow-slot').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tick]');
      if (!b) return;
      var id = b.getAttribute('data-tick');
      state.done[id] = !state.done[id];
      b.setAttribute('aria-pressed', String(!!state.done[id]));
      b.closest('.wf-step').classList.toggle('is-done', !!state.done[id]);
      save();
      updateProgress();
    });
    $('phase-nav').addEventListener('click', function (e) {
      var b = e.target.closest('[data-jump]');
      if (!b) return;
      var el = $('ph-' + b.getAttribute('data-jump'));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function updateProgress() {
    var n = 0, i;
    for (i = 1; i <= TOTAL; i++) if (state.done['s' + i]) n++;
    $('wf-fill').style.transform = 'scaleX(' + (TOTAL ? n / TOTAL : 0) + ')';
    $('head-sub').textContent = n ? n + ' of ' + TOTAL + ' steps done' : TOTAL + ' steps';
  }

  /* Highlight the phase chip for whatever is on screen. */
  function spy() {
    if (!('IntersectionObserver' in window)) return;
    var chips = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'), function (c) {
      chips[c.getAttribute('data-jump')] = c;
    });
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        visible[en.target.getAttribute('data-phase')] = en.isIntersecting;
      });
      var first = null;
      WORKFLOW.phases.forEach(function (ph) { if (!first && visible[ph.id]) first = ph.id; });
      Object.keys(chips).forEach(function (k) { chips[k].classList.toggle('on', k === first); });
      /* Keep the active chip reachable — the nav scrolls sideways on a phone. */
      if (first && chips[first]) {
        var nav = $('phase-nav'), c = chips[first];
        var left = c.offsetLeft - 18;
        if (Math.abs(nav.scrollLeft - left) > 8) nav.scrollTo({ left: left, behavior: 'smooth' });
      }
    }, { root: $('scroller'), rootMargin: '-72px 0px -55% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('[data-phase]'), function (s) { io.observe(s); });
  }

  /* ---------- theme ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f4f7fa' : '#080b10');
  }
  $('theme-toggle').addEventListener('click', function () {
    state.theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(state.theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  if (!state.theme) {
    state.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(state.theme);
  render();
  bind();
  updateProgress();
  spy();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();

</script>
