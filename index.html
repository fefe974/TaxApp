<script>
/* ============================================================
   APP SHELL — progress, navigation, screens
   ============================================================ */
(function () {
  var STORE = 'ledgerly.v1';
  var XP_LESSON = 20, XP_PROJECT = 55, XP_FIRSTTRY = 10;

  var progress = { done: {}, attempts: {}, xp: 0, streak: 0, lastDay: '', theme: '' };

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function yesterday() {
    var d = new Date(Date.now() - 86400000);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(STORE);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          progress.done = p.done || {};
          progress.attempts = p.attempts || {};
          progress.xp = p.xp || 0;
          progress.streak = p.streak || 0;
          progress.lastDay = p.lastDay || '';
          progress.theme = p.theme || '';
        }
      }
    } catch (e) { /* private mode — run without persistence */ }
  }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
  }
  function touchStreak() {
    var t = today();
    if (progress.lastDay === t) return;
    progress.streak = progress.lastDay === yesterday() ? progress.streak + 1 : 1;
    progress.lastDay = t;
    save();
  }

  /* ---------- progress helpers ---------- */
  function key(m, st) { return m.id + '/' + st.id; }
  function isDone(m, st) { return !!progress.done[key(m, st)]; }
  function missionDone(m) { return m.steps.filter(function (s) { return isDone(m, s); }).length; }
  function missionComplete(m) { return missionDone(m) === m.steps.length; }
  function missionUnlocked(mi) {
    if (mi === 0) return true;
    return missionComplete(COURSE.missions[mi - 1]);
  }
  function totalSteps() {
    return COURSE.missions.reduce(function (n, m) { return n + m.steps.length; }, 0);
  }
  function totalDone() {
    return COURSE.missions.reduce(function (n, m) { return n + missionDone(m); }, 0);
  }
  function nextStepRef() {
    for (var i = 0; i < COURSE.missions.length; i++) {
      var m = COURSE.missions[i];
      for (var j = 0; j < m.steps.length; j++) {
        if (!isDone(m, m.steps[j])) return { mi: i, si: j };
      }
    }
    return null;
  }
  function firstTryRate() {
    var keys = Object.keys(progress.done);
    if (!keys.length) return null;
    var first = keys.filter(function (k) { return (progress.attempts[k] || 1) === 1; }).length;
    return Math.round((first / keys.length) * 100);
  }

  /* ---------- dom helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function show(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) {
      s.classList.toggle('is-active', s.id === id);
    });
    var sc = document.querySelector('#' + id + ' .scroller');
    if (sc) sc.scrollTop = 0;
  }
  function ring(pct, size) {
    var r = (size / 2) - 4, c = 2 * Math.PI * r;
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '">' +
      '<circle class="track" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" stroke-width="4"/>' +
      '<circle class="fill" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" stroke-width="4" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - pct)) + '"/></svg>' +
      '<div class="ring-label">' + Math.round(pct * 100) + '%</div></div>';
  }
  var ICON = {
    path: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 8h9a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h12"/></svg>',
    ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h6"/></svg>',
    you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a8 8 0 0 1 16 0"/><circle cx="12" cy="8" r="4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M12 14v4M9 21h6"/></svg>',
    bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6h5.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>'
  };

  /* ---------- tab bar ---------- */
  var TABS = [ ['home', 'Path', ICON.path], ['ref', 'Reference', ICON.ref], ['you', 'Progress', ICON.you] ];
  function renderTabs(activeKey) {
    var html = TABS.map(function (t) {
      return '<button class="tab' + (t[0] === activeKey ? ' is-active' : '') + '" data-tab="' + t[0] + '">' + t[2] + '<span>' + t[1] + '</span></button>';
    }).join('');
    ['tabbar', 'tabbar-ref', 'tabbar-you'].forEach(function (id) {
      var el = $(id);
      if (el) el.innerHTML = html;
    });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (!t) return;
    goTab(t.getAttribute('data-tab'));
  });
  function goTab(k) {
    renderTabs(k);
    if (k === 'home') { renderHome(); show('screen-home'); }
    if (k === 'ref') { renderRef(); show('screen-ref'); }
    if (k === 'you') { renderYou(); show('screen-you'); }
  }

  /* ---------- home ---------- */
  function renderHome() {
    var next = nextStepRef();
    var pct = totalDone() / totalSteps();

    var hero;
    if (!next) {
      hero = '<div class="hero"><div class="hero-row">' + ring(1, 62) +
        '<div style="flex:1;min-width:0"><div class="eyebrow">Course complete</div>' +
        '<h2 class="title" style="margin-top:3px">You built the whole cycle</h2>' +
        '<p class="small" style="margin-top:5px">Every mission is finished. Revisit any project to sharpen it.</p></div></div></div>';
    } else {
      var m = COURSE.missions[next.mi], st = m.steps[next.si];
      var label = totalDone() === 0 ? 'Start here' : 'Pick up where you left off';
      hero = '<button class="hero" id="hero-cta" style="width:100%;text-align:left"><div class="hero-row">' + ring(pct, 62) +
        '<div style="flex:1;min-width:0"><div class="eyebrow">' + label + '</div>' +
        '<h2 class="subtitle" style="margin-top:4px;line-height:1.3">' + st.title + '</h2>' +
        '<div class="mission-meta"><span class="chip chip-brand">' + m.name + '</span>' +
        '<span class="chip">Step ' + (next.si + 1) + ' of ' + m.steps.length + '</span></div></div></div>' +
        '<div class="btn btn-primary btn-block" style="margin-top:14px;position:relative">' +
        (totalDone() === 0 ? 'Begin the course' : 'Continue') + '</div></button>';
    }
    $('hero-slot').innerHTML = hero;
    var cta = $('hero-cta');
    if (cta) cta.addEventListener('click', function () { openStep(next.mi, next.si); });

    $('stat-slot').innerHTML =
      '<div class="stat"><b class="num">' + progress.xp + '</b><span>XP EARNED</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>DAY STREAK</span></div>' +
      '<div class="stat"><b class="num">' + totalDone() + '/' + totalSteps() + '</b><span>STEPS DONE</span></div>';

    $('path-meta').textContent = COURSE.missions.length + ' missions · 3 projects';

    $('path-slot').innerHTML = COURSE.missions.map(function (m, mi) {
      var done = missionDone(m), total = m.steps.length;
      var unlocked = missionUnlocked(mi);
      var complete = done === total;
      var dots = m.steps.map(function (st) {
        return '<span class="step-dot' + (st.kind === 'project' ? ' project' : '') + (isDone(m, st) ? ' on' : '') + '"></span>';
      }).join('');
      return '<button class="mission' + (complete ? ' is-done' : '') + (unlocked ? '' : ' is-locked') + '" data-mission="' + mi + '"' + (unlocked ? '' : ' disabled') + '>' +
        '<span class="mission-badge">' + (complete ? '✓' : (mi + 1)) + '</span>' +
        '<span class="mission-body">' +
        '<span class="subtitle" style="display:block">' + m.name + '</span>' +
        '<span class="small" style="display:block;margin-top:4px">' + m.tagline + '</span>' +
        '<span class="mission-meta">' +
        '<span class="chip">' + m.minutes + ' min</span>' +
        '<span class="chip">' + total + ' steps</span>' +
        (m.steps.some(function (s) { return s.kind === 'project'; }) ? '<span class="chip chip-violet">Project</span>' : '') +
        (unlocked ? '' : '<span class="chip chip-amber">Finish mission ' + mi + ' first</span>') +
        '</span>' +
        '<span class="step-dots">' + dots + '</span>' +
        '</span></button>';
    }).join('');

    Array.prototype.forEach.call($('path-slot').querySelectorAll('[data-mission]'), function (btn) {
      btn.addEventListener('click', function () {
        var mi = Number(btn.getAttribute('data-mission'));
        var m = COURSE.missions[mi], si = 0;
        for (var j = 0; j < m.steps.length; j++) { if (!isDone(m, m.steps[j])) { si = j; break; } }
        openStep(mi, si);
      });
    });
  }

  /* ---------- reference ---------- */
  function renderRef() {
    $('ref-slot').innerHTML =
      '<div style="padding:14px 0 6px"><div class="eyebrow">Reference</div>' +
      '<h1 class="display" style="margin-top:6px">Cheat sheet</h1>' +
      '<p class="body" style="margin-top:8px">Everything the course derives, in one place. Come back here mid-exercise instead of guessing.</p></div>' +
      FIG.equation +
      '<div style="height:14px"></div>' + FIG.expanded +
      '<div style="height:14px"></div>' + FIG.drcr +
      '<div style="height:14px"></div>' + FIG.statements +
      '<div style="height:14px"></div>' + FIG.cycle +
      '<div class="section-head"><h2 class="title">Terms</h2></div>' +
      '<div class="glossary">' + GLOSSARY.map(function (g) {
        return '<div class="gterm"><b>' + g[0] + '</b><span>' + g[1] + '</span></div>';
      }).join('') + '</div><div style="height:10px"></div>';
  }

  /* ---------- progress screen ---------- */
  function renderYou() {
    var rate = firstTryRate();
    $('you-slot').innerHTML =
      '<div style="padding:14px 0 6px"><div class="eyebrow">Your progress</div>' +
      '<h1 class="display" style="margin-top:6px">' + totalDone() + ' of ' + totalSteps() + ' steps</h1>' +
      '<p class="body" style="margin-top:8px">' +
      (rate === null
        ? 'Nothing recorded yet. Finish a step and your first-try accuracy will show up here.'
        : 'You solved <strong>' + rate + '%</strong> of completed steps on the first attempt.') +
      '</p></div>' +
      '<div class="stat-strip">' +
      '<div class="stat"><b class="num">' + progress.xp + '</b><span>XP EARNED</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>DAY STREAK</span></div>' +
      '<div class="stat"><b class="num">' + (rate === null ? '—' : rate + '%') + '</b><span>FIRST TRY</span></div>' +
      '</div>' +
      '<div class="section-head"><h2 class="title">Mastery</h2></div>' +
      '<div class="card"><div class="mastery">' + COURSE.missions.map(function (m) {
        var p = missionDone(m) / m.steps.length;
        return '<div class="mastery-row"><span class="mastery-name">' + m.name + '</span>' +
          '<span class="minibar"><i style="width:' + (p * 100) + '%"></i></span>' +
          '<span class="mastery-pct">' + Math.round(p * 100) + '%</span></div>';
      }).join('') + '</div></div>' +
      '<div class="section-head"><h2 class="title">Settings</h2></div>' +
      '<div class="card"><button class="btn btn-ghost btn-block" id="reset-btn">Reset all progress</button>' +
      '<p class="small" style="margin-top:10px;text-align:center">Progress is stored on this device only.</p></div>' +
      '<div style="height:10px"></div>';

    $('reset-btn').addEventListener('click', function () {
      if (!window.confirm('Erase all progress and start the course over?')) return;
      progress.done = {}; progress.attempts = {}; progress.xp = 0;
      save();
      goTab('home');
    });
  }

  /* ---------- lesson ---------- */
  var current = null; // { mi, si, step, mission, task, tstate, renderer, checked }

  function openStep(mi, si) {
    var mission = COURSE.missions[mi];
    var step = mission.steps[si];
    var task = step.task;
    var renderer = RENDER[task.type];
    var tstate = renderer.init(task, mission.id + step.id);
    current = { mi: mi, si: si, mission: mission, step: step, task: task, tstate: tstate, renderer: renderer, checked: false, tries: 0, hinted: false };

    var totalInMission = mission.steps.length;
    $('lesson-progress').style.width = ((si) / totalInMission * 100) + '%';
    $('lesson-count').textContent = (si + 1) + ' / ' + totalInMission;

    var isProject = step.kind === 'project';
    var head;
    if (isProject) {
      head =
        '<div class="brief"><div class="task-tag">Project</div>' +
        '<h1 class="title">' + step.title + '</h1>' +
        '<p class="body" style="margin-top:9px">' + step.brief.lead + '</p>' +
        '<div class="facts">' + step.brief.facts.map(function (f, i) {
          return '<div class="fact"><i>' + (i + 1) + '</i><span>' + f + '</span></div>';
        }).join('') + '</div>' +
        '<div class="keyidea" style="margin-top:14px">' + ICON.bulb.replace('<svg', '<svg') +
        '<p><b>Your deliverable.</b> ' + step.brief.deliverable + '</p></div>' +
        '</div>';
    } else {
      head =
        '<div><div class="eyebrow">' + current.mission.name + ' · Step ' + (si + 1) + '</div>' +
        '<h1 class="display" style="margin-top:7px">' + step.title + '</h1></div>' +
        '<div class="prose body">' + step.concept.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        (step.figure || '') +
        (step.keyidea ? '<div class="keyidea">' + ICON.bulb + '<p><b>Key idea.</b> ' + step.keyidea + '</p></div>' : '');
    }

    $('lesson-slot').innerHTML = head +
      '<div class="divider-label">' + (isProject ? 'Build it' : 'Your turn') + '</div>' +
      '<div class="task' + (isProject ? '' : '') + '" id="task-card">' +
      '<div class="task-tag">' + (isProject ? 'Workpaper' : 'Exercise') + '</div>' +
      '<h2 class="task-prompt">' + task.prompt + '</h2>' +
      (task.sub ? '<p class="task-sub">' + task.sub + '</p>' : '') +
      '<div class="task-work" id="task-work"></div>' +
      '<div id="hint-slot"></div>' +
      '<div id="feedback-slot"></div>' +
      '</div>';

    var work = $('task-work');
    work.innerHTML = renderer.html(task, tstate);
    renderer.bind(work, task, tstate, { dirty: onDirty });

    setActions('check');
    show('screen-lesson');
  }

  function onDirty() {
    if (!current) return;
    current.checked = false;
    $('feedback-slot').innerHTML = '';
    setActions('check');
  }

  function setActions(mode) {
    var bar = $('lesson-actions');
    if (mode === 'continue') {
      bar.innerHTML = '<button class="btn btn-primary btn-block" id="act-next">Continue</button>';
      $('act-next').addEventListener('click', advance);
      return;
    }
    var ready = current.renderer.ready(current.task, current.tstate);
    bar.innerHTML =
      (current.task.hint ? '<button class="btn btn-ghost" id="act-hint" aria-label="Show a hint">Hint</button>' : '') +
      '<button class="btn btn-primary grow" id="act-check"' + (ready ? '' : ' disabled') + '>Check</button>';
    if ($('act-hint')) $('act-hint').addEventListener('click', showHint);
    $('act-check').addEventListener('click', doCheck);
  }

  function refreshCheckState() {
    var btn = $('act-check');
    if (!btn || !current) return;
    btn.disabled = !current.renderer.ready(current.task, current.tstate);
  }

  function showHint() {
    if (!current || current.hinted) return;
    current.hinted = true;
    $('hint-slot').innerHTML =
      '<div class="feedback hint"><span class="feedback-icon">?</span><div><b>Hint</b><p>' + current.task.hint + '</p></div></div>';
    var h = $('act-hint');
    if (h) h.disabled = true;
  }

  function doCheck() {
    if (!current) return;
    var r = current.renderer.check(current.task, current.tstate);
    current.tries++;
    current.renderer.paint($('task-work'), current.task, current.tstate, r);
    current.checked = true;

    if (r.ok) {
      completeStep();
      $('feedback-slot').innerHTML =
        '<div class="feedback ok"><span class="feedback-icon">✓</span><div><b>' +
        (current.tries === 1 ? 'Correct, first try' : 'Correct') + '</b><p>' +
        (current.task.explain || '') + '</p></div></div>';
      setActions('continue');
    } else {
      $('feedback-slot').innerHTML =
        '<div class="feedback no"><span class="feedback-icon">!</span><div><b>Not yet</b><p>' + (r.body || '') + '</p></div></div>';
      var card = $('task-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      var hb = $('act-check');
      if (hb) hb.textContent = 'Check again';
    }
    $('feedback-slot').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function completeStep() {
    var k = key(current.mission, current.step);
    if (progress.done[k]) return;
    progress.done[k] = true;
    progress.attempts[k] = current.tries;
    var award = current.step.kind === 'project' ? XP_PROJECT : XP_LESSON;
    if (current.tries === 1 && !current.hinted) award += XP_FIRSTTRY;
    progress.xp += award;
    save();
    var total = current.mission.steps.length;
    $('lesson-progress').style.width = ((current.si + 1) / total * 100) + '%';
  }

  function advance() {
    var mission = current.mission;
    if (current.si + 1 < mission.steps.length) {
      openStep(current.mi, current.si + 1);
      $('lesson-scroller').scrollTop = 0;
    } else {
      renderDone(mission, current.mi);
      show('screen-done');
    }
  }

  function renderDone(mission, mi) {
    var earned = mission.steps.reduce(function (n, st) {
      return n + (st.kind === 'project' ? XP_PROJECT : XP_LESSON);
    }, 0);
    var nextMission = COURSE.missions[mi + 1];
    $('done-slot').innerHTML =
      '<div class="done-wrap">' +
      '<div class="done-medal">' + ICON.trophy + '</div>' +
      '<div><div class="eyebrow">Mission complete</div>' +
      '<h1 class="display" style="margin-top:7px">' + mission.name + '</h1></div>' +
      '<div class="stat-strip" style="width:100%">' +
      '<div class="stat"><b class="num">' + mission.steps.length + '</b><span>STEPS</span></div>' +
      '<div class="stat"><b class="num">' + earned + '</b><span>XP AVAILABLE</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>DAY STREAK</span></div>' +
      '</div>' +
      '<div class="card" style="width:100%;text-align:left">' +
      '<div class="eyebrow" style="margin-bottom:11px">You can now</div>' +
      '<div class="cando">' + mission.cando.map(function (c) {
        return '<div class="cando-item">' + ICON.check + '<span>' + c + '</span></div>';
      }).join('') + '</div></div>' +
      (nextMission
        ? '<div class="card" style="width:100%;text-align:left"><div class="eyebrow">Up next</div>' +
          '<div class="subtitle" style="margin-top:5px">' + nextMission.name + '</div>' +
          '<p class="small" style="margin-top:4px">' + nextMission.tagline + '</p></div>'
        : '') +
      '</div>';
    var btn = $('done-continue');
    btn.textContent = nextMission ? 'Start ' + nextMission.name : 'Back to path';
    btn.onclick = function () {
      if (nextMission) { openStep(mi + 1, 0); }
      else { goTab('home'); }
    };
  }

  /* ---------- wiring ---------- */
  $('lesson-close').addEventListener('click', function () { goTab('home'); });

  document.addEventListener('input', refreshCheckState, true);
  document.addEventListener('change', refreshCheckState, true);
  document.addEventListener('click', function () { window.setTimeout(refreshCheckState, 0); }, true);

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f4f7fa' : '#080b10');
  }
  $('theme-toggle').addEventListener('click', function () {
    progress.theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(progress.theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  if (!progress.theme) {
    progress.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(progress.theme);
  touchStreak();
  goTab('home');

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
