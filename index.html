<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Governmental Accounting Trainer</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      // Reads the same versioned storage key the app uses (src/lib/storage.ts).
      (function () {
        try {
          var raw = localStorage.getItem('gat:progress');
          if (raw) {
            var theme = JSON.parse(raw).theme;
            if (theme === 'light' || theme === 'dark') {
              document.documentElement.setAttribute('data-theme', theme);
            }
          }
        } catch (e) { /* private mode etc. — system theme applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
