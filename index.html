        (verdictKind(a1, c1, effects.length) === 'idle' ? '' : (a1 === c1 ? ICON.check : ICON.warn) + ' ') +
        verdictLine(a0, a1, c1, effects.length) + '</div>';
  }

  function verdictKind(a1, c1, moves) {
    if (a1 !== c1) return 'no';
    return (!moves && a1 === 0) ? 'idle' : 'ok';
  }

  function verdictLine(a0, a1, c1, moves) {
    if (a1 !== c1) return 'Out by ' + dollars(Math.abs(a1 - c1));
    if (!moves) return a1 === 0
      ? 'Nothing recorded yet &mdash; open an entry and this fills in'
      : 'Both sides stand at ' + dollars(a1);
    var d = a1 - a0;
    if (d === 0) return 'Both sides stay at ' + dollars(a1) + ', because the movement was within one side';
    return 'Each side ' + (d < 0 ? 'falls' : 'rises') + ' by ' + dollars(Math.abs(d)) +
      ', landing on ' + dollars(a1);
  }

  /* ---------- illustration: what actually crossed ---------- */
  function flowScene(s) {
    function wire(cls, label) {
      return '<div class="fx-wire ' + cls + '">' +
        '<div class="fx-lab">' + label + '</div>' +
        '<div class="fx-rail"><i class="fx-tok"></i></div>' +
        '</div>';
    }
    return '<div class="fx-scene">' +
        '<div class="fx-node"><span>Other party</span><b>' + s.other + '</b></div>' +
        '<div class="fx-wires">' +
          wire('', s.get) +
          wire('rtl', s.give) +
          (s.back ? wire('back rtl', s.back) : '') +
        '</div>' +
        '<div class="fx-node self"><span>The business</span><b>' + CO.name + '</b></div>' +
      '</div>' +
      (s.cash === false ? '<p class="viz-sub">No cash moved in either direction. The entry is recorded anyway, because the resources and the claims on them both changed.</p>' : '');
  }

  /* ---------- illustration: which columns feed a statement ---------- */
  function routeViz(feeds, label) {
    return '<div class="route"><div class="route-cols">' +
      COLS.map(function (c) {
        return '<span class="route-col' + (feeds.indexOf(c.k) !== -1 ? ' on' : '') + '">' + ACCOUNT[c.k] + '</span>';
      }).join('') +
      '</div><div class="route-down">' + ICON.down + '</div>' +
      '<div class="route-col on" style="text-align:center">' + label + '</div></div>';
  }

  function viz(cap, html) {
    return '<div class="viz"><div class="viz-cap">' + cap + '</div>' + html + '</div>';
  }

  /* ---------- the dashboard ---------- */
  function renderDash() {
    var done = readCount();
    var last = -1;
    ENTRIES.forEach(function (e, i) { if (isRead(e.id)) last = i; });
    var t = totalsThrough(last);              // the equation as far as you have read

    var cards = ENTRIES.map(function (e, i) {
      var fx = effectsOf(LEDGER[i]);
      var run = totalsThrough(i);
      return '<button class="card-e' + (isRead(e.id) ? ' read' : '') + '" data-open="' + i + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(e.id) ? ICON.check : e.id) + '</span>' +
          '<b>' + e.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span>' +
        '<p>' + WORK_TX[e.id] + '</p>' +
        '<span class="card-fx">' + fx.map(function (f) {
          return '<span class="chip ' + f.side + '">' + f.name +
            ' <b>' + (f.shown > 0 ? '+' : '&minus;') + Math.abs(f.shown).toLocaleString('en-US') + '</b></span>';
        }).join('') + '</span>' +
        '<span class="card-run">after this entry &nbsp;<em>' + dollars(assetsOf(run)) + '</em> = <em>' + dollars(claimsOf(run)) + '</em></span>' +
        '</button>';
    }).join('');

    var reports = REPORTS.map(function (r, i) {
      return '<button class="card-e' + (isRead(r.id) ? ' read' : '') + '" data-open="' + (ENTRIES.length + i) + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(r.id) ? ICON.check : ICON.table) + '</span>' +
          '<b>' + r.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span>' +
        '<p>' + r.rule + '</p>' +
        '</button>';
    }).join('');

    $('guide').innerHTML =
      '<div class="wrap fade">' +
        '<div class="dash-head">' +
          '<h1>' + CO.name + ' &middot; July</h1>' +
          '<p>Nine entries and four reports. Open any one to see what happened, why it is recorded that way, and what it does to the equation. The figures below are live: they follow what you have read.</p>' +
        '</div>' +
        '<div class="state">' +
          '<div class="state-cap">' + ICON.pulse + (last < 0 ? 'Before any entry is recorded' : 'The equation after entry (' + LEDGER[last].id + ')') + '</div>' +
          balanceBoard(t, t, []) +
        '</div>' +
        '<div class="sect">The entries<i></i></div>' +
        '<div class="cards">' + cards + '</div>' +
        '<div class="sect">Closing the month<i></i></div>' +
        '<div class="cards">' + reports + '</div>' +
        '<div class="sect">How any entry is recorded<i></i></div>' +
        '<div class="method">' + METHOD.map(function (m, i) {
          return '<div class="method-row"><span class="method-n">' + (i + 1) + '</span>' +
            '<span>' + m[0] + '</span><em>' + m[1] + '</em></div>';
        }).join('') + '</div>' +
        '<div style="height:10px"></div>' +
      '</div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = dashScroll;
  }

  /* ---------- one entry, explained ---------- */
  function renderDetail() {
    var item = FLOW21[at];
    var body;

    if (at < ENTRIES.length) {
      var row = LEDGER[at];
      var fx = effectsOf(row);
      body =
        '<div class="ex-eyebrow">Entry <i>(' + row.id + ')</i> &middot; ' + (at + 1) + ' of ' + FLOW21.length + '</div>' +
        '<h1 class="ex-title">' + item.concept + '</h1>' +
        '<div class="ex-fact">' + WORK_TX[item.id] + '</div>' +
        viz('What crossed, and in which direction', flowScene(item.scene)) +
        '<div class="ex-why">' + item.why.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        viz('What it does to the equation', balanceBoard(totalsThrough(at - 1), totalsThrough(at), fx)) +
        (item.trap ? viz('The judgement call', trapViz(item.trap)) : '') +
        '<div class="ex-rule">' + ICON.bulb + '<p>' + item.rule + '</p></div>' +
        (item.doc || '') +
        viz('The row it produces', ledgerTable(99, fx.map(function (f) { return f.k; }), { remarks: true, only: at }));
    } else {
      var fin = totalsUpTo(999);
      body =
        '<div class="ex-eyebrow">Report &middot; ' + (at + 1) + ' of ' + FLOW21.length + '</div>' +
        '<h1 class="ex-title">' + item.title + '</h1>' +
        '<div class="ex-fact">' + item.concept + '</div>' +
        (item.feeds ? viz('Which columns feed this statement', routeViz(item.feeds, item.short)) : '') +
        '<div class="ex-why">' + item.why.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        (item.totals ? viz('The equation, totalled', balanceBoard(zeroTotals(), fin, allEffects())) : '') +
        (item.equity ? viz('Equity, decomposed', equityViz()) : '') +
        (item.stmt ? stmt(item.stmt, item.hits) : '') +
        '<div class="ex-rule">' + ICON.bulb + '<p>' + item.rule + '</p></div>' +
        (item.result ? '<div class="proof" style="border-radius:12px">' + ICON.check + '<span>' + item.result + '</span></div>' : '');
    }

    $('guide').innerHTML = '<div class="wrap fade">' + body + '<div style="height:10px"></div></div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = 0;
  }

  function zeroTotals() { var t = {}; COLS.forEach(function (c) { t[c.k] = 0; }); return t; }
  function allEffects() {
    var t = totalsUpTo(999);
    return COLS.filter(function (c) { return t[c.k]; }).map(function (c) {
      return { k: c.k, name: ACCOUNT[c.k], side: sideOf(c.k), shown: t[c.k], delta: sideOf(c.k) === 'a' ? t[c.k] : claimSign(c.k) * t[c.k] };
    });
  }

  function trapViz(t) {
    return '<div class="vs-q">' + t.q + '</div><div class="vs">' +
      '<div class="vs-col bad"><div class="vs-tag">' + ICON.x + ' Wrong</div><em>' + t.bad.t + '</em><p>' + t.bad.p + '</p></div>' +
      '<div class="vs-col good"><div class="vs-tag">' + ICON.check + ' Right</div><em>' + t.good.t + '</em><p>' + t.good.p + '</p></div>' +
      '</div>';
  }

  function equityViz() {
    var t = totalsUpTo(999);
    var re = t.rev - t.exp - t.div;
    return '<div class="decomp">' +
      '<div class="dc-node dc-top"><em>Stockholders&rsquo; Equity</em><b>' + dollars(t.cs + re) + '</b></div>' +
      '<div class="dc-link">' + ICON.down + '</div>' +
      '<div class="dc-row two">' +
        '<div class="dc-node"><span><em>Common Stock</em><small>What owners put in</small></span><b>' + dollars(t.cs) + '</b></div>' +
        '<div class="dc-node"><span><em>Retained Earnings</em><small>What the business kept</small></span><b>' + dollars(re) + '</b></div>' +
      '</div>' +
      '<div class="dc-link">' + ICON.down + '</div>' +
      '<div class="dc-row three">' +
        '<div class="dc-node sm"><em>Revenues</em><b>' + dollars(t.rev) + '</b></div>' +
        '<div class="dc-node sm minus"><em>&minus; Expenses</em><b>' + dollars(t.exp) + '</b></div>' +
        '<div class="dc-node sm minus"><em>&minus; Dividends</em><b>' + dollars(t.div) + '</b></div>' +
      '</div></div>';
  }

  /* Bars grow from where they were and figures count up to where they land.
     Under reduced motion both are simply set to their final values. */
  function animateViz(root) {
    var slow = reduceMotion();
    Array.prototype.forEach.call(root.querySelectorAll('[data-count]'), function (el) {
      var to = Number(el.getAttribute('data-count'));
      var from = Number(el.getAttribute('data-from'));
      if (slow || from === to) { el.innerHTML = dollars(to); return; }
      var t0 = null;
      requestAnimationFrame(function tick(now) {
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) / 280);
        var e = 1 - Math.pow(1 - p, 3);
        el.innerHTML = dollars(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(tick);
      });
    });
    var fills = root.querySelectorAll('.bb-fill[data-w]');
    if (!fills.length) return;
    if (slow) {
      Array.prototype.forEach.call(fills, function (f) { f.style.width = f.getAttribute('data-w'); });
      return;
    }
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(fills, function (f) { f.style.width = f.getAttribute('data-w'); });
    });
  }

  function renderGuide() {
    if (mod === 0) { if (view === 'dash') renderDash(); else renderDetail(); }
    else { if (view === 'dash') renderDash2(); else renderDetail2(); }
  }

  /* ---------- table pane ---------- */
  function renderTable() {
    var open = (view === 'detail' && at < ENTRIES.length) ? at : null;
    var hits = open === null ? [] : effectsOf(LEDGER[open]).map(function (e) { return e.k; });
    $('table-slot').innerHTML = ledgerTable(99, hits, { totals: true, mark: open });
    if (open === null) return;
    var sc = $('table-scroll');
    var row = $('table-slot').querySelector('tr.fresh');
    if (!row) return;
    window.setTimeout(function () {
      /* Honour the reduced-motion preference for programmatic scrolling too. */
      sc.scrollTo({ top: Math.max(0, row.offsetTop - sc.clientHeight / 2), behavior: reduceMotion() ? 'auto' : 'smooth' });
    }, 90);
  }


  /* ---------- the worksheet ----------
     Part 1 records the nine ledger rows, Part 2 reports the five figures
     the statements need. The workpaper in the middle is built from what
     the learner typed, not from the answer key, so a wrong entry shows up
     as an out-of-balance total before anything is graded. */
  var work = { fx: {}, fld: {}, hint: {} };
  var KEY = totalsUpTo(999);          // the column totals a correct sheet reaches

  function loadWork() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work') || '{}');
      if (w && typeof w === 'object') {
        work.fx = w.fx || {};
        work.fld = w.fld || {};
        work.hint = w.hint || {};
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork() {
    try { window.localStorage.setItem(STORE + '.work', JSON.stringify(work)); } catch (e) {}
  }

  function fxKey(ri, n, part) { return ri + '.' + n + '.' + part; }
  function amountOf(v) {
    if (v === undefined || v === null) return NaN;
    var c = String(v).replace(/[$,\s]/g, '');
    return c === '' ? NaN : Number(c);
  }
  function signed(n) { return (n < 0 ? '&minus;' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }

  /* One entered effect, or null when the learner has not finished it. */
  function effect(ri, i) {
    var k = work.fx[fxKey(ri, i, 'k')];
    var d = work.fx[fxKey(ri, i, 'd')];
    var a = amountOf(work.fx[fxKey(ri, i, 'a')]);
    if (!k || !d || isNaN(a)) return null;
    return { k: k, d: Number(d), a: a };
  }
  function slotsFor(ri) { return expectedFor(LEDGER[ri]).length; }

  /* Column totals from what the learner entered, never from LEDGER. */
  function workTotals() {
    var t = {};
    COLS.forEach(function (c) { t[c.k] = 0; });
    LEDGER.forEach(function (r, ri) {
      for (var i = 0; i < slotsFor(ri); i++) {
        var e = effect(ri, i);
        if (e) t[e.k] += e.d * e.a;
      }
    });
    return t;
  }

  function rowRight(ri) {
    var want = expectedFor(LEDGER[ri])
      .map(function (e) { return e.k + ':' + e.dir + ':' + e.amt; }).sort().join('|');
    var got = [];
    for (var i = 0; i < slotsFor(ri); i++) {
      var e = effect(ri, i);
      if (!e) return false;
      got.push(e.k + ':' + e.d + ':' + e.a);
    }
    return got.sort().join('|') === want;
  }

  /* Name what is wrong without naming the answer. */
  function rowDiagnosis(ri) {
    var n = slotsFor(ri), left = 0, right = 0, started = 0, done = 0, amts = [];
    for (var i = 0; i < n; i++) {
      // An effect can be started without being finished, and saying
      // "nothing recorded" over a visibly chosen account is just wrong.
      if (work.fx[fxKey(ri, i, 'k')] || work.fx[fxKey(ri, i, 'd')] ||
          !isNaN(amountOf(work.fx[fxKey(ri, i, 'a')]))) started++;
      var e = effect(ri, i);
      if (!e) continue;
      done++; amts.push(e.a);
      var col = COLS.filter(function (c) { return c.k === e.k; })[0];
      if (col.grp === 'a') left += e.d * e.a;
      else right += (e.k === 'exp' || e.k === 'div' ? -1 : 1) * e.d * e.a;
    }
    if (!started) return 'Nothing recorded yet. This transaction has ' + n + ' effects.';
    if (done < n) return 'Each effect needs an account, a direction and an amount &mdash; ' + done + ' of ' + n + ' done so far.';
    if (left !== right) return 'This row leaves the equation out by ' + signed(Math.abs(left - right)) + '. Whatever happens on one side has to be matched on the other.';
    var wanted = expectedFor(LEDGER[ri]).map(function (e) { return e.amt; }).sort().join(',');
    if (amts.sort().join(',') !== wanted) return 'It balances, but the figures are not the ones in the transaction. Read the amounts again.';
    return 'It balances and the amounts are right, so at least one account is wrong. Ask what the business actually received, and what it gave up or now owes.';
  }

  /* Part 2 is graded against the real answer, not against the learner's
     own totals — otherwise a wrong workpaper would grade its own errors
     as correct. When the two disagree, say which one is the problem. */
  function fieldRight(f) { return amountOf(work.fld[f.id]) === f.answer(KEY); }
  function fieldDiagnosis(f) {
    if (isNaN(amountOf(work.fld[f.id]))) return 'Nothing entered yet.';
    if (amountOf(work.fld[f.id]) === f.answer(workTotals())) {
      return 'This follows correctly from your workpaper, but the workpaper is not right yet. Fix Part 1 and this figure will come out right on its own.';
    }
    return 'Not yet. Work it out from your own column totals above rather than from memory.';
  }

  function scoreNow() {
    var rows = 0;
    LEDGER.forEach(function (r, ri) { if (rowRight(ri)) rows++; });
    return { got: rows + WORK_FIELDS.filter(fieldRight).length, total: LEDGER.length + WORK_FIELDS.length };
  }

  function renderSolve() {

    var opts = '<option value="">Choose an account&hellip;</option>' + COLS.map(function (c) {
      return '<option value="' + c.k + '">' + ACCOUNT[c.k] + '</option>';
    }).join('');

    var cards = LEDGER.map(function (r, ri) {
      var sets = '';
      for (var i = 0; i < slotsFor(ri); i++) {
        var who = 'effect ' + (i + 1) + ' of transaction ' + r.id;
        sets +=
          '<div class="ws-fx">' +
            '<div class="ws-line">' +
              '<select class="ws-sel" data-fx="' + ri + '.' + i + '" aria-label="Account for ' + who + '">' + opts + '</select>' +
            '</div>' +
            '<div class="ws-line">' +
              '<div class="ws-dir">' +
                '<button type="button" data-dir="' + ri + '.' + i + '.1" aria-label="Increase, ' + who + '">+</button>' +
                '<button type="button" data-dir="' + ri + '.' + i + '.-1" aria-label="Decrease, ' + who + '">&minus;</button>' +
              '</div>' +
              '<div class="ws-amt"><input data-amt="' + ri + '.' + i + '" inputmode="decimal" autocomplete="off" aria-label="Amount for ' + who + '" /></div>' +
            '</div>' +
          '</div>';
      }
      return '<div class="ws-tx" data-tx="' + ri + '">' +
        '<div class="ws-tx-head"><span class="ws-no">' + r.id + '</span><p class="ws-text">' + WORK_TX[r.id] + '</p></div>' +
        '<div class="ws-set">' + sets + '</div>' +
        '<div class="ws-foot"><button type="button" class="ws-hint" data-hint="' + ri + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-note="' + ri + '"></div>' +
      '</div>';
    }).join('');

    var fields = WORK_FIELDS.map(function (f, fi) {
      return '<div class="ws-field" data-field="' + f.id + '">' +
        '<label for="ws-' + f.id + '">' + f.label + '</label>' +
        '<div class="ws-line">' +
          '<div class="ws-amt"><input id="ws-' + f.id + '" data-fld="' + f.id + '" inputmode="decimal" autocomplete="off" /></div>' +
          '<button type="button" class="ws-hint" data-fhint="' + fi + '">' + ICON.bulb + 'Hint</button>' +
        '</div>' +
        '<div data-fnote="' + f.id + '"></div>' +
      '</div>';
    }).join('');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="ws-head">' +
          '<h1>Solve it yourself</h1>' +
          '<p>Seven transactions, nothing filled in. Record each one and watch your own workpaper balance &mdash; or fail to. Then report the five figures the three statements are built from. Every line has a hint, and none of them give anything away until you ask.</p>' +
        '</div>' +
        '<div class="ws-sect">Part 1 &middot; Record the transactions<i></i></div>' + cards +
        '<div class="ws-sect">Your workpaper<i></i></div><div id="solve-table"></div>' +
        '<div class="ws-sect">Part 2 &middot; Report the results<i></i></div>' +
        '<div class="ws-fields">' + fields + '</div>' +
        '<button type="button" class="ws-reset" id="ws-reset">Clear my work and start again</button>' +
      '</div>';

    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fx]'), function (el) {
      var p = el.getAttribute('data-fx').split('.');
      var v = work.fx[fxKey(p[0], p[1], 'k')];
      if (v) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-amt]'), function (el) {
      var p = el.getAttribute('data-amt').split('.');
      var v = work.fx[fxKey(p[0], p[1], 'a')];
      if (v !== undefined) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fld]'), function (el) {
      var v = work.fld[el.getAttribute('data-fld')];
      if (v !== undefined) el.value = v;
    });
    Object.keys(work.hint).forEach(paintHint);
    paintDirs();
    renderSolveTable();
  }

  function paintDirs() {
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-dir]'), function (b) {
      var p = b.getAttribute('data-dir').split('.');
      var on = String(work.fx[fxKey(p[0], p[1], 'd')]) === p[2];
      b.classList.toggle(p[2] === '1' ? 'on-up' : 'on-dn', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* Hint keys are the row index, or 'f' + field index. */
  function paintHint(key) {
    var lvl = work.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max;
    if (key.charAt(0) === 'f') {
      var f = WORK_FIELDS[Number(key.slice(1))];
      if (!f) return;
      max = f.hints.length;
      text = f.hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-fnote="' + f.id + '"]');
      btn = host.querySelector('[data-fhint="' + key.slice(1) + '"]');
    } else {
      var row = LEDGER[Number(key)];
      if (!row) return;
      var hints = WORK_HINTS[row.id] || [];
      max = hints.length;
      text = hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note="' + key + '"]');
      btn = host.querySelector('[data-hint="' + key + '"]');
    }
    if (!slot || !text) return;
    slot.innerHTML = '<div class="ws-note tip">' + text + '</div>';
    if (!btn) return;
    btn.innerHTML = ICON.bulb + (lvl >= max ? 'No more hints' : 'Another hint');
    btn.disabled = lvl >= max;
  }

  /* The learner's own workpaper: their entries, their totals, their proof. */
  function renderSolveTable() {
    var t = workTotals();
    var head = '<tr class="grp"><th class="lab"></th><th colspan="3">ASSETS</th><th class="op">=</th>' +
      '<th colspan="2">LIABILITIES</th><th class="op">+</th><th colspan="4">STOCKHOLDERS&rsquo; EQUITY</th></tr>';

    var acct = '<tr class="acct"><th class="lab">Trans.</th>';
    COLS.forEach(function (c, i) {
      if (i === 3) acct += '<th class="op">=</th>';
      if (i === 5) acct += '<th class="op">+</th>';
      acct += '<th>' + c.head + '</th>';
    });
    acct += '</tr>';

    var body = LEDGER.map(function (r, ri) {
      var line = {};
      for (var i = 0; i < slotsFor(ri); i++) {
        var e = effect(ri, i);
        if (e) line[e.k] = (line[e.k] || 0) + e.d * e.a;
      }
      var out = '<tr><td class="lab">(' + r.id + ')</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) out += '<td class="op"></td>';
        if (i === 5) out += '<td class="op"></td>';
        out += '<td>' + (line[c.k] ? money(line[c.k]) : '') + '</td>';
      });
      return out + '</tr>';
    }).join('');

    var foot = '<tr class="totals"><td class="lab">Totals</td>';
    COLS.forEach(function (c, i) {
      if (i === 3) foot += '<td class="op">=</td>';
      if (i === 5) foot += '<td class="op">+</td>';
      foot += '<td>' + (t[c.k] ? signed(t[c.k]) : '&mdash;') + '</td>';
    });
    foot += '</tr>';

    var A = assetsOf(t), C = claimsOf(t);
    var bar;
    if (A === 0 && C === 0) {
      bar = '<div class="proof" style="background:var(--surface-3);color:var(--muted)">' +
        '<span>Record an effect above and this workpaper fills itself in</span></div>';
    } else if (A === C) {
      bar = '<div class="proof"><span>Assets ' + signed(A) + '</span><span>=</span>' +
        '<span>Liabilities + Equity ' + signed(C) + '</span><span>' + ICON.check + '</span></div>';
    } else {
      bar = '<div class="proof" style="background:var(--bad)"><span>Assets ' + signed(A) + '</span>' +
        '<span>vs</span><span>' + signed(C) + '</span><span>out by ' + signed(Math.abs(A - C)) + '</span></div>';
    }

    $('solve-table').innerHTML =
      '<div class="card"><div class="tbl-scroll"><table class="led"><thead>' + head + acct +
      '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + bar + '</div>';
  }

  function rowTouched(ri) {
    for (var i = 0; i < slotsFor(ri); i++) {
      if (work.fx[fxKey(ri, i, 'k')] || work.fx[fxKey(ri, i, 'd')] || work.fx[fxKey(ri, i, 'a')]) return true;
    }
    return false;
  }

  function gradeSolve() {
    LEDGER.forEach(function (r, ri) {
      var card = $('solve').querySelector('[data-tx="' + ri + '"]');
      var note = $('solve').querySelector('[data-note="' + ri + '"]');
      var ok = rowRight(ri);
      var touched = rowTouched(ri);
      card.classList.toggle('right', ok);
      card.classList.toggle('wrong', !ok && touched);
      card.querySelector('.ws-no').innerHTML = ok ? ICON.check : r.id;
      if (ok || !touched) { var stale = card.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!work.hint[ri]) note.innerHTML = '<div class="ws-note bad">' + rowDiagnosis(ri) + '</div>';
    });
    WORK_FIELDS.forEach(function (f, fi) {
      var box = $('solve').querySelector('[data-field="' + f.id + '"]');
      var note = $('solve').querySelector('[data-fnote="' + f.id + '"]');
      var ok = fieldRight(f);
      var touched = String(work.fld[f.id] === undefined ? '' : work.fld[f.id]).trim() !== '';
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      if (ok || !touched) { var old = box.querySelector('.ws-note.bad'); if (old) old.remove(); }
      else if (!work.hint['f' + fi]) note.innerHTML = '<div class="ws-note bad">' + fieldDiagnosis(f) + '</div>';
    });
    renderControls();
    var first = $('solve').querySelector('.ws-tx.wrong, .ws-field.wrong');
    if (first) first.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' });
  }

  function motionOK() {
    return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* Editing a row withdraws the mark on it: a red border that survives the
     correction would be telling the learner about a mistake they just fixed. */
  function clearMark(ri) {
    var card = $('solve').querySelector('[data-tx="' + ri + '"]');
    if (!card) return;
    card.classList.remove('right', 'wrong');
    card.querySelector('.ws-no').textContent = LEDGER[ri].id;
    var bad = card.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function bindSolve() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-fx]');
      if (!sel) return;
      var p = sel.getAttribute('data-fx').split('.');
      work.fx[fxKey(p[0], p[1], 'k')] = sel.value;
      clearMark(p[0]); saveWork(); renderSolveTable(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var a = e.target.closest('[data-amt]');
      if (a) {
        var p = a.getAttribute('data-amt').split('.');
        work.fx[fxKey(p[0], p[1], 'a')] = a.value;
        clearMark(p[0]); saveWork(); renderSolveTable(); renderControls();
        return;
      }
      var f = e.target.closest('[data-fld]');
      if (!f) return;
      work.fld[f.getAttribute('data-fld')] = f.value;
      var box = f.closest('.ws-field');
      box.classList.remove('right', 'wrong');
      var bad = box.querySelector('.ws-note.bad');
      if (bad) bad.remove();
      saveWork(); renderControls();
    });

    host.addEventListener('click', function (e) {
      var d = e.target.closest('[data-dir]');
      if (d) {
        var p = d.getAttribute('data-dir').split('.');
        var cur = String(work.fx[fxKey(p[0], p[1], 'd')]);
        work.fx[fxKey(p[0], p[1], 'd')] = cur === p[2] ? '' : Number(p[2]);
        clearMark(p[0]); paintDirs(); saveWork(); renderSolveTable(); renderControls();
        return;
      }
      var h = e.target.closest('[data-hint]');
      if (h) { bumpHint(h.getAttribute('data-hint'), WORK_HINTS[LEDGER[Number(h.getAttribute('data-hint'))].id].length); return; }
      var fh = e.target.closest('[data-fhint]');
      if (fh) { bumpHint('f' + fh.getAttribute('data-fhint'), WORK_FIELDS[Number(fh.getAttribute('data-fhint'))].hints.length); return; }
      if (e.target.closest('#ws-reset')) {
        if (!window.confirm('Clear every answer and hint on this worksheet?')) return;
        work.fx = {}; work.fld = {}; work.hint = {};
        saveWork(); renderSolve(); renderControls();
        $('solve').scrollIntoView({ block: 'start' });
      }
    });
  }

  function bumpHint(key, max) {
    work.hint[key] = Math.min((work.hint[key] || 0) + 1, max);
    paintHint(key);
    saveWork();
  }

  /* ---------- module 2.2: journalize, post, trial balance ---------- */

  var FLOW2 = ENTRIES2.concat(REPORTS2);

  function money2(n) { return n.toLocaleString('en-US'); }
  function jIndex(id) { for (var i = 0; i < JOURNAL.length; i++) if (JOURNAL[i].id === id) return i; return -1; }

  /* ---------- illustration: which side an increase lands on ----------
     Families the entry touches are lit; the accounts themselves drop in
     underneath the side they landed on. */
  function ruleBoard(j) {
    var FAM_D = ['Asset', 'Expense', 'Dividends'];
    var FAM_C = ['Liability', 'Equity', 'Revenue'];
    var hit = {};
    (j ? j.lines : []).forEach(function (l) { hit[acct(l[0]).fam] = true; });

    function col(cls, cap, sub, fams, side) {
      var rows = fams.map(function (f) {
        return '<div class="rule-fam' + (hit[f] ? ' on' : '') + '"><u>' + f + '</u><em>&uarr;</em></div>';
      }).join('');
      var lands = (j ? j.lines : []).filter(function (l) {
        return (l[1] ? 'D' : 'C') === side;
      }).map(function (l, i) {
        var a = acct(l[0]);
        var up = side === a.up;          // its own increase side, or the other one
        return '<div class="rule-acct' + (up ? '' : ' down') + '" style="--i:' + i + '">' +
          '<span>' + a.name + ' <em>' + (up ? '&uarr;' : '&darr;') + '</em></span>' +
          '<b>' + money2(l[1] || l[2]) + '</b></div>';
      }).join('');
      return '<div class="rule-col ' + cls + '">' +
        '<div class="rule-hd"><b>' + cap + '</b><span>' + sub + '</span></div>' +
        '<div class="rule-fams">' + rows + '</div>' +
        (lands ? '<div class="rule-hit">' + lands + '</div>' : '') +
        '</div>';
    }
    return '<div class="rule-b">' +
      col('d', 'Debit', 'the left side', FAM_D, 'D') +
      col('c', 'Credit', 'the right side', FAM_C, 'C') +
      '</div>' +
      '<p class="viz-sub">The families above show which side <em>increases</em> each kind of account. ' +
      'An account lands on that side when it goes up (&uarr;) and on the opposite side when it goes down (&darr;).</p>';
  }

  /* ---------- illustration: the entry as it is actually written ---------- */
  function journalEntry(j, opts) {
    opts = opts || {};
    var rows = j.lines.map(function (l, i) {
      var isDr = !!l[1];
      return '<div class="je-row ' + (isDr ? 'dr' : 'cr') + (opts.live ? ' on' : '') + '" style="--i:' + i + '">' +
        '<span>' + (i === 0 ? j.date : '') + '</span>' +
        '<span class="je-acct">' + acct(l[0]).name + '</span>' +
        '<span class="je-amt">' + (l[1] ? money2(l[1]) : '') + '</span>' +
        '<span class="je-amt">' + (l[2] ? money2(l[2]) : '') + '</span>' +
        '</div>';
    }).join('');
    return '<div class="je"><div class="je-bar">General Journal</div><div class="je-grid">' +
      '<div class="je-head"><span>Date</span><span>Account Titles</span><span>Debit</span><span>Credit</span></div>' +
      rows +
      (opts.note ? '<div class="je-note">' + opts.note + '</div>' : '') +
      '</div></div>';
  }

  /* ---------- illustration: posting into the ledger ---------- */
  function tAccount(t, k, freshId) {
    var a = acct(k), rec = t[k];
    function side(which) {
      var lines = rec.lines.filter(function (x) { return which === 'd' ? x.d : x.c; }).map(function (x) {
        return '<div class="ta-line' + (x.id === freshId ? ' fresh' : '') + '">' +
          '<u>' + x.date.replace('July ', '7/') + '</u><span>' + money2(which === 'd' ? x.d : x.c) + '</span></div>';
      }).join('');
      var b = balOf(t, k);
      var showBal = b !== 0 && ((a.up === 'D') === (which === 'd'));
      return '<div class="ta-side ' + which + '">' + lines +
        (showBal ? '<div class="ta-bal"><u>Bal.</u><span>' + money2(b) + '</span></div>' : '') +
        '</div>';
    }
    return '<div class="ta"><div class="ta-name">' + a.name + '</div>' +
      '<div class="ta-body">' + side('d') + side('c') + '</div></div>';
  }

  function postingViz(j) {
    var t = postedThrough(jIndex(j.id));
    var keys = j.lines.map(function (l) { return l[0]; });
    return '<div class="post-wrap">' +
      journalEntry(j, { note: 'Each amount below is copied to the same side of its own account.' }) +
      '<div class="post-drop">' + ICON.down + '</div>' +
      '<div class="tas' + (keys.length === 2 ? ' two' : '') + '">' +
        keys.map(function (k) { return tAccount(t, k, j.id); }).join('') +
      '</div></div>';
  }

  /* ---------- illustration: the trial balance ---------- */
  function trialBalance(t, hits) {
    hits = hits || [];
    var rows = ACCT.map(function (a) {
      var b = balOf(t, a.k);
      var cls = !b ? ' zero' : (hits.indexOf(a.k) !== -1 ? ' on' : '');
      return '<div class="tb-row' + cls + '"><span class="tb-name">' + a.name + '</span>' +
        '<span>' + (b && a.up === 'D' ? money2(b) : '') + '</span>' +
        '<span>' + (b && a.up === 'C' ? money2(b) : '') + '</span></div>';
    }).join('');
    var tot = trialTotals(t);
    return '<div class="tb">' +
      '<div class="tb-hd"><span>Account</span><span>Debit</span><span>Credit</span></div>' + rows +
      '<div class="tb-tot"><span>Totals</span><span>' + money2(tot.dr) + '</span><span>' + money2(tot.cr) + '</span></div>' +
      '</div>' +
      '<div class="verdict ' + (tot.dr === tot.cr ? 'ok' : 'no') + '">' +
        (tot.dr === tot.cr ? ICON.check + ' The two columns agree at ' + dollars(tot.dr)
                           : ICON.warn + ' Out by ' + dollars(Math.abs(tot.dr - tot.cr))) + '</div>';
  }

  /* ---------- dashboard ---------- */
  function renderDash2() {
    var done = readCount();
    var last = -1;
    ENTRIES2.forEach(function (e, i) { if (isRead(e.id)) last = i; });
    var t = postedThrough(last);
    var tot = trialTotals(t);

    var cards = ENTRIES2.map(function (e, i) {
      var j = JOURNAL[i];
      var lines = j.lines.map(function (l) {
        return '<span class="' + (l[1] ? 'dr' : 'cr') + '"><i>' + (l[1] ? 'Dr' : 'Cr') + '</i> ' +
          acct(l[0]).name + '<b>' + money2(l[1] || l[2]) + '</b></span>';
      }).join('');
      return '<button class="card-e' + (isRead(e.id) ? ' read' : '') + '" data-open="' + i + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(e.id) ? ICON.check : (i + 1)) + '</span>' +
          '<b>' + e.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span>' +
        '<p>' + j.date + ' &middot; ' + FACTS2[e.id] + '</p>' +
        '<span class="card-je">' + lines + '</span>' +
        '</button>';
    }).join('');

    var reports = REPORTS2.map(function (r, i) {
      return '<button class="card-e' + (isRead(r.id) ? ' read' : '') + '" data-open="' + (ENTRIES2.length + i) + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(r.id) ? ICON.check : ICON.table) + '</span>' +
          '<b>' + r.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span><p>' + r.rule + '</p></button>';
    }).join('');

    $('guide').innerHTML =
      '<div class="wrap fade">' +
        '<div class="dash-head">' +
          '<h1>' + CO2.name + '</h1>' +
          '<p>Eleven journal entries, posted to the ledger and proved with a trial balance. Open any entry to see which accounts move, which side each one lands on, and why.</p>' +
        '</div>' +
        '<div class="state">' +
          '<div class="state-cap">' + ICON.pulse + (last < 0 ? 'Before anything is journalized' : 'The ledger after ' + JOURNAL[last].date) + '</div>' +
          '<div class="bb">' +
            '<div class="bb-side bb-a"><span class="bb-cap">Total debits</span>' +
              '<b class="bb-num" data-from="' + tot.dr + '" data-count="' + tot.dr + '">' + dollars(tot.dr) + '</b></div>' +
            '<div class="bb-op">=</div>' +
            '<div class="bb-side bb-c"><span class="bb-cap">Total credits</span>' +
              '<b class="bb-num" data-from="' + tot.cr + '" data-count="' + tot.cr + '">' + dollars(tot.cr) + '</b></div>' +
          '</div>' +
          '<div class="verdict ' + (tot.dr === 0 ? 'idle' : 'ok') + '">' +
            (tot.dr === 0 ? 'Nothing journalized yet &mdash; open an entry and this fills in'
                          : ICON.check + ' Every entry so far has matching sides') + '</div>' +
        '</div>' +
        '<div class="sect">The journal entries<i></i></div>' +
        '<div class="cards">' + cards + '</div>' +
        '<div class="sect">Posting and proving<i></i></div>' +
        '<div class="cards">' + reports + '</div>' +
        '<div class="sect">How any entry is decided<i></i></div>' +
        '<div class="method">' + METHOD2.map(function (m, i) {
          return '<div class="method-row"><span class="method-n">' + (i + 1) + '</span>' +
            '<span>' + m[0] + '</span><em>' + m[1] + '</em></div>';
        }).join('') + '</div>' +
        '<div style="height:10px"></div>' +
      '</div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = dashScroll;
  }

  /* ---------- one entry, explained ---------- */
  function renderDetail2() {
    var item = FLOW2[at], body;

    if (at < ENTRIES2.length) {
      var j = JOURNAL[at];
      body =
        '<div class="ex-eyebrow">Entry <i>' + (at + 1) + '</i> &middot; ' + j.date + ' &middot; ' + (at + 1) + ' of ' + FLOW2.length + '</div>' +

        viz('The entry as it is written', journalEntry(j, {

  /* ---------- module 2.2 worksheet ----------

    { id: 'tot', label: 'Total of each trial balance column', total: true,
      hints: ['Add every debit balance. The credit column has to come to the same figure.',
              'Assets plus dividends plus expenses on one side; liabilities, equity and revenue on the other.',
              '5,410 + 4,600 + 900 + 1,800 + 8,000 + 600 + 290 + 2,000.'] }
  ];

  var w2 = { fx: {}, fld: {}, hint: {} };

  function loadWork2() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work2') || '{}');
      if (w && typeof w === 'object') { w2.fx = w.fx || {}; w2.fld = w.fld || {}; w2.hint = w.hint || {}; }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork2() {
    try { window.localStorage.setItem(STORE + '.work2', JSON.stringify(w2)); } catch (e) {}
  }

  function k2(ji, li, part) { return ji + '.' + li + '.' + part; }
  function line2(ji, li) {
    var a = w2.fx[k2(ji, li, 'k')], s = w2.fx[k2(ji, li, 's')], n = amountOf(w2.fx[k2(ji, li, 'a')]);
    if (!a || !s || isNaN(n)) return null;
    return { k: a, s: s, n: n };
  }
  function slots2(ji) { return JOURNAL[ji].lines.length; }

  function entryRight2(ji) {
    var want = JOURNAL[ji].lines.map(function (l) {
      return l[0] + ':' + (l[1] ? 'D' : 'C') + ':' + (l[1] || l[2]);
    }).sort().join('|');
    var got = [];
    for (var i = 0; i < slots2(ji); i++) {
      var l = line2(ji, i);
      if (!l) return false;
      got.push(l.k + ':' + l.s + ':' + l.n);
    }
    return got.sort().join('|') === want;
  }
  function entryTouched2(ji) {
    for (var i = 0; i < slots2(ji); i++) {
      if (w2.fx[k2(ji, i, 'k')] || w2.fx[k2(ji, i, 's')] || w2.fx[k2(ji, i, 'a')]) return true;
    }
    return false;
  }

  /* Diagnose without giving the answer away. */
  function entryDiag2(ji) {
    var n = slots2(ji), done = 0, started = 0, dr = 0, cr = 0;
    for (var i = 0; i < n; i++) {
      if (w2.fx[k2(ji, i, 'k')] || w2.fx[k2(ji, i, 's')] || !isNaN(amountOf(w2.fx[k2(ji, i, 'a')]))) started++;
      var l = line2(ji, i);
      if (!l) continue;
      done++;
      if (l.s === 'D') dr += l.n; else cr += l.n;
    }
    if (!started) return 'Nothing recorded yet. This transaction needs ' + n + ' lines.';
    if (done < n) return 'Each line needs an account, a side and an amount &mdash; ' + done + ' of ' + n + ' done so far.';
    if (dr !== cr) return 'Debits come to ' + dollars(dr) + ' and credits to ' + dollars(cr) + '. Every entry has to have equal sides.';
    if (dr !== jDebits(JOURNAL[ji])) return 'The sides balance, but the amounts are not the ones in the transaction. Read the figures again.';
    var mine = [], theirs = [];
    for (var x = 0; x < n; x++) { var q = line2(ji, x); mine.push(q.k + q.s); }
    JOURNAL[ji].lines.forEach(function (l) { theirs.push(l[0] + (l[1] ? 'D' : 'C')); });
    var sameAccts = mine.map(function (m) { return m.slice(0, -1); }).sort().join() ===
                    theirs.map(function (m) { return m.slice(0, -1); }).sort().join();
    if (sameAccts) return 'The right accounts, but at least one is on the wrong side. Ask which family it belongs to and whether it went up or down.';
    return 'It balances and the amounts are right, so at least one account is wrong. Ask what the business received, and what it gave up or now owes.';
  }

  function field2Answer(f) {
    var full = postedThrough(999);
    return f.total ? trialTotals(full).dr : balOf(full, f.acct);
  }
  function field2Right(f) { return amountOf(w2.fld[f.id]) === field2Answer(f); }

  function score2() {
    var n = 0;
    JOURNAL.forEach(function (j, i) { if (entryRight2(i)) n++; });
    return { got: n + FIELDS2.filter(field2Right).length, total: JOURNAL.length + FIELDS2.length };
  }

  function renderSolve2() {
    var opts = '<option value="">Choose an account&hellip;</option>' + ACCT.map(function (a) {
      return '<option value="' + a.k + '">' + a.name + '</option>';
    }).join('');

    var cards = JOURNAL.map(function (j, ji) {
      var sets = '';
      for (var i = 0; i < slots2(ji); i++) {
        var who = 'line ' + (i + 1) + ' of entry ' + (ji + 1);
        sets += '<div class="ws-fx">' +
          '<div class="ws-line"><select class="ws-sel" data-fx2="' + ji + '.' + i + '" aria-label="Account for ' + who + '">' + opts + '</select></div>' +
          '<div class="ws-line">' +
            '<div class="ws-dir">' +
              '<button type="button" data-side="' + ji + '.' + i + '.D" aria-label="Debit, ' + who + '">Dr</button>' +
              '<button type="button" data-side="' + ji + '.' + i + '.C" aria-label="Credit, ' + who + '">Cr</button>' +
            '</div>' +
            '<div class="ws-amt"><input data-amt2="' + ji + '.' + i + '" inputmode="decimal" autocomplete="off" aria-label="Amount for ' + who + '" /></div>' +
          '</div></div>';
      }
      return '<div class="ws-tx" data-tx2="' + ji + '">' +
        '<div class="ws-tx-head"><span class="ws-no">' + (ji + 1) + '</span>' +
        '<p class="ws-text"><b>' + j.date + '</b> &middot; ' + FACTS2[j.id] + '</p></div>' +
        '<div class="ws-set">' + sets + '</div>' +
        '<div class="ws-foot"><button type="button" class="ws-hint" data-hint2="' + ji + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-note2="' + ji + '"></div></div>';
    }).join('');

    var fields = FIELDS2.map(function (f, fi) {
      return '<div class="ws-field" data-field2="' + f.id + '">' +
        '<label for="w2-' + f.id + '">' + f.label + '</label>' +
        '<div class="ws-line"><div class="ws-amt"><input id="w2-' + f.id + '" data-fld2="' + f.id + '" inputmode="decimal" autocomplete="off" /></div>' +
        '<button type="button" class="ws-hint" data-fhint2="' + fi + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-fnote2="' + f.id + '"></div></div>';
    }).join('');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="ws-head"><h1>Journalize it yourself</h1>' +
        '<p>The same eleven transactions, with nothing filled in. Record each one &mdash; account, side, amount &mdash; then report the balances the ledger comes to. Every line has a hint that gives nothing away until you ask.</p></div>' +
        '<div class="ws-sect">Part 1 &middot; Journalize the transactions<i></i></div>' + cards +
        '<div class="ws-sect">Part 2 &middot; Report the balances<i></i></div>' +
        '<div class="ws-fields">' + fields + '</div>' +
        '<button type="button" class="ws-reset" id="ws-reset2">Clear my work and start again</button>' +
      '</div>';

    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fx2]'), function (el) {
      var p = el.getAttribute('data-fx2').split('.');
      var v = w2.fx[k2(p[0], p[1], 'k')]; if (v) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-amt2]'), function (el) {
      var p = el.getAttribute('data-amt2').split('.');
      var v = w2.fx[k2(p[0], p[1], 'a')]; if (v !== undefined) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fld2]'), function (el) {
      var v = w2.fld[el.getAttribute('data-fld2')]; if (v !== undefined) el.value = v;
    });
    Object.keys(w2.hint).forEach(paintHint2);
    paintSides2();
  }

  function paintSides2() {
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-side]'), function (b) {
      var p = b.getAttribute('data-side').split('.');
      var on = w2.fx[k2(p[0], p[1], 's')] === p[2];
      b.classList.toggle(p[2] === 'D' ? 'on-up' : 'on-dn', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function paintHint2(key) {
    var lvl = w2.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max;
    if (key.charAt(0) === 'f') {
      var f = FIELDS2[Number(key.slice(1))];
      if (!f) return;
      max = f.hints.length; text = f.hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-fnote2="' + f.id + '"]');
      btn = host.querySelector('[data-fhint2="' + key.slice(1) + '"]');
    } else {
      var j = JOURNAL[Number(key)];
      if (!j) return;
      var hints = HINTS2[j.id] || [];
      max = hints.length; text = hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note2="' + key + '"]');
      btn = host.querySelector('[data-hint2="' + key + '"]');
    }
    if (!slot || !text) return;
    slot.innerHTML = '<div class="ws-note tip">' + text + '</div>';
    if (!btn) return;
    btn.innerHTML = ICON.bulb + (lvl >= max ? 'No more hints' : 'Another hint');
    btn.disabled = lvl >= max;
  }

  function gradeSolve2() {
    JOURNAL.forEach(function (j, ji) {
      var card = $('solve').querySelector('[data-tx2="' + ji + '"]');
      var note = $('solve').querySelector('[data-note2="' + ji + '"]');
      var ok = entryRight2(ji), touched = entryTouched2(ji);
      card.classList.toggle('right', ok);
      card.classList.toggle('wrong', !ok && touched);
      card.querySelector('.ws-no').innerHTML = ok ? ICON.check : (ji + 1);
      if (ok || !touched) { var stale = card.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!w2.hint[ji]) note.innerHTML = '<div class="ws-note bad">' + entryDiag2(ji) + '</div>';
    });
    FIELDS2.forEach(function (f, fi) {
      var box = $('solve').querySelector('[data-field2="' + f.id + '"]');
      var note = $('solve').querySelector('[data-fnote2="' + f.id + '"]');
      var ok = field2Right(f);
      var touched = String(w2.fld[f.id] === undefined ? '' : w2.fld[f.id]).trim() !== '';
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      if (ok || !touched) { var old = box.querySelector('.ws-note.bad'); if (old) old.remove(); }
      else if (!w2.hint['f' + fi]) note.innerHTML = '<div class="ws-note bad">Not yet. Work it out from your own entries above.</div>';
    });
    renderControls();
    var first = $('solve').querySelector('.ws-tx.wrong, .ws-field.wrong');
    if (first) first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  function clearMark2(ji) {
    var card = $('solve').querySelector('[data-tx2="' + ji + '"]');
    if (!card) return;
    card.classList.remove('right', 'wrong');
    card.querySelector('.ws-no').textContent = Number(ji) + 1;
    var bad = card.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function bindSolve2() {
    var host = $('solve');
    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-fx2]');
      if (!sel) return;
      var p = sel.getAttribute('data-fx2').split('.');
      w2.fx[k2(p[0], p[1], 'k')] = sel.value;
      clearMark2(p[0]); saveWork2(); renderControls();
    });
    host.addEventListener('input', function (e) {
      var a = e.target.closest('[data-amt2]');
      if (a) {
        var p = a.getAttribute('data-amt2').split('.');
        w2.fx[k2(p[0], p[1], 'a')] = a.value;
        clearMark2(p[0]); saveWork2(); renderControls();
        return;
      }
      var f = e.target.closest('[data-fld2]');
      if (!f) return;
      w2.fld[f.getAttribute('data-fld2')] = f.value;
      var box = f.closest('.ws-field');
      box.classList.remove('right', 'wrong');
      var bad = box.querySelector('.ws-note.bad');
      if (bad) bad.remove();
      saveWork2(); renderControls();
    });
    host.addEventListener('click', function (e) {
      var d = e.target.closest('[data-side]');
      if (d) {
        var p = d.getAttribute('data-side').split('.');
        var cur = w2.fx[k2(p[0], p[1], 's')];
        w2.fx[k2(p[0], p[1], 's')] = cur === p[2] ? '' : p[2];
        clearMark2(p[0]); paintSides2(); saveWork2(); renderControls();
        return;
      }
      var h = e.target.closest('[data-hint2]');
      if (h) {
        var key = h.getAttribute('data-hint2');
        var max = (HINTS2[JOURNAL[Number(key)].id] || []).length;
        w2.hint[key] = Math.min((w2.hint[key] || 0) + 1, max);
        paintHint2(key); saveWork2();
        return;
      }
      var fh = e.target.closest('[data-fhint2]');
      if (fh) {
        var fi = fh.getAttribute('data-fhint2');
        w2.hint['f' + fi] = Math.min((w2.hint['f' + fi] || 0) + 1, FIELDS2[Number(fi)].hints.length);
        paintHint2('f' + fi); saveWork2();
        return;
      }
      if (e.target.closest('#ws-reset2')) {
        if (!window.confirm('Clear every answer and hint on this worksheet?')) return;
        w2.fx = {}; w2.fld = {}; w2.hint = {};
        saveWork2(); renderSolve2(); renderControls();
      }
    });
  }

  /* ---------- chrome ---------- */
  function renderModBtn() {
    var m = MODULES[mod];
    $('mod-name').textContent = m.co;
    $('mod-sub').innerHTML = m.code + ' &middot; ' + m.sub;
  }

  function renderSheet() {
    $('mod-list').innerHTML = MODULES.map(function (m, i) {
      var f = i === 0 ? FLOW21 : FLOW2;
      var n = f.filter(function (x) { return read[m.id] && read[m.id][x.id]; }).length;
      return '<button class="mod-card' + (i === mod ? ' on' : '') + '" data-mod="' + i + '">' +
        '<i>' + m.code + '</i><b>' + m.name + '</b>' +
        '<span>' + m.blurb + '</span>' +
        '<em>' + m.co + ' &middot; ' + n + ' of ' + f.length + ' explained</em>' +
        '</button>';
    }).join('');
  }

  function openSheet(on) {
    if (on) renderSheet();
    $('sheet').classList.toggle('on', on);
  }

  function renderControls() {
    var solving = tab === 'solve';
    $('btn-prev').hidden = solving;
    $('btn-next').hidden = solving;
    $('prog-label').parentNode.hidden = solving;
    $('ws-score').hidden = !solving;
    $('btn-check').hidden = !solving;
    if (solving) {
      var sc = mod === 0 ? scoreNow() : score2();
      $('ws-score').querySelector('b').innerHTML = sc.got + ' of ' + sc.total;
      $('ws-score').classList.toggle('done', sc.got === sc.total);
      $('btn-check').textContent = sc.got === sc.total ? 'All correct' : 'Check my work';
      return;
    }
    var dash = view === 'dash';
    var done = readCount();
    var FLOW = flow();
    $('btn-prev').hidden = dash;
    $('btn-prev').disabled = false;
    $('btn-next').disabled = false;
    $('prev-label').textContent = 'All entries';
    if (dash) {
      $('prog-label').textContent = done + ' of ' + FLOW.length + ' explained';
      $('next-label').textContent = done === 0 ? 'Start' : (done === FLOW.length ? 'Review' : 'Continue');
    } else {
      $('prog-label').textContent = (at < ENTRIES.length ? 'Entry ' : 'Report ') + (at + 1) + ' of ' + FLOW.length;
      $('next-label').textContent = at === FLOW.length - 1 ? 'Finish' : 'Next';
    }
    $('rail').innerHTML = FLOW.map(function (f, i) {
      return '<i class="stp' + (isRead(f.id) ? ' done' : '') + (!dash && i === at ? ' now' : '') + '"></i>';
    }).join('');
  }

  function renderTabs() {
    ['guide', 'table', 'solve'].forEach(function (t) {
      $('tab-' + t).classList.toggle('on', tab === t);
      $('pane-' + t).classList.toggle('on', tab === t);
      // aria-selected needs role="tab"; aria-current is valid on a plain button.
      if (tab === t) $('tab-' + t).setAttribute('aria-current', 'true');
      else $('tab-' + t).removeAttribute('aria-current');
    });
  }

  function render() {
    renderTabs();
    renderModBtn();
    if (tab === 'solve') $('guide').innerHTML = '';
    else renderGuide();
    if (mod === 0) renderTable(); else renderTable2();
    if (tab !== 'solve') $('solve').innerHTML = '';
    else if (mod === 0) renderSolve(); else renderSolve2();
    renderControls();
  }

  /* ---------- navigation ---------- */
  function hashFor() { return MODULES[mod].id + (view === 'dash' ? '' : '-' + flow()[at].id); }
  function stateFromHash() {
    var h = (location.hash || '').replace('#', '');
    var m = /^(lo2[12])(?:-(.+))?$/.exec(h);
    if (!m) return null;
    var mi = MODULES[0].id === m[1] ? 0 : 1;
    if (!m[2]) return { mod: mi, view: 'dash', at: 0 };
    var f = mi === 0 ? FLOW21 : FLOW2;
    for (var i = 0; i < f.length; i++) if (f[i].id === m[2]) return { mod: mi, view: 'detail', at: i };
    return { mod: mi, view: 'dash', at: 0 };
  }
  function apply(st, fromHistory) {
    if (!st) return;
    if (st.mod === undefined) st.mod = mod;
    if (st.mod === mod && st.view === view && st.at === at) return;
    if (view === 'dash') dashScroll = $('guide').parentNode.scrollTop;
    if (st.mod !== mod) { mod = st.mod; dashScroll = 0; }
    view = st.view;
    at = st.at;
    if (view === 'detail') readSet()[flow()[at].id] = 1;
    save();
    render();
    if (!fromHistory && window.history && history.pushState) {
      history.pushState({ mod: mod, view: view, at: at }, '', '#' + hashFor());
    }
  }
  function openAt(n) { apply({ view: 'detail', at: Math.max(0, Math.min(flow().length - 1, n)) }); }
  function toDash() { apply({ view: 'dash', at: at }); }

  window.addEventListener('popstate', function () {
    var st = stateFromHash();
    if (!st) return;
    if (st.mod === mod && st.view === view && st.at === at) return;
    mod = st.mod; view = st.view; at = st.at;
    if (view === 'detail') readSet()[flow()[at].id] = 1;
    save(); render();
  });

  /* Opening an entry from the dashboard. */
  $('guide').addEventListener('click', function (e) {
    var card = e.target.closest('[data-open]');
    if (card) openAt(Number(card.getAttribute('data-open')));
  });

  $('mod-btn').addEventListener('click', function () { openSheet(true); });
  $('sheet').addEventListener('click', function (e) {
    var card = e.target.closest('[data-mod]');
    if (card) {
      var n = Number(card.getAttribute('data-mod'));
      openSheet(false);
      if (n !== mod) apply({ mod: n, view: 'dash', at: 0 });
      return;
    }
    if (e.target === $('sheet')) openSheet(false);   // tapping the scrim closes it
  });

  $('btn-prev').addEventListener('click', toDash);
  $('btn-next').addEventListener('click', function () {
    if (view === 'dash') {
      var f = flow(), next = 0;
      while (next < f.length && isRead(f[next].id)) next++;
      openAt(next === f.length ? 0 : next);
      return;
    }
    if (at === flow().length - 1) toDash();
    else openAt(at + 1);
  });
  $('tab-guide').addEventListener('click', function () { tab = 'guide'; save(); render(); });
  $('tab-table').addEventListener('click', function () { tab = 'table'; save(); render(); });
  $('tab-solve').addEventListener('click', function () { tab = 'solve'; save(); render(); });
  $('btn-check').addEventListener('click', function () { if (mod === 0) gradeSolve(); else gradeSolve2(); });

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea, select')) return;
    if (e.key === 'Escape' && $('sheet').classList.contains('on')) { openSheet(false); return; }
    if (tab === 'solve') return;
    if (view === 'dash') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); openAt(at + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); openAt(at - 1); }
    if (e.key === 'Escape') { e.preventDefault(); toDash(); }
  });

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#12141a' : '#1e3a5f');
  }
  $('btn-theme').addEventListener('click', function () {
    theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  loadWork();
  loadWork2();
  if (!theme) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  var fromUrl = stateFromHash();
  if (fromUrl) { mod = fromUrl.mod; view = fromUrl.view; at = fromUrl.at; if (view === 'detail') readSet()[flow()[at].id] = 1; }
  render();
  bindSolve();
  bindSolve2();
  if (window.history && history.replaceState) {
    history.replaceState({ mod: mod, view: view, at: at }, '', '#' + hashFor());
  }

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();

</script>
</body>
</html>
