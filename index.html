<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Speedy Delivery Inc. · Accounting workflow</title>
<meta name="description" content="A comprehensive accounting problem worked one step at a time. Watch the tabular summary build itself, then turn it into the three financial statements." />
<meta name="theme-color" content="#f8fafc" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Workflow" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
/* ============================================================
   Tokens — light by default. Students read dense tables in
   daylight, so the ground is paper, not ink.
   ============================================================ */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-3: #e2e8f0;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --text: #1e293b;
  --text-dim: #475569;
  --muted: #64748b;

  --brand: #2563eb;
  --brand-deep: #1d4ed8;
  --brand-soft: #eff6ff;
  --brand-line: #bfdbfe;
  --brand-ink: #1e3a8a;
  --on-brand: #ffffff;

  --amber: #b45309;
  --amber-soft: #fffbeb;
  --amber-line: #fcd34d;
  --amber-ink: #78350f;

  --good: #059669;
  --good-soft: #ecfdf5;
  --good-line: #6ee7b7;
  --good-deep: #047857;

  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --bad-line: #fecaca;

  --head-bar: #334155;
  --head-bar-2: #475569;
  --head-ink: #ffffff;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 12px 28px -12px rgba(15, 23, 42, 0.22);
  --shadow-up: 0 -8px 24px -12px rgba(15, 23, 42, 0.15);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #131c2e;
  --surface-2: #1a2438;
  --surface-3: #243047;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.18);
  --text: #e8eef7;
  --text-dim: #b3c1d4;
  --muted: #8496ad;

  --brand: #60a5fa;
  --brand-deep: #3b82f6;
  --brand-soft: rgba(96, 165, 250, 0.13);
  --brand-line: rgba(96, 165, 250, 0.36);
  --brand-ink: #bfdbfe;
  --on-brand: #06152e;

  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.11);
  --amber-line: rgba(251, 191, 36, 0.34);
  --amber-ink: #fde68a;

  --good: #34d399;
  --good-soft: rgba(52, 211, 153, 0.12);
  --good-line: rgba(52, 211, 153, 0.34);
  --good-deep: #10b981;

  --bad: #f87171;
  --bad-soft: rgba(248, 113, 113, 0.12);
  --bad-line: rgba(248, 113, 113, 0.32);

  --head-bar: #1e293b;
  --head-bar-2: #263349;
  --head-ink: #e8eef7;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 14px 32px -14px rgba(0, 0, 0, 0.75);
  --shadow-up: 0 -8px 24px -14px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

.app {
  height: 100vh; height: 100dvh;
  max-height: 100vh; max-height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.wrap { width: 100%; max-width: 720px; margin: 0 auto; }

/* ---------- header ---------- */
.appbar {
  flex: 0 0 auto;
  background: var(--brand);
  color: #fff;
  padding: max(14px, env(safe-area-inset-top)) 18px 14px;
  box-shadow: var(--shadow);
  z-index: 20;
}
html[data-theme="dark"] .appbar { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--text); }
.appbar-inner { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto; }
.mark {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  background: #fff; color: var(--brand);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .mark { background: var(--brand); color: var(--on-brand); }
.mark svg { width: 22px; height: 22px; }
.appbar-title { flex: 1; min-width: 0; }
.appbar-title b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.appbar-title span { display: block; font-size: 12px; font-weight: 500; opacity: 0.82; }
.ghost-btn {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}
html[data-theme="dark"] .ghost-btn { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); }
.ghost-btn svg { width: 19px; height: 19px; }

/* ---------- tabs ---------- */
.tabs {
  flex: 0 0 auto;
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 15;
}
.tabs-inner { display: flex; width: 100%; max-width: 720px; margin: 0 auto; }
.tab {
  flex: 1;
  position: relative;
  min-height: 54px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13.5px; font-weight: 700;
  color: var(--muted);
  transition: color 0.18s;
}
.tab svg { width: 18px; height: 18px; }
.tab.on { color: var(--brand); }
.tab.on::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: 0;
  height: 3px; border-radius: 3px 3px 0 0; background: var(--brand);
}
.tab-sep { width: 1px; background: var(--line); margin: 12px 0; }

/* ---------- panes ---------- */
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }
.scroll {
  flex: 1; min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
#pane-guide .scroll { padding: 22px 18px 30px; }

/* ---------- step ---------- */
.step-eyebrow {
  font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
.step-title {
  font-size: 27px; line-height: 1.16; font-weight: 800; letter-spacing: -0.03em;
  margin-top: 8px;
  text-wrap: balance;
}
.stack { display: grid; gap: 22px; margin-top: 26px; }
/* Grid items default to min-width:auto, so a wide table would blow the
   column out past the viewport instead of scrolling inside its own box. */
.stack > * { min-width: 0; }
.wrap { min-width: 0; }

/* Boxes with the label riding the top edge. */
.box { position: relative; border-radius: var(--r-xl); padding: 20px 18px 18px; }
.box-tag {
  position: absolute; top: -11px; left: 18px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  max-width: calc(100% - 36px);
  overflow: hidden; text-overflow: ellipsis;
}
.box-tag svg { width: 13px; height: 13px; flex: 0 0 auto; }

.box-fact { background: var(--amber-soft); border: 1px solid var(--amber-line); }
.box-fact .box-tag { background: var(--surface); color: var(--amber); border: 1px solid var(--amber-line); }
.box-fact p { font-size: 16.5px; line-height: 1.55; font-weight: 550; color: var(--amber-ink); }

.box-concept { background: var(--surface); border: 1px solid var(--brand-line); box-shadow: var(--shadow); }
.box-concept .box-tag { background: var(--brand); color: var(--on-brand); }
.box-concept p { font-size: 16px; line-height: 1.62; color: var(--text-dim); white-space: pre-line; }
.box-concept p + p { margin-top: 12px; }
.box-concept b { color: var(--text); font-weight: 700; }

.box-impact { background: var(--brand-soft); border: 1px solid var(--brand-line); padding: 18px 16px; }
.box-impact .impact-cap {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--brand-ink); margin-bottom: 13px;
}
.box-impact .impact-cap svg { width: 15px; height: 15px; }

.equation {
  display: flex; align-items: stretch; gap: 10px;
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
.eq-side { flex: 1; min-width: 0; display: grid; gap: 6px; align-content: start; }
.eq-side:last-child { justify-items: end; text-align: right; }
.eq-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.eq-item { font-size: 13.5px; font-weight: 650; line-height: 1.35; }
.eq-item b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eq-op { display: grid; place-items: center; font-size: 18px; font-weight: 800; color: var(--muted); }

.note-warn {
  display: flex; gap: 10px; margin-top: 14px;
  padding: 12px 14px; border-radius: var(--r-md);
  background: var(--bad-soft); border: 1px solid var(--bad-line);
}
.note-warn svg { flex: 0 0 auto; width: 17px; height: 17px; color: var(--bad); margin-top: 2px; }
.note-warn p { font-size: 14px; line-height: 1.5; color: var(--text-dim); }

/* ---------- source document ---------- */
.doc {
  margin-top: 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.doc-bar {
  padding: 8px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.doc-body { padding: 13px 15px 15px; font-family: var(--mono); font-size: 12.5px; line-height: 1.75; font-variant-numeric: tabular-nums; }
.doc-issuer { font-weight: 700; color: var(--text); margin-bottom: 3px; }
.doc-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-dim); }
.doc-row span:last-child { white-space: nowrap; }
.doc-total {
  display: flex; justify-content: space-between; gap: 14px;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--line-strong);
  font-weight: 700; color: var(--text);
}
.doc-note { font-family: var(--font); font-size: 12px; font-style: italic; color: var(--muted); margin-top: 9px; }

/* ---------- tables ---------- */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.led {
  border-collapse: separate; border-spacing: 0;
  width: max-content; min-width: 100%;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  background: var(--surface);
}
table.led th, table.led td { padding: 9px 10px; text-align: right; white-space: nowrap; }
table.led thead .grp {
  background: var(--head-bar); color: var(--head-ink);
  text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
  border-bottom: 1px solid var(--line);
}
table.led thead .grp .op { background: var(--head-bar-2); }
table.led thead .acct th {
  background: var(--surface-2);
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  border-bottom: 2px solid var(--line-strong);
}
table.led .op { color: var(--muted); font-weight: 700; padding-left: 4px; padding-right: 4px; }
table.led tbody td { border-bottom: 1px solid var(--line); color: var(--text-dim); font-family: var(--mono); }
table.led .lab {
  position: sticky; left: 0; z-index: 2;
  text-align: left; font-family: var(--font); font-weight: 700; font-size: 11.5px;
  background: var(--surface-2); color: var(--text-dim);
  border-right: 1px solid var(--line);
  box-shadow: 2px 0 4px rgba(15, 23, 42, 0.04);
}
table.led thead .lab { z-index: 4; }
table.led thead .grp .lab { background: var(--head-bar); }
table.led .rem { text-align: left; font-family: var(--font); font-style: italic; font-size: 11.5px; color: var(--muted); }

/* the row that just landed */
table.led tr.fresh td { background: var(--brand-soft); }
table.led tr.fresh .lab { background: var(--brand-soft); color: var(--brand); }
/* the cells this step produced */
table.led td.hit {
  font-weight: 800; color: var(--brand-ink);
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 2px var(--brand);
  border-radius: 5px;
}
table.led tr.totals td {
  background: var(--good-soft); color: var(--good-deep);
  font-weight: 800; border-top: 2px solid var(--good-line); border-bottom: 0;
}
table.led tr.totals .lab { background: var(--good-soft); color: var(--good-deep); }

.proof {
  display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  padding: 14px;
  background: var(--good);
  color: #fff;
  font-family: var(--mono); font-weight: 800; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.proof span { display: inline-flex; align-items: center; gap: 8px; }
.proof svg { width: 17px; height: 17px; }

.card {
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* ---------- statements ---------- */
.stmt { padding: 18px 16px; font-variant-numeric: tabular-nums; background: var(--surface); }
.stmt-head { text-align: center; margin-bottom: 15px; }
.stmt-head b { display: block; font-size: 14px; font-weight: 800; }
.stmt-head span { display: block; font-size: 13px; color: var(--text-dim); }
.stmt-head i { display: block; font-size: 12px; color: var(--muted); font-style: normal; }
.stmt-line { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; padding: 3px 4px; border-radius: 5px; }
.stmt-line .lbl { flex: 1; min-width: 0; }
.stmt-line .amt { font-family: var(--mono); text-align: right; white-space: nowrap; min-width: 78px; }
.stmt-line.ind .lbl { padding-left: 16px; }
.stmt-line.hd { font-weight: 700; }
.stmt-line.tot { font-weight: 700; }
.stmt-line.tot .amt { border-top: 1px solid var(--line-strong); padding-top: 3px; }
.stmt-line.grand { font-weight: 800; }
.stmt-line.grand .amt { border-top: 1px solid var(--line-strong); border-bottom: 3px double var(--line-strong); padding: 3px 0; }
.stmt-line.hit { background: var(--brand-soft); box-shadow: inset 0 0 0 1.5px var(--brand-line); }
.stmt-line.hit .lbl { color: var(--brand-ink); font-weight: 700; }
.stmt-line.hit .amt { color: var(--brand-ink); font-weight: 800; }
.stmt-gap { height: 10px; }

/* ---------- facts list ---------- */
.facts { display: grid; gap: 10px; }
.fact { display: flex; gap: 11px; font-size: 14.5px; line-height: 1.45; color: var(--text-dim); }
.fact i {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;
  display: grid; place-items: center; font-style: normal;
  font-size: 11px; font-weight: 800;
  background: var(--brand-soft); color: var(--brand);
}

/* ---------- bottom controls ---------- */
.controls {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: var(--shadow-up);
  z-index: 20;
}
.controls-inner { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 720px; margin: 0 auto; }
.nav-btn {
  flex: 0 0 auto;
  min-height: 48px; min-width: 48px;
  padding: 0 15px;
  border-radius: var(--r-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 14.5px; font-weight: 700;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-dim);
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s var(--ease), background 0.15s, opacity 0.15s;
}
.nav-btn:active { transform: scale(0.97); }
.nav-btn svg { width: 19px; height: 19px; }
.nav-btn[disabled] { opacity: 0.4; pointer-events: none; box-shadow: none; }
.nav-next {
  background: var(--brand); color: var(--on-brand); border-color: transparent;
  box-shadow: 0 4px 12px -4px var(--brand);
}
.progress-wrap { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 6px; }
.progress-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.progress-track { width: 100%; max-width: 210px; height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress-track i { display: block; height: 100%; width: 100%; border-radius: 999px; background: var(--brand); transform-origin: left center; transform: scaleX(0); transition: transform 0.35s var(--ease); }

/* ---------- table pane ---------- */
#pane-table .scroll { padding: 14px; background: var(--surface-2); }
.hint {
  margin: 16px auto 0; max-width: 420px;
  padding: 14px 16px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 14px; color: var(--muted); text-align: center;
  box-shadow: var(--shadow-sm);
}

.fade { animation: fade 0.34s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pop { animation: pop 0.3s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
@media (min-width: 700px) {
  .step-title { font-size: 32px; }
  #pane-guide .scroll { padding: 30px 24px 40px; }
}
@media (max-width: 360px) {
  .step-title { font-size: 23px; }
  .nav-btn span { display: none; }
}
</style>
</head>

<body>
<div class="app">

  <header class="appbar">
    <div class="appbar-inner">
      <span class="mark" id="mark"></span>
      <div class="appbar-title">
        <b>Speedy Delivery Inc.</b>
        <span>Accounting workflow walkthrough</span>
      </div>
      <button class="ghost-btn" id="btn-theme" aria-label="Switch colour theme"></button>
    </div>
  </header>

  <nav class="tabs">
    <div class="tabs-inner">
      <button class="tab on" id="tab-guide"></button>
      <div class="tab-sep"></div>
      <button class="tab" id="tab-table"></button>
    </div>
  </nav>

  <section class="pane on" id="pane-guide">
    <div class="scroll"><div id="guide"></div></div>
  </section>

  <section class="pane" id="pane-table">
    <div class="scroll" id="table-scroll"><div id="table-slot"></div></div>
  </section>

  <div class="controls">
    <div class="controls-inner">
      <button class="nav-btn" id="btn-prev"><span id="prev-icon"></span><span>Previous</span></button>
      <div class="progress-wrap">
        <div class="progress-label" id="prog-label">Step 0</div>
        <div class="progress-track"><i id="prog-fill"></i></div>
      </div>
      <button class="nav-btn nav-next" id="btn-next"><span id="next-label">Start</span><span id="next-icon"></span></button>
    </div>
  </div>

</div>
<script>
/* ============================================================
   THE PROBLEM — one source of truth.
   Ledger rows, the running totals and all three statements are
   derived from LEDGER, so they cannot disagree.
   ============================================================ */
var CO = {
  name: 'Speedy Delivery Inc.',
  period: 'For the Month Ended July 31, 2025',
  asAt: 'July 31, 2025'
};

var COLS = [
  { k: 'cash',  head: 'Cash',        grp: 'a' },
  { k: 'ar',    head: '+ Accts Rec.', grp: 'a' },
  { k: 'eq',    head: '+ Equip.',     grp: 'a' },
  { k: 'np',    head: 'Notes Pay.',   grp: 'l' },
  { k: 'ap',    head: '+ Accts Pay.', grp: 'l' },
  { k: 'cs',    head: 'Com. Stock',   grp: 'e' },
  { k: 'rev',   head: 'Rev.',         grp: 'e' },
  { k: 'exp',   head: '&minus; Exp.', grp: 'e' },
  { k: 'div',   head: '&minus; Div.', grp: 'e' }
];

/* step = which walkthrough step reveals the row. */
var LEDGER = [
  { id: '1',  step: 1, trans: '(1)', cash:  10000, cs: 10000,  rem: 'Issued stock' },
  { id: '2',  step: 2, trans: '(2)', cash:   -800, exp:   800, rem: 'Rent expense' },

function totalsUpTo(step) {
  var t = {};

    COLS.forEach(function (c) { if (r[c.k]) t[c.k] += r[c.k]; });

  return t;
}
function assetsOf(t) { return t.cash + t.ar + t.eq; }
function claimsOf(t) { return t.np + t.ap + t.cs + t.rev - t.exp - t.div; }

<script>
/* ============================================================
   APP SHELL
   A paged walkthrough. Advancing a step reveals the ledger row
   it produces, in both the guide and the full table.
   ============================================================ */
(function () {
  var STORE = 'speedy.walkthrough.v1';
  var LAST = STEPS.length - 1;
  var cur = 0;
  var tab = 'guide';
  var theme = '';

  function $(id) { return document.getElementById(id); }

  function load() {
    try {
      var p = JSON.parse(window.localStorage.getItem(STORE) || '{}');
      if (typeof p.step === 'number' && p.step >= 0 && p.step <= LAST) cur = p.step;
      if (p.tab === 'table' || p.tab === 'guide') tab = p.tab;
      theme = p.theme || '';
    } catch (e) { /* private mode: run without persistence */ }
  }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify({ step: cur, tab: tab, theme: theme })); } catch (e) {}
  }

  /* ---------- the ledger table ----------
     `upto` reveals rows; `hits` rings the cells this step produced. */
  function ledgerTable(upto, hits, opts) {
    opts = opts || {};
    var showTotals = !!opts.totals;
    var all = hits && hits.indexOf('all') !== -1;

    var grp = '<tr class="grp">' +
      '<th class="lab"></th>' +
      '<th colspan="3">ASSETS</th>' +
      '<th class="op">=</th>' +
      '<th colspan="2">LIABILITIES</th>' +
      '<th class="op">+</th>' +
      '<th colspan="4">STOCKHOLDERS&rsquo; EQUITY</th>' +
      (opts.remarks === false ? '' : '<th></th>') +
      '</tr>';

    function headCells() {
      var out = '', i;
      for (i = 0; i < COLS.length; i++) {
        if (i === 3) out += '<th class="op">=</th>';
        if (i === 5) out += '<th class="op">+</th>';
        out += '<th>' + COLS[i].head + '</th>';
      }
      return out;
    }
    var head = '<tr class="acct"><th class="lab">Trans.</th>' + headCells() +
      (opts.remarks === false ? '' : '<th style="text-align:left">Remark</th>') + '</tr>';

    var rows = LEDGER.filter(function (r) { return r.step <= upto; });
    var body = rows.map(function (r) {
      var fresh = r.step === upto ? ' class="fresh"' : '';
      var out = '<tr' + fresh + '><td class="lab">' + (r.trans || '') + '</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) out += '<td class="op"></td>';
        if (i === 5) out += '<td class="op"></td>';
        var v = r[c.k];
        var hit = (r.step === upto && hits && hits.indexOf(c.k) !== -1) ? ' class="hit"' : '';
        out += '<td' + hit + '>' + (v ? money(v) : '') + '</td>';
      });
      if (opts.remarks !== false) out += '<td class="rem">' + (r.rem || '') + '</td>';
      return out + '</tr>';
    }).join('');

    var foot = '';
    if (showTotals) {
      var t = totalsUpTo(upto);
      foot = '<tr class="totals"><td class="lab">Totals</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) foot += '<td class="op">=</td>';
        if (i === 5) foot += '<td class="op">+</td>';
        var hit = (all || (hits && hits.indexOf(c.k) !== -1)) ? ' class="hit"' : '';
        foot += '<td' + hit + '>' + (t[c.k] ? dollars(t[c.k]) : '&mdash;') + '</td>';
      });
      if (opts.remarks !== false) foot += '<td class="rem"></td>';
      foot += '</tr>';
    }

    var proof = '';
    if (showTotals) {
      var tt = totalsUpTo(upto);
      proof = '<div class="proof"><span>Assets ' + dollars(assetsOf(tt)) + '</span>' +
        '<span>=</span><span>Liabilities + Equity ' + dollars(claimsOf(tt)) + '</span>' +
        '<span>' + ICON.check + '</span></div>';
    }

    return '<div class="card pop"><div class="tbl-scroll"><table class="led"><thead>' + grp + head +
      '</thead><tbody>' + body + '</tbody>' + (foot ? '<tfoot>' + foot + '</tfoot>' : '') +
      '</table></div>' + proof + '</div>';
  }

  /* ---------- guide pane ---------- */
  function renderGuide() {
    var s = STEPS[cur];
    var impact = '';

    if (s.hits && s.hits.length) {
      impact = '<div class="box box-impact"><div class="impact-cap">' + ICON.pulse +
        (s.totals ? 'The summary so far' : 'Changes in this step') + '</div>' +
        ledgerTable(cur, s.hits, { totals: !!s.totals, remarks: !s.totals }) + '</div>';
    }

    $('guide').innerHTML =
      '<div class="wrap fade">' +
      '<div class="step-eyebrow">Step ' + cur + ' of ' + LAST + '</div>' +
      '<h2 class="step-title">' + s.title + '</h2>' +
      '<div class="stack">' +
      '<div class="box box-fact"><span class="box-tag">The fact</span><p>' + s.fact + '</p></div>' +
      '<div class="box box-concept"><span class="box-tag">' + ICON.bulb + 'Key concept: ' + s.concept + '</span>' +
      '<p>' + s.why + '</p></div>' +
      (s.eq ? equationStrip(s.eq[0], s.eq[1]) : '') +
      (s.warn ? '<div class="note-warn">' + ICON.warn + '<p>' + s.warn + '</p></div>' : '') +
      (s.doc || '') +
      (s.extra || '') +
      impact +
      (s.after || '') +
      (s.result ? '<div class="proof" style="border-radius:12px">' + ICON.check + '<span>' + s.result + '</span></div>' : '') +
      '</div><div style="height:8px"></div></div>';
    $('guide').parentNode.scrollTop = 0;
  }

  function equationStrip(left, right) {
    function side(cap, items) {
      return '<div class="eq-side"><span class="eq-cap">' + cap + '</span>' +
        items.map(function (i) { return '<span class="eq-item">' + i[0] + ' <b>' + i[1] + '</b></span>'; }).join('') +
        '</div>';
    }
    return '<div class="equation">' + side('Assets', left) + '<div class="eq-op">=</div>' +
      side('Liabilities + Equity', right) + '</div>';
  }

  /* ---------- table pane ---------- */
  function renderTable() {
    var s = STEPS[cur];
    if (cur === 0) {
      $('table-slot').innerHTML =
        '<div class="hint">Advance the walkthrough with the controls below and this table will build itself, one transaction at a time.</div>';
      return;
    }
    $('table-slot').innerHTML = ledgerTable(cur, s.hits, { totals: !!s.totals });
    var sc = $('table-scroll');
    var fresh = $('table-slot').querySelector('tr.fresh, tr.totals');
    if (fresh) {
      window.setTimeout(function () {
        sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
      }, 90);
    }
  }

  /* ---------- chrome ---------- */
  function renderControls() {
    $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === LAST;
    $('next-label').textContent = cur === 0 ? 'Start' : (cur === LAST ? 'Done' : 'Next');
    $('prog-label').textContent = 'Step ' + cur + ' of ' + LAST;
    $('prog-fill').style.transform = 'scaleX(' + (cur / LAST) + ')';
  }

  function renderTabs() {
    $('tab-guide').classList.toggle('on', tab === 'guide');
    $('tab-table').classList.toggle('on', tab === 'table');
    $('pane-guide').classList.toggle('on', tab === 'guide');
    $('pane-table').classList.toggle('on', tab === 'table');
  }

  function render() {
    renderTabs();
    renderGuide();
    renderTable();
    renderControls();
  }

  /* ---------- navigation ---------- */
  function go(n) {
    var next = Math.max(0, Math.min(LAST, n));
    if (next === cur) return;
    cur = next;
    save();
    render();
  }

  $('btn-prev').addEventListener('click', function () { go(cur - 1); });
  $('btn-next').addEventListener('click', function () { go(cur + 1); });
  $('tab-guide').addEventListener('click', function () { tab = 'guide'; save(); render(); });
  $('tab-table').addEventListener('click', function () { tab = 'table'; save(); render(); });

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0b1220' : '#2563eb');
  }
  $('btn-theme').addEventListener('click', function () {
    theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  if (!theme) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  render();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();

</script>
</body>
</html>
