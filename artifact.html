      : st === 'balanced' ? '<span class="pill ready">Balanced</span>'
      : '<span class="pill off">Out of balance</span>';
    var off = st === 'draft'
      ? '<div class="gl-off idle"><span>Enter the debit and the credit</span><span>&mdash;</span></div>'
      : (st === 'balanced' || st === 'posted')
        ? '<div class="gl-off ok"><span>In balance</span><span>' + ICON.check + '</span></div>'
        : '<div class="gl-off off"><span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span></div>';

    return '<div class="doc-je' + (locked ? ' posted' : '') + '" data-tx2="' + ji + '">' +
      '<div class="je-top"><span class="je-ref">' + jeRef(ji) + '</span>' +
        '<span class="je-date">' + j.date + ', 2025</span>' + pill + '</div>' +
      '<div class="je-memo"><u>Source document</u>' + FACTS2[j.id] + '</div>' +
      '<div class="gl">' +
        '<div class="gl-hd"><span>Account</span><span>Debit</span><span>Credit</span></div>' + rows +
        '<div class="gl-foot"><span class="lbl">Totals</span><span>' + (t.d ? money2(t.d) : '&mdash;') + '</span><span>' + (t.c ? money2(t.c) : '&mdash;') + '</span></div>' +
        off +
      '</div>' +
      '<div class="je-acts">' +
        '<button type="button" class="ws-hint" data-hint2="' + ji + '">' + ICON.bulb + 'Hint</button>' +
        (locked
          ? '<button type="button" class="btn-post undo" data-unpost="' + ji + '">Unpost</button>'
          : '<button type="button" class="btn-post" data-post="' + ji + '"' + (canPost(ji) ? '' : ' disabled') + '>' + ICON.check + 'Post to ledger</button>') +
      '</div>' +
      '<div data-note2="' + ji + '" style="padding:0 11px 11px"></div>' +
      '</div>';
  }

  /* Move to a voucher, remembering where we were. */
  function goVoucher(n) {
    w2.at = Math.max(0, Math.min(JOURNAL.length - 1, n));
    saveWork2();
    renderSolve2();
    renderControls();
    var doc = $('solve').querySelector('.doc-je');
    if (doc) doc.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' });
  }

  function refreshDoc(ji) {
    var t = jtotals(ji);
    var doc = $('solve').querySelector('[data-tx2="' + ji + '"]');
    if (!doc) return;
    var foot = doc.querySelectorAll('.gl-foot span');
    foot[1].innerHTML = t.d ? money2(t.d) : '&mdash;';
    foot[2].innerHTML = t.c ? money2(t.c) : '&mdash;';
    var off = doc.querySelector('.gl-off');
    off.className = 'gl-off ' + (!t.filled ? 'idle' : (t.off === 0 && t.d ? 'ok' : 'off'));
    off.innerHTML = !t.filled
      ? '<span>Enter the debit and the credit</span><span>&mdash;</span>'
      : t.off === 0 && t.d
        ? '<span>In balance</span><span>' + ICON.check + '</span>'
        : '<span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span>';
    var pill = doc.querySelector('.pill');
    if (!isPosted(ji)) {
      pill.className = 'pill ' + (!t.filled ? 'draft' : (t.off === 0 && t.d ? 'ready' : 'off'));
      pill.textContent = !t.filled ? 'Draft' : (t.off === 0 && t.d ? 'Balanced' : 'Out of balance');
    }
    var post = doc.querySelector('[data-post]');
    if (post) post.disabled = !canPost(ji);
    doc.classList.remove('graded-bad');
    var bad = doc.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  /* The trial balance columns foot themselves as they are filled. */
  function refreshTb() {
    var mt = myTbTotals();
    var p = $('tb-proof');
    if (!p) return;
    p.className = 'gl-off ' + (!mt.d && !mt.c ? 'idle' : (mt.d === mt.c ? 'ok' : 'off'));
    p.innerHTML = !mt.d && !mt.c
      ? '<span>Fill the columns and they will foot themselves</span><span>&mdash;</span>'
      : mt.d === mt.c
        ? '<span>Your columns agree at ' + dollars(mt.d) + '</span><span>' + ICON.check + '</span>'
        : '<span>Your columns are out by</span><span>' + dollars(Math.abs(mt.d - mt.c)) + '</span>';
  }

  function refreshInstr() {
    var host = $('solve').querySelector('.instr');
    if (!host) return;
    var sc = score2();
    Array.prototype.forEach.call(host.querySelectorAll('.instr-row'), function (row, i) {
      var x = INSTRUCTIONS2[i], got = sc.parts[x.id], cap = sc.caps[x.id];
      var done = cap > 0 && got === cap;
      row.classList.toggle('done', done);
      row.querySelector('.instr-k').innerHTML = done ? ICON.check : x.id + '.';
      row.querySelector('.instr-n').textContent = got + '/' + cap;
    });
  }

  function gradeSolve2() {
    w2.graded = 1;
    JOURNAL.forEach(function (j, ji) {
      var doc = $('solve').querySelector('[data-tx2="' + ji + '"]');
      if (!doc) return;                       // only the open voucher is on screen
      var note = $('solve').querySelector('[data-note2="' + ji + '"]');
      var ok = entryRight2(ji), touched = entryTouched2(ji);
      doc.classList.toggle('graded-bad', !ok && touched);
      if (ok || !touched) { var stale = doc.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!w2.hint[ji]) note.innerHTML = '<div class="ws-note bad">' + entryDiag2(ji) + '</div>';
    });
    // The chip strip carries the verdict for the vouchers that are not open.
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-vgo]'), function (c) {
      var ji = Number(c.getAttribute('data-vgo'));
      c.classList.toggle('bad', entryTouched2(ji) && !entryRight2(ji));
    });

    var led = myLedger(), key = postedThrough(999);
    ledgerAccts().forEach(function (k) {
      var box = $('solve').querySelector('[data-acct="' + k + '"]');
      if (!box) return;
      var note = $('solve').querySelector('[data-bnote="' + k + '"]');
      var ok = balRight(k), touched = balTouched(k);
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      var old = box.querySelector('.ws-note.bad');
      if (old) old.remove();
      if (ok || !touched || w2.hint['b' + k]) return;
      // A balance that is right for the learner's own ledger points upstream.
      note.innerHTML = '<div class="ws-note bad">' +
        (amountOf(w2.bal[k]) === myBal(led, k)
          ? 'That is the correct balance for your ledger, but your ledger is not right yet. Check the vouchers that touch this account.'
          : 'Not yet. Foot the debit side, foot the credit side, and take the difference.') + '</div>';
    });

    tbGraded().forEach(function (a) {
      var row = $('solve').querySelector('[data-tbrow="' + a.k + '"]');
      if (!row) return;
      var ok = tbRight(a.k), touched = tbTouched(a.k);
      row.classList.toggle('right', ok);
      row.classList.toggle('wrong', !ok && touched);
    });
    // An account with no balance must be left blank, not filled with a zero.
    ACCT.forEach(function (a) {
      if (balOf(key, a.k)) return;
      var row = $('solve').querySelector('[data-tbrow="' + a.k + '"]');
      if (row) row.classList.toggle('wrong', tbTouched(a.k));
    });
    var tot = $('solve').querySelector('.tbf-tot');
    if (tot) {
      tot.classList.toggle('right', tbTotalRight('d') && tbTotalRight('c'));
      tot.classList.toggle('wrong', (String(w2.tbt.d || '').trim() !== '' || String(w2.tbt.c || '').trim() !== '') &&
        !(tbTotalRight('d') && tbTotalRight('c')));
    }

    refreshInstr();
    renderControls();
    var first = $('solve').querySelector('.doc-je.graded-bad, .ta-box.wrong, .tbf-row.wrong');
    if (first) first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  function bindSolve2() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-a2]');
      if (!sel) return;
      w2.fx[sel.getAttribute('data-a2') + '.k'] = sel.value;
      refreshDoc(sel.getAttribute('data-a2').split('.')[0]);
      saveWork2(); refreshInstr(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var d = e.target.closest('[data-d2]'), c = e.target.closest('[data-c2]');
      if (d || c) {
        var el = d || c, key = el.getAttribute(d ? 'data-d2' : 'data-c2');
        var col = d ? 'd' : 'c', other = d ? 'c' : 'd';
        w2.fx[key + '.' + col] = el.value;
        var twin = host.querySelector('[data-' + other + '2="' + key + '"]');
        if (el.value && twin && twin.value) { twin.value = ''; w2.fx[key + '.' + other] = ''; }
        if (twin) twin.classList.toggle('muted', !!el.value);
        el.classList.remove('muted');
        refreshDoc(key.split('.')[0]);
        saveWork2(); refreshInstr(); renderControls();
        return;
      }
      var b = e.target.closest('[data-bal]');
      if (b) {
        var bk = b.getAttribute('data-bal');
        w2.bal[bk] = b.value;
        var box = host.querySelector('[data-acct="' + bk + '"]');
        if (box) {
          box.classList.remove('right', 'wrong');
          var stale = box.querySelector('.ws-note.bad');
          if (stale) stale.remove();
        }
        saveWork2(); refreshInstr(); renderControls();
        return;
      }
      var t = e.target.closest('[data-tb]');
      if (t) {
        var tk = t.getAttribute('data-tb');
        w2.tb[tk] = t.value;
        var row = host.querySelector('[data-tbrow="' + tk.split('.')[0] + '"]');
        if (row) row.classList.remove('right', 'wrong');
        refreshTb(); saveWork2(); refreshInstr(); renderControls();
        return;
      }
      var tt = e.target.closest('[data-tbt]');
      if (tt) {
        w2.tbt[tt.getAttribute('data-tbt')] = tt.value;
        var totRow = host.querySelector('.tbf-tot');
        if (totRow) totRow.classList.remove('right', 'wrong');
        refreshTb(); saveWork2(); refreshInstr(); renderControls();
      }
    });

    host.addEventListener('click', function (e) {
      var v = e.target.closest('[data-vgo]');
      if (v) { goVoucher(Number(v.getAttribute('data-vgo'))); return; }
      if (e.target.closest('[data-vprev]')) { goVoucher((w2.at || 0) - 1); return; }
      if (e.target.closest('[data-vnext]')) { goVoucher((w2.at || 0) + 1); return; }
      var p = e.target.closest('[data-post]');
      if (p) {
        var ji = Number(p.getAttribute('data-post'));
        if (!canPost(ji)) return;
        w2.posted[ji] = 1;
        // Carry on to the next voucher still waiting, the way a run of data
        // entry does, rather than leaving the finished one on screen.
        var next = ji;
        for (var n = 1; n <= JOURNAL.length; n++) {
          var c = (ji + n) % JOURNAL.length;
          if (!isPosted(c)) { next = c; break; }
        }
        w2.at = next;
        saveWork2(); renderSolve2(); renderControls();
        return;
      }
      var u = e.target.closest('[data-unpost]');
      if (u) {
        delete w2.posted[u.getAttribute('data-unpost')];
        saveWork2(); renderSolve2(); renderControls();
        return;
      }
      var x = e.target.closest('[data-hclose]');
      if (x) { shut2(x.getAttribute('data-hclose')); return; }
      var h = e.target.closest('[data-hint2]');
      if (h) {
        var key = h.getAttribute('data-hint2');
        bump2(key, (HINTS2[JOURNAL[Number(key)].id] || []).length);
        return;
      }
      var bh = e.target.closest('[data-bhint]');
      if (bh) { bump2('b' + bh.getAttribute('data-bhint'), 3); return; }
      var th = e.target.closest('[data-thint]');
      if (th) { bump2('t' + th.getAttribute('data-thint'), 3); return; }
      if (e.target.closest('#ws-reset2')) {
        if (!window.confirm('Clear every voucher, posting, balance and hint?')) return;
        w2.fx = {}; w2.hint = {}; w2.shut = {}; w2.posted = {}; w2.bal = {}; w2.tb = {}; w2.tbt = {};
        w2.at = 0; w2.graded = 0;
        saveWork2(); renderSolve2(); renderControls();
      }
    });
  }

  /* ---------- module 2.3: adjusting entries ---------- */

  var FLOW3 = ENTRIES3.concat(REPORTS3);

  /* ---------- illustration: where the cash sits on the timeline ----------
     The whole of this module is one idea: the cash and the earning happen
     at different moments, and the adjustment closes the gap. A deferral has
     the cash first, an accrual has it last. */
  function timeline(a) {
    var deferral = a.kind === 'deferral';
    var cashPct = deferral ? 8 : 82;
    var usePct = deferral ? 52 : 40;
    var cashMark = '<span class="tl-mark cash" style="left:' + cashPct + '%">' +
      '<b>Cash moves</b><u>' + (deferral ? 'already paid' : 'not yet') + '</u></span>';
    var useMark = '<span class="tl-mark use" style="left:' + usePct + '%">' +
      '<b>' + (a.lines[0][0] === 'ar' ? 'Service performed' : 'Benefit used') + '</b><u>during July</u></span>';
    /* Emitted left to right. On an accrual the cash sits after the work, and
       a reader going through this linearly has to meet them in that order or
       the picture says the opposite of what it shows. */
    var marks = cashPct < usePct ? cashMark + useMark : useMark + cashMark;
    return '<div class="tl">' +
        '<div class="tl-bar">' +
          '<i class="tl-tick" style="left:0"></i>' +
          '<i class="tl-tick" style="left:100%"></i>' +
          marks +
        '</div>' +
        '<div class="tl-ends"><span>July 1</span><span>July 31</span></div>' +
      '</div>' +
      '<div class="tl-verdict ' + (deferral ? 'def' : 'acc') + '">' +
        '<b>' + (deferral ? 'Deferral' : 'Accrual') + '</b>' +
        '<span>' + (deferral
          ? 'The cash moved first. The adjustment splits it between what has been used and what has not.'
          : 'The cash has not moved. The adjustment records what has happened anyway.') + '</span>' +
      '</div>';
  }

  /* ---------- illustration: one of each, and never Cash ---------- */

    function slot(cls, cap, l) {
      var ac = acct3(l[0]);
      return '<div class="pair-col ' + cls + '">' +
        '<span class="pair-cap">' + cap + '</span>' +
        '<div class="pair-acct"><b>' + ac.no + '</b><span>' + ac.name + '</span>' +
        '<em>' + (l[1] ? 'Dr ' : 'Cr ') + money2(l[1] || l[2]) + '</em></div>' +
        '</div>';
    }
    var is = a.lines.filter(function (l) { return acct3(l[0]).stmt === 'I'; })[0];
    var bs = a.lines.filter(function (l) { return acct3(l[0]).stmt === 'B'; })[0];
    return '<div class="pair">' + slot('i', 'Income statement', is) + slot('b', 'Balance sheet', bs) + '</div>' +
      '<div class="verdict ok">' + ICON.check + ' One of each, and Cash is untouched</div>';

  function rowViz(a) {

  /* ---------- the two families ---------- */

  /* ---------- the three-column worksheet ---------- */
  function worksheet3(upto) {
    var after = adjustedThrough(upto === undefined ? 999 : upto);
    var ut = tbTotals3(UNADJ), at2 = tbTotals3(after);

  /* ---------- module 2.3 worksheet ----------
     a. Journalize the following adjustments.
     b. Show the effects on the trial balance to prepare an adjusted
        trial balance.

     Posting an adjustment carries it onto the worksheet's Adjustments
     columns; extending each row to its new balance is the learner's. */

  var INSTRUCTIONS3 = [
    { id: 'a', text: 'Journalize the five adjustments.' },
    { id: 'b', text: 'Show the effects on the trial balance to prepare an adjusted trial balance.' }
  ];

  var w3 = { fx: {}, hint: {}, shut: {}, posted: {}, adj: {}, tot: {}, at: 0, graded: 0 };

  function loadWork3() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work3') || '{}');
      if (w && typeof w === 'object') {
        w3.fx = w.fx || {}; w3.hint = w.hint || {}; w3.shut = w.shut || {};
        w3.posted = w.posted || {}; w3.adj = w.adj || {}; w3.tot = w.tot || {};
        w3.at = w.at || 0;
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork3() {
    try { window.localStorage.setItem(STORE + '.work3', JSON.stringify(w3)); } catch (e) {}
  }

  function c3(ai, li, col) { return w3.fx[ai + '.' + li + '.' + col]; }
  function a3line(ai, li) {
    var k = c3(ai, li, 'k'), d = amt2(c3(ai, li, 'd')), c = amt2(c3(ai, li, 'c'));
    if (!k || (d && c) || (!d && !c)) return null;
    return { k: k, s: d ? 'D' : 'C', n: d || c };
  }
  function a3totals(ai) {
    var d = 0, c = 0, filled = 0;
    for (var i = 0; i < 2; i++) {
      d += amt2(c3(ai, i, 'd'));
      c += amt2(c3(ai, i, 'c'));
      if (c3(ai, i, 'k') || amt2(c3(ai, i, 'd')) || amt2(c3(ai, i, 'c'))) filled++;
    }
    return { d: d, c: c, off: d - c, filled: filled };
  }
  function canPost3(ai) {
    var t = a3totals(ai);
    if (!t.d || t.off !== 0) return false;
    return !!(a3line(ai, 0) && a3line(ai, 1));
  }
  function isPosted3(ai) { return !!w3.posted[ai]; }

  function a3Right(ai) {
    var want = ADJ[ai].lines.map(function (l) {
      return l[0] + ':' + (l[1] ? 'D' : 'C') + ':' + (l[1] || l[2]);
    }).sort().join('|');
    var got = [];
    for (var i = 0; i < 2; i++) {
      var l = a3line(ai, i);
      if (!l) return false;
      got.push(l.k + ':' + l.s + ':' + l.n);
    }
    return got.sort().join('|') === want;
  }
  function a3Touched(ai) { return a3totals(ai).filled > 0; }

  function a3Diag(ai) {
    var t = a3totals(ai), done = 0;
    for (var i = 0; i < 2; i++) if (a3line(ai, i)) done++;
    if (!t.filled) return 'Nothing entered yet. Every adjusting entry has two lines.';
    if (done < 2) return 'Both lines need an account and one amount, in either column &mdash; ' + done + ' of 2 complete.';
    if (t.off !== 0) return 'Out of balance by ' + dollars(Math.abs(t.off)) + '. Debits ' + dollars(t.d) + ', credits ' + dollars(t.c) + '.';
    if (t.d !== adjDebits(ADJ[ai])) return 'It balances, but the amount is not right. Work out how much of the cost belongs to July.';
    var mine = [], theirs = [];
    for (var x = 0; x < 2; x++) { var q = a3line(ai, x); mine.push(q.k + q.s); }
    ADJ[ai].lines.forEach(function (l) { theirs.push(l[0] + (l[1] ? 'D' : 'C')); });
    var sameAccts = mine.map(function (m) { return m.slice(0, -1); }).sort().join() ===
                    theirs.map(function (m) { return m.slice(0, -1); }).sort().join();
    if (sameAccts) return 'The right accounts, on the wrong sides. Ask which one is the expense or revenue and which is the balance sheet account.';
    // The two rules that catch most wrong-account attempts.
    var used = mine.map(function (m) { return m.slice(0, -1); });
    if (used.indexOf('cash') !== -1) return 'An adjusting entry never touches Cash. The cash either moved in an earlier month or has not moved at all.';
    var isCount = used.filter(function (k) { return acct3(k) && acct3(k).stmt === 'I'; }).length;
    if (isCount !== 1) return 'Every adjusting entry changes exactly one income statement account and one balance sheet account. This one changes ' + isCount + ' income statement accounts.';
    return 'It balances and the amount is right, so one of the accounts is wrong.';
  }

  /* ---- (b) the learner's own adjusted column ---- */
  function myAdjusted() {
    var t = {};
    ACCT3.forEach(function (a) { t[a.k] = UNADJ[a.k] || 0; });
    ADJ.forEach(function (a, ai) {
      if (!isPosted3(ai)) return;
      for (var i = 0; i < 2; i++) {
        var l = a3line(ai, i);
        if (!l) continue;
        t[l.k] += (acct3(l.k).up === 'D') ? (l.s === 'D' ? l.n : -l.n) : (l.s === 'C' ? l.n : -l.n);
      }
    });
    return t;
  }
  function myAdjOn(k) {
    var d = 0, c = 0;
    ADJ.forEach(function (a, ai) {
      if (!isPosted3(ai)) return;
      for (var i = 0; i < 2; i++) {
        var l = a3line(ai, i);
        if (l && l.k === k) { if (l.s === 'D') d += l.n; else c += l.n; }
      }
    });
    return { d: d, c: c };
  }
  function afterRight(k) { return amountOf(w3.adj[k]) === adjustedThrough(999)[k]; }
  function afterTouched(k) { return String(w3.adj[k] === undefined ? '' : w3.adj[k]).trim() !== ''; }
  function totRight(col) {
    var want = tbTotals3(adjustedThrough(999));
    return amountOf(w3.tot[col]) === (col === 'd' ? want.d : want.c);
  }

  function score3() {
    var a = 0, b = 0;
    ADJ.forEach(function (x, i) { if (a3Right(i)) a++; });
    ACCT3.forEach(function (x) { if (afterRight(x.k)) b++; });
    if (totRight('d')) b++;
    if (totRight('c')) b++;
    return {
      got: a + b, total: ADJ.length + ACCT3.length + 2,
      parts: { a: a, b: b }, caps: { a: ADJ.length, b: ACCT3.length + 2 }
    };
  }

  function adjHints(ai) {
    var a = ADJ[ai];
    return [
      a.kind === 'deferral'
        ? 'The cash for this already moved. How much of what it bought has been used up by July 31?'
        : 'No cash has moved. Something happened anyway &mdash; what, and who does it affect?',
      'It changes one income statement account and one balance sheet account, and never Cash.',
      'Debit ' + acct3(a.lines[0][0]).name + ' ' + money2(a.lines[0][1]) +
        '. Credit ' + acct3(a.lines[1][0]).name + ' ' + money2(a.lines[1][2]) + '.'
    ];
  }
  function afterHints(k) {
    var a = acct3(k), u = UNADJ[k] || 0, x = myAdjOn(k);
    return [
      'Take the unadjusted balance and apply whatever the adjustments did to this account.',
      'Unadjusted ' + dollars(u) + ', and your posted adjustments put ' + dollars(x.d) + ' on the debit side and ' + dollars(x.c) + ' on the credit side.',
      a.up === 'D' ? dollars(u) + ' + ' + money2(x.d) + ' &minus; ' + money2(x.c) + '.'
                   : dollars(u) + ' + ' + money2(x.c) + ' &minus; ' + money2(x.d) + '.'
    ];
  }

  function paintHint3(key) {
    var lvl = w3.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max = 3;
    if (key.charAt(0) === 'r' && acct3(key.slice(1))) {
      var rk = key.slice(1);
      text = afterHints(rk)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-rnote="' + rk + '"]');
      btn = host.querySelector('[data-rhint="' + rk + '"]');
    } else {
      var ai = Number(key);
      if (!ADJ[ai]) return;
      text = adjHints(ai)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note3="' + ai + '"]');
      btn = host.querySelector('[data-hint3="' + ai + '"]');
    }
    if (!slot || !text) return;
    var shut = !!w3.shut[key];
    slot.innerHTML = shut ? '' : tipHtml(key, text);
    if (!btn) return;
    btn.classList.toggle('on', !shut);
    if (!btn.classList.contains('sm')) {
      btn.innerHTML = ICON.bulb + (shut ? 'Show hint' : (lvl >= max ? 'No more hints' : 'Another hint'));
    }
    btn.disabled = !shut && lvl >= max;
  }
  function bump3(key, max) {
    if (w3.shut[key]) delete w3.shut[key];
    else w3.hint[key] = Math.min((w3.hint[key] || 0) + 1, max);
    paintHint3(key);
    saveWork3();
  }

  function instrPanel3() {
    var sc = score3();
    return '<div class="instr"><div class="instr-cap">Instructions</div>' +
      INSTRUCTIONS3.map(function (x) {
        var got = sc.parts[x.id], cap = sc.caps[x.id], done = cap > 0 && got === cap;
        return '<div class="instr-row' + (done ? ' done' : '') + '">' +
          '<span class="instr-k">' + (done ? ICON.check : x.id + '.') + '</span>' +
          '<span class="instr-t">' + x.text + '</span>' +
          '<span class="instr-n">' + got + '/' + cap + '</span></div>';
      }).join('') + '</div>';
  }

  function vState3(ai) {
    if (isPosted3(ai)) return 'posted';
    var t = a3totals(ai);
    if (!t.filled) return 'draft';
    return (t.off === 0 && t.d) ? 'balanced' : 'off';
  }

  function renderSolve3() {
    var opts = '<option value="">&mdash; select account &mdash;</option>' + ACCT3.map(function (a) {
      return '<option value="' + a.k + '">' + a.no + '  ' + a.name.replace('&mdash;', '—') + '</option>';
    }).join('');
    var cur = Math.max(0, Math.min(ADJ.length - 1, w3.at || 0));
    var posted = 0;
    ADJ.forEach(function (a, i) { if (isPosted3(i)) posted++; });

    var chips = ADJ.map(function (a, ai) {
      var st = vState3(ai);
      return '<button type="button" class="vchip' + (ai === cur ? ' now' : '') +
        (st === 'posted' ? ' done' : (st === 'off' ? ' off' : '')) +
        (w3.graded && a3Touched(ai) && !a3Right(ai) ? ' bad' : '') + '" data-v3="' + ai + '"' +
        ' aria-label="Adjustment ' + a.n + ' of 5, ' + st + '"' + (ai === cur ? ' aria-current="true"' : '') + '>' +
        (st === 'posted' ? ICON.check : a.n) + '</button>';
    }).join('');

    var a = ADJ[cur], t = a3totals(cur), locked = isPosted3(cur), st = vState3(cur);
    var rows = '';
    for (var i = 0; i < 2; i++) {
      var dv = c3(cur, i, 'd') || '', cv = c3(cur, i, 'c') || '';
      rows += '<div class="gl-row">' +

    var body = ACCT3.map(function (x) {

        '<td class="hcell"><button type="button" class="ws-hint sm" data-rhint="' + x.k + '" aria-label="Hint for ' + x.name.replace('&mdash;', ' ') + '">' + ICON.bulb + '</button></td>' +
        '</tr><tr class="notrow"><td colspan="8"><div data-rnote="' + x.k + '"></div></td></tr>';
    }).join('');
    var ut = tbTotals3(UNADJ);
    var foot = '<tr><td class="rowlab">Totals</td>' +
      '<td class="ro">' + money2(ut.d) + '</td><td class="ro">' + money2(ut.c) + '</td>' +

  function refreshDoc3(ai) {
    var t = a3totals(ai);
    var doc = $('solve').querySelector('[data-tx3="' + ai + '"]');
    if (!doc) return;
    var foot = doc.querySelectorAll('.gl-foot span');
    foot[1].innerHTML = t.d ? money2(t.d) : '&mdash;';
    foot[2].innerHTML = t.c ? money2(t.c) : '&mdash;';
    var st = vState3(ai);
    var off = doc.querySelector('.gl-off');
    off.className = 'gl-off ' + (st === 'draft' ? 'idle' : ((st === 'balanced' || st === 'posted') ? 'ok' : 'off'));
    off.innerHTML = st === 'draft'
      ? '<span>Enter the debit and the credit</span><span>&mdash;</span>'
      : (st === 'balanced' || st === 'posted')
        ? '<span>In balance</span><span>' + ICON.check + '</span>'
        : '<span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span>';
    var pill = doc.querySelector('.pill');
    if (!isPosted3(ai)) {
      pill.className = 'pill ' + (st === 'draft' ? 'draft' : (st === 'balanced' ? 'ready' : 'off'));
      pill.textContent = st === 'draft' ? 'Draft' : (st === 'balanced' ? 'Balanced' : 'Out of balance');
    }
    var post = doc.querySelector('[data-post3]');
    if (post) post.disabled = !canPost3(ai);
    doc.classList.remove('graded-bad');
    var bad = doc.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function refreshProof3() {
    var typed = { d: amountOf(w3.tot.d), c: amountOf(w3.tot.c) };
    var p = $('solve').querySelector('.sw-panel-bd .gl-off');
    if (!p) return;
    var idle = isNaN(typed.d) && isNaN(typed.c);
    p.className = 'gl-off ' + (idle ? 'idle' : (typed.d === typed.c ? 'ok' : 'off'));
    p.innerHTML = idle
      ? '<span>Total both columns when the rows are extended</span><span>&mdash;</span>'
      : typed.d === typed.c
        ? '<span>Your columns agree at ' + dollars(typed.d || 0) + '</span><span>' + ICON.check + '</span>'
        : '<span>Your columns are out by</span><span>' + dollars(Math.abs((typed.d || 0) - (typed.c || 0))) + '</span>';

  function refreshInstr3() {
    var host = $('solve').querySelector('.instr');
    if (!host) return;
    var sc = score3();
    Array.prototype.forEach.call(host.querySelectorAll('.instr-row'), function (row, i) {
      var x = INSTRUCTIONS3[i], got = sc.parts[x.id], cap = sc.caps[x.id];
      var done = cap > 0 && got === cap;
      row.classList.toggle('done', done);
      row.querySelector('.instr-k').innerHTML = done ? ICON.check : x.id + '.';
      row.querySelector('.instr-n').textContent = got + '/' + cap;
    });
  }

  function go3(n) {
    w3.at = Math.max(0, Math.min(ADJ.length - 1, n));
    saveWork3(); renderSolve3(); renderControls();
  }

  function gradeSolve3() {
    w3.graded = 1;
    ADJ.forEach(function (a, ai) {
      var doc = $('solve').querySelector('[data-tx3="' + ai + '"]');
      if (!doc) return;
      var note = $('solve').querySelector('[data-note3="' + ai + '"]');
      var ok = a3Right(ai), touched = a3Touched(ai);
      doc.classList.toggle('graded-bad', !ok && touched);
      if (ok || !touched) { var stale = doc.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!w3.hint[ai]) note.innerHTML = '<div class="ws-note bad">' + a3Diag(ai) + '</div>';
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-v3]'), function (c) {
      var ai = Number(c.getAttribute('data-v3'));
      c.classList.toggle('bad', a3Touched(ai) && !a3Right(ai));
    });
    var mine = myAdjusted();
    ACCT3.forEach(function (x) {
      var row = $('solve').querySelector('[data-arow="' + x.k + '"]');
      if (!row) return;
      var ok = afterRight(x.k), touched = afterTouched(x.k);
      row.classList.toggle('right', ok);
      row.classList.toggle('wrong', !ok && touched);
      var note = $('solve').querySelector('[data-rnote="' + x.k + '"]');
      if (!note) return;
      var old = note.querySelector('.ws-note.bad');
      if (old) old.remove();
      if (ok || !touched || w3.hint['r' + x.k]) return;
      note.innerHTML = '<div class="ws-note bad">' +
        (amountOf(w3.adj[x.k]) === mine[x.k]
          ? 'That follows from the adjustments you have posted, but they are not all right yet. Check part (a).'
          : 'Not yet. Take the unadjusted balance and apply the adjustments on this row.') + '</div>';
    });
    refreshInstr3();
    renderControls();
    var first = $('solve').querySelector('.doc-je.graded-bad, .wp-row.wrong');
    if (first) first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  function bindSolve3() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-a3]');
      if (!sel) return;
      w3.fx[sel.getAttribute('data-a3') + '.k'] = sel.value;
      refreshDoc3(sel.getAttribute('data-a3').split('.')[0]);
      saveWork3(); refreshInstr3(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var d = e.target.closest('[data-d3]'), c = e.target.closest('[data-c3]');
      if (d || c) {
        var el = d || c, key = el.getAttribute(d ? 'data-d3' : 'data-c3');
        var col = d ? 'd' : 'c', other = d ? 'c' : 'd';
        w3.fx[key + '.' + col] = el.value;
        var twin = host.querySelector('[data-' + other + '3="' + key + '"]');
        if (el.value && twin && twin.value) { twin.value = ''; w3.fx[key + '.' + other] = ''; }
        if (twin) twin.classList.toggle('muted', !!el.value);
        el.classList.remove('muted');
        refreshDoc3(key.split('.')[0]);
        saveWork3(); refreshInstr3(); renderControls();
        return;
      }
      var af = e.target.closest('[data-after]');
      if (af) {
        var k = af.getAttribute('data-after');
        w3.adj[k] = af.value;
        var row = host.querySelector('[data-arow="' + k + '"]');
        if (row) row.classList.remove('right', 'wrong');
        var note = host.querySelector('[data-rnote="' + k + '"] .ws-note.bad');
        if (note) note.remove();
        saveWork3(); refreshInstr3(); renderControls();
        return;
      }
      var tt = e.target.closest('[data-tot3]');
      if (tt) {
        w3.tot[tt.getAttribute('data-tot3')] = tt.value;
        refreshProof3(); saveWork3(); refreshInstr3(); renderControls();
      }
    });

    host.addEventListener('click', function (e) {
      var v = e.target.closest('[data-v3]');
      if (v) { go3(Number(v.getAttribute('data-v3'))); return; }
      if (e.target.closest('[data-v3prev]')) { go3((w3.at || 0) - 1); return; }
      if (e.target.closest('[data-v3next]')) { go3((w3.at || 0) + 1); return; }
      var p = e.target.closest('[data-post3]');
      if (p) {
        var ai = Number(p.getAttribute('data-post3'));
        if (!canPost3(ai)) return;
        w3.posted[ai] = 1;
        var next = ai;
        for (var n = 1; n <= ADJ.length; n++) {
          var q = (ai + n) % ADJ.length;
          if (!isPosted3(q)) { next = q; break; }
        }
        w3.at = next;
        saveWork3(); renderSolve3(); renderControls();
        return;
      }
      var u = e.target.closest('[data-unpost3]');
      if (u) {
        delete w3.posted[u.getAttribute('data-unpost3')];
        saveWork3(); renderSolve3(); renderControls();
        return;
      }
      var x = e.target.closest('[data-hclose]');
      if (x) {
        var hk = x.getAttribute('data-hclose');
        w3.shut[hk] = 1; paintHint3(hk); saveWork3();
        return;
      }
      var h = e.target.closest('[data-hint3]');
      if (h) { bump3(h.getAttribute('data-hint3'), 3); return; }
      var rh = e.target.closest('[data-rhint]');
      if (rh) { bump3('r' + rh.getAttribute('data-rhint'), 3); return; }
      if (e.target.closest('#ws-reset3')) {
        if (!window.confirm('Clear every adjustment, posting and balance?')) return;
        w3.fx = {}; w3.hint = {}; w3.shut = {}; w3.posted = {}; w3.adj = {}; w3.tot = {};
        w3.at = 0; w3.graded = 0;
        saveWork3(); renderSolve3(); renderControls();
      }
    });
  }

  /* ---------- module 2.4: the closing process ---------- */

  var FLOW4 = FLOW4DATA;

  /* ---------- the closing funnel ----------
     The one diagram the module turns on. Revenue and the expenses drain into
     Income Summary, whose balance moves to Retained Earnings — and Dividends
     goes straight there, bypassing Income Summary entirely. That bypass is the

    var t = preClose(), ni = netIncome(), te = totalExpenses();
    function box(x, y, w, h, no, name, amt, cls) {
      return '<g class="' + (cls || '') + '">' +

        '<text x="' + (x + w / 2) + '" y="' + (y + 28) + '" text-anchor="middle" class="fn-num">' + money2(amt) + '</text>' +

        '<path d="M0 0 L8 4 L0 8 z" fill="currentColor" /></marker>' +
      '<marker id="fnArrowA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L8 4 L0 8 z" class="fn-accentfill" /></marker></defs>' +

      /* Dividends sits on the Income Summary row rather than above it, so its

      box(6, 6, 96, 34, '400', 'Revenue', t.rev, 'fn-temp') +

      '<path d="M54 40 L54 66 L104 66 L104 96" fill="none" marker-end="url(#fnArrow)" />' +
      '<path d="M162 40 L162 66 L136 66 L136 96" fill="none" marker-end="url(#fnArrow)" />' +

      box(56, 98, 128, 36, '350', 'Income Summary', ni, 'fn-hold') +
      box(206, 98, 90, 36, '332', 'Dividends', t.div, 'fn-temp fn-accent') +

      '<text x="296" y="180" class="fn-lbl fn-bypass" text-anchor="end">never through Income Summary</text>' +

      box(56, 188, 156, 36, '320', 'Retained Earnings', endingRE(), 'fn-perm') +

  /* ---------- what empties and what carries forward ---------- */
  function tempPermViz() {

  /* ---------- module 2.4 worksheet ----------
     a. Prepare the income statement, a retained earnings statement and a
        classified balance sheet.
     b. Journalize and post closing entries and complete the closing process.
     c. Prepare a post-closing trial balance at July 31. */

  var INSTRUCTIONS4 = [
    { id: 'a', text: 'Prepare the income statement and a retained earnings statement for July and a classified balance sheet at July 31.' },
    { id: 'b', text: 'Journalize and post closing entries and complete the closing process.' },
    { id: 'c', text: 'Prepare a post-closing trial balance at July 31.' }
  ];

  /* The figures each statement turns on. Every one is derived, so the form
     cannot ask for something the guide did not produce. */
  var STMT_FIELDS = [
    { id: 'rev', doc: 'Income statement', label: 'Service revenue',
      answer: function () { return incomeStatement().revenue; },
      hints: ['It comes straight off the adjusted trial balance — no arithmetic.',
              'Service Revenue after the adjustments, not before.',
              'The adjusted balance is ' + '$7,900' + '.'] },
    { id: 'te', doc: 'Income statement', label: 'Total expenses',
      answer: function () { return incomeStatement().totalExpenses; },
      hints: ['Add every expense account, and only the expense accounts.',
              'Five of them: salaries and wages, supplies, maintenance and repairs, depreciation, insurance.',
              'Dividends is not one of them.'] },
    { id: 'ni', doc: 'Income statement', label: 'Net income',
      answer: function () { return netIncome(); },
      hints: ['Revenue less expenses.', 'Nothing the owners put in or took out belongs here.',
              'Service revenue less the total you just found.'] },
    { id: 're', doc: 'Retained earnings statement', label: 'Retained earnings, July 31',
      answer: function () { return endingRE(); },
      hints: ['Opening balance, plus net income, less dividends.',
              'Kleene was incorporated on July 1, so what did retained earnings open at?',
              'Zero, plus net income, less the dividends paid.'] },
    { id: 'ca', doc: 'Balance sheet', label: 'Total current assets',
      answer: function () { return balanceSheet().currentTotal; },
      hints: ['The assets expected to be used or collected within a year.',
              'Cash, accounts receivable, supplies, prepaid insurance.',
              'Equipment is not current.'] },
    { id: 'bv', doc: 'Balance sheet', label: 'Equipment, less accumulated depreciation',
      answer: function () { return balanceSheet().bookValue; },
      hints: ['The cost stays on the books; the depreciation is subtracted from it.',
              'Equipment at cost less the accumulated depreciation taken so far.',
              '$8,000 less $180.'] },
    { id: 'ta', doc: 'Balance sheet', label: 'Total assets',
      answer: function () { return balanceSheet().totalAssets; },
      hints: ['Current assets plus what is left of the equipment.',
              'Add the two subtotals you have already worked out.',
              'Total current assets plus the book value.'] },
    { id: 'cl', doc: 'Balance sheet', label: 'Total current liabilities',
      answer: function () { return balanceSheet().liabTotal; },
      hints: ['What is owed and falls due within a year.',
              'Accounts payable and salaries and wages payable.',
              'One of those two only appeared after the adjustments.'] },
    { id: 'eq', doc: 'Balance sheet', label: 'Total stockholders&rsquo; equity',
      answer: function () { return balanceSheet().equityTotal; },
      hints: ['What the owners put in, plus what the business has kept.',
              'Common stock plus retained earnings.',
              'Use the retained earnings figure from the statement before.'] },
    { id: 'tc', doc: 'Balance sheet', label: 'Total liabilities and stockholders&rsquo; equity',
      answer: function () { return balanceSheet().totalClaims; },
      hints: ['Liabilities plus equity.',
              'If it does not equal total assets, one of the earlier figures is wrong.',
              'It has to come to the same number as total assets.'] }
  ];

  var w4 = { fld: {}, fx: {}, hint: {}, shut: {}, posted: {}, tb: {}, tot: {}, at: 0, graded: 0 };

  function loadWork4() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work4') || '{}');
      if (w && typeof w === 'object') {
        w4.fld = w.fld || {}; w4.fx = w.fx || {}; w4.hint = w.hint || {}; w4.shut = w.shut || {};
        w4.posted = w.posted || {}; w4.tb = w.tb || {}; w4.tot = w.tot || {}; w4.at = w.at || 0;
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork4() {
    try { window.localStorage.setItem(STORE + '.work4', JSON.stringify(w4)); } catch (e) {}
  }

  function maxLines4(ci) { return Math.max(2, CLOSE[ci].lines.length); }
  function c4(ci, li, col) { return w4.fx[ci + '.' + li + '.' + col]; }
  function c4line(ci, li) {
    var k = c4(ci, li, 'k'), d = amt2(c4(ci, li, 'd')), c = amt2(c4(ci, li, 'c'));
    if (!k || (d && c) || (!d && !c)) return null;
    return { k: k, s: d ? 'D' : 'C', n: d || c };
  }
  function c4totals(ci) {
    var d = 0, c = 0, filled = 0, n = maxLines4(ci);
    for (var i = 0; i < n; i++) {
      d += amt2(c4(ci, i, 'd'));
      c += amt2(c4(ci, i, 'c'));
      if (c4(ci, i, 'k') || amt2(c4(ci, i, 'd')) || amt2(c4(ci, i, 'c'))) filled++;
    }
    return { d: d, c: c, off: d - c, filled: filled };
  }
  function canPost4(ci) {
    var t = c4totals(ci);
    if (!t.d || t.off !== 0) return false;
    /* every filled row has to be a complete line, and there must be at least two */
    var n = maxLines4(ci), done = 0;
    for (var i = 0; i < n; i++) {
      var any = c4(ci, i, 'k') || amt2(c4(ci, i, 'd')) || amt2(c4(ci, i, 'c'));
      if (!any) continue;
      if (!c4line(ci, i)) return false;
      done++;
    }
    return done >= 2;
  }
  function isPosted4(ci) { return !!w4.posted[ci]; }

  function c4Right(ci) {
    var want = CLOSE[ci].lines.map(function (l) {
      return l[0] + ':' + (l[1] ? 'D' : 'C') + ':' + (l[1] || l[2]);
    }).sort().join('|');
    var got = [], n = maxLines4(ci);
    for (var i = 0; i < n; i++) {
      var any = c4(ci, i, 'k') || amt2(c4(ci, i, 'd')) || amt2(c4(ci, i, 'c'));
      if (!any) continue;
      var l = c4line(ci, i);
      if (!l) return false;
      got.push(l.k + ':' + l.s + ':' + l.n);
    }
    return got.sort().join('|') === want;
  }
  function c4Touched(ci) { return c4totals(ci).filled > 0; }

  function c4Diag(ci) {
    var t = c4totals(ci), e = CLOSE[ci], n = maxLines4(ci);
    var mine = [];
    for (var i = 0; i < n; i++) { var l = c4line(ci, i); if (l) mine.push(l); }
    if (!t.filled) return 'Nothing entered yet. This entry closes ' + e.short.toLowerCase() + '.';
    if (mine.length < 2) return 'Every closing entry needs at least two complete lines — an account and one amount, in either column.';
    if (t.off !== 0) return 'Out of balance by ' + dollars(Math.abs(t.off)) + '. Debits ' + dollars(t.d) + ', credits ' + dollars(t.c) + '.';
    var used = mine.map(function (m) { return m.k; });
    /* The mistake this module exists to prevent. */
    if (e.id === 'c4' && used.indexOf('isum') !== -1)
      return 'Dividends never pass through Income Summary. They are a distribution of profit, not an expense, so they close straight to Retained Earnings.';
    if (e.id !== 'c4' && used.indexOf('div') !== -1)
      return 'Dividends does not belong in this entry. It is closed on its own, directly to Retained Earnings.';
    if (used.indexOf('cash') !== -1)
      return 'Closing moves balances between accounts that are already on the books. No cash changes hands, so Cash is never touched.';
    var right = e.lines.map(function (l) { return l[0]; }).sort().join();
    if (used.slice().sort().join() === right)
      return 'The right accounts, on the wrong sides. A credit balance is closed with a debit of the same size, and the other way round.';
    if (t.d !== closeDebits(e))
      return 'It balances, but not at the right size. A closing entry is exactly as large as the balance it is emptying.';
    return 'It balances and the amount is right, so one of the accounts is wrong.';
  }

  /* ---- (c) the learner's post-closing trial balance ---- */
  function tbVal4(k, col) { var v = w4.tb[k + '.' + col]; return v === undefined ? '' : v; }
  function tbRight4(k) {
    var t = closedThrough(999), a = acct4(k), want = t[k] || 0;
    var d = amountOf(tbVal4(k, 'd')), c = amountOf(tbVal4(k, 'c'));
    if (a.up === 'D') return d === want && isNaN(c);
    return c === want && isNaN(d);
  }
  function tbTouched4(k) {
    return String(tbVal4(k, 'd')).trim() !== '' || String(tbVal4(k, 'c')).trim() !== '';
  }
  function totRight4(col) {
    var want = tbTotals4(closedThrough(999), permanentAccts());
    return amountOf(w4.tot[col]) === (col === 'd' ? want.d : want.c);
  }
  function fldRight4(f) { return amountOf(w4.fld[f.id]) === f.answer(); }

  function score4() {
    var a = STMT_FIELDS.filter(fldRight4).length;
    var b = 0; CLOSE.forEach(function (e, i) { if (c4Right(i)) b++; });
    var c = permanentAccts().filter(function (x) { return tbRight4(x.k); }).length;
    if (totRight4('d')) c++;
    if (totRight4('c')) c++;
    return {
      got: a + b + c, total: STMT_FIELDS.length + CLOSE.length + permanentAccts().length + 2,
      parts: { a: a, b: b, c: c },
      caps: { a: STMT_FIELDS.length, b: CLOSE.length, c: permanentAccts().length + 2 }
    };
  }

  function closeHints(ci) {
    var e = CLOSE[ci];
    return [
      'What kind of balance does the account being closed carry? Empty it with the opposite.',
      e.id === 'c4' ? 'Dividends is temporary but it is not an expense, so it does not go through Income Summary.'
                    : 'The amount is whatever the adjusted trial balance says that account holds.',
      e.lines.map(function (l) { return (l[1] ? 'Debit ' : 'Credit ') + acct4(l[0]).name + ' ' + money2(l[1] || l[2]); }).join('; ') + '.'
    ];
  }
  function tbHints4(k) {
    var a = acct4(k), t = closedThrough(999);
    return [
      'Only permanent accounts appear, each at the balance closing left it with.',
      a.fam + ' accounts carry a ' + (a.up === 'D' ? 'debit' : 'credit') + ' balance, so it goes in the ' + (a.up === 'D' ? 'debit' : 'credit') + ' column.',
      'This one stands at ' + dollars(t[k] || 0) + '.'
    ];
  }
  function fldHints4(fi) { return STMT_FIELDS[fi].hints; }

  function paintHint4(key) {
    var lvl = w4.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max = 3;
    if (key.charAt(0) === 'f') {
      var fi = Number(key.slice(1));
      if (!STMT_FIELDS[fi]) return;
      text = fldHints4(fi)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-fnote4="' + STMT_FIELDS[fi].id + '"]');
      btn = host.querySelector('[data-fhint4="' + fi + '"]');
    } else if (key.charAt(0) === 't') {
      var tk = key.slice(1);
      if (!acct4(tk)) return;
      text = tbHints4(tk)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-tnote4="' + tk + '"]');
      btn = host.querySelector('[data-thint4="' + tk + '"]');
    } else {
      var ci = Number(key);
      if (!CLOSE[ci]) return;
      text = closeHints(ci)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note4="' + ci + '"]');
      btn = host.querySelector('[data-hint4="' + ci + '"]');
    }
    if (!slot || !text) return;
    var shut = !!w4.shut[key];
    slot.innerHTML = shut ? '' : tipHtml(key, text);
    if (!btn) return;
    btn.classList.toggle('on', !shut);
    if (!btn.classList.contains('sm')) {
      btn.innerHTML = ICON.bulb + (shut ? 'Show hint' : (lvl >= max ? 'No more hints' : 'Another hint'));
    }
    btn.disabled = !shut && lvl >= max;
  }
  function bump4(key, max) {
    if (w4.shut[key]) delete w4.shut[key];
    else w4.hint[key] = Math.min((w4.hint[key] || 0) + 1, max);
    paintHint4(key);
    saveWork4();
  }

  function instrPanel4() {
    var sc = score4();
    return '<div class="instr"><div class="instr-cap">Instructions</div>' +
      INSTRUCTIONS4.map(function (x) {
        var got = sc.parts[x.id], cap = sc.caps[x.id], done = cap > 0 && got === cap;
        return '<div class="instr-row' + (done ? ' done' : '') + '">' +
          '<span class="instr-k">' + (done ? ICON.check : x.id + '.') + '</span>' +
          '<span class="instr-t">' + x.text + '</span>' +
          '<span class="instr-n">' + got + '/' + cap + '</span></div>';
      }).join('') + '</div>';
  }

  function vState4(ci) {
    if (isPosted4(ci)) return 'posted';
    var t = c4totals(ci);
    if (!t.filled) return 'draft';
    return (t.off === 0 && t.d && canPost4(ci)) ? 'balanced' : 'off';
  }

  function renderSolve4() {
    var opts = '<option value="">&mdash; select account &mdash;</option>' + ACCT4.map(function (a) {
      return '<option value="' + a.k + '">' + a.no + '  ' + a.name.replace('&mdash;', '—') + '</option>';
    }).join('');
    var cur = Math.max(0, Math.min(CLOSE.length - 1, w4.at || 0));
    var posted = 0;
    CLOSE.forEach(function (e, i) { if (isPosted4(i)) posted++; });

    /* ---- (a) the statement figures ---- */
    var lastDoc = '';
    var fields = STMT_FIELDS.map(function (f, fi) {
      var head = f.doc !== lastDoc ? '<div class="ws-doc">' + f.doc + '</div>' : '';
      lastDoc = f.doc;
      return head + '<div class="ws-field" data-field4="' + f.id + '">' +
        '<label for="w4-' + f.id + '">' + f.label + '</label>' +
        '<div class="ws-line"><div class="ws-amt"><input id="w4-' + f.id + '" data-fld4="' + f.id + '" inputmode="decimal" autocomplete="off" /></div>' +
        '<button type="button" class="ws-hint" data-fhint4="' + fi + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-fnote4="' + f.id + '"></div></div>';
    }).join('');

    /* ---- (b) one closing entry at a time ---- */
    var chips = CLOSE.map(function (e, ci) {
      var st = vState4(ci);
      return '<button type="button" class="vchip' + (ci === cur ? ' now' : '') +
        (st === 'posted' ? ' done' : (st === 'off' ? ' off' : '')) +
        (w4.graded && c4Touched(ci) && !c4Right(ci) ? ' bad' : '') + '" data-v4="' + ci + '"' +
        ' aria-label="Closing entry ' + e.n + ' of 4, ' + st + '"' + (ci === cur ? ' aria-current="true"' : '') + '>' +
        (st === 'posted' ? ICON.check : e.n) + '</button>';
    }).join('');

    var e = CLOSE[cur], t = c4totals(cur), locked = isPosted4(cur), st = vState4(cur);
    var rows = '';
    for (var i = 0; i < maxLines4(cur); i++) {
      var dv = c4(cur, i, 'd') || '', cv = c4(cur, i, 'c') || '';
      rows += '<div class="gl-row">' +
        '<select class="gl-acct" data-a4="' + cur + '.' + i + '"' + (locked ? ' disabled' : '') +
          ' aria-label="Account for line ' + (i + 1) + ' of closing entry ' + e.n + '">' + opts + '</select>' +
        '<input class="gl-amt' + (cv ? ' muted' : '') + '" data-d4="' + cur + '.' + i + '" value="' + dv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off"' +
          ' aria-label="Debit for line ' + (i + 1) + ' of closing entry ' + e.n + '" />' +
        '<input class="gl-amt' + (dv ? ' muted' : '') + '" data-c4="' + cur + '.' + i + '" value="' + cv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off"' +
          ' aria-label="Credit for line ' + (i + 1) + ' of closing entry ' + e.n + '" />' +
        '</div>';
    }
    var pill = st === 'posted' ? '<span class="pill posted">' + ICON.check + 'Posted</span>'
      : st === 'draft' ? '<span class="pill draft">Draft</span>'
      : st === 'balanced' ? '<span class="pill ready">Balanced</span>'
      : '<span class="pill off">Out of balance</span>';
    var off = st === 'draft'
      ? '<div class="gl-off idle"><span>Enter the debit and the credit</span><span>&mdash;</span></div>'
      : (st === 'balanced' || st === 'posted')
        ? '<div class="gl-off ok"><span>In balance</span><span>' + ICON.check + '</span></div>'
        : '<div class="gl-off off"><span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span></div>';

    var doc = '<div class="doc-je' + (locked ? ' posted' : '') + '" data-tx4="' + cur + '">' +
      '<div class="je-top"><span class="je-ref">CLOSE-' + e.n + '</span>' +
        '<span class="je-date">July 31, 2025</span>' + pill + '</div>' +
      '<div class="je-memo"><u>What to close</u>' + e.short + '</div>' +
      '<div class="gl">' +
        '<div class="gl-hd"><span>Account</span><span>Debit</span><span>Credit</span></div>' + rows +
        '<div class="gl-foot"><span class="lbl">Totals</span><span>' + (t.d ? money2(t.d) : '&mdash;') + '</span><span>' + (t.c ? money2(t.c) : '&mdash;') + '</span></div>' + off +
      '</div>' +
      '<div class="je-acts">' +
        '<button type="button" class="ws-hint" data-hint4="' + cur + '">' + ICON.bulb + 'Hint</button>' +
        (locked ? '<button type="button" class="btn-post undo" data-unpost4="' + cur + '">Unpost</button>'
                : '<button type="button" class="btn-post" data-post4="' + cur + '"' + (canPost4(cur) ? '' : ' disabled') + '>' + ICON.check + 'Post</button>') +
      '</div>' +
      '<div data-note4="' + cur + '" style="padding:0 11px 11px"></div>' +
      '</div>';

    /* ---- (c) the post-closing trial balance ---- */
    var perm = permanentAccts();
    var tbRows = perm.map(function (a) {
      return '<tr class="wp-row" data-trow4="' + a.k + '">' +
        '<td class="rowlab">' + a.no + ' ' + a.name.replace('&mdash;Equipment', '&mdash;Eqp.') + '</td>' +
        '<td><input class="cell" data-tb4="' + a.k + '.d" value="' + tbVal4(a.k, 'd') + '" inputmode="decimal" autocomplete="off" aria-label="Debit balance of ' + a.name.replace('&mdash;', ' ') + '" /></td>' +
        '<td><input class="cell" data-tb4="' + a.k + '.c" value="' + tbVal4(a.k, 'c') + '" inputmode="decimal" autocomplete="off" aria-label="Credit balance of ' + a.name.replace('&mdash;', ' ') + '" /></td>' +
        '<td class="hcell"><button type="button" class="ws-hint sm" data-thint4="' + a.k + '" aria-label="Hint for ' + a.name.replace('&mdash;', ' ') + '">' + ICON.bulb + '</button></td>' +
        '</tr><tr class="notrow"><td colspan="4"><div data-tnote4="' + a.k + '"></div></td></tr>';
    }).join('');
    var mine = { d: 0, c: 0 };
    perm.forEach(function (a) {
      var d = amountOf(tbVal4(a.k, 'd')), c = amountOf(tbVal4(a.k, 'c'));
      if (!isNaN(d)) mine.d += d;
      if (!isNaN(c)) mine.c += c;
    });
    var typed = { d: amountOf(w4.tot.d), c: amountOf(w4.tot.c) };
    var proof = (isNaN(typed.d) && isNaN(typed.c))
      ? '<div class="gl-off idle"><span>Total both columns when every row is entered</span><span>&mdash;</span></div>'
      : (typed.d === typed.c
        ? '<div class="gl-off ok"><span>Your columns agree at ' + dollars(typed.d || 0) + '</span><span>' + ICON.check + '</span></div>'
        : '<div class="gl-off off"><span>Your columns are out by</span><span>' + dollars(Math.abs((typed.d || 0) - (typed.c || 0))) + '</span></div>');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="sw-bar">' +
          '<span class="sw-bar-id"><h1>' + CO2.name + '</h1><span>Closing the books &middot; Jul 2025</span></span>' +
          '<span class="sw-counts">' +
            '<span class="sw-count"><b>' + (CLOSE.length - posted) + '</b><u>to close</u></span>' +
            '<span class="sw-count' + (posted === CLOSE.length ? ' done' : '') + '"><b>' + posted + '</b><u>closed</u></span>' +
          '</span>' +
        '</div>' +
        instrPanel4() +
        '<div class="ws-sect">a &middot; Prepare the statements<i></i></div>' +
        '<p class="ws-aside">Every figure below comes from the adjusted trial balance in the Reference tab. Work down in order &mdash; the later ones depend on the earlier ones.</p>' +
        '<div class="ws-fields">' + fields + '</div>' +
        '<div class="ws-sect">b &middot; Journalize the closing entries<i></i></div>' +
        '<div class="pager">' +
          '<button type="button" class="pager-btn" data-v4prev' + (cur === 0 ? ' disabled' : '') + ' aria-label="Previous closing entry">' + ICON.prev + '</button>' +
          '<span class="pager-now"><b>CLOSE-' + e.n + '</b>' + (cur + 1) + ' of ' + CLOSE.length + '</span>' +
          '<button type="button" class="pager-btn" data-v4next' + (cur === CLOSE.length - 1 ? ' disabled' : '') + ' aria-label="Next closing entry">' + ICON.next + '</button>' +
        '</div>' +
        '<div class="vchips">' + chips + '</div>' + doc +
        '<div class="ws-sect">c &middot; The post-closing trial balance<i></i></div>' +
        '<p class="wp-tip">' + ICON.bulb + 'Only permanent accounts belong here. If a revenue, expense or dividend account has a balance left, part (b) is not finished.</p>' +
        '<div class="sw-panel"><div class="sw-panel-hd"><b>Post-Closing Trial Balance</b><span>July 31, 2025</span></div>' +
          '<div class="wp-scroll"><table class="wp w4"><thead>' +
            '<tr class="acct"><th class="rowlab">Account</th><th>Debit</th><th>Credit</th><th></th></tr></thead>' +
            '<tbody>' + tbRows + '</tbody><tfoot><tr><td class="rowlab">Totals</td>' +
            '<td><input class="cell" data-tot4="d" value="' + (w4.tot.d || '') + '" inputmode="decimal" autocomplete="off" aria-label="Total of the debit column" /></td>' +
            '<td><input class="cell" data-tot4="c" value="' + (w4.tot.c || '') + '" inputmode="decimal" autocomplete="off" aria-label="Total of the credit column" /></td>' +
            '<td class="hcell"></td></tr></tfoot></table></div>' +
          '<div class="sw-panel-bd" style="padding-top:0">' + proof + '</div>' +
        '</div>' +
        '<button type="button" class="ws-reset" id="ws-reset4">Clear my work and start again</button>' +
      '</div>';

    Array.prototype.forEach.call($('solve').querySelectorAll('[data-a4]'), function (el) {
      var v = w4.fx[el.getAttribute('data-a4') + '.k'];
      if (v) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fld4]'), function (el) {
      var v = w4.fld[el.getAttribute('data-fld4')];
      if (v !== undefined) el.value = v;
    });
    Object.keys(w4.hint).forEach(paintHint4);
  }

  function refreshDoc4(ci) {
    var t = c4totals(ci);
    var doc = $('solve').querySelector('[data-tx4="' + ci + '"]');
    if (!doc) return;
    var foot = doc.querySelectorAll('.gl-foot span');
    foot[1].innerHTML = t.d ? money2(t.d) : '&mdash;';
    foot[2].innerHTML = t.c ? money2(t.c) : '&mdash;';
    var st = vState4(ci);
    var off = doc.querySelector('.gl-off');
    off.className = 'gl-off ' + (st === 'draft' ? 'idle' : ((st === 'balanced' || st === 'posted') ? 'ok' : 'off'));
    off.innerHTML = st === 'draft'
      ? '<span>Enter the debit and the credit</span><span>&mdash;</span>'
      : (st === 'balanced' || st === 'posted')
        ? '<span>In balance</span><span>' + ICON.check + '</span>'
        : '<span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span>';
    var pill = doc.querySelector('.pill');
    if (!isPosted4(ci)) {
      pill.className = 'pill ' + (st === 'draft' ? 'draft' : (st === 'balanced' ? 'ready' : 'off'));
      pill.textContent = st === 'draft' ? 'Draft' : (st === 'balanced' ? 'Balanced' : 'Out of balance');
    }
    var post = doc.querySelector('[data-post4]');
    if (post) post.disabled = !canPost4(ci);
    doc.classList.remove('graded-bad');
    var bad = doc.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function refreshProof4() {
    var typed = { d: amountOf(w4.tot.d), c: amountOf(w4.tot.c) };
    var p = $('solve').querySelector('.sw-panel-bd .gl-off');
    if (!p) return;
    var idle = isNaN(typed.d) && isNaN(typed.c);
    p.className = 'gl-off ' + (idle ? 'idle' : (typed.d === typed.c ? 'ok' : 'off'));
    p.innerHTML = idle
      ? '<span>Total both columns when every row is entered</span><span>&mdash;</span>'
      : typed.d === typed.c
        ? '<span>Your columns agree at ' + dollars(typed.d || 0) + '</span><span>' + ICON.check + '</span>'
        : '<span>Your columns are out by</span><span>' + dollars(Math.abs((typed.d || 0) - (typed.c || 0))) + '</span>';
  }

  function refreshInstr4() {
    var host = $('solve').querySelector('.instr');
    if (!host) return;
    var sc = score4();
    Array.prototype.forEach.call(host.querySelectorAll('.instr-row'), function (row, i) {
      var x = INSTRUCTIONS4[i], got = sc.parts[x.id], cap = sc.caps[x.id];
      var done = cap > 0 && got === cap;
      row.classList.toggle('done', done);
      row.querySelector('.instr-k').innerHTML = done ? ICON.check : x.id + '.';
      row.querySelector('.instr-n').textContent = got + '/' + cap;
    });
  }

  function go4(n) {
    w4.at = Math.max(0, Math.min(CLOSE.length - 1, n));
    saveWork4(); renderSolve4(); renderControls();
  }

  function gradeSolve4() {
    w4.graded = 1;
    STMT_FIELDS.forEach(function (f, fi) {
      var box = $('solve').querySelector('[data-field4="' + f.id + '"]');
      if (!box) return;
      var ok = fldRight4(f), touched = String(w4.fld[f.id] === undefined ? '' : w4.fld[f.id]).trim() !== '';
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      var note = $('solve').querySelector('[data-fnote4="' + f.id + '"]');
      var old = note.querySelector('.ws-note.bad');
      if (old) old.remove();
      if (ok || !touched || w4.hint['f' + fi]) return;
      note.innerHTML = '<div class="ws-note bad">Not yet. ' + f.hints[0] + '</div>';
    });
    CLOSE.forEach(function (e, ci) {
      var doc = $('solve').querySelector('[data-tx4="' + ci + '"]');
      if (!doc) return;
      var note = $('solve').querySelector('[data-note4="' + ci + '"]');
      var ok = c4Right(ci), touched = c4Touched(ci);
      doc.classList.toggle('graded-bad', !ok && touched);
      if (ok || !touched) { var stale = doc.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!w4.hint[ci]) note.innerHTML = '<div class="ws-note bad">' + c4Diag(ci) + '</div>';
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-v4]'), function (c) {
      var ci = Number(c.getAttribute('data-v4'));
      c.classList.toggle('bad', c4Touched(ci) && !c4Right(ci));
    });
    permanentAccts().forEach(function (a) {
      var row = $('solve').querySelector('[data-trow4="' + a.k + '"]');
      if (!row) return;
      var ok = tbRight4(a.k), touched = tbTouched4(a.k);
      row.classList.toggle('right', ok);
      row.classList.toggle('wrong', !ok && touched);
      var note = $('solve').querySelector('[data-tnote4="' + a.k + '"]');
      if (!note) return;
      var old = note.querySelector('.ws-note.bad');
      if (old) old.remove();
      if (ok || !touched || w4.hint['t' + a.k]) return;
      var wrongCol = (a.up === 'D' && String(tbVal4(a.k, 'c')).trim() !== '') ||
                     (a.up === 'C' && String(tbVal4(a.k, 'd')).trim() !== '');
      note.innerHTML = '<div class="ws-note bad">' + (wrongCol
        ? 'Right idea, wrong column. ' + a.fam + ' accounts carry a ' + (a.up === 'D' ? 'debit' : 'credit') + ' balance.'
        : 'Not the balance closing left this account with.') + '</div>';
    });
    refreshInstr4();
    renderControls();
    var first = $('solve').querySelector('.ws-field.wrong, .doc-je.graded-bad, .wp-row.wrong');
    if (first) first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  function bindSolve4() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-a4]');
      if (!sel) return;
      w4.fx[sel.getAttribute('data-a4') + '.k'] = sel.value;
      refreshDoc4(sel.getAttribute('data-a4').split('.')[0]);
      saveWork4(); refreshInstr4(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var d = e.target.closest('[data-d4]'), c = e.target.closest('[data-c4]');
      if (d || c) {
        var el = d || c, key = el.getAttribute(d ? 'data-d4' : 'data-c4');
        var col = d ? 'd' : 'c', other = d ? 'c' : 'd';
        w4.fx[key + '.' + col] = el.value;
        var twin = host.querySelector('[data-' + other + '4="' + key + '"]');
        if (el.value && twin && twin.value) { twin.value = ''; w4.fx[key + '.' + other] = ''; }
        if (twin) twin.classList.toggle('muted', !!el.value);
        el.classList.remove('muted');
        refreshDoc4(key.split('.')[0]);
        saveWork4(); refreshInstr4(); renderControls();
        return;
      }
      var f = e.target.closest('[data-fld4]');
      if (f) {
        w4.fld[f.getAttribute('data-fld4')] = f.value;
        var box = f.closest('.ws-field');
        box.classList.remove('right', 'wrong');
        var bad = box.querySelector('.ws-note.bad');
        if (bad) bad.remove();
        saveWork4(); refreshInstr4(); renderControls();
        return;
      }
      var tb = e.target.closest('[data-tb4]');
      if (tb) {
        var parts = tb.getAttribute('data-tb4').split('.');
        w4.tb[parts[0] + '.' + parts[1]] = tb.value;
        var row = host.querySelector('[data-trow4="' + parts[0] + '"]');
        if (row) row.classList.remove('right', 'wrong');
        var n = host.querySelector('[data-tnote4="' + parts[0] + '"] .ws-note.bad');
        if (n) n.remove();
        saveWork4(); refreshInstr4(); renderControls();
        return;
      }
      var tt = e.target.closest('[data-tot4]');
      if (tt) {
        w4.tot[tt.getAttribute('data-tot4')] = tt.value;
        refreshProof4(); saveWork4(); refreshInstr4(); renderControls();
      }
    });

    host.addEventListener('click', function (e) {
      var v = e.target.closest('[data-v4]');
      if (v) { go4(Number(v.getAttribute('data-v4'))); return; }
      if (e.target.closest('[data-v4prev]')) { go4((w4.at || 0) - 1); return; }
      if (e.target.closest('[data-v4next]')) { go4((w4.at || 0) + 1); return; }
      var p = e.target.closest('[data-post4]');
      if (p) {
        var ci = Number(p.getAttribute('data-post4'));
        if (!canPost4(ci)) return;
        w4.posted[ci] = 1;
        var next = ci;
        for (var n = 1; n <= CLOSE.length; n++) {
          var q = (ci + n) % CLOSE.length;
          if (!isPosted4(q)) { next = q; break; }
        }
        w4.at = next;
        saveWork4(); renderSolve4(); renderControls();
        return;
      }
      var u = e.target.closest('[data-unpost4]');
      if (u) {
        delete w4.posted[u.getAttribute('data-unpost4')];
        saveWork4(); renderSolve4(); renderControls();
        return;
      }
      var x = e.target.closest('[data-hclose]');
      if (x) {
        var hk = x.getAttribute('data-hclose');
        w4.shut[hk] = 1; paintHint4(hk); saveWork4();
        return;
      }
      var h = e.target.closest('[data-hint4]');
      if (h) { bump4(h.getAttribute('data-hint4'), 3); return; }
      var fh = e.target.closest('[data-fhint4]');
      if (fh) { bump4('f' + fh.getAttribute('data-fhint4'), 3); return; }
      var th = e.target.closest('[data-thint4]');
      if (th) { bump4('t' + th.getAttribute('data-thint4'), 3); return; }
      if (e.target.closest('#ws-reset4')) {
        if (!window.confirm('Clear every statement figure, closing entry and balance?')) return;
        w4.fld = {}; w4.fx = {}; w4.hint = {}; w4.shut = {}; w4.posted = {}; w4.tb = {}; w4.tot = {};
        w4.at = 0; w4.graded = 0;
        saveWork4(); renderSolve4(); renderControls();
      }
    });
  }

  function sheetAProof() {
    var p = sheetProof(), af = adjFoot();
    var lines = [];

      ? (af.d === af.c
        ? { k: 'ok', a: 'Your adjustment columns agree', b: money2(af.d) }
        : { k: 'off', a: 'Your adjustment columns are out by', b: money2(Math.abs(af.d - af.c)) })
      : { k: 'idle', a: 'Adjustments not entered yet', b: '&mdash;' });
    lines.push(!p.any
      ? { k: 'idle', a: 'Total the four extension columns to prove the sheet', b: '&mdash;' }
      : (p.is === 0 && p.bs === 0
        ? { k: 'ok', a: 'Both pairs foot &mdash; the worksheet proves', b: money2(p.isTot) + ' / ' + money2(p.bsTot) }
        : { k: 'off', a: 'Income statement out by ' + money2(Math.abs(p.is)) + ', balance sheet out by', b: money2(Math.abs(p.bs)) }));
    return lines.map(function (l) {
      return '<div class="gl-off ' + l.k + '"><span>' + l.a + '</span><span>' + (l.k === 'ok' ? ICON.check + ' ' : '') + l.b + '</span></div>';

      '</div></div>' +

  /* ---------- sheets c and d: the journal ---------- */
  function jState5(kind, ei) {
    if (isPosted5(kind, ei)) return 'posted';
    var t = j5totals(kind, ei);
    if (!t.filled) return 'draft';
    return (t.off === 0 && t.d && canPost5(kind, ei)) ? 'balanced' : 'off';
  }

  function journalSheet(kind) {
    var list = entries5(kind), cur = Math.max(0, Math.min(list.length - 1, atOf(kind)));
    var opts = '<option value="">&mdash; select account &mdash;</option>' + ACCT5ALL().map(function (a) {
      return '<option value="' + a.k + '">' + a.name.replace('&mdash;', '—') + '</option>';
    }).join('');
    var posted = 0;
    list.forEach(function (e, i) { if (isPosted5(kind, i)) posted++; });

    var chips = list.map(function (e, ei) {
      var st = jState5(kind, ei);
      return '<button type="button" class="vchip' + (ei === cur ? ' now' : '') +
        (st === 'posted' ? ' done' : (st === 'off' ? ' off' : '')) +
        (w5.graded && j5Touched(kind, ei) && !j5Right(kind, ei) ? ' bad' : '') + '" data-j5="' + kind + '.' + ei + '"' +
        ' aria-label="' + (kind === 'c' ? 'Adjusting' : 'Closing') + ' entry ' + (ei + 1) + ' of ' + list.length + ', ' + st + '"' +
        (ei === cur ? ' aria-current="true"' : '') + '>' + (st === 'posted' ? ICON.check : (ei + 1)) + '</button>';
    }).join('');

    var e = list[cur], t = j5totals(kind, cur), locked = isPosted5(kind, cur), st = jState5(kind, cur);
    var rows = '';
    for (var i = 0; i < maxLines5(kind, cur); i++) {
      var dv = j5(kind, cur, i, 'd') || '', cv = j5(kind, cur, i, 'c') || '';
      var lab = ' of ' + (kind === 'c' ? 'adjusting' : 'closing') + ' entry ' + (cur + 1);
      rows += '<div class="gl-row">' +
        '<select class="gl-acct" data-ja5="' + kind + '.' + cur + '.' + i + '"' + (locked ? ' disabled' : '') +
          ' aria-label="Account for line ' + (i + 1) + lab + '">' + opts + '</select>' +
        '<input class="gl-amt' + (cv ? ' muted' : '') + '" data-jd5="' + kind + '.' + cur + '.' + i + '" value="' + dv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off" aria-label="Debit for line ' + (i + 1) + lab + '" />' +
        '<input class="gl-amt' + (dv ? ' muted' : '') + '" data-jc5="' + kind + '.' + cur + '.' + i + '" value="' + cv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off" aria-label="Credit for line ' + (i + 1) + lab + '" />' +
        '</div>';
    }
    var pill = st === 'posted' ? '<span class="pill posted">' + ICON.check + 'Posted</span>'
      : st === 'draft' ? '<span class="pill draft">Draft</span>'
      : st === 'balanced' ? '<span class="pill ready">Balanced</span>'
      : '<span class="pill off">Out of balance</span>';
    var off = st === 'draft'
      ? '<div class="gl-off idle"><span>Enter the debit and the credit</span><span>&mdash;</span></div>'
      : (st === 'balanced' || st === 'posted')
        ? '<div class="gl-off ok"><span>In balance</span><span>' + ICON.check + '</span></div>'
        : '<div class="gl-off off"><span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span></div>';

    var memo = kind === 'c'
      ? '<u>Which adjustment</u>Any one of the six, in any slot &mdash; each appears once'
      : '<u>What to close</u>' + e.short;

    var doc = '<div class="doc-je' + (locked ? ' posted' : '') + '" data-j5doc="' + kind + '.' + cur + '">' +
      '<div class="je-top"><span class="je-ref">' + (kind === 'c' ? 'ADJ' : 'CLOSE') + '-' + (cur + 1) + '</span>' +
        '<span class="je-date">' + CO5.short + '</span>' + pill + '</div>' +
      '<div class="je-memo">' + memo + '</div>' +
      '<div class="gl">' +
        '<div class="gl-hd"><span>Account</span><span>Debit</span><span>Credit</span></div>' + rows +
        '<div class="gl-foot"><span class="lbl">Totals</span><span>' + (t.d ? money2(t.d) : '&mdash;') + '</span><span>' + (t.c ? money2(t.c) : '&mdash;') + '</span></div>' + off +
      '</div>' +
      '<div class="je-acts">' + hintBtn5(kind + cur) +
        (locked ? '<button type="button" class="btn-post undo" data-junp5="' + kind + '.' + cur + '">Unpost</button>'
                : '<button type="button" class="btn-post" data-jpost5="' + kind + '.' + cur + '"' + (canPost5(kind, cur) ? '' : ' disabled') + '>' + ICON.check + 'Post</button>') +
      '</div>' +
      '<div data-note5="' + kind + cur + '" style="padding:0 11px 11px"></div>' +
      '</div>';

    return '<p class="ws-aside">' + (kind === 'c'
        ? 'Six adjusting entries, journalized from the adjustment columns of your worksheet. The slots are not in any particular order &mdash; put each adjustment wherever you like, once.'
        : 'Four closing entries, in the order they have to be made. Their amounts are on the worksheet already.') + '</p>' +
      '<div class="pager">' +
        '<button type="button" class="pager-btn" data-jprev5="' + kind + '"' + (cur === 0 ? ' disabled' : '') + ' aria-label="Previous entry">' + ICON.prev + '</button>' +
        '<span class="pager-now"><b>' + (kind === 'c' ? 'ADJ' : 'CLOSE') + '-' + (cur + 1) + '</b>' + (cur + 1) + ' of ' + list.length + '</span>' +
        '<button type="button" class="pager-btn" data-jnext5="' + kind + '"' + (cur === list.length - 1 ? ' disabled' : '') + ' aria-label="Next entry">' + ICON.next + '</button>' +
      '</div>' +
      '<div class="vchips">' + chips + '</div>' + doc;
  }

  /* ---------- sheet e: the post-closing trial balance ---------- */
  function sheetE() {
    var perm = permanent5();

        '<td><input class="cell" data-tb5="' + a.k + '.c" value="' + tbVal5(a.k, 'c') + '" inputmode="decimal" autocomplete="off" aria-label="' + attr('Credit balance of ' + nm) + '" /></td>' +

          '<tbody>' + rows + '</tbody><tfoot><tr><td class="rowlab">Totals</td>' +
          '<td><input class="cell" data-ttot5="d" value="' + (w5.ttot.d || '') + '" inputmode="decimal" autocomplete="off" aria-label="Total of the debit column" /></td>' +
          '<td><input class="cell" data-ttot5="c" value="' + (w5.ttot.c || '') + '" inputmode="decimal" autocomplete="off" aria-label="Total of the credit column" /></td>' +
          '<td class="hcell"></td></tr></tfoot></table></div>' +
        '<div class="sw-panel-bd" style="padding-top:0">' + proof + '</div>' +
      '</div>';
  }

  /* ---------- the workbook ---------- */
  function instrPanel5() {
    var sc = score5();

      INSTRUCTIONS5.map(function (x) {

  function renderSolve5() {
    var sc = score5();
    var body = w5.sheet === 'a' ? sheetA()
      : w5.sheet === 'b' ? sheetB()
      : w5.sheet === 'c' ? journalSheet('c')
      : w5.sheet === 'd' ? journalSheet('d')
      : sheetE();

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="sw-bar">' +
          '<span class="sw-bar-id"><h1>' + CO5.name + '</h1><span>' + CO5.period.replace('For the ', '') + '</span></span>' +
          '<span class="sw-counts">' +
            '<span class="sw-count"><b>' + (sc.total - sc.got) + '</b><u>to go</u></span>' +
