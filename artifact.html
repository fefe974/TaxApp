.p5-open svg { width: 16px; height: 16px; }

/* ---- the spreadsheet ---- */
.xl-bar {
  display: flex; align-items: stretch; gap: 6px; margin-bottom: 8px;
}
.xl-name {
  flex: 0 0 54px; display: grid; place-items: center;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface-2);
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--brand);
}
.xl-fx {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface-2);
}
.xl-fx i {
  font-style: italic; font-family: var(--display); font-size: 12px; font-weight: 600;
  color: var(--muted); flex: 0 0 auto;
}
.xl-fx em {
  font-style: normal; font-size: 11px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.xl-jump { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; }
.xl-jb {
  flex: 0 0 auto; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 11px; font-weight: 600; color: var(--text-dim); white-space: nowrap;
}
.xl-wrap {
  overflow-x: auto; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface);
}
.xl-grid { display: inline-block; min-width: 100%; }
.xl-row { display: flex; align-items: stretch; }
.xl-h {
  position: sticky; left: 0; z-index: 2;
  flex: 0 0 134px; padding: 6px 7px; display: flex; align-items: center; gap: 5px;
  background: var(--surface); border-right: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line);
  font-size: 11px; line-height: 1.2; color: var(--text-dim);
}
.xl-h i {
  font-style: normal; flex: 0 0 14px; text-align: right;
  font-family: var(--mono); font-size: 9px; color: var(--muted);
}
.xl-c {
  flex: 0 0 68px; min-height: 36px; padding: 6px 7px;
  display: flex; align-items: center; justify-content: flex-end;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--text); background: var(--surface);
}
.xl-c.given { background: var(--surface-2); color: var(--text-dim); }
.xl-c.dead { background: var(--surface-3); }
.xl-c.xl-w { padding: 0; }
.xl-in {
  width: 100%; height: 100%; min-height: 36px; border: 0; background: transparent;
  padding: 0 7px; text-align: right; color: var(--text);
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
}
.xl-in:focus { outline: 2px solid var(--brand); outline-offset: -2px; background: var(--brand-soft); }
.xl-in.wrong { background: var(--bad-soft); color: var(--bad); }
.xl-in.tot, .xl-in.ni { font-weight: 700; }
.xl-x {
  width: 100%; min-height: 36px; padding: 0 7px; text-align: right;
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--text); background: transparent;
  display: flex; align-items: center; justify-content: flex-end;
}
.xl-x::before {
  content: ''; width: 9px; height: 9px; border: 1px dashed var(--line-strong);
  border-radius: 2px; opacity: 0.9;
}
.xl-x.on::before { display: none; }
.xl-x.on { background: var(--good-soft); color: var(--good-deep); font-weight: 700; }
.xl-x.bad { background: var(--bad-soft); color: var(--bad); }
.xl-row.bad .xl-h { background: var(--bad-soft); }
/* The two extension pairs are a different job from the columns before them. */
.xl-row > .xl-c:nth-child(8) { border-left: 2px solid var(--line-strong); }
.xl-row > .xl-c:nth-child(10) { border-left: 1px solid var(--line-strong); }
.xl-grp .xl-g {
  min-height: 26px; flex: 0 0 calc(var(--n) * 68px);
  display: flex; align-items: center; justify-content: center; text-align: center;
  border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  line-height: 1.15; padding: 3px 4px;
}
.xl-g.given { background: var(--surface-2); color: var(--muted); }
.xl-g.mine { background: var(--brand-soft); color: var(--brand-ink); }
.xl-grp .xl-h { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.xl-hd .xl-c {
  min-height: 24px; background: var(--surface-2); color: var(--muted);
  font-size: 10px; justify-content: space-between; align-items: center;
}
.xl-hd .xl-c u { text-decoration: none; font-weight: 800; color: var(--text-dim); }
.xl-hd .xl-h { font-weight: 700; color: var(--text-dim); background: var(--surface-2); }
.xl-row:nth-of-type(even) .xl-c:not(.given):not(.dead) { background: var(--surface); }
.xl-foot .xl-c, .xl-foot .xl-h { border-top: 2px solid var(--line-strong); font-weight: 700; }
.xl-ni .xl-h { font-weight: 700; color: var(--brand); }
.xl-c.auto { background: var(--surface-2); color: var(--muted); }
.xl-c.auto.ok { color: var(--good-deep); background: var(--good-soft); }
.xl-c.auto.off { color: var(--bad); background: var(--bad-soft); }

.xl-legend {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-top: 9px; font-size: 11px; color: var(--muted);
}
.xl-legend span { display: inline-flex; align-items: center; gap: 5px; }
.xl-legend b { font-family: var(--mono); font-weight: 700; color: var(--text-dim); }
.lg { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line-strong); }
.lg.given { background: var(--surface-2); }
.lg.mine { background: var(--brand-soft); border-color: var(--brand-line); }

.xl-help { margin-top: 12px; display: grid; gap: 4px; }
.xl-help-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px; border-radius: var(--r-sm); background: var(--surface-2);
}
.xl-help-row b { flex: 1; font-size: 12px; font-weight: 650; color: var(--text-dim); }

/* ---- the balance sheet form ---- */
.bsf { padding: 4px 0 2px; }
.bsf-sect {
  padding: 8px 11px 6px; font-size: 11px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand);
  border-bottom: 1px solid var(--line);
}
.bsf-sub {
  padding: 9px 11px 3px; font-size: 12px; font-weight: 700; color: var(--text-dim);
}
.bsf-line {
  display: flex; align-items: center; gap: 9px; padding: 4px 11px;
  font-size: 12.5px; color: var(--text-dim);
}
.bsf-line.in { padding-left: 22px; }
.bsf-line b {
  margin-left: auto; font-family: var(--mono); font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.bsf-line.sum { padding-top: 6px; padding-bottom: 6px; border-top: 1px solid var(--line); }
.bsf-line.sum label { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 650; color: var(--text); }
.bsf-in { flex: 0 0 104px; }
.bsf-in input {
  width: 100%; padding: 8px 9px; text-align: right;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text);
  font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.bsf-field.right .bsf-in input { border-color: var(--good-line); background: var(--good-soft); }
.bsf-field.wrong .bsf-in input { border-color: var(--bad-line); background: var(--bad-soft); }
.bsf-field [data-note5] { padding: 0 11px 4px; }

@media (max-width: 340px) {
  .xl-h { flex-basis: 112px; }
  .xl-c { flex-basis: 62px; }
  .xl-grp .xl-g { flex-basis: calc(var(--n) * 62px); }
  .bsf-in { flex-basis: 92px; }
}


/* ============================================================
   THE LECTURE PANE
   Read straight through, so it is one page rather than a paged
   flow. Topics are numbered, each names the one it builds on, and
   the figures are schematic — the guide supplies the real numbers.
   ============================================================ */

#pane-lecture .scroll { padding: 22px 18px 34px; }
#pane-lecture .wrap { max-width: 640px; }
@media (min-width: 720px) { #pane-lecture .scroll { padding: 30px 24px 44px; } }
@media (max-width: 360px) { #pane-lecture .scroll { padding: 20px 16px 30px; } }

.lec-head { margin-bottom: 16px; }
.lec-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 7px;
}
.lec-head h1 {
  font-family: var(--display); font-size: 22px; font-weight: 600;
  line-height: 1.2; letter-spacing: -0.01em; color: var(--text);
}
.lec-thesis { margin-top: 11px; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
.lec-thesis.sm { margin-top: 0; margin-bottom: 12px; font-size: 13px; }

/* An account's effect on its own side of the equation. Expenses and
   dividends sit inside equity but reduce it, which is the one place
   the arithmetic stops matching the plus sign on screen. */
function sideOf(k) { return COLS.filter(function (c) { return c.k === k; })[0].grp === 'a' ? 'a' : 'c'; }
function claimSign(k) { return (k === 'exp' || k === 'div') ? -1 : 1; }

/* [{k, name, side, delta, shown}] for one ledger row. */
function effectsOf(row) {
  return COLS.filter(function (c) { return row[c.k]; }).map(function (c) {
    var v = row[c.k];
    var side = sideOf(c.k);
    return {
      k: c.k,
      name: ACCOUNT[c.k],
      side: side,
      shown: v,                                     // what the workpaper prints
      delta: side === 'a' ? v : claimSign(c.k) * v  // what it does to that side
    };
  });
}

  function flow() { return flowFor(mod); }
  /* How many of the open module's screens are entries rather than reports. */
  /* 2.4 opens with statements rather than entries, so its 'Entry n of m'
     label would be wrong from the first screen; it uses the item's own kind. */
  function entryCount() { return [ENTRIES.length, ENTRIES2.length, ENTRIES3.length, STMT4.length, 0][mod]; }
  function modId() { return MODULES[mod].id; }
  function readSet() {
    if (!read[modId()]) read[modId()] = {};
    return read[modId()];
  }

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* Cumulative column totals through ledger row i. totalsUpTo works in
     steps, and transaction 7 is three rows inside one step. */
  function totalsThrough(i) {
    var t = {};
    COLS.forEach(function (c) { t[c.k] = 0; });
    LEDGER.slice(0, i + 1).forEach(function (r) {
      COLS.forEach(function (c) { if (r[c.k]) t[c.k] += r[c.k]; });
    });
    return t;
  }

  function isRead(id) { return !!readSet()[id]; }
  function readCount() { return flow().filter(function (f) { return isRead(f.id); }).length; }

  /* ---------- illustration: the balance board ---------- */
  function balanceBoard(before, after, effects, capA, capC) {
    function side(cls, cap, from, to, list) {
      var chips = list.map(function (e, i) {
        return '<span class="bb-chip' + (e.delta < 0 ? ' dn' : '') + '" style="--i:' + i + '">' +
          '<u>' + e.name + '</u><b>' + (e.shown > 0 ? '+' : '&minus;') + Math.abs(e.shown).toLocaleString('en-US') + '</b></span>';
      }).join('');
      return '<div class="bb-side ' + cls + '">' +
        '<span class="bb-cap">' + cap + '</span>' +
        '<b class="bb-num" data-from="' + from + '" data-count="' + to + '">' + dollars(from) + '</b>' +
        (chips ? '<div class="bb-chips">' + chips + '</div>' : '') +
        '</div>';
    }
    function bar(cls, from, to) {
      return '<div class="bb-track ' + cls + '"><i class="bb-fill" style="width:' +
        pct(from) + '" data-w="' + pct(to) + '"></i></div>';
    }
    function pct(v) { return Math.max(0, Math.min(100, (v / GRAND) * 100)).toFixed(2) + '%'; }

    var a0 = assetsOf(before), a1 = assetsOf(after);
    var c0 = claimsOf(before), c1 = claimsOf(after);
    return '<div class="bb">' +
        side('bb-a', capA || 'Assets', a0, a1, effects.filter(function (e) { return e.side === 'a'; })) +
        '<div class="bb-op">=</div>' +
        side('bb-c', capC || 'Liabilities + Equity', c0, c1, effects.filter(function (e) { return e.side === 'c'; })) +
      '</div>' +
      '<div class="bb-bars">' + bar('a', a0, a1) + '<span class="bb-gap"></span>' + bar('c', c0, c1) + '</div>' +
      '<div class="verdict ' + verdictKind(a1, c1, effects.length) + '">' +
        (verdictKind(a1, c1, effects.length) === 'idle' ? '' : (a1 === c1 ? ICON.check : ICON.warn) + ' ') +
        verdictLine(a0, a1, c1, effects.length) + '</div>';
  }

  function verdictKind(a1, c1, moves) {
    if (a1 !== c1) return 'no';
    return (!moves && a1 === 0) ? 'idle' : 'ok';
  }

  function verdictLine(a0, a1, c1, moves) {
    if (a1 !== c1) return 'Out by ' + dollars(Math.abs(a1 - c1));
    if (!moves) return a1 === 0
      ? 'Nothing recorded yet &mdash; open an entry and this fills in'
      : 'Both sides stand at ' + dollars(a1);
    var d = a1 - a0;
    if (d === 0) return 'Both sides stay at ' + dollars(a1) + ', because the movement was within one side';
    return 'Each side ' + (d < 0 ? 'falls' : 'rises') + ' by ' + dollars(Math.abs(d)) +
      ', landing on ' + dollars(a1);
  }

  /* ---------- illustration: what actually crossed ---------- */
  function flowScene(s) {
    function wire(cls, label) {
      return '<div class="fx-wire ' + cls + '">' +
        '<div class="fx-lab">' + label + '</div>' +
        '<div class="fx-rail"><i class="fx-tok"></i></div>' +
        '</div>';
    }
    return '<div class="fx-scene">' +
        '<div class="fx-node"><span>Other party</span><b>' + s.other + '</b></div>' +
        '<div class="fx-wires">' +
          wire('', s.get) +
          wire('rtl', s.give) +
          (s.back ? wire('back rtl', s.back) : '') +
        '</div>' +
        '<div class="fx-node self"><span>The business</span><b>' + CO.name + '</b></div>' +
      '</div>' +
      (s.cash === false ? '<p class="viz-sub">No cash moved in either direction. The entry is recorded anyway, because the resources and the claims on them both changed.</p>' : '');
  }

  /* ---------- illustration: which columns feed a statement ---------- */
  function routeViz(feeds, label) {
    return '<div class="route"><div class="route-cols">' +
      COLS.map(function (c) {
        return '<span class="route-col' + (feeds.indexOf(c.k) !== -1 ? ' on' : '') + '">' + ACCOUNT[c.k] + '</span>';
      }).join('') +
      '</div><div class="route-down">' + ICON.down + '</div>' +
      '<div class="route-col on" style="text-align:center">' + label + '</div></div>';
  }

  /* An aria-label is an attribute, so a stray quote in a claim would end it. */
  function attr(t) { return String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/<[^>]*>/g, ''); }

  /* cap is the visible title; claim is the sentence a reader who cannot see
     the picture gets instead of it. keepText spares figures whose text is the
     content — role="img" would hide a whole trial balance to say one line. */
  function viz(cap, html, claim, keepText) {
    var body = html;
    if (claim && keepText) body = '<p class="sr-only">' + claim + '</p>' + html;
    else if (claim) body = '<div role="img" aria-label="' + attr(claim) + '">' + html + '</div>';
    return '<figure class="viz"><figcaption class="viz-cap">' + cap + '</figcaption>' + body + '</figure>';
  }

  /* ---------- the dashboard ---------- */
  function renderDash() {
    var done = readCount();
    var last = -1;
    ENTRIES.forEach(function (e, i) { if (isRead(e.id)) last = i; });
    var t = totalsThrough(last);              // the equation as far as you have read

    var cards = ENTRIES.map(function (e, i) {
      var fx = effectsOf(LEDGER[i]);
      var run = totalsThrough(i);
      return '<button class="card-e' + (isRead(e.id) ? ' read' : '') + '" data-open="' + i + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(e.id) ? ICON.check : e.id) + '</span>' +
          '<b>' + e.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span>' +
        '<p>' + WORK_TX[e.id] + '</p>' +
        '<span class="card-fx">' + fx.map(function (f) {
          return '<span class="chip ' + f.side + '">' + f.name +
            ' <b>' + (f.shown > 0 ? '+' : '&minus;') + Math.abs(f.shown).toLocaleString('en-US') + '</b></span>';
        }).join('') + '</span>' +
        '<span class="card-run">after this entry &nbsp;<em>' + dollars(assetsOf(run)) + '</em> = <em>' + dollars(claimsOf(run)) + '</em></span>' +
        '</button>';
    }).join('');

    var reports = REPORTS.map(function (r, i) {
      return '<button class="card-e' + (isRead(r.id) ? ' read' : '') + '" data-open="' + (ENTRIES.length + i) + '">' +
        '<span class="card-e-top">' +
          '<span class="card-n">' + (isRead(r.id) ? ICON.check : ICON.table) + '</span>' +
          '<b>' + r.short + '</b>' +
          '<span class="card-go">' + ICON.next + '</span>' +
        '</span>' +
        '<p>' + r.rule + '</p>' +
        '</button>';
    }).join('');

    $('guide').innerHTML =
      '<div class="wrap fade">' +
        '<div class="dash-head">' +
          '<h1>' + CO.name + ' &middot; July</h1>' +
          '<p>Nine entries and four reports. Open any one to see what happened, why it is recorded that way, and what it does to the equation. The figures below are live: they follow what you have read.</p>' +
        '</div>' +
        '<div class="state">' +
          '<div class="state-cap">' + ICON.pulse + (last < 0 ? 'Before any entry is recorded' : 'The equation after entry (' + LEDGER[last].id + ')') + '</div>' +
          balanceBoard(t, t, []) +
        '</div>' +
        '<div class="sect">The entries<i></i></div>' +
        '<div class="cards">' + cards + '</div>' +
        '<div class="sect">Closing the month<i></i></div>' +
        '<div class="cards">' + reports + '</div>' +
        '<div class="sect">How any entry is recorded<i></i></div>' +
        '<div class="method">' + METHOD.map(function (m, i) {
          return '<div class="method-row"><span class="method-n">' + (i + 1) + '</span>' +
            '<span>' + m[0] + '</span><em>' + m[1] + '</em></div>';
        }).join('') + '</div>' +
        '<div style="height:10px"></div>' +
      '</div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = dashScroll;
  }

  /* ---------- one entry, explained ---------- */
  function renderDetail() {
    var item = FLOW21[at];
    var body;

    if (at < ENTRIES.length) {
      var row = LEDGER[at];
      var fx = effectsOf(row);
      body =
        '<div class="ex-eyebrow">Entry <i>(' + row.id + ')</i> &middot; ' + (at + 1) + ' of ' + FLOW21.length + '</div>' +
        '<h1 class="ex-title">' + item.concept + '</h1>' +
        '<div class="ex-fact">' + WORK_TX[item.id] + '</div>' +
        viz('What crossed, and in which direction', flowScene(item.scene),
          item.concept + ': what the business gave up, and what it received in return.') +
        '<div class="ex-why">' + item.why.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        viz('What it does to the equation', balanceBoard(totalsThrough(at - 1), totalsThrough(at), fx),
          'After this entry, assets of ' + dollars(assetsOf(totalsThrough(at))) +
          ' equal liabilities plus equity of ' + dollars(claimsOf(totalsThrough(at))) + '.') +
        (item.trap ? viz('The judgement call', trapViz(item.trap),
          'The tempting wrong treatment set beside the correct one.', true) : '') +
        '<div class="ex-rule">' + ICON.bulb + '<p>' + item.rule + '</p></div>' +
        (item.doc || '') +
        viz('The row it produces', ledgerTable(99, fx.map(function (f) { return f.k; }), { remarks: true, only: at }),
          'The single row this transaction adds to the tabular summary.', true);
    } else {
      var fin = totalsUpTo(999);
      body =
        '<div class="ex-eyebrow">Report &middot; ' + (at + 1) + ' of ' + FLOW21.length + '</div>' +
        '<h1 class="ex-title">' + item.title + '</h1>' +
        '<div class="ex-fact">' + item.concept + '</div>' +
        (item.feeds ? viz('Which columns feed this statement', routeViz(item.feeds, item.short),
          'Which columns of the tabular summary flow into the ' + item.short + '.') : '') +
        '<div class="ex-why">' + item.why.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        (item.totals ? viz('The equation, totalled', balanceBoard(zeroTotals(), fin, allEffects()),
          'With every transaction recorded, assets of ' + dollars(assetsOf(fin)) +
          ' equal liabilities plus equity of ' + dollars(claimsOf(fin)) + '.') : '') +
        (item.equity ? viz('Equity, decomposed', equityViz(),
          'Equity splits into common stock and retained earnings, and retained earnings into revenue less expenses less dividends.') : '') +
        (item.stmt ? stmt(item.stmt, item.hits) : '') +
        '<div class="ex-rule">' + ICON.bulb + '<p>' + item.rule + '</p></div>' +
        (item.result ? '<div class="proof" style="border-radius:12px">' + ICON.check + '<span>' + item.result + '</span></div>' : '');
    }

    $('guide').innerHTML = '<div class="wrap fade">' + body + '<div style="height:10px"></div></div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = 0;
  }

  function zeroTotals() { var t = {}; COLS.forEach(function (c) { t[c.k] = 0; }); return t; }
  function allEffects() {
    var t = totalsUpTo(999);
    return COLS.filter(function (c) { return t[c.k]; }).map(function (c) {
      return { k: c.k, name: ACCOUNT[c.k], side: sideOf(c.k), shown: t[c.k], delta: sideOf(c.k) === 'a' ? t[c.k] : claimSign(c.k) * t[c.k] };
    });
  }

  function trapViz(t) {
    return '<div class="vs-q">' + t.q + '</div><div class="vs">' +
      '<div class="vs-col bad"><div class="vs-tag">' + ICON.x + ' Wrong</div><em>' + t.bad.t + '</em><p>' + t.bad.p + '</p></div>' +
      '<div class="vs-col good"><div class="vs-tag">' + ICON.check + ' Right</div><em>' + t.good.t + '</em><p>' + t.good.p + '</p></div>' +
      '</div>';
  }

  function equityViz() {
    var t = totalsUpTo(999);
    var re = t.rev - t.exp - t.div;
    return '<div class="decomp">' +
      '<div class="dc-node dc-top"><em>Stockholders&rsquo; Equity</em><b>' + dollars(t.cs + re) + '</b></div>' +
      '<div class="dc-link">' + ICON.down + '</div>' +
      '<div class="dc-row two">' +
        '<div class="dc-node"><span><em>Common Stock</em><small>What owners put in</small></span><b>' + dollars(t.cs) + '</b></div>' +
        '<div class="dc-node"><span><em>Retained Earnings</em><small>What the business kept</small></span><b>' + dollars(re) + '</b></div>' +
      '</div>' +
      '<div class="dc-link">' + ICON.down + '</div>' +
      '<div class="dc-row three">' +
        '<div class="dc-node sm"><em>Revenues</em><b>' + dollars(t.rev) + '</b></div>' +
        '<div class="dc-node sm minus"><em>&minus; Expenses</em><b>' + dollars(t.exp) + '</b></div>' +
        '<div class="dc-node sm minus"><em>&minus; Dividends</em><b>' + dollars(t.div) + '</b></div>' +
      '</div></div>';
  }

  /* Bars grow from where they were and figures count up to where they land.
     Under reduced motion both are simply set to their final values. */
  function animateViz(root) {
    var slow = reduceMotion();
    Array.prototype.forEach.call(root.querySelectorAll('[data-count]'), function (el) {
      var to = Number(el.getAttribute('data-count'));
      var from = Number(el.getAttribute('data-from'));
      if (slow || from === to) { el.innerHTML = dollars(to); return; }
      var t0 = null;
      requestAnimationFrame(function tick(now) {
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) / 280);
        var e = 1 - Math.pow(1 - p, 3);
        el.innerHTML = dollars(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(tick);
      });
    });
    var fills = root.querySelectorAll('.bb-fill[data-w]');
    if (!fills.length) return;
    if (slow) {
      Array.prototype.forEach.call(fills, function (f) { f.style.width = f.getAttribute('data-w'); });
      return;
    }
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(fills, function (f) { f.style.width = f.getAttribute('data-w'); });
    });
  }

  function renderGuide() {
    var dash = view === 'dash';
    if (mod === 0) { if (dash) renderDash(); else renderDetail(); }
    else if (mod === 1) { if (dash) renderDash2(); else renderDetail2(); }
    else if (mod === 2) { if (dash) renderDash3(); else renderDetail3(); }
    else if (mod === 3) { if (dash) renderDash4(); else renderDetail4(); }
    else renderDash5();          /* the capstone has one screen: the problem */
  }

  /* ---------- table pane ---------- */
  /* ---------- reference ----------
     Everything a learner would have on the desk beside them, and none of
     the figures they are being asked to produce. The worked summary lives
     in the guide, where it is being taught. */
  function renderTable() {
    $('table-slot').innerHTML =
      '<div class="card" style="padding:14px">' +
        '<div class="ref-head"><h2>The transactions</h2>' +
        '<p>' + CO.name + ' during its first month. These are the events to be recorded.</p></div>' +
        '<div class="src" style="margin-top:11px">' +
          LEDGER.map(function (r) {
            return '<div class="src-row"><u>(' + r.id + ')</u><span>' + WORK_TX[r.id] + '</span></div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="card" style="padding:14px;margin-top:12px">' +
        '<div class="ref-head"><h2>The columns of the summary</h2>' +
        '<p>Each account gets a column, grouped by the side of the equation it sits on.</p></div>' +
        '<div class="coa" style="margin-top:11px">' +
          '<div class="coa-hd"><span></span><span>Account</span><span>Group</span><span></span></div>' +
          COLS.map(function (c) {
            var grp = c.grp === 'a' ? 'Asset' : (c.grp === 'l' ? 'Liability' : 'Equity');
            var down = (c.k === 'exp' || c.k === 'div');
            return '<div class="coa-row"><span></span>' +
              '<span class="coa-name">' + ACCOUNT[c.k] + '</span>' +
              '<span class="coa-fam">' + grp + '</span>' +
              '<span class="' + (down ? 'coa-cr' : 'coa-dr') + '">' + (down ? '&minus;' : '+') + '</span></div>';
          }).join('') +
        '</div>' +
        '<p class="viz-sub">Expenses and dividends sit inside equity but reduce it, which is why they are subtracted rather than added.</p>' +
      '</div>' +
      '<div class="card" style="padding:14px;margin-top:12px">' +
        '<div class="ref-head"><h2>The equation</h2></div>' +
        '<div class="rule-b" style="margin-top:10px">' +
          '<div class="rule-col d"><div class="rule-hd"><b>Assets</b><span>what the business controls</span></div></div>' +
          '<div class="rule-col c"><div class="rule-hd"><b>Liabilities + Equity</b><span>who has a claim on it</span></div></div>' +
        '</div>' +
      '</div>';
  }


  /* ---------- the worksheet ----------
     Part 1 records the nine ledger rows, Part 2 reports the five figures
     the statements need. The workpaper in the middle is built from what
     the learner typed, not from the answer key, so a wrong entry shows up
     as an out-of-balance total before anything is graded. */
  var work = { cell: {}, fld: {}, hint: {}, shut: {} };
  var KEY = totalsUpTo(999);          // the column totals a correct sheet reaches

  function loadWork() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work') || '{}');
      if (w && typeof w === 'object') {
        work.cell = w.cell || {};
        work.fld = w.fld || {};
        work.hint = w.hint || {};
        work.shut = w.shut || {};
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork() {
    try { window.localStorage.setItem(STORE + '.work', JSON.stringify(work)); } catch (e) {}
  }

  function fxKey(ri, n, part) { return ri + '.' + n + '.' + part; }
  function amountOf(v) {
    if (v === undefined || v === null) return NaN;
    var c = String(v).replace(/[$,\s]/g, '');
    if (c === '' || c === '-') return NaN;
    return Number(c);
  }
  function motionOK() { return !reduceMotion(); }

  /* A hint can always be put away again. Closing keeps the level, so the
     button re-opens it rather than losing the learner's place. */
  function tipHtml(key, text) {
    return '<div class="ws-note tip"><span>' + text + '</span>' +
      '<button type="button" class="tip-x" data-hclose="' + key + '" aria-label="Close hint">' + ICON.x + '</button></div>';
  }

  /* Hint keys are the row index, or 'f' + field index. */
  function paintHint(key) {
    var lvl = work.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max;
    if (key.charAt(0) === 'f') {
      var f = WORK_FIELDS[Number(key.slice(1))];
      if (!f) return;
      max = f.hints.length;
      text = f.hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-fnote="' + f.id + '"]');
      btn = host.querySelector('[data-fhint="' + key.slice(1) + '"]');
    } else {
      var row = LEDGER[Number(key)];
      if (!row) return;
      var hints = WORK_HINTS[row.id] || [];
      max = hints.length;
      text = hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note="' + key + '"]');
      btn = host.querySelector('[data-hint="' + key + '"]');
    }
    if (!slot || !text) return;
    var shut = !!work.shut[key];
    slot.innerHTML = shut ? '' : tipHtml(key, text);
    if (!btn) return;
    btn.classList.toggle('on', !shut);
    btn.innerHTML = ICON.bulb + (shut ? 'Show hint' : (lvl >= max ? 'No more hints' : 'Another hint'));
    btn.disabled = !shut && lvl >= max;
  }

  /* Pressing Hint on a closed hint brings it back at the level already
     reached; pressing it on an open one goes a level deeper. */
  function bumpHint(key, max) {
    if (work.shut[key]) delete work.shut[key];
    else work.hint[key] = Math.min((work.hint[key] || 0) + 1, max);
    paintHint(key);
    saveWork();
  }
  function shutHint(key) {
    work.shut[key] = 1;
    paintHint(key);
    saveWork();
  }

  /* ---------- module 2.1 worksheet, as a working paper ----------
     The tabular summary is a spreadsheet, so the learner fills it in as
     one: a cell per account per transaction, columns footed live, and the
     proof line underneath. It scrolls sideways because a nine-column
     working paper does. */

  function cellKey(ri, k) { return ri + '.' + k; }
  function cellVal(ri, k) {
    var v = work.cell ? work.cell[cellKey(ri, k)] : undefined;
    return v === undefined ? '' : v;
  }
  function cellNum(ri, k) {
    var n = amountOf(cellVal(ri, k));
    return isNaN(n) ? 0 : n;
  }

  function workTotals() {
    var t = {};
    COLS.forEach(function (c) { t[c.k] = 0; });
    LEDGER.forEach(function (r, ri) { COLS.forEach(function (c) { t[c.k] += cellNum(ri, c.k); }); });
    return t;
  }

  function rowTouched(ri) {
    return COLS.some(function (c) { return String(cellVal(ri, c.k)).trim() !== ''; });
  }
  function rowRight(ri) {
    return COLS.every(function (c) {
      var typed = String(cellVal(ri, c.k)).trim();
      var want = LEDGER[ri][c.k] || 0;
      if (!typed) return want === 0;
      var n = amountOf(typed);
      return !isNaN(n) && n === want;
    });
  }

  function rowDiagnosis(ri) {
    var row = LEDGER[ri];
    var filled = COLS.filter(function (c) { return String(cellVal(ri, c.k)).trim() !== ''; });
    var wanted = COLS.filter(function (c) { return row[c.k]; });
    if (!filled.length) return 'Nothing entered on this line yet. It touches ' + wanted.length + ' columns.';
    var left = 0, right = 0;
    COLS.forEach(function (c) {
      var n = cellNum(ri, c.k);
      if (!n) return;
      if (c.grp === 'a') left += n;
      else right += (c.k === 'exp' || c.k === 'div' ? -1 : 1) * n;
    });
    if (left !== right) return 'This line leaves the equation out by ' + dollars(Math.abs(left - right)) + '. Both sides have to move together.';
    if (filled.length !== wanted.length) return 'The line balances, but it uses ' + filled.length + ' columns where the transaction touches ' + wanted.length + '.';
    var amts = filled.map(function (c) { return Math.abs(cellNum(ri, c.k)); }).sort().join(',');
    var want = wanted.map(function (c) { return Math.abs(row[c.k]); }).sort().join(',');
    if (amts !== want) return 'It balances, but the figures are not the ones in the transaction. Read the amounts again.';
    return 'It balances and the amounts are right, so at least one column is wrong. Ask what the business received, and what it gave up or now owes.';
  }

  function fieldRight(f) { return amountOf(work.fld[f.id]) === f.answer(KEY); }
  function fieldDiagnosis(f) {
    if (isNaN(amountOf(work.fld[f.id]))) return 'Nothing entered yet.';
    if (amountOf(work.fld[f.id]) === f.answer(workTotals())) {
      return 'This follows correctly from your working paper, but the working paper is not right yet. Fix the grid and this figure will come out right on its own.';
    }
    return 'Not yet. Work it out from your own column totals rather than from memory.';
  }

  function scoreNow() {
    var a = 0;
    LEDGER.forEach(function (r, ri) { if (rowRight(ri)) a++; });
    var x = WORK_FIELDS.filter(fieldRight).length;
    return {
      got: a + x, total: LEDGER.length + WORK_FIELDS.length,
      parts: { a: a, x: x }, caps: { a: LEDGER.length, x: WORK_FIELDS.length }
    };
  }

  function instrPanel21() {
    var sc = scoreNow();
    return '<div class="instr">' +
      '<div class="instr-cap">Instructions</div>' +
      INSTRUCTIONS21.map(function (i) {
        var got = sc.parts[i.id], cap = sc.caps[i.id], done = cap > 0 && got === cap;
        return '<div class="instr-row' + (done ? ' done' : '') + (i.kind === 'extra' ? ' extra' : '') + '">' +
          '<span class="instr-k">' + (done ? ICON.check : (i.kind === 'extra' ? '+' : i.id + '.')) + '</span>' +
          '<span class="instr-t">' + i.text + '</span>' +
          '<span class="instr-n">' + got + '/' + cap + '</span></div>';
      }).join('') +
      '</div>';
  }

  function refreshInstr21() {
    var host = $('solve').querySelector('.instr');
    if (!host) return;
    var sc = scoreNow();
    Array.prototype.forEach.call(host.querySelectorAll('.instr-row'), function (row, i) {
      var x = INSTRUCTIONS21[i], got = sc.parts[x.id], cap = sc.caps[x.id];
      var done = cap > 0 && got === cap;
      row.classList.toggle('done', done);
      row.querySelector('.instr-k').innerHTML = done ? ICON.check : (x.kind === 'extra' ? '+' : x.id + '.');
      row.querySelector('.instr-n').textContent = got + '/' + cap;
    });
  }

  function renderSolve() {
    if (!work.cell) work.cell = {};
    var t = workTotals();
    var A = assetsOf(t), C = claimsOf(t);

    /* The transactions, with the hint for each attached where you would
       look for it: on the source document, not in the grid. */
    var srcs = LEDGER.map(function (r, ri) {
      return '<div class="ws-tx" data-tx="' + ri + '">' +
        '<div class="ws-tx-head"><span class="ws-no">' + r.id + '</span>' +
        '<p class="ws-text">' + WORK_TX[r.id] + '</p></div>' +
        '<div class="ws-foot"><button type="button" class="ws-hint" data-hint="' + ri + '">' + ICON.bulb + 'Hint</button>' +
        '<button type="button" class="ws-goto" data-goto="' + ri + '">Go to line ' + r.id + '</button></div>' +
        '<div data-note="' + ri + '"></div></div>';
    }).join('');

    var grp = '<tr class="grp"><th class="rowlab"></th>' +
      '<th colspan="3">ASSETS</th><th colspan="2">LIABILITIES</th><th colspan="4">STOCKHOLDERS&rsquo; EQUITY</th></tr>';
    var head = '<tr class="acct"><th class="rowlab">Trans.</th>' +
      COLS.map(function (c) { return '<th>' + c.head.replace(/^\+ /, '') + '</th>'; }).join('') + '</tr>';

    var body = LEDGER.map(function (r, ri) {
      return '<tr class="wp-row" data-row="' + ri + '"><td class="rowlab">(' + r.id + ')</td>' +
        COLS.map(function (c) {
          return '<td><input class="cell" data-cell="' + ri + '.' + c.k + '" value="' + cellVal(ri, c.k) + '"' +
            ' inputmode="text" autocomplete="off" aria-label="' + ACCOUNT[c.k] + ' for transaction ' + r.id + '" /></td>';
        }).join('') + '</tr>';
    }).join('');

    var foot = '<tr><td class="rowlab">Totals</td>' +
      COLS.map(function (c) { return '<td>' + (t[c.k] ? money(t[c.k]) : '&mdash;') + '</td>'; }).join('') + '</tr>';

    var proof = (A === 0 && C === 0)
      ? '<div class="gl-off idle"><span>Fill a line and the columns foot themselves</span><span>&mdash;</span></div>'
      : A === C
        ? '<div class="gl-off ok"><span>Assets ' + dollars(A) + ' = Liabilities + Equity ' + dollars(C) + '</span><span>' + ICON.check + '</span></div>'
        : '<div class="gl-off off"><span>Assets ' + dollars(A) + ' vs ' + dollars(C) + '</span><span>' + dollars(Math.abs(A - C)) + '</span></div>';

    var fields = WORK_FIELDS.map(function (f, fi) {
      return '<div class="ws-field" data-field="' + f.id + '">' +
        '<label for="ws-' + f.id + '">' + f.label + '</label>' +
        '<div class="ws-line"><div class="ws-amt"><input id="ws-' + f.id + '" data-fld="' + f.id + '" inputmode="decimal" autocomplete="off" /></div>' +
        '<button type="button" class="ws-hint" data-fhint="' + fi + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-fnote="' + f.id + '"></div></div>';
    }).join('');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="sw-bar">' +
          '<span class="sw-bar-id"><h1>' + CO.name + '</h1><span>Tabular summary &middot; Jul 2025</span></span>' +
          '<span class="sw-counts"><span class="sw-count" id="wp-count"><b>0</b><u>of 9 lines</u></span></span>' +
        '</div>' +
        instrPanel21() +
        '<div class="ws-sect">Source documents<i></i></div>' + srcs +
        '<div class="ws-sect">a &middot; The tabular summary<i></i></div>' +
        '<div class="sw-panel"><div class="sw-panel-hd"><b>Tabular summary</b><span>swipe to see every column</span></div>' +
          '<div class="wp-scroll"><table class="wp"><thead>' + grp + head + '</thead>' +
          '<tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
          '<div class="sw-panel-bd" style="padding-top:0">' + proof + '</div>' +
        '</div>' +
        '<p class="wp-tip">' + ICON.bulb + 'Enter the amount in the column it belongs to. Type a minus sign for a decrease, and leave a cell empty when the transaction does not touch it.</p>' +
        '<div class="ws-sect extra">Beyond the problem &middot; Report the results<i></i></div>' +
        '<p class="ws-aside">The problem stops at the summary above. These five figures are not part of it &mdash; they are where the totals go next, and each one is a line of a financial statement you have already met in the guide.</p>' +
        '<div class="ws-fields">' + fields + '</div>' +
        '<button type="button" class="ws-reset" id="ws-reset">Clear my work and start again</button>' +
      '</div>';

    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fld]'), function (el) {
      var v = work.fld[el.getAttribute('data-fld')]; if (v !== undefined) el.value = v;
    });
    Object.keys(work.hint).forEach(paintHint);
    refreshWp();
  }

  /* Foot the columns and redraw the proof without rebuilding the grid. The
     instruction panel is refreshed here too, so it tracks the same keystrokes. */
  function refreshWp() {
    refreshInstr21();
    var t = workTotals(), A = assetsOf(t), C = claimsOf(t);
    var cells = $('solve').querySelectorAll('tfoot td');
    COLS.forEach(function (c, i) {
      if (cells[i + 1]) cells[i + 1].innerHTML = t[c.k] ? money(t[c.k]) : '&mdash;';
    });
    var proof = $('solve').querySelector('.sw-panel-bd .gl-off');
    if (proof) {
      proof.className = 'gl-off ' + ((A === 0 && C === 0) ? 'idle' : (A === C ? 'ok' : 'off'));
      proof.innerHTML = (A === 0 && C === 0)
        ? '<span>Fill a line and the columns foot themselves</span><span>&mdash;</span>'
        : A === C
          ? '<span>Assets ' + dollars(A) + ' = Liabilities + Equity ' + dollars(C) + '</span><span>' + ICON.check + '</span>'
          : '<span>Assets ' + dollars(A) + ' vs ' + dollars(C) + '</span><span>' + dollars(Math.abs(A - C)) + '</span>';
    }
    var done = 0;
    LEDGER.forEach(function (r, ri) { if (rowTouched(ri)) done++; });
    var cnt = $('wp-count');
    if (cnt) {
      cnt.querySelector('b').textContent = done;
      cnt.classList.toggle('done', done === LEDGER.length);
    }
  }

  function gradeSolve() {
    LEDGER.forEach(function (r, ri) {
      var card = $('solve').querySelector('[data-tx="' + ri + '"]');
      var line = $('solve').querySelector('[data-row="' + ri + '"]');
      var note = $('solve').querySelector('[data-note="' + ri + '"]');
      var ok = rowRight(ri), touched = rowTouched(ri);
      card.classList.toggle('right', ok);
      card.classList.toggle('wrong', !ok && touched);
      line.classList.toggle('right', ok);
      line.classList.toggle('wrong', !ok && touched);
      card.querySelector('.ws-no').innerHTML = ok ? ICON.check : r.id;
      if (ok || !touched) { var stale = card.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!work.hint[ri]) note.innerHTML = '<div class="ws-note bad">' + rowDiagnosis(ri) + '</div>';
    });
    WORK_FIELDS.forEach(function (f, fi) {
      var box = $('solve').querySelector('[data-field="' + f.id + '"]');
      var note = $('solve').querySelector('[data-fnote="' + f.id + '"]');
      var ok = fieldRight(f);
      var touched = String(work.fld[f.id] === undefined ? '' : work.fld[f.id]).trim() !== '';
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      if (ok || !touched) { var old = box.querySelector('.ws-note.bad'); if (old) old.remove(); }
      else if (!work.hint['f' + fi]) note.innerHTML = '<div class="ws-note bad">' + fieldDiagnosis(f) + '</div>';
    });
    renderControls();
    var first = $('solve').querySelector('.ws-tx.wrong, .ws-field.wrong');
    if (first) first.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' });
  }

  function clearMark(ri) {
    var card = $('solve').querySelector('[data-tx="' + ri + '"]');
    var line = $('solve').querySelector('[data-row="' + ri + '"]');
    if (line) line.classList.remove('right', 'wrong');
    if (!card) return;
    card.classList.remove('right', 'wrong');
    card.querySelector('.ws-no').textContent = LEDGER[ri].id;
    var bad = card.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function bindSolve() {
    var host = $('solve');

    host.addEventListener('input', function (e) {
      var c = e.target.closest('[data-cell]');
      if (c) {
        var p = c.getAttribute('data-cell');
        if (!work.cell) work.cell = {};
        work.cell[p] = c.value;
        clearMark(p.split('.')[0]);
        refreshWp(); saveWork(); renderControls();
        return;
      }
      var f = e.target.closest('[data-fld]');
      if (!f) return;
      work.fld[f.getAttribute('data-fld')] = f.value;
      var box = f.closest('.ws-field');
      box.classList.remove('right', 'wrong');
      var bad = box.querySelector('.ws-note.bad');
      if (bad) bad.remove();
      saveWork(); refreshInstr21(); renderControls();
    });

    host.addEventListener('click', function (e) {
      var g = e.target.closest('[data-goto]');
      if (g) {
        var row = host.querySelector('[data-row="' + g.getAttribute('data-goto') + '"] .cell');
        if (row) { row.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' }); row.focus(); }
        return;
      }
      var x = e.target.closest('[data-hclose]');
      if (x) { shutHint(x.getAttribute('data-hclose')); return; }
      var h = e.target.closest('[data-hint]');
      if (h) { bumpHint(h.getAttribute('data-hint'), WORK_HINTS[LEDGER[Number(h.getAttribute('data-hint'))].id].length); return; }
      var fh = e.target.closest('[data-fhint]');
      if (fh) { bumpHint('f' + fh.getAttribute('data-fhint'), WORK_FIELDS[Number(fh.getAttribute('data-fhint'))].hints.length); return; }
      if (e.target.closest('#ws-reset')) {
        if (!window.confirm('Clear every answer and hint on this working paper?')) return;
        work.cell = {}; work.fld = {}; work.hint = {}; work.shut = {};
        saveWork(); renderSolve(); renderControls();
      }
    });
  }

  /* ---------- module 2.2: journalize, post, trial balance ---------- */

  var FLOW2 = ENTRIES2.concat(REPORTS2);
  /* FLOW3 is declared with the rest of module 2.3, further down. */

  function money2(n) { return n.toLocaleString('en-US'); }
  function jIndex(id) { for (var i = 0; i < JOURNAL.length; i++) if (JOURNAL[i].id === id) return i; return -1; }

  /* ---------- illustration: which side an increase lands on ----------
     Families the entry touches are lit; the accounts themselves drop in
     underneath the side they landed on. */
  function ruleBoard(j) {
    var FAM_D = ['Asset', 'Expense', 'Dividends'];
    var FAM_C = ['Liability', 'Equity', 'Revenue'];
    var hit = {};
    (j ? j.lines : []).forEach(function (l) { hit[acct(l[0]).fam] = true; });

    function col(cls, cap, sub, fams, side) {
      var rows = fams.map(function (f) {
        return '<div class="rule-fam' + (hit[f] ? ' on' : '') + '"><u>' + f + '</u><em>&uarr;</em></div>';
      }).join('');
      var lands = (j ? j.lines : []).filter(function (l) {
        return (l[1] ? 'D' : 'C') === side;
      }).map(function (l, i) {
        var a = acct(l[0]);
        var up = side === a.up;          // its own increase side, or the other one
        return '<div class="rule-acct' + (up ? '' : ' down') + '" style="--i:' + i + '">' +
          '<span>' + a.name + ' <em>' + (up ? '&uarr;' : '&darr;') + '</em></span>' +
          '<b>' + money2(l[1] || l[2]) + '</b></div>';
      }).join('');
      return '<div class="rule-col ' + cls + '">' +
        '<div class="rule-hd"><b>' + cap + '</b><span>' + sub + '</span></div>' +
        '<div class="rule-fams">' + rows + '</div>' +
        (lands ? '<div class="rule-hit">' + lands + '</div>' : '') +
        '</div>';
    }
    return '<div class="rule-b">' +
      col('d', 'Debit', 'the left side', FAM_D, 'D') +
      col('c', 'Credit', 'the right side', FAM_C, 'C') +
      '</div>' +
      '<p class="viz-sub">The families above show which side <em>increases</em> each kind of account. ' +
      'An account lands on that side when it goes up (&uarr;) and on the opposite side when it goes down (&darr;).</p>';
  }

  /* ---------- illustration: the entry as it is actually written ---------- */
  function journalEntry(j, opts) {
    opts = opts || {};
    var rows = j.lines.map(function (l, i) {
      var isDr = !!l[1];
      return '<div class="je-row ' + (isDr ? 'dr' : 'cr') + (opts.live ? ' on' : '') + '" style="--i:' + i + '">' +
        '<span>' + (i === 0 ? j.date : '') + '</span>' +
        '<span class="je-acct">' + acct(l[0]).name + '</span>' +
        '<span class="je-amt">' + (l[1] ? money2(l[1]) : '') + '</span>' +
        '<span class="je-amt">' + (l[2] ? money2(l[2]) : '') + '</span>' +
        '</div>';
    }).join('');
    return '<div class="je"><div class="je-bar">General Journal</div><div class="je-grid">' +
      '<div class="je-head"><span>Date</span><span>Account Titles</span><span>Debit</span><span>Credit</span></div>' +
      rows +
      (opts.note ? '<div class="je-note">' + opts.note + '</div>' : '') +
      '</div></div>';
  }

  /* ---------- illustration: posting into the ledger ---------- */
  function tAccount(t, k, freshId) {
    var a = acct(k), rec = t[k];
    function side(which) {
      var lines = rec.lines.filter(function (x) { return which === 'd' ? x.d : x.c; }).map(function (x) {
        return '<div class="ta-line' + (x.id === freshId ? ' fresh' : '') + '">' +
          '<u>' + x.date.replace('July ', '7/') + '</u><span>' + money2(which === 'd' ? x.d : x.c) + '</span></div>';
      }).join('');
      var b = balOf(t, k);
      var showBal = b !== 0 && ((a.up === 'D') === (which === 'd'));
      return '<div class="ta-side ' + which + '">' + lines +
        (showBal ? '<div class="ta-bal"><u>Bal.</u><span>' + money2(b) + '</span></div>' : '') +
        '</div>';
    }
    return '<div class="ta"><div class="ta-name">' + a.name + '</div>' +
      '<div class="ta-body">' + side('d') + side('c') + '</div></div>';
  }

  function postingViz(j) {
    var t = postedThrough(jIndex(j.id));
    var keys = j.lines.map(function (l) { return l[0]; });
    return '<div class="post-wrap">' +
      journalEntry(j, { note: 'Each amount below is copied to the same side of its own account.' }) +
      '<div class="post-drop">' + ICON.down + '</div>' +
      '<div class="tas' + (keys.length === 2 ? ' two' : '') + '">' +
        keys.map(function (k) { return tAccount(t, k, j.id); }).join('') +
      '</div></div>';
  }

  /* ---------- illustration: the trial balance ---------- */
  function trialBalance(t, hits) {
    hits = hits || [];
    var rows = ACCT.map(function (a) {
      var b = balOf(t, a.k);
      var cls = !b ? ' zero' : (hits.indexOf(a.k) !== -1 ? ' on' : '');
      return '<div class="tb-row' + cls + '"><span class="tb-name">' + a.name + '</span>' +
        '<span>' + (b && a.up === 'D' ? money2(b) : '') + '</span>' +
        '<span>' + (b && a.up === 'C' ? money2(b) : '') + '</span></div>';
    }).join('');
    var tot = trialTotals(t);
    return '<div class="tb">' +
      '<div class="tb-hd"><span>Account</span><span>Debit</span><span>Credit</span></div>' + rows +
      '<div class="tb-tot"><span>Totals</span><span>' + money2(tot.dr) + '</span><span>' + money2(tot.cr) + '</span></div>' +
      '</div>' +
      '<div class="verdict ' + (tot.dr === tot.cr ? 'ok' : 'no') + '">' +
        (tot.dr === tot.cr ? ICON.check + ' The two columns agree at ' + dollars(tot.dr)
                           : ICON.warn + ' Out by ' + dollars(Math.abs(tot.dr - tot.cr))) + '</div>';
  }

  /* ---------- dashboard ---------- */

    $('guide').innerHTML =

            '<div class="bb-op">=</div>' +
            '<div class="bb-side bb-c"><span class="bb-cap">Total credits</span>' +
              '<b class="bb-num" data-from="' + tot.cr + '" data-count="' + tot.cr + '">' + dollars(tot.cr) + '</b></div>' +
          '</div>' +
          '<div class="verdict ' + (tot.dr === 0 ? 'idle' : 'ok') + '">' +
            (tot.dr === 0 ? 'Nothing journalized yet &mdash; open an entry and this fills in'
                          : ICON.check + ' Every entry so far has matching sides') + '</div>' +
        '</div>' +
        '<div class="sect">The journal entries<i></i></div>' +
        '<div class="cards">' + cards + '</div>' +
        '<div class="sect">Posting and proving<i></i></div>' +
        '<div class="cards">' + reports + '</div>' +
        '<div class="sect">How any entry is decided<i></i></div>' +
        '<div class="method">' + METHOD2.map(function (m, i) {
          return '<div class="method-row"><span class="method-n">' + (i + 1) + '</span>' +
            '<span>' + m[0] + '</span><em>' + m[1] + '</em></div>';
        }).join('') + '</div>' +
        '<div style="height:10px"></div>' +
      '</div>';
    animateViz($('guide'));
    $('guide').parentNode.scrollTop = dashScroll;
  }

  /* ---------- one entry, explained ---------- */
  function renderDetail2() {
    var item = FLOW2[at], body;

    if (at < ENTRIES2.length) {
      var j = JOURNAL[at];
      body =

  /* ---------- module 2.2 worksheet ----------
     Journalize all eleven transactions unaided, then report four balances
     the ledger produces. Graded against JOURNAL, so the answer key is the
     same data the explanations are built from. */

  var HINTS2 = {
    j1:  ['Two accounts change: what the business now holds, and who has a claim on it.',

          'Debit Cash 12,000. Credit Common Stock 12,000.'],

          'Debit Accounts Receivable 2,500. Credit Service Revenue 2,500.'],
    j10: ['Did the $290 create something the business still owns on July 31?',
          'Maintenance and Repairs Expense and Cash. Repairs keep an asset going, they do not make one.',
          'Debit Maintenance and Repairs Expense 290. Credit Cash 290.'],
    j11: ['Money left the business, but not in order to earn anything.',
          'Dividends and Cash. It is a distribution, so it never touches an expense account.',
          'Debit Dividends 600. Credit Cash 600.']
  };

  var w2 = { fx: {}, hint: {}, shut: {}, posted: {}, bal: {}, tb: {}, tbt: {}, at: 0, graded: 0 };

  function loadWork2() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work2') || '{}');
      if (w && typeof w === 'object') {
        w2.fx = w.fx || {}; w2.hint = w.hint || {}; w2.shut = w.shut || {}; w2.posted = w.posted || {};
        w2.bal = w.bal || {}; w2.tb = w.tb || {}; w2.tbt = w.tbt || {};
        w2.at = w.at || 0;
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork2() {
    try { window.localStorage.setItem(STORE + '.work2', JSON.stringify(w2)); } catch (e) {}
  }
  function slots2(ji) { return JOURNAL[ji].lines.length; }

  /* Hint keys: a voucher index, 'b' + account for a ledger balance, 't' +
     account for a trial balance row, all three levels deep. */
  function paintHint2(key) {
    var lvl = w2.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max = 3;
    if (key.charAt(0) === 'b' && acct(key.slice(1))) {
      var bk = key.slice(1);
      text = balHints(bk)[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-bnote="' + bk + '"]');
      btn = host.querySelector('[data-bhint="' + bk + '"]');
    } else if (key.charAt(0) === 't' && acct(key.slice(1))) {
      var tk = key.slice(1);
      text = tbHints(tk)[Math.min(lvl, max) - 1];
      btn = host.querySelector('[data-thint="' + tk + '"]');
      var row = host.querySelector('[data-tbrow="' + tk + '"]');
      if (row) {
        var after = row.nextElementSibling;
        if (!after || !after.classList.contains('tbf-note')) {
          after = document.createElement('div');
          after.className = 'tbf-note';
          row.parentNode.insertBefore(after, row.nextSibling);
        }
        slot = after;
      }
    } else {
      var j = JOURNAL[Number(key)];
      if (!j) return;
      var hints = HINTS2[j.id] || [];
      max = hints.length;
      text = hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note2="' + key + '"]');
      btn = host.querySelector('[data-hint2="' + key + '"]');
    }
    if (!slot || !text) return;
    var shut = !!w2.shut[key];
    slot.innerHTML = shut ? '' : tipHtml(key, text);
    if (!btn) return;
    btn.classList.toggle('on', !shut);
    // The compact buttons beside a balance or a trial balance row are icon-only.
    if (!btn.classList.contains('sm')) {
      btn.innerHTML = ICON.bulb + (shut ? 'Show hint' : (lvl >= max ? 'No more hints' : 'Another hint'));
    }
    btn.disabled = !shut && lvl >= max;
  }

  /* Same rule as module 2.1: closed re-opens, open goes deeper. */
  function bump2(key, max) {
    if (w2.shut[key]) delete w2.shut[key];
    else w2.hint[key] = Math.min((w2.hint[key] || 0) + 1, max);
    paintHint2(key);
    saveWork2();
  }
  function shut2(key) {
    w2.shut[key] = 1;
    paintHint2(key);
    saveWork2();
  }

  /* ---------- module 2.2 worksheet: the problem's own instructions ----------
     a. Journalize the July transactions.
     b. Post to the ledger accounts. (Use T-accounts.)
     c. Prepare a trial balance at July 31.

     All three are the learner's work. The software posts the amounts across
     when a voucher is posted, because that is what posting mechanically is,
     but footing each account and building the trial balance are done by
     hand — those are the deliverables the problem asks for. */

  var INSTRUCTIONS2 = [
    { id: 'a', text: 'Journalize the July transactions.' },
    { id: 'b', text: 'Post to the ledger accounts. (Use T-accounts.)' },
    { id: 'c', text: 'Prepare a trial balance at July 31.' }
  ];

  function accNo(k) { return acct(k).no; }

  function cell2(ji, li, col) { return w2.fx[ji + '.' + li + '.' + col]; }
  function amt2(v) { var n = amountOf(v); return isNaN(n) ? 0 : n; }

  function jline(ji, li) {
    var k = cell2(ji, li, 'k');
    var d = amt2(cell2(ji, li, 'd')), c = amt2(cell2(ji, li, 'c'));
    if (!k) return null;
    if (d && c) return null;                 // an amount is one or the other
    if (!d && !c) return null;
    return { k: k, s: d ? 'D' : 'C', n: d || c };
  }
  function jtotals(ji) {
    var d = 0, c = 0, filled = 0;
    for (var i = 0; i < slots2(ji); i++) {
      d += amt2(cell2(ji, i, 'd'));
      c += amt2(cell2(ji, i, 'c'));
      if (cell2(ji, i, 'k') || amt2(cell2(ji, i, 'd')) || amt2(cell2(ji, i, 'c'))) filled++;
    }
    return { d: d, c: c, off: d - c, filled: filled };
  }
  function canPost(ji) {
    var t = jtotals(ji);
    if (!t.d || t.off !== 0) return false;
    for (var i = 0; i < slots2(ji); i++) if (!jline(ji, i)) return false;
    return true;
  }
  function isPosted(ji) { return !!w2.posted[ji]; }

  function entryRight2(ji) {
    var want = JOURNAL[ji].lines.map(function (l) {
      return l[0] + ':' + (l[1] ? 'D' : 'C') + ':' + (l[1] || l[2]);
    }).sort().join('|');
    var got = [];
    for (var i = 0; i < slots2(ji); i++) {
      var l = jline(ji, i);
      if (!l) return false;
      got.push(l.k + ':' + l.s + ':' + l.n);
    }
    return got.sort().join('|') === want;
  }
  function entryTouched2(ji) { return jtotals(ji).filled > 0; }

  function entryDiag2(ji) {
    var t = jtotals(ji), n = slots2(ji), done = 0;
    for (var i = 0; i < n; i++) if (jline(ji, i)) done++;
    if (!t.filled) return 'Nothing entered yet. This voucher takes ' + n + ' lines.';
    if (done < n) return 'Every line needs an account and one amount, in either the debit or the credit column &mdash; ' + done + ' of ' + n + ' complete.';
    if (t.off !== 0) return 'Out of balance by ' + dollars(Math.abs(t.off)) + '. Debits ' + dollars(t.d) + ', credits ' + dollars(t.c) + '.';
    if (t.d !== jDebits(JOURNAL[ji])) return 'The voucher balances, but the amounts are not the ones on the source document. Read the figures again.';
    var mine = [], theirs = [];
    for (var x = 0; x < n; x++) { var q = jline(ji, x); mine.push(q.k + q.s); }
    JOURNAL[ji].lines.forEach(function (l) { theirs.push(l[0] + (l[1] ? 'D' : 'C')); });
    var sameAccts = mine.map(function (m) { return m.slice(0, -1); }).sort().join() ===
                    theirs.map(function (m) { return m.slice(0, -1); }).sort().join();
    if (sameAccts) return 'The right accounts, but at least one is on the wrong side. Ask which family it belongs to and whether it went up or down.';
    return 'It balances and the amounts are right, so at least one account is wrong. Ask what the business received, and what it gave up or now owes.';
  }

  /* ---------- (b) the ledger the learner's own postings build ----------
     Built from posted vouchers only, so an unposted or wrong voucher shows
     up here rather than being quietly corrected. */
  function myLedger() {
    var t = {};
    ACCT.forEach(function (a) { t[a.k] = { d: 0, c: 0, lines: [] }; });
    JOURNAL.forEach(function (j, ji) {
      if (!isPosted(ji)) return;
      for (var i = 0; i < slots2(ji); i++) {
        var l = jline(ji, i);
        if (!l) continue;
        if (l.s === 'D') t[l.k].d += l.n; else t[l.k].c += l.n;
        t[l.k].lines.push({ ref: jeRef(ji), date: j.date, s: l.s, n: l.n });
      }
    });
    return t;
  }
  function jeRef(ji) { return 'JE-' + String(ji + 1).padStart(2, '0'); }
  function myBal(t, k) {
    var a = acct(k);
    return a.up === 'D' ? t[k].d - t[k].c : t[k].c - t[k].d;
  }
  /* The ledger shows the accounts the learner has actually posted to. */
  function ledgerAccts() {
    var t = myLedger();
    return ACCT.filter(function (a) { return t[a.k].lines.length; }).map(function (a) { return a.k; });
  }
  /* The accounts the finished problem carries a balance in — a fixed target,
     so the count does not move as vouchers are posted. */
  function keyAccts() {
    var key = postedThrough(999);
    return ACCT.filter(function (a) { return balOf(key, a.k); }).map(function (a) { return a.k; });
  }
  function balRight(k) {
    var key = postedThrough(999);
    return amountOf(w2.bal[k]) === balOf(key, k);
  }
  function balTouched(k) { return String(w2.bal[k] === undefined ? '' : w2.bal[k]).trim() !== ''; }

  /* ---------- (c) the trial balance the learner writes ---------- */
  function tbVal(k, col) { return w2.tb[k + '.' + col]; }
  function tbRight(k) {
    var key = postedThrough(999), want = balOf(key, k), a = acct(k);
    var d = amountOf(tbVal(k, 'd')), c = amountOf(tbVal(k, 'c'));
    if (!want) return isNaN(d) && isNaN(c);            // unused accounts stay blank
    if (a.up === 'D') return d === want && isNaN(c);
    return c === want && isNaN(d);
  }
  function tbTouched(k) {
    return String(tbVal(k, 'd') || '').trim() !== '' || String(tbVal(k, 'c') || '').trim() !== '';
  }
  function tbGraded() { return ACCT.filter(function (a) { return balOf(postedThrough(999), a.k); }); }
  function tbTotalRight(col) {
    return amountOf(w2.tbt[col]) === trialTotals(postedThrough(999)).dr;
  }
  function myTbTotals() {
    var d = 0, c = 0;
    ACCT.forEach(function (a) {
      var x = amountOf(tbVal(a.k, 'd')), y = amountOf(tbVal(a.k, 'c'));
      if (!isNaN(x)) d += x;
      if (!isNaN(y)) c += y;
    });
    return { d: d, c: c };
  }

  /* Hints for (b) and (c) are derived rather than written out, so they can
     speak about the learner's own ledger. */
  function balHints(k) {
    var t = myLedger(), a = acct(k);
    return [
      'Add the debit side, add the credit side, and take the difference. The balance sits on the side that is larger.',
      'In your ledger this account has debits of ' + dollars(t[k].d) + ' and credits of ' + dollars(t[k].c) + '.',
      a.up === 'D' ? dollars(t[k].d) + ' less ' + dollars(t[k].c) + '.'
                   : dollars(t[k].c) + ' less ' + dollars(t[k].d) + '.'
    ];
  }
  function tbHints(k) {
    var a = acct(k);
    return [
      'Which column does this account normally sit in?',
      a.fam + ' accounts increase on the ' + (a.up === 'D' ? 'debit' : 'credit') + ' side, so they carry a ' + (a.up === 'D' ? 'debit' : 'credit') + ' balance.',
      'Put its balance in the ' + (a.up === 'D' ? 'debit' : 'credit') + ' column and leave the other blank.'
    ];
  }

  function score2() {
    var a = 0, b = 0, c = 0;
    JOURNAL.forEach(function (j, i) { if (entryRight2(i)) a++; });
    keyAccts().forEach(function (k) { if (balRight(k)) b++; });
    tbGraded().forEach(function (x) { if (tbRight(x.k)) c++; });
    if (tbTotalRight('d')) c++;
    if (tbTotalRight('c')) c++;
    return {
      got: a + b + c,
      total: JOURNAL.length + keyAccts().length + tbGraded().length + 2,
      parts: { a: a, b: b, c: c },
      caps: { a: JOURNAL.length, b: keyAccts().length, c: tbGraded().length + 2 }

  }

  function instrPanel() {
    var sc = score2();

      '<div class="instr-cap">Instructions</div>' +

        var got = sc.parts[x.id], cap = sc.caps[x.id];

  function renderSolve2() {
    var opts = '<option value="">&mdash; select account &mdash;</option>' + ACCT.map(function (a) {
      return '<option value="' + a.k + '">' + a.no + '  ' + a.name + '</option>';
    }).join('');

    var posted = 0;

    /* ---- (a) the general journal, one voucher at a time ---- */
    var cur = Math.max(0, Math.min(JOURNAL.length - 1, w2.at || 0));
    var docs = voucherPager(cur, opts) + voucherHtml(cur, opts);

    /* ---- (b) the ledger: postings arrive, the learner foots each account ---- */
    var led = myLedger();
    var accts = ledgerAccts();
    var ledger = !posted
      ? '<div class="sw-empty">Nothing posted yet. Post a voucher above and its amounts arrive here, on the side the entry put them.</div>'
      : '<div class="tas two">' + accts.map(function (k) {

            '<div class="ta-body">' + side('d') + side('c') + '</div></div>' +
            '<div class="ta-foot">' +
              '<label for="bal-' + k + '">Balance</label>' +
              '<input class="gl-amt" id="bal-' + k + '" data-bal="' + k + '" value="' + (w2.bal[k] === undefined ? '' : w2.bal[k]) + '"' +
                ' inputmode="decimal" autocomplete="off" aria-label="Balance of ' + a.name + '" />' +
              '<button type="button" class="ws-hint sm" data-bhint="' + k + '" aria-label="Hint for ' + a.name + '">' + ICON.bulb + '</button>' +
            '</div>' +
            '<div data-bnote="' + k + '"></div></div>';
        }).join('') + '</div>';

    /* ---- (c) the trial balance the learner writes out ---- */
    var mt = myTbTotals();
    var tbRows = ACCT.map(function (a) {
      return '<div class="tbf-row" data-tbrow="' + a.k + '">' +
        '<span class="tbf-name">' + a.no + ' &nbsp;' + a.name + '</span>' +
        '<input class="gl-amt" data-tb="' + a.k + '.d" value="' + (tbVal(a.k, 'd') || '') + '" inputmode="decimal" autocomplete="off" aria-label="Debit balance of ' + a.name + '" />' +
        '<input class="gl-amt" data-tb="' + a.k + '.c" value="' + (tbVal(a.k, 'c') || '') + '" inputmode="decimal" autocomplete="off" aria-label="Credit balance of ' + a.name + '" />' +
        '<button type="button" class="ws-hint sm" data-thint="' + a.k + '" aria-label="Hint for ' + a.name + '">' + ICON.bulb + '</button>' +
        '</div>';
    }).join('');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="sw-bar">' +
          '<span class="sw-bar-id"><h1>' + CO2.name + '</h1><span>General Journal &middot; Jul 2025</span></span>' +
          '<span class="sw-counts">' +
            '<span class="sw-count"><b>' + (JOURNAL.length - posted) + '</b><u>unposted</u></span>' +
            '<span class="sw-count' + (posted === JOURNAL.length ? ' done' : '') + '"><b>' + posted + '</b><u>posted</u></span>' +
          '</span>' +
        '</div>' +
        instrPanel() +

        '<div class="ws-sect">a &middot; Journalize the transactions<i></i></div>' + docs +

  /* A voucher's state, for the chip strip and the pill. */
  function vState(ji) {
    if (isPosted(ji)) return 'posted';
    var t = jtotals(ji);
    if (!t.filled) return 'draft';
    return (t.off === 0 && t.d) ? 'balanced' : 'off';
  }

  function voucherPager(cur, opts) {
    var chips = JOURNAL.map(function (j, ji) {
      var st = vState(ji);
      var cls = 'vchip' + (ji === cur ? ' now' : '') +
        (st === 'posted' ? ' done' : (st === 'off' ? ' off' : '')) +
        (w2.graded && entryTouched2(ji) && !entryRight2(ji) ? ' bad' : '');
      return '<button type="button" class="' + cls + '" data-vgo="' + ji + '"' +
        ' aria-label="Voucher ' + (ji + 1) + ' of ' + JOURNAL.length + ', ' + st + '"' +
        (ji === cur ? ' aria-current="true"' : '') + '>' +
        (st === 'posted' ? ICON.check : (ji + 1)) + '</button>';
    }).join('');
    return '<div class="pager">' +
        '<button type="button" class="pager-btn" data-vprev' + (cur === 0 ? ' disabled' : '') +
          ' aria-label="Previous voucher">' + ICON.prev + '</button>' +
        '<span class="pager-now"><b>' + jeRef(cur) + '</b>' + (cur + 1) + ' of ' + JOURNAL.length + '</span>' +
        '<button type="button" class="pager-btn" data-vnext' + (cur === JOURNAL.length - 1 ? ' disabled' : '') +
          ' aria-label="Next voucher">' + ICON.next + '</button>' +
      '</div>' +
      '<div class="vchips">' + chips + '</div>';
  }

  function voucherHtml(ji, opts) {
    var j = JOURNAL[ji];
    var t = jtotals(ji), locked = isPosted(ji);

    for (var i = 0; i < slots2(ji); i++) {

      rows += '<div class="gl-row">' +
        '<select class="gl-acct" data-a2="' + ji + '.' + i + '"' + (locked ? ' disabled' : '') +
          ' aria-label="Account for line ' + (i + 1) + ' of voucher ' + (ji + 1) + '">' + opts + '</select>' +
        '<input class="gl-amt' + (cv ? ' muted' : '') + '" data-d2="' + ji + '.' + i + '" value="' + dv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off"' +
          ' aria-label="Debit for line ' + (i + 1) + ' of voucher ' + (ji + 1) + '" />' +
        '<input class="gl-amt' + (dv ? ' muted' : '') + '" data-c2="' + ji + '.' + i + '" value="' + cv + '"' +
          (locked ? ' readonly' : '') + ' inputmode="decimal" autocomplete="off"' +
          ' aria-label="Credit for line ' + (i + 1) + ' of voucher ' + (ji + 1) + '" />' +
        '</div>';
