<title>Ledgerly — Learn accounting by doing it</title>
<style>
/* ============================================================
   Ledgerly design system
   ============================================================ */
:root {
  --bg: #080b10;
  --bg-2: #0c1219;
  --surface: #121a23;
  --surface-2: #18232f;
  --surface-3: #1f2c3a;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #e9f1f8;
  --text-dim: #a8bacb;
  --muted: #7d92a6;

  --brand: #3ddc97;
  --brand-deep: #12b981;
  --brand-soft: rgba(61, 220, 151, 0.14);
  --cyan: #62e0f5;
  --violet: #9d8cff;
  --violet-soft: rgba(157, 140, 255, 0.14);
  --amber: #ffc46b;
  --amber-soft: rgba(255, 196, 107, 0.14);
  --rose: #ff7a85;
  --rose-soft: rgba(255, 122, 133, 0.14);
  --on-brand: #04140d;

  --asset: #62e0f5;
  --liability: #ffc46b;
  --equity: #9d8cff;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  /* Neutral elevation only. Coloured haloes read as decoration, not depth. */
  --shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.75);
  --shadow-lift: 0 14px 34px -16px rgba(0, 0, 0, 0.85);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --bar-h: 76px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="light"] {
  --bg: #f4f7fa;
  --bg-2: #eaeff5;
  --surface: #ffffff;
  --surface-2: #f2f6fa;
  --surface-3: #e6edf4;
  --line: rgba(11, 20, 32, 0.09);
  --line-strong: rgba(11, 20, 32, 0.18);
  --text: #0b1420;
  --text-dim: #3d4d5f;
  --muted: #61748a;

  --brand: #0d9b6c;
  --brand-deep: #067a54;
  --brand-soft: rgba(13, 155, 108, 0.12);
  --cyan: #0d8fb3;
  --violet: #6a55e8;
  --violet-soft: rgba(106, 85, 232, 0.12);
  --amber: #a9720b;
  --amber-soft: rgba(169, 114, 11, 0.14);
  --rose: #d63a52;
  --rose-soft: rgba(214, 58, 82, 0.12);
  --on-brand: #ffffff;

  --asset: #0d8fb3;
  --liability: #a9720b;
  --equity: #6a55e8;
  --shadow: 0 16px 36px -24px rgba(11, 20, 32, 0.5);
  --shadow-lift: 0 22px 50px -26px rgba(11, 20, 32, 0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(70% 45% at 12% -6%, rgba(61, 220, 151, 0.12), transparent 68%),
    radial-gradient(60% 40% at 92% 4%, rgba(157, 140, 255, 0.11), transparent 66%);
}
html[data-theme="light"] body::before {
  background:
    radial-gradient(70% 45% at 12% -6%, rgba(13, 155, 108, 0.09), transparent 68%),
    radial-gradient(60% 40% at 92% 4%, rgba(106, 85, 232, 0.08), transparent 66%);
}

h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--brand); }

/* Keyboard focus must stay visible everywhere. tap-highlight is suppressed
   above for touch, which would otherwise leave keyboard users with nothing. */
:focus-visible {
  outline: 2px solid var(--ring, var(--brand));
  outline-offset: 3px;
  border-radius: 6px;
}
.opt:focus-visible, .sortrow:focus-visible, .seqitem:focus-visible,
.mission:focus-visible, .hero:focus-visible { outline-offset: 2px; }

.app {
  position: relative;
  z-index: 1;
  /* vh first as a fallback for WebViews without dvh support — without a
     resolved height the scroll containers below would collapse. */
  height: 100vh;
  max-height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.wrap {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 0 18px;
}

.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.is-active { display: flex; animation: screen-in 0.34s var(--ease); }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.scroller {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-top: max(14px, env(safe-area-inset-top));
  padding-bottom: 26px;
}
.screen > .scroller:last-child { padding-bottom: calc(26px + env(safe-area-inset-bottom)); }

/* ---------- typography helpers ---------- */
.eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
}
.display { font-size: 30px; line-height: 1.14; font-weight: 760; letter-spacing: -0.028em; }
.title { font-size: 22px; line-height: 1.22; font-weight: 720; letter-spacing: -0.02em; }
.subtitle { font-size: 17px; font-weight: 680; letter-spacing: -0.012em; }
.body { color: var(--text-dim); font-size: 15.5px; line-height: 1.62; }
.small { font-size: 13px; color: var(--muted); line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.pos { color: var(--brand); }
.neg { color: var(--rose); }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 20px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--line);
  transition: transform 0.16s var(--ease), opacity 0.16s, background 0.16s;
}
.btn:active { transform: scale(0.975); }
.btn[disabled] { opacity: 0.42; pointer-events: none; }
.btn-primary {
  background: linear-gradient(180deg, var(--brand), var(--brand-deep));
  color: var(--on-brand);
  border-color: transparent;
  box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.55);
}
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 640; }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; font-size: 14px; padding: 0 14px; border-radius: 11px; }

/* ---------- bottom action bar ---------- */
.actionbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, var(--bg) 34%);
}
.actionbar-inner {
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
.actionbar-inner .btn-primary, .actionbar-inner .grow { flex: 1; }

/* ---------- tab bar ---------- */
.tabbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1;
  max-width: 130px;
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 7px 4px;
  border-radius: 13px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.01em;
  transition: color 0.18s, background 0.18s;
}
.tab svg { width: 21px; height: 21px; }
.tab.is-active { color: var(--brand); background: var(--brand-soft); }

/* ---------- home ---------- */
.home-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0 16px;
}
.brandmark { display: flex; align-items: center; gap: 10px; }
.brand-dot {
  width: 34px; height: 34px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--brand), var(--cyan));
  color: var(--on-brand);
  font-weight: 800;
  font-size: 17px;
  box-shadow: 0 5px 12px -6px rgba(0, 0, 0, 0.5);
}
.brand-name { font-weight: 780; letter-spacing: -0.028em; font-size: 18px; }
.icon-btn {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-dim);
}
.icon-btn svg { width: 18px; height: 18px; }

.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  padding: 20px;
  background: linear-gradient(155deg, color-mix(in srgb, var(--brand) 22%, var(--surface)), var(--surface) 62%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lift);
}
.hero::after {
  content: "";
  position: absolute;
  right: -50px; top: -60px;
  width: 190px; height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(98, 224, 245, 0.3), transparent 68%);
}
.hero-row { display: flex; align-items: center; gap: 14px; position: relative; }

/* One measured line, not three identical metric cards. */
.stat-strip {
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-wrap: wrap;
  margin: 18px 0 4px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat b { font-size: 19px; font-weight: 740; letter-spacing: -0.028em; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 560; }

/* progress ring */
.ring { position: relative; flex: 0 0 auto; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-linecap: round; }
.ring .track { stroke: var(--line-strong); }
.ring .fill { stroke: var(--brand); transition: stroke-dashoffset 0.7s var(--ease); }
.ring-label {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 780;
  font-variant-numeric: tabular-nums;
}

/* mission list */
.path { display: grid; gap: 12px; margin-top: 6px; }
.mission {
  position: relative;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  transition: transform 0.18s var(--ease), border-color 0.18s;
}
.mission:active { transform: scale(0.988); }
.mission.is-done { border-color: color-mix(in srgb, var(--brand) 42%, transparent); }
.mission.is-locked { opacity: 0.5; }
.mission-badge {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 14px;
  display: grid; place-items: center;
  font-weight: 800;
  font-size: 15px;
  background: var(--surface-3);
  color: var(--text-dim);
}
.mission.is-done .mission-badge { background: var(--brand); color: var(--on-brand); }
.mission-badge svg { width: 20px; height: 20px; }
.mission-body { flex: 1; min-width: 0; }
.mission-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  background: var(--surface-3);
  color: var(--text-dim);
}
.chip-brand { background: var(--brand-soft); color: var(--brand); }
.chip-violet { background: var(--violet-soft); color: var(--violet); }
.chip-amber { background: var(--amber-soft); color: var(--amber); }

.minibar { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 11px; }
.minibar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--cyan)); transform-origin: left center; transform: scaleX(0); transition: transform 0.6s var(--ease); }

.step-dots { display: flex; gap: 4px; margin-top: 11px; flex-wrap: wrap; }
.step-dot { width: 100%; max-width: 26px; height: 4px; border-radius: 999px; background: var(--surface-3); flex: 1; }
.step-dot.on { background: var(--brand); }
.step-dot.project { background: var(--violet-soft); }
.step-dot.project.on { background: var(--violet); }

/* ---------- lesson shell ---------- */
.lesson-head {
  position: sticky;
  top: 0;
  z-index: 15;
  padding: max(10px, env(safe-area-inset-top)) 18px 10px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.lesson-head-inner { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.progress-track { flex: 1; height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress-track i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--cyan)); transform-origin: left center; transform: scaleX(0); transition: transform 0.5s var(--ease); }

.lesson-body { padding-top: 22px; }
.lesson-body > * + * { margin-top: 16px; }
.prose p + p { margin-top: 12px; }
.prose strong { color: var(--text); font-weight: 700; }

.divider-label {
  display: flex; align-items: center; gap: 12px;
  margin: 26px 0 4px !important;
  color: var(--brand);
  font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
}
.divider-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }

.keyidea {
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--amber) 34%, transparent);
  background: var(--amber-soft);
  padding: 13px 15px;
  display: flex; gap: 11px;
}
.keyidea svg { flex: 0 0 auto; width: 17px; height: 17px; color: var(--amber); margin-top: 2px; }
.keyidea p { font-size: 14.5px; color: var(--text-dim); line-height: 1.55; }
.keyidea b { color: var(--text); }

/* ---------- diagrams ---------- */
.figure {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
}
.figure-cap { font-size: 11.5px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); margin-bottom: 13px; }

.eqbar { display: grid; gap: 8px; }
.eqbar-row { display: flex; align-items: stretch; gap: 8px; }
.eqbar-seg {
  border-radius: var(--r-sm);
  padding: 11px 12px;
  display: grid;
  gap: 2px;
  align-content: center;
  border: 1px solid;
  min-height: 62px;
}
.eqbar-seg b { font-size: 14.5px; font-weight: 740; letter-spacing: -0.01em; }
.eqbar-seg span { font-size: 11.5px; opacity: 0.82; line-height: 1.35; }
.seg-asset { background: color-mix(in srgb, var(--asset) 15%, transparent); border-color: color-mix(in srgb, var(--asset) 40%, transparent); color: var(--asset); }
.seg-liability { background: color-mix(in srgb, var(--liability) 15%, transparent); border-color: color-mix(in srgb, var(--liability) 40%, transparent); color: var(--liability); }
.seg-equity { background: color-mix(in srgb, var(--equity) 15%, transparent); border-color: color-mix(in srgb, var(--equity) 40%, transparent); color: var(--equity); }
.eq-op { display: grid; place-items: center; font-size: 19px; font-weight: 800; color: var(--muted); padding: 0 2px; }

.flow { display: grid; gap: 8px; }
.flow-node {
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  padding: 12px 14px;
}
.flow-node b { font-size: 14.5px; font-weight: 720; display: block; }
.flow-node span { font-size: 12.5px; color: var(--muted); }
.flow-arrow { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--brand); font-size: 12px; font-weight: 640; line-height: 1; }
.flow-arrow svg { width: 16px; height: 16px; }

.tgrid { display: grid; grid-template-columns: 1fr 1fr; }
.taccount { border: 1px solid var(--line-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.taccount-name { padding: 9px 12px; font-weight: 720; font-size: 14px; text-align: center; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); }
.taccount-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 92px; }
.taccount-col { padding: 9px 10px; display: grid; gap: 5px; align-content: start; }
.taccount-col:first-child { border-right: 1px solid var(--line-strong); }
.taccount-head { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.taccount-val { font-family: var(--mono); font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.taccount-total { border-top: 1px solid var(--line-strong); padding-top: 5px; font-weight: 700; }

.rulegrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.rule {
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
}
.rule b { display: block; font-size: 12.5px; font-weight: 760; margin-bottom: 3px; }
.rule span { font-size: 12px; color: var(--muted); line-height: 1.45; }

.cyclewheel { display: grid; gap: 7px; }
.cyclephase {
  display: flex; gap: 11px; align-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 10px 12px;
}
.cyclephase i {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 9px;
  display: grid; place-items: center; font-style: normal;
  font-size: 12px; font-weight: 800;
  background: var(--brand-soft); color: var(--brand);
}
.cyclephase b { font-size: 13.5px; font-weight: 720; display: block; }
.cyclephase span { font-size: 12px; color: var(--muted); }

/* ============================================================
   Accounting document language
   Ruled paper, source documents, and statements set the way an
   accountant sets them: right-aligned tabular figures, a single
   rule above a subtotal, a double rule under a final total.
   ============================================================ */

/* --- source documents (receipt, invoice, note) --- */
.doc {
  position: relative;
  border-radius: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  padding: 14px 16px 16px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.7;
  font-variant-numeric: tabular-nums;
}
.doc::before {
  content: "";
  position: absolute; inset: 0 0 auto 0; height: 3px;
  border-radius: 4px 4px 0 0;
  background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px);
}
.doc-kind {
  font-family: var(--font);
  font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.doc-issuer { font-weight: 700; color: var(--text); }
.doc-row { display: flex; justify-content: space-between; gap: 14px; }
.doc-row span:last-child { white-space: nowrap; }
.doc-total {
  display: flex; justify-content: space-between; gap: 14px;
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--line-strong);
  font-weight: 700; color: var(--text);
}
.doc-note { font-family: var(--font); font-size: 12px; color: var(--muted); margin-top: 9px; font-style: italic; }

/* --- financial statements in proper form --- */
.stmt {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 16px 14px;
  font-variant-numeric: tabular-nums;
}
.stmt-head { text-align: center; margin-bottom: 14px; }
.stmt-head b { display: block; font-size: 13.5px; font-weight: 780; letter-spacing: 0.02em; }
.stmt-head span { display: block; font-size: 12.5px; color: var(--text-dim); }
.stmt-head i { display: block; font-size: 11.5px; color: var(--muted); font-style: normal; }
.stmt-line { display: flex; align-items: baseline; gap: 10px; font-size: 13px; padding: 2px 0; }
.stmt-line .lbl { flex: 1; min-width: 0; }
.stmt-line .amt { font-family: var(--mono); text-align: right; white-space: nowrap; min-width: 74px; }
.stmt-line.indent .lbl { padding-left: 16px; }
.stmt-line.head-line { font-weight: 700; }
.stmt-line.total { font-weight: 700; }
.stmt-line.total .amt { border-top: 1px solid var(--line-strong); padding-top: 3px; }
.stmt-line.grand .amt {
  border-top: 1px solid var(--line-strong);
  border-bottom: 3px double var(--line-strong);
  padding: 3px 0;
  font-weight: 780;
}
.stmt-gap { height: 9px; }
.stmt-tie {
  margin-top: 12px; padding: 9px 11px;
  border-radius: var(--r-sm);
  background: var(--brand-soft);

/* Column balances after the first `upto` rows have been posted. */
function speedyBalances(upto) {
  var bal = {};
  EQ_ACCOUNTS.forEach(function (a) { bal[a.k] = 0; });
  SPEEDY.rows.slice(0, upto).forEach(function (r) {
    r.fx.forEach(function (e) { bal[e[0]] += e[1] * e[2]; });
  });
  return bal;
}
function assetsOf(b) { return b.cash + b.ar + b.equip; }
function claimsOf(b) { return b.np + b.ap + b.cs + b.rev - b.exp - b.div; }

/* The running summary, rebuilt after each transaction the learner posts.
   The newest row is tinted so the learner sees what their work just added. */
function sofarTable(upto, caption) {
  var bal = speedyBalances(upto);
  var groups = '<tr><th class="rowlabel"></th>' +
    '<th class="group c-asset" colspan="3">Assets</th>' +
    '<th class="group c-liability sep" colspan="2">Liabilities</th>' +

  var heads = '<tr><th class="rowlabel">Txn</th>' + EQ_ACCOUNTS.map(function (a) {
    var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
    var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
    return '<th class="' + cls + sep + '">' + a.abbr + '</th>';
  }).join('') + '</tr>';

  var body = SPEEDY.rows.slice(0, upto).map(function (r, ri) {
    var line = {};
    r.fx.forEach(function (e) { line[e[0]] = (line[e[0]] || 0) + e[1] * e[2]; });
    var isNew = ri === upto - 1 ? ' newrow' : '';
    var cells = EQ_ACCOUNTS.map(function (a) {
      var v = line[a.k];
      var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
      if (!v) return '<td class="zero' + sep + isNew + '">&middot;</td>';
      var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
      return '<td class="' + cls + sep + isNew + '">' + (v < 0 ? '&minus;' : '+') + Math.abs(v).toLocaleString('en-US') + '</td>';
    }).join('');
    return '<tr><td class="rowlabel' + isNew + '">(' + r.no + ')</td>' + cells + '</tr>';
  }).join('');

  var foot = '<tr><td class="rowlabel">Total</td>' + EQ_ACCOUNTS.map(function (a) {
    var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
    var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
    return '<td class="' + cls + sep + '">' + (bal[a.k] ? Math.abs(bal[a.k]).toLocaleString('en-US') : '&mdash;') + '</td>';
  }).join('') + '</tr>';

  var A = assetsOf(bal), C = claimsOf(bal);
  return '<div class="sofar"><div class="sofar-cap"><span>' + (caption || 'Speedy&rsquo;s summary so far') + '</span>' +
    '<span>' + upto + ' of ' + SPEEDY.rows.length + ' posted</span></div>' +
    '<div class="wp-scroll"><table class="wp-table"><thead>' + groups + heads + '</thead>' +
    '<tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
    '<div class="balance-line ' + (A === C ? 'ok' : 'off') + '">$' + A.toLocaleString('en-US') +
    '&nbsp; = &nbsp;$' + C.toLocaleString('en-US') + ' <span class="bal-ok">' + SVG.check + '</span></div></div>';
}

    (note ? '<div class="doc-note">' + note + '</div>' : '') + '</div>';
}

/* A financial statement in proper form: centred three-line heading,

function stmtFig(name, dateline, lines, tie) {
  return '<div class="stmt">' +
    '<div class="stmt-head"><b>' + SPEEDY.company + '</b><span>' + name + '</span><i>' + dateline + '</i></div>' +

}

          what: 'The <strong>retained earnings statement</strong> starts with the opening balance, adds net income, and subtracts any dividends declared.',
          why: 'It is the bridge between the income statement and the balance sheet. Without it, the profit figure would have no path into equity and the balance sheet would not balance.',
          how: [
            'Start with retained earnings at the beginning of the period. Speedy began at $0 on July 1.',
            'Add net income taken from the income statement.',
            'Subtract dividends declared. Speedy declared none.',
            'The result is retained earnings at the end of the period.'
          ],
          figure: stmtFig('Retained Earnings Statement', SPEEDY.period, [
            ['Retained earnings, July 1', '$0', ''],
            ['Add: Net income', '1,800', ''],
            ['', '1,800', 'total'],
            ['Less: Dividends', '0', ''],
            ['Retained earnings, July 31', '$1,800', 'grand']
          ], 'The $1,800 ending balance is what appears inside equity on the balance sheet.'),
          keyidea: 'A newly incorporated business always starts at $0 retained earnings. It has not had a period yet in which to earn anything.',
          task: {
            type: 'numeric',
            prompt: 'Build Speedy&rsquo;s retained earnings statement.',
            sub: 'Three lines and a total.',
            fields: [
              { label: 'Retained earnings, July 1', answer: 0, why: 'Speedy was incorporated on July 1, so it had earned nothing before that date.' },
              { label: 'Add: net income', answer: 1800, why: 'Taken straight from the income statement.' },
              { label: 'Less: dividends', answer: 0, why: 'Speedy declared no dividends in July, which is why that workpaper column stayed empty.' },
              { label: 'Retained earnings, July 31', answer: 1800, why: '$0 + $1,800 &minus; $0.' }
            ],
            hint: 'One of these four is not $1,800 and not a trick. Speedy is one month old.',
            explain: 'Retained earnings of $1,800. Every dollar Speedy earned in July it also kept, because it paid nothing out to its owners.'
          }
        },

        /* ---- T14 ---- */
        {
          id: 't14',
          title: 'The balance sheet',
          applies: 'Speedy at July 31',
          lead: 'The last statement is the accounting equation itself, published.',
          what: 'The <strong>balance sheet</strong> reports assets, liabilities and equity at a single moment in time.',
          why: 'It is the equation from the very first topic, formatted for a reader. If the two sides disagree, the books are wrong. It is dated &ldquo;as at&rdquo; a single day because every balance changes the moment the next transaction happens.',
          how: [
            'List the assets and total them.',
            'List the liabilities and total them.',
            'List equity: common stock plus the ending retained earnings from the previous statement.',
            'Confirm total assets equal total liabilities plus equity.'
          ],
          figure: stmtFig('Balance Sheet', SPEEDY.asAt, [
            ['Assets', '', 'head-line'],
            ['Cash', '$10,500', 'indent'],
            ['Accounts receivable', '2,000', 'indent'],
            ['Equipment', '3,000', 'indent'],
            ['Total assets', '$15,500', 'grand'],
            'gap',
            ['Liabilities and Stockholders&rsquo; Equity', '', 'head-line'],
            ['Notes payable', '$700', 'indent'],
            ['Accounts payable', '3,000', 'indent'],
            ['Total liabilities', '3,700', 'total'],
            'gap',
            ['Common stock', '10,000', 'indent'],
            ['Retained earnings', '1,800', 'indent'],
            ['Total stockholders&rsquo; equity', '11,800', 'total'],
            'gap',
            ['Total liabilities and equity', '$15,500', 'grand']
          ], '<b>$15,500 = $15,500.</b> The equation you started with, proved on a published statement.'),
          task: {
            type: 'numeric',
            prompt: 'Build Speedy&rsquo;s balance sheet and prove it.',
            sub: 'Equity comes from two places now: what the owners put in, and what the business kept.',
            fields: [
              { label: 'Total assets', answer: 15500, why: '$10,500 + $2,000 + $3,000.' },
              { label: 'Total liabilities', answer: 3700, why: '$700 note + $3,000 payable.' },
              { label: 'Common stock', answer: 10000, why: 'Contributed capital from transaction 1, unchanged all month.' },
              { label: 'Retained earnings', answer: 1800, why: 'The ending balance from the retained earnings statement.' },
              { label: 'Total liabilities and equity', answer: 15500, why: '$3,700 + $10,000 + $1,800.' }
            ],
            hint: 'Equity is not one figure here. Add the contributed capital to the earned capital.',
            explain: 'Both sides come to $15,500. You started with an equation, took a month of transactions apart one topic at a time, and finished with a proved set of statements.'
          }
        }
      ]
    }
  ]
};
</script>
<script>
/* ============================================================
   EXERCISE ENGINE
   Every renderer owns four jobs: draw itself, collect an answer,
   grade it, and explain what went wrong specifically.
   ============================================================ */

function fmt(n) { return Math.abs(n).toLocaleString('en-US'); }
function money(n) { return '$' + fmt(n); }
function signed(n) { return (n < 0 ? '−' : '') + fmt(n); }
function hashCode(s) { var h = 0, i; for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h) || 7; }
function seededShuffle(arr, seed) {
  var a = arr.slice(), r = seed, i, j, t;
  function rnd() { r = (r * 1103515245 + 12345) & 0x7fffffff; return r / 0x7fffffff; }
  for (i = a.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function parseAmount(v) {
  if (v === null || v === undefined) return NaN;
  var clean = String(v).replace(/[$,\s]/g, '').replace(/^\((.*)\)$/, '-$1');
  if (clean === '') return NaN;
  var n = Number(clean);
  return isFinite(n) ? n : NaN;
}
function acctByKey(k) {
  for (var i = 0; i < EQ_ACCOUNTS.length; i++) { if (EQ_ACCOUNTS[i].k === k) return EQ_ACCOUNTS[i]; }
  return null;
}
function eqSideOf(key) {
  var a = acctByKey(key);
  return a ? (a.g === 'asset' ? 'left' : 'right') : 'right';
}
/* Signed contribution of one effect to its side of the equation. */
function eqWeight(key, dir, amt) {
  var contra = (key === 'exp' || key === 'div') ? -1 : 1;
  return dir * amt * contra;
}

var RENDER = {};

/* ---------------- multiple choice ---------------- */
RENDER.choice = {
  init: function (task, stepId) {
    var idx = task.options.map(function (o, i) { return i; });
    return { picked: [], order: seededShuffle(idx, hashCode(stepId)) };
  },
  html: function (task, s) {
    return '<div class="opts">' + s.order.map(function (oi, pos) {
      var o = task.options[oi];
      return '<button type="button" class="opt" data-opt="' + oi + '">' +
        '<span class="opt-mark' + (task.multi ? '' : ' is-radio') + '">' + (task.multi ? SVG.check : '') + '</span>' +
        '<span class="opt-body">' + o.t + '</span></button>';
    }).join('') + '</div>' +
    (task.multi ? '<p class="small" style="margin-top:10px">Select all that apply.</p>' : '');
  },
  bind: function (root, task, s, ctx) {
    root.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-opt]');
      if (!btn) return;
      var i = Number(btn.getAttribute('data-opt'));
      if (task.multi) {
        var at = s.picked.indexOf(i);
        if (at === -1) s.picked.push(i); else s.picked.splice(at, 1);
      } else {
        s.picked = [i];
      }
      RENDER.choice.repaint(root, task, s);
      ctx.dirty();
    });
    RENDER.choice.repaint(root, task, s);
  },
  repaint: function (root, task, s) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-opt]'), function (btn) {
      var i = Number(btn.getAttribute('data-opt'));
      btn.classList.remove('is-right', 'is-wrong');
      btn.classList.toggle('is-picked', s.picked.indexOf(i) !== -1);
      var why = btn.querySelector('.opt-why');
      if (why) why.remove();
    });
  },
  ready: function (task, s) { return s.picked.length > 0; },
  check: function (task, s) {
    var correctIdx = [];
    task.options.forEach(function (o, i) { if (o.ok) correctIdx.push(i); });
    var missed = correctIdx.filter(function (i) { return s.picked.indexOf(i) === -1; });
    var wrong = s.picked.filter(function (i) { return !task.options[i].ok; });
    var ok = missed.length === 0 && wrong.length === 0;
    if (ok) return { ok: true };
    if (!task.multi) return { ok: false, body: 'Not quite. Read the note under the option you picked, then try another.' };
    var bits = [];
    if (wrong.length) bits.push(wrong.length + (wrong.length === 1 ? ' account does not belong' : ' accounts do not belong'));
    if (missed.length) bits.push(missed.length + ' still missing');
    return { ok: false, body: 'Close. ' + bits.join(', ') + '.' };
  },
  paint: function (root, task, s, result) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-opt]'), function (btn) {
      var i = Number(btn.getAttribute('data-opt'));
      var o = task.options[i];
      var picked = s.picked.indexOf(i) !== -1;
      btn.classList.remove('is-picked');
      if (o.ok && (picked || result.ok)) btn.classList.add('is-right');
      if (!o.ok && picked) btn.classList.add('is-wrong');
      if (picked && o.why && !btn.querySelector('.opt-why')) {
        btn.querySelector('.opt-body').insertAdjacentHTML('beforeend', '<span class="opt-why">' + o.why + '</span>');
      }
    });
  }
};

/* ---------------- classify / sort ---------------- */
RENDER.sort = {
  init: function (task, stepId) {
    var idx = task.items.map(function (o, i) { return i; });
    return { pick: {}, order: seededShuffle(idx, hashCode(stepId + 's')) };
  },
  html: function (task, s) {
    return s.order.map(function (ii) {
      var item = task.items[ii];
      return '<div class="sortrow" data-row="' + ii + '">' +
        '<div class="sortrow-label">' + item.t + '</div>' +
        '<div class="segmented">' + task.buckets.map(function (b) {
          return '<button type="button" class="seg-btn" data-row="' + ii + '" data-bucket="' + b.k + '">' + b.label + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  },
  bind: function (root, task, s, ctx) {
    root.addEventListener('click', function (e) {
      var btn = e.target.closest('.seg-btn');
      if (!btn) return;
      s.pick[btn.getAttribute('data-row')] = btn.getAttribute('data-bucket');
      RENDER.sort.repaint(root, task, s);
      ctx.dirty();
    });
    RENDER.sort.repaint(root, task, s);
  },
  repaint: function (root, task, s) {
    Array.prototype.forEach.call(root.querySelectorAll('.sortrow'), function (row) {
      row.classList.remove('is-right', 'is-wrong');
      var note = row.querySelector('.sortrow-note');
      if (note) note.remove();
    });
    Array.prototype.forEach.call(root.querySelectorAll('.seg-btn'), function (btn) {
      btn.classList.toggle('on', s.pick[btn.getAttribute('data-row')] === btn.getAttribute('data-bucket'));
    });
  },
  ready: function (task, s) {
    return task.items.every(function (item, i) { return !!s.pick[i]; });
  },
  check: function (task, s) {
    var wrong = task.items.filter(function (item, i) { return s.pick[i] !== item.k; });
    if (!wrong.length) return { ok: true };
    var n = wrong.length;
    return {
      ok: false,
      body: n + ' of ' + task.items.length + (n === 1 ? ' is' : ' are') + ' in the wrong place. The rows outlined in red are the ones to rethink.'
    };
  },
  paint: function (root, task, s) {
    Array.prototype.forEach.call(root.querySelectorAll('.sortrow'), function (row) {
      var i = Number(row.getAttribute('data-row'));
      var item = task.items[i];
      var right = s.pick[i] === item.k;
      row.classList.add(right ? 'is-right' : 'is-wrong');
      if (item.why && !row.querySelector('.sortrow-note')) {
        row.insertAdjacentHTML('beforeend', '<div class="sortrow-note">' + item.why + '</div>');
      }
    });
  }
};

/* ---------------- numeric fields ---------------- */
RENDER.numeric = {
  init: function () { return { vals: {} }; },
  html: function (task, s) {
    return '<div style="display:grid;gap:12px">' + task.fields.map(function (f, i) {
      return '<div class="field" data-field="' + i + '">' +
        '<label for="nf' + i + '">' + f.label + '</label>' +
        '<div class="amount-wrap" style="flex:1">' +
        '<input class="input num-input" id="nf' + i + '" data-field-input="' + i + '" inputmode="decimal" autocomplete="off" placeholder="0" />' +
        '</div></div>';
    }).join('') + '</div>';
  },
  bind: function (root, task, s, ctx) {
    root.addEventListener('input', function (e) {
      var el = e.target.closest('[data-field-input]');
      if (!el) return;
      s.vals[el.getAttribute('data-field-input')] = el.value;
      el.classList.remove('is-right', 'is-wrong');
      var note = el.closest('.field').querySelector('.sortrow-note');
      if (note) note.remove();
      ctx.dirty();
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-field-input]'), function (el) {
      var v = s.vals[el.getAttribute('data-field-input')];
      if (v !== undefined) el.value = v;
    });
  },
  ready: function (task, s) {
    return task.fields.every(function (f, i) { return !isNaN(parseAmount(s.vals[i])); });
  },
  check: function (task, s) {
    var wrong = task.fields.filter(function (f, i) { return parseAmount(s.vals[i]) !== f.answer; });
    if (!wrong.length) return { ok: true };
    return {
      ok: false,
      body: wrong.length === 1
        ? 'One figure is off. Check the line highlighted in red.'
        : wrong.length + ' of the ' + task.fields.length + ' figures are off. Each one feeds the next, so start at the top.'
    };
  },
  paint: function (root, task, s) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-field-input]'), function (el) {
      var i = Number(el.getAttribute('data-field-input'));
      var f = task.fields[i];
      var right = parseAmount(s.vals[i]) === f.answer;
      el.classList.add(right ? 'is-right' : 'is-wrong');
      if (!right && f.why && !el.closest('.field').querySelector('.sortrow-note')) {
        el.closest('.field').insertAdjacentHTML('beforeend', '<div class="sortrow-note">' + f.why + '</div>');
      }
    });
  }
};


/* ---------------- transaction analysis + workpaper ---------------- */
RENDER.equation = {
  init: function (task) {
    return {
      rows: task.txns.map(function (t) {
        return t.effects.map(function () { return { acct: '', dir: 0, amt: '' }; });
      })
    };
  },
  html: function (task, s) {
    var opts = '<option value="">Choose an account</option>' + EQ_ACCOUNTS.map(function (a) {
      return '<option value="' + a.k + '">' + a.n + '</option>';
    }).join('');
    var body = task.txns.map(function (t, ti) {
      var effects = t.effects.map(function (e, ei) {
        return '<div class="effect"><div class="effect-line">' +
          '<select class="select" data-acct="' + ti + '.' + ei + '" aria-label="Account for effect ' + (ei + 1) + '">' + opts + '</select>' +
          '</div><div class="effect-line">' +
          '<div class="dirtoggle">' +
            '<button type="button" data-dir="' + ti + '.' + ei + '.1" aria-label="Increase">+</button>' +
            '<button type="button" data-dir="' + ti + '.' + ei + '.-1" aria-label="Decrease">−</button>' +
          '</div>' +
          '<div class="amount-wrap" style="flex:1">' +
          '<input class="input num-input" data-amt="' + ti + '.' + ei + '" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount for effect ' + (ei + 1) + '" />' +
          '</div></div></div>';
      }).join('');
      return '<div class="txn" data-txn="' + ti + '">' +
        '<div class="txn-head"><span class="txn-no">' + (ti + 1) + '</span><span class="txn-text">' + t.text + '</span></div>' +
        '<div class="effects">' + effects + '</div></div>';
    }).join('');
    return body + (task.mode === 'workpaper' ? RENDER.equation.wpShell(task) : RENDER.equation.miniShell());
  },
  miniShell: function () {
    return '<div class="workpaper" data-mini><div class="balance-line" data-balance>Assets — = — Liabilities + Equity</div></div>';
  },
  wpShell: function (task) {
    var groups = '<tr><th class="rowlabel"></th>' +
      '<th class="group c-asset" colspan="3">Assets</th>' +
      '<th class="group c-liability sep" colspan="2">Liabilities</th>' +
      '<th class="group c-equity sep" colspan="4">Stockholders&rsquo; Equity</th></tr>';
    var heads = '<tr><th class="rowlabel">Txn</th>' + EQ_ACCOUNTS.map(function (a, i) {
      var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
      var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
      return '<th class="' + cls + sep + '">' + a.abbr + '</th>';
    }).join('') + '</tr>';
    return '<div class="workpaper">' +
      '<div class="wp-scroll"><table class="wp-table"><thead>' + groups + heads + '</thead>' +
      '<tbody data-wp-body></tbody>' +
      '<tfoot data-wp-foot></tfoot></table></div>' +
      '<div class="balance-line" data-balance></div></div>';
  },
  bind: function (root, task, s, ctx) {
    function touched(ti) {
      var el = root.querySelector('[data-txn="' + ti + '"]');
      if (el) { el.classList.remove('is-right', 'is-wrong'); var n = el.querySelector('.txn-note'); if (n) n.remove(); }
    }
    root.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-acct]');
      if (!sel) return;
      var p = sel.getAttribute('data-acct').split('.');
      s.rows[p[0]][p[1]].acct = sel.value;
      touched(p[0]);
      RENDER.equation.update(root, task, s);
      ctx.dirty();
    });
    root.addEventListener('input', function (e) {
      var inp = e.target.closest('[data-amt]');
      if (!inp) return;
      var p = inp.getAttribute('data-amt').split('.');
      s.rows[p[0]][p[1]].amt = inp.value;
      touched(p[0]);
      RENDER.equation.update(root, task, s);
      ctx.dirty();
    });
    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-dir]');
      if (!b) return;
      var p = b.getAttribute('data-dir').split('.');
      var d = Number(p[2]);
      s.rows[p[0]][p[1]].dir = s.rows[p[0]][p[1]].dir === d ? 0 : d;
      touched(p[0]);
      RENDER.equation.update(root, task, s);
      ctx.dirty();
    });
    RENDER.equation.update(root, task, s);
  },
  balances: function (task, s) {
    var bal = {};
    EQ_ACCOUNTS.forEach(function (a) { bal[a.k] = (task.opening && task.opening[a.k]) || 0; });
    var rows = [];
    s.rows.forEach(function (effects) {
      var line = {};
      effects.forEach(function (e) {
        var amt = parseAmount(e.amt);
        if (!e.acct || !e.dir || isNaN(amt)) return;
        line[e.acct] = (line[e.acct] || 0) + e.dir * amt;
        bal[e.acct] += e.dir * amt;
      });
      rows.push({ line: line, snapshot: null });
    });
    return { bal: bal, rows: rows };
  },
  update: function (root, task, s) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-dir]'), function (b) {
      var p = b.getAttribute('data-dir').split('.');
      var d = Number(p[2]);
      var on = s.rows[p[0]][p[1]].dir === d;
      b.classList.toggle(d > 0 ? 'on-up' : 'on-down', on);
    });
    var res = RENDER.equation.balances(task, s);
    var bal = res.bal;
    var assets = bal.cash + bal.ar + bal.equip;
    var claims = bal.np + bal.ap + bal.cs + bal.rev - bal.exp - bal.div;
    var line = root.querySelector('[data-balance]');
    var body = root.querySelector('[data-wp-body]');
    var foot = root.querySelector('[data-wp-foot]');

    if (body) {
      body.innerHTML = res.rows.map(function (r, ri) {
        var cells = EQ_ACCOUNTS.map(function (a) {
          var v = r.line[a.k];
          var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
          if (!v) return '<td class="zero' + sep + '">&middot;</td>';
          var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
          return '<td class="' + cls + sep + '">' + (v < 0 ? '−' : '+') + fmt(v) + '</td>';
        }).join('');
        return '<tr><td class="rowlabel">(' + (ri + 1) + ')</td>' + cells + '</tr>';
      }).join('');
      foot.innerHTML = '<tr><td class="rowlabel">Total</td>' + EQ_ACCOUNTS.map(function (a) {
        var sep = (a.k === 'np' || a.k === 'cs') ? ' sep' : '';
        var cls = 'c-' + (a.g === 'asset' ? 'asset' : a.g === 'liability' ? 'liability' : 'equity');
        return '<td class="' + cls + sep + '">' + (bal[a.k] ? fmt(bal[a.k]) : '&mdash;') + '</td>';
      }).join('') + '</tr>';
    }

    if (line) {
      var even = assets === claims;
      var any = assets !== 0 || claims !== 0;
      line.className = 'balance-line' + (any ? (even ? ' ok' : ' off') : '');
      line.innerHTML = money(assets) + '&nbsp; = &nbsp;' + money(claims) +
        (any ? (even ? ' <span class="bal-ok">' + SVG.check + '</span>' : ' <span class="bal-off">out by ' + money(Math.abs(assets - claims)) + '</span>') : '');
    }
  },
  ready: function (task, s) {
    return s.rows.every(function (effects) {
      return effects.every(function (e) { return e.acct && e.dir && !isNaN(parseAmount(e.amt)); });
    });
  },
  keyOf: function (e) { return e.acct + ':' + (e.dir > 0 ? '+' : '-') + ':' + parseAmount(e.amt); },
  txnCorrect: function (task, s, ti) {
    var want = task.txns[ti].effects.map(function (e) { return e.acct + ':' + (e.dir > 0 ? '+' : '-') + ':' + e.amt; }).sort();
    var got = s.rows[ti].map(RENDER.equation.keyOf).sort();
    return want.join('|') === got.join('|');
  },
  diagnose: function (task, s, ti) {
    var left = 0, right = 0;
    s.rows[ti].forEach(function (e) {
      var amt = parseAmount(e.amt);
      if (!e.acct || !e.dir || isNaN(amt)) return;
      if (eqSideOf(e.acct) === 'left') left += e.dir * amt;
      else right += eqWeight(e.acct, e.dir, amt);
    });
    if (left !== right) return 'This entry leaves the equation out by ' + money(Math.abs(left - right)) + '. Both sides have to move together.';
    var wantAmts = task.txns[ti].effects.map(function (e) { return e.amt; }).sort().join(',');
    var gotAmts = s.rows[ti].map(function (e) { return parseAmount(e.amt); }).sort().join(',');
    if (wantAmts !== gotAmts) return 'Your amounts do not match the transaction. Re-read the figures given.';
    return 'It balances, but at least one account is wrong. Ask what the company actually received or gave up.';
  },
  check: function (task, s) {
    var bad = [];
    task.txns.forEach(function (t, ti) { if (!RENDER.equation.txnCorrect(task, s, ti)) bad.push(ti + 1); });
    if (!bad.length) return { ok: true };
    return {
      ok: false,
      body: bad.length === 1
        ? 'Transaction ' + bad[0] + ' is not right yet. Read the note under it.'
        : bad.length + ' transactions need another look: ' + bad.join(', ') + '.'
    };
  },
  paint: function (root, task, s) {
    task.txns.forEach(function (t, ti) {
      var el = root.querySelector('[data-txn="' + ti + '"]');
      if (!el) return;
      var right = RENDER.equation.txnCorrect(task, s, ti);
      el.classList.add(right ? 'is-right' : 'is-wrong');
      if (el.querySelector('.txn-note')) return;
      var msg = right ? (t.note || '') : RENDER.equation.diagnose(task, s, ti);
      if (msg) el.insertAdjacentHTML('beforeend', '<div class="txn-note">' + msg + '</div>');
    });
  }
};

/* ---------------- guided walkthrough ----------------
   One transaction, opened up. Each sub-step asks a single decision,
   explains the logic the moment it is answered, then unlocks the next.
   The last one posts the row into Speedy's running summary.        */
RENDER.walkthrough = {
  init: function (task) {
    return { at: 0, picks: {}, wrong: {}, done: false };
  },
  html: function (task, s) {
    return '<div class="wt-source">' + (task.doc || '') + '</div>' +
      '<div class="wt-steps">' + task.steps.map(function (st, i) {
        return '<div class="wt-step' + (i === 0 ? '' : ' is-locked') + '" data-wt="' + i + '">' +
          '<div class="wt-head"><span class="wt-no">' + (i + 1) + '</span>' +
          '<span class="wt-ask">' + st.ask + '</span></div>' +
          '<div class="wt-body">' + RENDER.walkthrough.stepBody(st, i) + '</div>' +
          '</div>';
      }).join('') + '</div>' +
      '<div data-wt-post></div>';
  },
  stepBody: function (st, i) {
    if (st.kind === 'num') {
      return '<div class="field-row"><div class="amount-wrap" style="flex:1">' +
        '<input class="input num-input" data-wt-num="' + i + '" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="' + st.ask.replace(/<[^>]+>/g, '') + '" />' +
        '</div><button type="button" class="btn btn-sm btn-ghost" data-wt-ok="' + i + '">Check</button></div>';
    }
    return '<div class="wt-opts">' + st.options.map(function (o, oi) {
      return '<button type="button" class="wt-opt" data-wt-opt="' + i + '.' + oi + '">' + o + '</button>';
    }).join('') + '</div>' +
    (st.kind === 'picks' ? '<p class="small" style="margin-top:9px">Pick every account this transaction touches, then confirm.</p><button type="button" class="btn btn-sm btn-ghost" style="margin-top:9px" data-wt-ok="' + i + '">Confirm selection</button>' : '');
  },
  bind: function (root, task, s, ctx) {
    function judge(i) {
      var st = task.steps[i];
      var el = root.querySelector('[data-wt="' + i + '"]');
      var got = s.picks[i];
      var ok;
      if (st.kind === 'num') ok = parseAmount(got) === st.answer;
      else if (st.kind === 'picks') {
        var a = (got || []).slice().sort().join(',');
        ok = a === st.answer.slice().sort().join(',');
      } else ok = got === st.answer;

      var old = el.querySelector('.wt-why');
      if (old) old.remove();

      if (!ok) {
        s.wrong[i] = true;
        el.insertAdjacentHTML('beforeend', '<div class="wt-why miss">' + (st.miss || 'Not quite. Try again.') + '</div>');
        RENDER.walkthrough.paintOpts(root, task, s, i, false);
        ctx.dirty();
        return;
      }
      el.classList.add('is-done');
      el.querySelector('.wt-no').innerHTML = SVG.check;
      RENDER.walkthrough.paintOpts(root, task, s, i, true);
      el.insertAdjacentHTML('beforeend', '<div class="wt-why"><b>Why.</b> ' + st.because + '</div>');
      var btn = el.querySelector('[data-wt-ok]');
      if (btn) btn.remove();

      if (i + 1 < task.steps.length) {
        s.at = i + 1;
        var next = root.querySelector('[data-wt="' + (i + 1) + '"]');
        next.classList.remove('is-locked');
        next.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        s.done = true;
        if (task.post) {
          root.querySelector('[data-wt-post]').innerHTML =
            '<div class="wt-post"><b>Posted.</b> ' + task.post + '</div>' +
            (task.summary || '');
        }
      }
      ctx.dirty();
    }

    root.addEventListener('click', function (e) {
      var opt = e.target.closest('[data-wt-opt]');
      if (opt) {
        var p = opt.getAttribute('data-wt-opt').split('.');
        var i = Number(p[0]), oi = Number(p[1]);
        if (i !== s.at || s.picks[i] === undefined || task.steps[i].kind !== 'picks') { /* fallthrough */ }
        if (task.steps[i].kind === 'picks') {
          var cur = s.picks[i] || [];
          var at = cur.indexOf(oi);
          if (at === -1) cur.push(oi); else cur.splice(at, 1);
          s.picks[i] = cur;
          RENDER.walkthrough.paintOpts(root, task, s, i, null);
        } else {
          s.picks[i] = oi;
          RENDER.walkthrough.paintOpts(root, task, s, i, null);
          judge(i);
        }
        return;
      }
      var ok = e.target.closest('[data-wt-ok]');
      if (ok) judge(Number(ok.getAttribute('data-wt-ok')));
    });

    root.addEventListener('input', function (e) {
      var n = e.target.closest('[data-wt-num]');
      if (!n) return;
      s.picks[n.getAttribute('data-wt-num')] = n.value;
    });
    root.addEventListener('keydown', function (e) {
      var n = e.target.closest('[data-wt-num]');
      if (n && e.key === 'Enter') { e.preventDefault(); judge(Number(n.getAttribute('data-wt-num'))); }
    });
  },
  paintOpts: function (root, task, s, i, verdict) {
    var st = task.steps[i];
    Array.prototype.forEach.call(root.querySelectorAll('[data-wt-opt^="' + i + '."]'), function (b) {
      var oi = Number(b.getAttribute('data-wt-opt').split('.')[1]);
      b.classList.remove('picked', 'right', 'wrong');
      var picked = st.kind === 'picks' ? (s.picks[i] || []).indexOf(oi) !== -1 : s.picks[i] === oi;
      if (verdict === null) { if (picked) b.classList.add('picked'); return; }
      if (verdict) {
        var isAnswer = st.kind === 'picks' ? st.answer.indexOf(oi) !== -1 : st.answer === oi;
        if (isAnswer) b.classList.add('right');
      } else if (picked) b.classList.add('wrong');
    });
  },
  ready: function (task, s) { return s.done; },
  check: function () { return { ok: true }; },
  paint: function () {}
};

</script>
<script>
/* ============================================================
   APP SHELL — progress, navigation, screens
   ============================================================ */
(function () {
  var STORE = 'ledgerly.v1';
  var XP_LESSON = 20, XP_PROJECT = 55, XP_FIRSTTRY = 10;

  var progress = { done: {}, attempts: {}, xp: 0, streak: 0, lastDay: '', theme: '' };

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function yesterday() {
    var d = new Date(Date.now() - 86400000);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(STORE);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          progress.done = p.done || {};
          progress.attempts = p.attempts || {};
          progress.xp = p.xp || 0;
          progress.streak = p.streak || 0;
          progress.lastDay = p.lastDay || '';
          progress.theme = p.theme || '';
        }
      }
    } catch (e) { /* private mode — run without persistence */ }
  }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
  }
  function touchStreak() {
    var t = today();
    if (progress.lastDay === t) return;
    progress.streak = progress.lastDay === yesterday() ? progress.streak + 1 : 1;
    progress.lastDay = t;
    save();
  }

  /* ---------- progress helpers ---------- */
  function key(m, st) { return m.id + '/' + st.id; }
  function isDone(m, st) { return !!progress.done[key(m, st)]; }
  function missionDone(m) { return m.steps.filter(function (s) { return isDone(m, s); }).length; }
  function missionComplete(m) { return missionDone(m) === m.steps.length; }
  function missionUnlocked(mi) {
    if (mi === 0) return true;
    return missionComplete(COURSE.missions[mi - 1]);
  }
  function totalSteps() {
    return COURSE.missions.reduce(function (n, m) { return n + m.steps.length; }, 0);
  }
  function totalDone() {
    return COURSE.missions.reduce(function (n, m) { return n + missionDone(m); }, 0);
  }
  function nextStepRef() {
    for (var i = 0; i < COURSE.missions.length; i++) {
      var m = COURSE.missions[i];
      for (var j = 0; j < m.steps.length; j++) {
        if (!isDone(m, m.steps[j])) return { mi: i, si: j };
      }
    }
    return null;
  }
  function firstTryRate() {
    var keys = Object.keys(progress.done);
    if (!keys.length) return null;
    var first = keys.filter(function (k) { return (progress.attempts[k] || 1) === 1; }).length;
    return Math.round((first / keys.length) * 100);
  }

  /* ---------- dom helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function show(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) {
      s.classList.toggle('is-active', s.id === id);
    });
    var sc = document.querySelector('#' + id + ' .scroller');
    if (sc) sc.scrollTop = 0;
  }
  /* Progress fills scale rather than resize — animating width thrashes layout. */
  function setProgress(fraction) {
    $('lesson-progress').style.transform = 'scaleX(' + Math.max(0, Math.min(1, fraction)) + ')';
  }
  function ring(pct, size) {
    var r = (size / 2) - 4, c = 2 * Math.PI * r;
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '">' +
      '<circle class="track" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" stroke-width="4"/>' +
      '<circle class="fill" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" stroke-width="4" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - pct)) + '"/></svg>' +
      '<div class="ring-label">' + Math.round(pct * 100) + '%</div></div>';
  }
  var ICON = {
    path: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 8h9a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h12"/></svg>',
    ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h6"/></svg>',
    you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20a8 8 0 0 1 16 0"/><circle cx="12" cy="8" r="4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M12 14v4M9 21h6"/></svg>',
    bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6h5.4c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>'
  };

  /* ---------- tab bar ---------- */
  var TABS = [ ['home', 'Path', ICON.path], ['ref', 'Reference', ICON.ref], ['you', 'Progress', ICON.you] ];
  function renderTabs(activeKey) {
    var html = TABS.map(function (t) {
      return '<button class="tab' + (t[0] === activeKey ? ' is-active' : '') + '" data-tab="' + t[0] + '">' + t[2] + '<span>' + t[1] + '</span></button>';
    }).join('');
    ['tabbar', 'tabbar-ref', 'tabbar-you'].forEach(function (id) {
      var el = $(id);
      if (el) el.innerHTML = html;
    });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (!t) return;
    goTab(t.getAttribute('data-tab'));
  });
  function goTab(k) {
    renderTabs(k);
    if (k === 'home') { renderHome(); show('screen-home'); }
    if (k === 'ref') { renderRef(); show('screen-ref'); }
    if (k === 'you') { renderYou(); show('screen-you'); }
  }

  /* ---------- home ---------- */
  function renderHome() {
    var next = nextStepRef();
    var pct = totalDone() / totalSteps();

    var hero;
    if (!next) {
      hero = '<div class="hero"><div class="hero-row">' + ring(1, 62) +
        '<div style="flex:1;min-width:0">' +
        '<h2 class="title">You built the whole cycle</h2>' +
        '<p class="small" style="margin-top:5px">Every mission is finished. Revisit any project to sharpen it.</p></div></div></div>';
    } else {
      var m = COURSE.missions[next.mi], st = m.steps[next.si];
      var label = totalDone() === 0 ? 'Start here' : 'Pick up where you left off';
      hero = '<button class="hero" id="hero-cta" style="width:100%;text-align:left"><div class="hero-row">' + ring(pct, 62) +
        '<div style="flex:1;min-width:0">' +
        '<h2 class="subtitle" style="line-height:1.3">' + st.title + '</h2>' +
        '<div class="mission-meta"><span class="chip chip-brand">' + m.name + '</span>' +
        '<span class="chip">Step ' + (next.si + 1) + ' of ' + m.steps.length + '</span></div></div></div>' +
        '<div class="btn btn-primary btn-block" style="margin-top:14px;position:relative">' +
        (totalDone() === 0 ? 'Begin the course' : 'Continue') + '</div></button>';
    }
    $('hero-slot').innerHTML = hero;
    var cta = $('hero-cta');
    if (cta) cta.addEventListener('click', function () { openStep(next.mi, next.si); });

    $('stat-slot').innerHTML =
      '<div class="stat"><b class="num">' + progress.xp + '</b><span>XP</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>day streak</span></div>' +
      '<div class="stat"><b class="num">' + totalDone() + '/' + totalSteps() + '</b><span>steps done</span></div>';

    /* The whole course is this one problem, so it leads the home screen. */
    $('problem-slot').innerHTML =
      '<div class="brief">' +
      '<p class="body">' + COURSE.problem.lead + '</p>' +
      '<div class="facts">' + COURSE.problem.facts.map(function (f, i) {
        return '<div class="fact"><i>' + (i + 1) + '</i><span>' + f + '</span></div>';
      }).join('') + '</div>' +
      '<div class="keyidea" style="margin-top:14px">' + ICON.bulb +
      '<p><b>Your deliverable.</b> ' + COURSE.problem.deliverable + '</p></div></div>';

    var topicCount = COURSE.missions.reduce(function (n, m) { return n + m.steps.length; }, 0);
    $('path-meta').textContent = COURSE.missions.length + ' modules · ' + topicCount + ' topics';

    $('path-slot').innerHTML = COURSE.missions.map(function (m, mi) {
      var done = missionDone(m), total = m.steps.length;
      var unlocked = missionUnlocked(mi);
      var complete = done === total;
      var dots = m.steps.map(function (st) {
        return '<span class="step-dot' + (st.kind === 'project' ? ' project' : '') + (isDone(m, st) ? ' on' : '') + '"></span>';
      }).join('');
      return '<button class="mission' + (complete ? ' is-done' : '') + (unlocked ? '' : ' is-locked') + '" data-mission="' + mi + '"' + (unlocked ? '' : ' disabled') + '>' +
        '<span class="mission-badge">' + (complete ? SVG.check : (mi + 1)) + '</span>' +
        '<span class="mission-body">' +
        '<span class="subtitle" style="display:block">' + m.name + '</span>' +
        '<span class="small" style="display:block;margin-top:4px">' + m.tagline + '</span>' +
        '<span class="mission-meta">' +
        '<span class="chip">' + m.minutes + ' min</span>' +
        '<span class="chip">' + total + ' steps</span>' +
        (m.steps.some(function (s) { return s.kind === 'project'; }) ? '<span class="chip chip-violet">Project</span>' : '') +
        (unlocked ? '' : '<span class="chip chip-amber">Finish mission ' + mi + ' first</span>') +
        '</span>' +
        '<span class="step-dots">' + dots + '</span>' +
        '</span></button>';
    }).join('');

    Array.prototype.forEach.call($('path-slot').querySelectorAll('[data-mission]'), function (btn) {
      btn.addEventListener('click', function () {
        var mi = Number(btn.getAttribute('data-mission'));
        var m = COURSE.missions[mi], si = 0;
        for (var j = 0; j < m.steps.length; j++) { if (!isDone(m, m.steps[j])) { si = j; break; } }
        openStep(mi, si);
      });
    });
  }

  /* ---------- reference ---------- */
  function renderRef() {
    $('ref-slot').innerHTML =
      '<div style="padding:14px 0 6px">' +
      '<h1 class="display">Cheat sheet</h1>' +
      '<p class="body" style="margin-top:8px">Everything the course derives, in one place. Come back here mid-exercise instead of guessing.</p></div>' +
      FIG.equation +
      '<div style="height:14px"></div>' + FIG.families +
      '<div style="height:14px"></div>' + FIG.expanded +
      '<div style="height:14px"></div>' + FIG.statements +
      '<div style="height:14px"></div>' + sofarTable(9, 'The completed workpaper') +
      '<div class="section-head"><h2 class="title">Terms</h2></div>' +
      '<div class="glossary">' + GLOSSARY.map(function (g) {
        return '<div class="gterm"><b>' + g[0] + '</b><span>' + g[1] + '</span></div>';
      }).join('') + '</div><div style="height:10px"></div>';
  }

  /* ---------- progress screen ---------- */
  function renderYou() {
    var rate = firstTryRate();
    $('you-slot').innerHTML =
      '<div style="padding:14px 0 6px">' +
      '<h1 class="display">' + totalDone() + ' of ' + totalSteps() + ' steps</h1>' +
      '<p class="body" style="margin-top:8px">' +
      (rate === null
        ? 'Nothing recorded yet. Finish a step and your first-try accuracy will show up here.'
        : 'You solved <strong>' + rate + '%</strong> of completed steps on the first attempt.') +
      '</p></div>' +
      '<div class="stat-strip">' +
      '<div class="stat"><b class="num">' + progress.xp + '</b><span>XP</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>day streak</span></div>' +
      '<div class="stat"><b class="num">' + (rate === null ? '—' : rate + '%') + '</b><span>first try</span></div>' +
      '</div>' +
      '<div class="section-head"><h2 class="title">Mastery</h2></div>' +
      '<div class="card"><div class="mastery">' + COURSE.missions.map(function (m) {
        var p = missionDone(m) / m.steps.length;
        return '<div class="mastery-row"><span class="mastery-name">' + m.name + '</span>' +
          '<span class="minibar"><i style="transform:scaleX(' + p + ')"></i></span>' +
          '<span class="mastery-pct">' + Math.round(p * 100) + '%</span></div>';
      }).join('') + '</div></div>' +
      '<div class="section-head"><h2 class="title">Settings</h2></div>' +
      '<div class="card"><button class="btn btn-ghost btn-block" id="reset-btn">Reset all progress</button>' +
      '<p class="small" style="margin-top:10px;text-align:center">Progress is stored on this device only.</p></div>' +
      '<div style="height:10px"></div>';

    $('reset-btn').addEventListener('click', function () {
      if (!window.confirm('Erase all progress and start the course over?')) return;
      progress.done = {}; progress.attempts = {}; progress.xp = 0;
      save();
      goTab('home');
    });
  }

  /* ---------- lesson ---------- */
  var current = null; // { mi, si, step, mission, task, tstate, renderer, checked }

  function openStep(mi, si) {
    var mission = COURSE.missions[mi];
    var step = mission.steps[si];
    var task = step.task;
    var renderer = RENDER[task.type];
    var tstate = renderer.init(task, mission.id + step.id);
    current = { mi: mi, si: si, mission: mission, step: step, task: task, tstate: tstate, renderer: renderer, checked: false, tries: 0, hinted: false };

    var totalInMission = mission.steps.length;
    setProgress(si / totalInMission);
    $('lesson-count').textContent = (si + 1) + ' / ' + totalInMission;

    var isProject = step.kind === 'project';
    var head;
    if (isProject) {
      head =
        '<div class="brief">' +
        '<h1 class="title">' + step.title + '</h1>' +
        '<p class="body" style="margin-top:9px">' + step.brief.lead + '</p>' +
        '<div class="facts">' + step.brief.facts.map(function (f, i) {
          return '<div class="fact"><i>' + (i + 1) + '</i><span>' + f + '</span></div>';
        }).join('') + '</div>' +
        '<div class="keyidea" style="margin-top:14px">' + ICON.bulb.replace('<svg', '<svg') +
        '<p><b>Your deliverable.</b> ' + step.brief.deliverable + '</p></div>' +
        '</div>';
    } else {
      head =
        '<div><h1 class="display">' + step.title + '</h1>' +
        '<div class="mission-meta"><span class="chip chip-brand">' + current.mission.name + '</span>' +
        '<span class="chip">Step ' + (si + 1) + ' of ' + totalInMission + '</span>' +
        (step.applies ? '<span class="chip chip-violet">' + step.applies + '</span>' : '') +
        '</div></div>' +
        (step.lead ? '<p class="body">' + step.lead + '</p>' : '') +
        '<div class="wwh">' +
        '<div class="wwh-block wwh-what"><div class="wwh-tag">What is it?</div><p>' + step.what + '</p></div>' +
        '<div class="wwh-block wwh-why"><div class="wwh-tag">Why does it matter?</div><p>' + step.why + '</p></div>' +
        '<div class="wwh-block wwh-how"><div class="wwh-tag">How do you apply it?</div>' +
        '<div class="howlist">' + step.how.map(function (h, i) {
          return '<div class="howstep"><i>' + (i + 1) + '</i><span>' + h + '</span></div>';
        }).join('') + '</div></div>' +
        '</div>' +
        (step.figure || '') +
        (step.keyidea ? '<div class="keyidea">' + ICON.bulb + '<p><b>Watch out.</b> ' + step.keyidea + '</p></div>' : '');
    }

    $('lesson-slot').innerHTML = head +
      '<div class="divider-label">' + (isProject ? 'Build it' : (step.applies ? 'Apply it &middot; ' + step.applies : 'Apply it')) + '</div>' +
      '<div class="task' + (isProject ? '' : '') + '" id="task-card">' +
      '<h2 class="task-prompt">' + task.prompt + '</h2>' +
      (task.sub ? '<p class="task-sub">' + task.sub + '</p>' : '') +
      '<div class="task-work" id="task-work"></div>' +
      '<div id="hint-slot"></div>' +
      '<div id="feedback-slot"></div>' +
      '</div>';

    var work = $('task-work');
    work.innerHTML = renderer.html(task, tstate);
    renderer.bind(work, task, tstate, { dirty: onDirty });

    setActions('check');
    show('screen-lesson');
  }

  function onDirty() {
    if (!current) return;
    current.checked = false;
    $('feedback-slot').innerHTML = '';
    setActions('check');
  }

  function setActions(mode) {
    var bar = $('lesson-actions');
    if (mode === 'continue') {
      bar.innerHTML = '<button class="btn btn-primary btn-block" id="act-next">Continue</button>';
      $('act-next').addEventListener('click', advance);
      return;
    }
    var ready = current.renderer.ready(current.task, current.tstate);
    bar.innerHTML =
      (current.task.hint ? '<button class="btn btn-ghost" id="act-hint" aria-label="Show a hint">Hint</button>' : '') +
      '<button class="btn btn-primary grow" id="act-check"' + (ready ? '' : ' disabled') + '>Check</button>';
    if ($('act-hint')) $('act-hint').addEventListener('click', showHint);
    $('act-check').addEventListener('click', doCheck);
  }

  function refreshCheckState() {
    var btn = $('act-check');
    if (!btn || !current) return;
    btn.disabled = !current.renderer.ready(current.task, current.tstate);
  }

  function showHint() {
    if (!current || current.hinted) return;
    current.hinted = true;
    $('hint-slot').innerHTML =
      '<div class="feedback hint"><span class="feedback-icon">' + SVG.hint + '</span><div><b>Hint</b><p>' + current.task.hint + '</p></div></div>';
    var h = $('act-hint');
    if (h) h.disabled = true;
  }

  function doCheck() {
    if (!current) return;
    var r = current.renderer.check(current.task, current.tstate);
    current.tries++;
    current.renderer.paint($('task-work'), current.task, current.tstate, r);
    current.checked = true;

    if (r.ok) {
      completeStep();
      $('feedback-slot').innerHTML =
        '<div class="feedback ok"><span class="feedback-icon">' + SVG.check + '</span><div><b>' +
        (current.tries === 1 ? 'Correct, first try' : 'Correct') + '</b><p>' +
        (current.task.explain || '') + '</p></div></div>';
      setActions('continue');
    } else {
      $('feedback-slot').innerHTML =
        '<div class="feedback no"><span class="feedback-icon">' + SVG.alert + '</span><div><b>Not yet</b><p>' + (r.body || '') + '</p></div></div>';
      var card = $('task-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      var hb = $('act-check');
      if (hb) hb.textContent = 'Check again';
    }
    $('feedback-slot').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function completeStep() {
    var k = key(current.mission, current.step);
    if (progress.done[k]) return;
    progress.done[k] = true;
    progress.attempts[k] = current.tries;
    var award = current.step.kind === 'project' ? XP_PROJECT : XP_LESSON;
    if (current.tries === 1 && !current.hinted) award += XP_FIRSTTRY;
    progress.xp += award;
    save();
    var total = current.mission.steps.length;
    setProgress((current.si + 1) / total);
  }

  function advance() {
    var mission = current.mission;
    if (current.si + 1 < mission.steps.length) {
      openStep(current.mi, current.si + 1);
      $('lesson-scroller').scrollTop = 0;
    } else {
      renderDone(mission, current.mi);
      show('screen-done');
    }
  }

  function renderDone(mission, mi) {
    var earned = mission.steps.reduce(function (n, st) {
      return n + (st.kind === 'project' ? XP_PROJECT : XP_LESSON);
    }, 0);
    var nextMission = COURSE.missions[mi + 1];
    $('done-slot').innerHTML =
      '<div class="done-wrap">' +
      '<div class="done-medal">' + ICON.trophy + '</div>' +
      '<div><h1 class="display">' + mission.name + '</h1>' +
      '<p class="body" style="margin-top:8px">Mission complete.</p></div>' +
      '<div class="stat-strip" style="width:100%">' +
      '<div class="stat"><b class="num">' + mission.steps.length + '</b><span>steps</span></div>' +
      '<div class="stat"><b class="num">' + earned + '</b><span>XP available</span></div>' +
      '<div class="stat"><b class="num">' + progress.streak + '</b><span>day streak</span></div>' +
      '</div>' +
      '<div class="card" style="width:100%;text-align:left">' +
      '<div class="eyebrow" style="margin-bottom:11px">You can now</div>' +
      '<div class="cando">' + mission.cando.map(function (c) {
        return '<div class="cando-item">' + ICON.check + '<span>' + c + '</span></div>';
      }).join('') + '</div></div>' +
      (nextMission
        ? '<div class="card" style="width:100%;text-align:left"><div class="eyebrow">Up next</div>' +
          '<div class="subtitle" style="margin-top:5px">' + nextMission.name + '</div>' +
          '<p class="small" style="margin-top:4px">' + nextMission.tagline + '</p></div>'
        : '') +
      '</div>';
    var btn = $('done-continue');
    btn.textContent = nextMission ? 'Start ' + nextMission.name : 'Back to path';
    btn.onclick = function () {
      if (nextMission) { openStep(mi + 1, 0); }
      else { goTab('home'); }
    };
  }

  /* ---------- wiring ---------- */
  $('lesson-close').addEventListener('click', function () { goTab('home'); });

  document.addEventListener('input', refreshCheckState, true);
  document.addEventListener('change', refreshCheckState, true);
  document.addEventListener('click', function () { window.setTimeout(refreshCheckState, 0); }, true);

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f4f7fa' : '#080b10');
  }
  $('theme-toggle').addEventListener('click', function () {
    progress.theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(progress.theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  if (!progress.theme) {
    progress.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(progress.theme);
  touchStreak();
  goTab('home');
})();
</script>
