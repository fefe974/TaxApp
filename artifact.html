/* ============================================================
   Tokens — light by default. Students read dense tables in
   daylight, so the ground is paper, not ink.
   ============================================================ */
:root {
  color-scheme: light;
  /* Warm paper rather than cold slate: this is a ledger, not a dashboard. */
  --bg: #faf8f4;
  --surface: #ffffff;
  --surface-2: #f4f1ea;
  --surface-3: #e8e3d8;
  --line: #e6e1d6;
  --line-strong: #cfc7b6;
  --text: #191d24;
  --text-dim: #4a5260;
  --muted: #79808d;

  /* Scholarly navy, not default-blue. */
  --brand: #1e3a5f;
  --brand-deep: #142a47;
  --brand-soft: #eef2f8;
  --brand-line: #c2d0e2;
  --brand-ink: #142a47;
  --on-brand: #ffffff;

  /* Ledger conventions: brass for source facts, green proved, red wrong. */
  --amber: #8a5a12;
  --amber-soft: #fdf7ea;
  --amber-line: #e3ca94;
  --amber-ink: #5c3b0a;

  --good: #0f7b5a;
  --good-soft: #edf7f2;
  --good-line: #9dd4bf;
  --good-deep: #0b5d44;

  --bad: #b4232a;
  --bad-soft: #fdf1f1;
  --bad-line: #eec2c2;

  --head-bar: #1e3a5f;
  --head-bar-2: #2b4c76;
  --head-ink: #ffffff;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --shadow-sm: 0 1px 2px rgba(37, 30, 18, 0.05);
  --shadow: 0 6px 18px -8px rgba(37, 30, 18, 0.16);
  --shadow-lg: 0 18px 40px -18px rgba(37, 30, 18, 0.26);
  --shadow-up: 0 -10px 28px -16px rgba(37, 30, 18, 0.18);

  --display: 'Literata', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Strong custom curves: the built-in CSS easings are too weak to read
     as intentional. ease-out for entering, ease-in-out for on-screen movement. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease: var(--ease-out);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12141a;
  --surface: #1a1d25;
  --surface-2: #21252f;
  --surface-3: #2c313d;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.19);
  --text: #ece9e2;
  --text-dim: #b8b6ae;
  --muted: #8b8a83;

  --brand: #8fb4e0;
  --brand-deep: #6f9bd0;
  --brand-soft: rgba(143, 180, 224, 0.13);
  --brand-line: rgba(143, 180, 224, 0.34);
  --brand-ink: #cadcf1;
  --on-brand: #0f1b2b;

  --amber: #e0b464;
  --amber-soft: rgba(224, 180, 100, 0.11);
  --amber-line: rgba(224, 180, 100, 0.32);
  --amber-ink: #efd6a5;

  --good: #4ec49b;
  --good-soft: rgba(78, 196, 155, 0.12);
  --good-line: rgba(78, 196, 155, 0.32);
  --good-deep: #6ad4ae;

  --bad: #e8767c;
  --bad-soft: rgba(232, 118, 124, 0.12);
  --bad-line: rgba(232, 118, 124, 0.3);

  --head-bar: #232833;
  --head-bar-2: #2d3340;
  --head-ink: #ece9e2;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
  --shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.65);
  --shadow-lg: 0 18px 40px -18px rgba(0, 0, 0, 0.8);
  --shadow-up: 0 -10px 28px -16px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
h1, h2, h3, p { margin: 0; font-size: inherit; font-weight: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

.app {
  height: 100vh; height: 100dvh;
  max-height: 100vh; max-height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.wrap { width: 100%; max-width: 720px; margin: 0 auto; }

/* ---------- header ---------- */
.appbar {
  flex: 0 0 auto;
  background: var(--brand);
  color: #fff;
  padding: max(14px, env(safe-area-inset-top)) 18px 14px;
  box-shadow: var(--shadow);
  z-index: 20;
}
html[data-theme="dark"] .appbar { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--text); }
.appbar-inner { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto; }
.mark {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  background: #fff; color: var(--brand);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .mark { background: var(--brand); color: var(--on-brand); }
.mark svg { width: 22px; height: 22px; }
.appbar-title { flex: 1; min-width: 0; }
.appbar-title b { display: block; font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.appbar-title span { display: block; font-size: 12px; font-weight: 500; opacity: 0.82; }
.ghost-btn {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}
html[data-theme="dark"] .ghost-btn { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); }
.ghost-btn svg { width: 19px; height: 19px; }

/* ---------- tabs ---------- */
.tabs {
  flex: 0 0 auto;
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  z-index: 15;
}
.tabs-inner { display: flex; width: 100%; max-width: 720px; margin: 0 auto; }
.tab {
  flex: 1;
  position: relative;
  min-height: 54px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13.5px; font-weight: 700;
  color: var(--muted);
  transition: color 180ms var(--ease-out);
}
.tab svg { width: 18px; height: 18px; }
.tab.on { color: var(--brand); }
.tab.on::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: 0;
  height: 3px; border-radius: 3px 3px 0 0; background: var(--brand);
}
.tab-sep { width: 1px; background: var(--line); margin: 12px 0; }

/* ---------- panes ---------- */
.pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }
.scroll {
  flex: 1; min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
#pane-guide .scroll { padding: 22px 18px 30px; }

/* ---------- step ---------- */
.step-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.step-title {
  font-family: var(--display);
  font-size: 31px; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em;
  margin-top: 10px;
  text-wrap: balance;
}
.stack { display: grid; gap: 22px; margin-top: 26px; }
/* Grid items default to min-width:auto, so a wide table would blow the
   column out past the viewport instead of scrolling inside its own box. */
.stack > * { min-width: 0; }
.wrap { min-width: 0; }

/* Boxes with the label riding the top edge. */
.box { position: relative; border-radius: var(--r-xl); padding: 20px 18px 18px; }
.box-tag {
  position: absolute; top: -11px; left: 18px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  max-width: calc(100% - 36px);
  overflow: hidden; text-overflow: ellipsis;
}
.box-tag svg { width: 13px; height: 13px; flex: 0 0 auto; }

.box-fact { background: var(--amber-soft); border: 1px solid var(--amber-line); }
.box-fact .box-tag { background: var(--surface); color: var(--amber); border: 1px solid var(--amber-line); }
.box-fact p { font-family: var(--display); font-size: 19px; line-height: 1.4; font-weight: 500; color: var(--amber-ink); }

.box-concept { background: var(--surface); border: 1px solid var(--brand-line); box-shadow: var(--shadow); }
.box-concept .box-tag { background: var(--brand); color: var(--on-brand); }
.box-concept p { font-size: 16px; line-height: 1.66; color: var(--text-dim); white-space: pre-line; }
.box-concept p + p { margin-top: 12px; }
.box-concept b { color: var(--text); font-weight: 700; }


.concept-name {
  font-family: var(--display);
  font-size: 21px; font-weight: 600; line-height: 1.2; letter-spacing: -0.012em;
  color: var(--text);
  margin-bottom: 12px;
  text-wrap: balance;
}
.box-impact { background: var(--brand-soft); border: 1px solid var(--brand-line); padding: 18px 16px; }
.box-impact .impact-cap {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--brand-ink); margin-bottom: 13px;
}
.box-impact .impact-cap svg { width: 15px; height: 15px; }

.equation {
  display: flex; align-items: stretch; gap: 10px;
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
.eq-side { flex: 1; min-width: 0; display: grid; gap: 6px; align-content: start; }
.eq-side:last-child { justify-items: end; text-align: right; }
.eq-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.eq-item { font-size: 13.5px; font-weight: 650; line-height: 1.35; }
.eq-item b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eq-op { display: grid; place-items: center; font-size: 18px; font-weight: 800; color: var(--muted); }

.note-warn {
  display: flex; gap: 10px; margin-top: 14px;
  padding: 12px 14px; border-radius: var(--r-md);
  background: var(--bad-soft); border: 1px solid var(--bad-line);
}
.note-warn svg { flex: 0 0 auto; width: 17px; height: 17px; color: var(--bad); margin-top: 2px; }
.note-warn p { font-size: 14px; line-height: 1.5; color: var(--text-dim); }

/* ---------- source document ---------- */
.doc {
  margin-top: 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.doc-bar {
  padding: 8px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.doc-body { padding: 13px 15px 15px; font-family: var(--mono); font-size: 12.5px; line-height: 1.75; font-variant-numeric: tabular-nums; }
.doc-issuer { font-weight: 700; color: var(--text); margin-bottom: 3px; }
.doc-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-dim); }
.doc-row span:last-child { white-space: nowrap; }
.doc-total {
  display: flex; justify-content: space-between; gap: 14px;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--line-strong);
  font-weight: 700; color: var(--text);
}
.doc-note { font-family: var(--font); font-size: 12px; font-style: italic; color: var(--muted); margin-top: 9px; }

/* ---------- tables ---------- */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.led {
  border-collapse: separate; border-spacing: 0;
  width: max-content; min-width: 100%;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  background: var(--surface);
}
table.led th, table.led td { padding: 9px 10px; text-align: right; white-space: nowrap; }
table.led thead .grp {
  background: var(--head-bar); color: var(--head-ink);
  text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
  border-bottom: 1px solid var(--line);
}
table.led thead .grp .op { background: var(--head-bar-2); }
table.led thead .acct th {
  background: var(--surface-2);
  font-size: 11px; font-weight: 700; color: var(--text-dim);
  border-bottom: 2px solid var(--line-strong);
}
table.led .op { color: var(--muted); font-weight: 700; padding-left: 4px; padding-right: 4px; }
table.led tbody td { border-bottom: 1px solid var(--line); color: var(--text-dim); font-family: var(--mono); }
table.led .lab {
  position: sticky; left: 0; z-index: 2;
  text-align: left; font-family: var(--font); font-weight: 700; font-size: 11.5px;
  background: var(--surface-2); color: var(--text-dim);
  border-right: 1px solid var(--line);
  box-shadow: 2px 0 4px rgba(15, 23, 42, 0.04);
}
table.led thead .lab { z-index: 4; }
table.led thead .grp .lab { background: var(--head-bar); }
table.led .rem { text-align: left; font-family: var(--font); font-style: italic; font-size: 11.5px; color: var(--muted); }

/* the row that just landed */
table.led tr.fresh td { background: var(--brand-soft); }
table.led tr.fresh .lab { background: var(--brand-soft); color: var(--brand); }
/* the cells this step produced */
table.led td.hit {
  font-weight: 800; color: var(--brand-ink);
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 2px var(--brand);
  border-radius: 5px;
}
table.led tr.totals td {
  background: var(--good-soft); color: var(--good-deep);
  font-weight: 800; border-top: 2px solid var(--good-line); border-bottom: 0;
}
table.led tr.totals .lab { background: var(--good-soft); color: var(--good-deep); }

.proof {
  display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  padding: 14px;
  background: var(--good);
  color: #fff;
  font-family: var(--mono); font-weight: 800; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.proof span { display: inline-flex; align-items: center; gap: 8px; }
.proof svg { width: 17px; height: 17px; }

.card {
  position: relative;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* ---------- statements ---------- */
/* Faint ruled paper, the surface an accountant actually writes on. */
.stmt {
  padding: 20px 16px; font-variant-numeric: tabular-nums;
  background:
    repeating-linear-gradient(180deg, transparent 0 27px, var(--line) 27px 28px),
    var(--surface);
  background-position: 0 44px;
}
.stmt-head { text-align: center; margin-bottom: 15px; }
.stmt-head b { display: block; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.stmt-head span { display: block; font-family: var(--display); font-size: 14px; color: var(--text-dim); }
.stmt-head i { display: block; font-size: 12px; color: var(--muted); font-style: normal; }
.stmt-line { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; padding: 3px 4px; border-radius: 5px; }
.stmt-line .lbl { flex: 1; min-width: 0; }
.stmt-line .amt { font-family: var(--mono); text-align: right; white-space: nowrap; min-width: 78px; }
.stmt-line.ind .lbl { padding-left: 16px; }
.stmt-line.hd { font-weight: 700; }
.stmt-line.tot { font-weight: 700; }
.stmt-line.tot .amt { border-top: 1px solid var(--line-strong); padding-top: 3px; }
.stmt-line.grand { font-weight: 800; }
.stmt-line.grand .amt { border-top: 1px solid var(--line-strong); border-bottom: 3px double var(--line-strong); padding: 3px 0; }
.stmt-line.hit { background: var(--brand-soft); box-shadow: inset 0 0 0 1.5px var(--brand-line); }
.stmt-line.hit .lbl { color: var(--brand-ink); font-weight: 700; }
.stmt-line.hit .amt { color: var(--brand-ink); font-weight: 800; }
.stmt-gap { height: 10px; }

/* ---------- facts list ---------- */
.facts { display: grid; gap: 10px; }
.fact { display: flex; gap: 11px; font-size: 14.5px; line-height: 1.45; color: var(--text-dim); }
.fact i {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;
  display: grid; place-items: center; font-style: normal;
  font-size: 11px; font-weight: 800;
  background: var(--brand-soft); color: var(--brand);
}


/* ---------- lecture ---------- */
.lec-lede { font-family: var(--display); font-size: 20px; line-height: 1.42; font-weight: 400; color: var(--text-dim); margin-top: 14px; }
.lec-body { display: grid; gap: 14px; margin-top: 20px; }
.lec-body p { font-size: 15.5px; line-height: 1.62; color: var(--text-dim); }
.lec-body b { color: var(--text); font-weight: 700; }
.keypoint {
  display: flex; gap: 11px; margin-top: 20px;
  padding: 14px 15px; border-radius: var(--r-md);
  background: var(--amber-soft); border: 1px solid var(--amber-line);
}
.keypoint svg { flex: 0 0 auto; width: 17px; height: 17px; color: var(--amber); margin-top: 2px; }
.keypoint p { font-size: 14.5px; line-height: 1.55; color: var(--amber-ink); }

.viz {
  margin-top: 20px; padding: 18px 16px;
  border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.viz-cap { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }





/* ---------- visual teaching devices ---------- */

/* Pipeline: one real event carried through to one real report line. */
.pipe { display: grid; gap: 8px; }
.pipe-stage { border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface-2); padding: 12px 13px; }
.pipe-hd { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.pipe-n {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 6px;
  display: grid; place-items: center; font-size: 11px; font-weight: 800;
  background: var(--brand); color: var(--on-brand);
}
.pipe-hd b { font-size: 13px; font-weight: 750; }
.pipe-art {
  border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line);
  padding: 9px 11px; font-size: 12.5px; color: var(--text-dim);
}
.pipe-art.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 12px; }
.pipe-down { display: grid; place-items: center; color: var(--brand); }
.pipe-down svg { width: 17px; height: 17px; }

/* Balance: two pans with real totals, and what it looks like when it breaks. */
.scale { display: flex; align-items: stretch; gap: 8px; }
.pan {
  flex: 1; min-width: 0;
  border-radius: var(--r-md); border: 1px solid; padding: 11px 12px;
  display: grid; gap: 4px; align-content: start;
}
.pan-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; opacity: 0.85; }
.pan b { font-family: var(--mono); font-size: 19px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pan-items { display: grid; gap: 2px; margin-top: 4px; }
.pan-items span { font-family: var(--mono); font-size: 11px; opacity: 0.82; font-variant-numeric: tabular-nums; }
.pan-a { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand-ink); }
.pan-c { background: var(--good-soft); border-color: var(--good-line); color: var(--good-deep); }
.pan-bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.scale-op { display: grid; place-items: center; font-size: 17px; font-weight: 800; color: var(--muted); }
.verdict {
  margin-top: 10px; padding: 9px 12px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 750;
}
.verdict svg { width: 15px; height: 15px; }
.verdict.ok { background: var(--good-soft); color: var(--good-deep); border: 1px solid var(--good-line); }
.verdict.no { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }
.viz-sub { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

/* Decomposition: one figure splitting into the parts it is made of. */
.decomp { display: grid; gap: 0; }
.dc-node {
  border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface-2); padding: 10px 12px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.dc-node em { font-style: normal; font-size: 13px; font-weight: 700; }
.dc-node b { font-family: var(--mono); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dc-node small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.dc-top { background: var(--good-soft); border-color: var(--good-line); color: var(--good-deep); }
.dc-row { display: grid; gap: 8px; }
@media (min-width: 480px) { .dc-row.two { grid-template-columns: 1fr 1fr; } .dc-row.three { grid-template-columns: repeat(3, 1fr); } }
.dc-link { display: grid; place-items: center; height: 22px; color: var(--muted); }
.dc-link svg { width: 16px; height: 16px; }
.dc-node.sm { padding: 8px 11px; }
.dc-node.sm em { font-size: 12px; }
.dc-node.sm b { font-size: 12.5px; }
.dc-node.minus b { color: var(--bad); }

/* Wrong beside right. */
.vs { display: grid; gap: 10px; }
@media (min-width: 520px) { .vs { grid-template-columns: 1fr 1fr; } }
.vs-col { border-radius: var(--r-md); border: 1px solid; padding: 12px 13px; }
.vs-col.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.vs-col.good { background: var(--good-soft); border-color: var(--good-line); }
.vs-tag { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.vs-tag svg { width: 14px; height: 14px; }
.vs-col.bad .vs-tag { color: var(--bad); }
.vs-col.good .vs-tag { color: var(--good-deep); }
.vs-col em { font-style: normal; display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.vs-col p { font-size: 12.5px; line-height: 1.5; color: var(--text-dim); margin-top: 6px; }
.vs-q { font-size: 13.5px; font-weight: 750; margin: 16px 0 10px; }
.vs-q:first-child { margin-top: 0; }

/* Four steps building one row. */
.build { display: grid; gap: 8px; }
.build-row { display: flex; align-items: center; gap: 11px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); padding: 10px 12px; }
.build-n {
  flex: 0 0 auto; width: 21px; height: 21px; border-radius: 6px;
  display: grid; place-items: center; font-size: 11px; font-weight: 800;
  background: var(--brand-soft); color: var(--brand);
}
.build-txt { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-dim); }
.build-out { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.build-out.ok { color: var(--good-deep); }
/* An inline SVG with no width falls back to its intrinsic size and pushes
   the row past the viewport. Size every icon inside a visual. */
.build-out svg { width: 14px; height: 14px; vertical-align: -2px; }
.viz svg { max-width: 100%; }
.build-txt { min-width: 0; }
.viz { min-width: 0; }


/* Hover feedback, gated: a touch tap fires a false hover otherwise. */
@media (hover: hover) and (pointer: fine) {
  .nav-btn:hover:not([disabled]) { background: var(--surface-2); border-color: var(--line-strong); }
  .nav-next:hover:not([disabled]) { background: var(--brand-deep); border-color: transparent; }
  .tab:hover { color: var(--text-dim); }
  .tab.on:hover { color: var(--brand); }
  .ghost-btn:hover { background: rgba(255, 255, 255, 0.26); }
  html[data-theme="dark"] .ghost-btn:hover { background: var(--surface-3); }
  .skip:focus-visible { outline-offset: 4px; }
}

/* ---------- skip link ---------- */
.skip {
  position: absolute; top: 8px; left: 8px; z-index: 60;
  min-height: 44px; display: inline-flex; align-items: center;
  padding: 10px 16px; border-radius: var(--r-md);
  background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 700;
  box-shadow: var(--shadow-lg);
  transform: translateY(-160%);
  transition: transform 150ms var(--ease-out);
}
.skip:focus { transform: translateY(0); }

/* ---------- segmented progress rail ----------
   17 ticks, split at the lecture/walkthrough boundary, so the shape of
   the course is visible instead of an anonymous filling bar. */
.rail { display: flex; gap: 2px; width: 100%; max-width: 220px; }
.rail i {
  flex: 1; height: 6px; border-radius: 2px;
  background: var(--surface-3);
  transition: background 200ms var(--ease-out), transform 200ms var(--ease-in-out);
  transform-origin: bottom;
}
.rail i.lec.done { background: var(--brand-line); }
.rail i.stp.done { background: var(--brand); }
.rail i.now { background: var(--brand); transform: scaleY(1.7); }
.rail i.gap { flex: 0 0 6px; background: transparent; }

/* ---------- refinement ---------- */
.appbar { border-bottom: 1px solid rgba(0,0,0,0.12); }
html[data-theme="dark"] .appbar { border-bottom-color: var(--line); }
.mark { border-radius: 12px; }

.box { box-shadow: var(--shadow-sm); }
.box-concept { box-shadow: var(--shadow); }
.box-tag { letter-spacing: 0.1em; }

/* Hairline rules instead of heavy borders on data surfaces. */
table.led thead .acct th { border-bottom: 1.5px solid var(--line-strong); }
table.led tbody td { border-bottom: 1px solid var(--line); }
table.led tbody tr:last-child td { border-bottom: 0; }
table.led .lab { box-shadow: 1px 0 0 var(--line); }

/* A posted row arrives rather than appearing. */
@keyframes land {
  0%   { background: color-mix(in srgb, var(--brand) 22%, transparent); }
  100% { background: var(--brand-soft); }
}
table.led tr.fresh td { animation: land 260ms var(--ease-out); }
table.led td.hit { box-shadow: inset 0 0 0 1.5px var(--brand); border-radius: 4px; }

/* The proof bar reads like a stamp on the page. */
.proof { letter-spacing: 0.01em; }
.verdict { font-family: var(--font); }

/* Buttons: quieter chrome, firmer press. */
.nav-btn { border-radius: var(--r-md); font-weight: 650; }
.nav-next { box-shadow: 0 6px 16px -8px var(--brand); }
.tab { letter-spacing: -0.005em; }

/* Give the guide column a printed measure. */
#pane-guide .wrap { max-width: 640px; }
.lec-body p { max-width: 62ch; }
.box-concept p { max-width: 62ch; }

/* ---------- solve it yourself ----------
   Every class is ws-prefixed: the worksheet shares a stylesheet with the
   walkthrough, and a bare `.amt` here would put a `$` glyph in front of
   every statement figure over there. */
#pane-solve .scroll { padding: 22px 18px 30px; }
.ws-head { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.ws-head h1 {
  font-family: var(--display);
  font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.12;
}
.ws-head p { font-size: 15px; color: var(--text-dim); margin-top: 10px; line-height: 1.55; }
.ws-sect {
  display: flex; align-items: baseline; gap: 10px;
  margin: 26px 0 14px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
.ws-sect i { flex: 1; height: 1px; background: var(--line); font-style: normal; }

.ws-tx {
  border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--surface); padding: 15px 14px; box-shadow: var(--shadow-sm);
}
.ws-tx + .ws-tx { margin-top: 12px; }
.ws-tx.right { border-color: var(--good-line); background: var(--good-soft); }
.ws-tx.wrong { border-color: var(--bad-line); }
.ws-tx-head { display: flex; gap: 11px; align-items: flex-start; }
.ws-no {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 11.5px; font-weight: 800; font-family: var(--mono);

(function () {
  var STORE = 'speedy.walkthrough.v2';
  var LEC = LECTURE.length;          // lecture screens come first

  var cur = 0;                       // index into the combined flow
  var tab = 'guide';
  var theme = '';

  function $(id) { return document.getElementById(id); }

  function load() {
    try {
      var p = JSON.parse(window.localStorage.getItem(STORE) || '{}');
      if (typeof p.step === 'number' && p.step >= 0 && p.step < TOTAL) cur = p.step;
      if (p.tab === 'table' || p.tab === 'guide' || p.tab === 'solve') tab = p.tab;
      theme = p.theme || '';
    } catch (e) { /* private mode: run without persistence */ }
  }
  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify({ step: cur, tab: tab, theme: theme })); } catch (e) {}
  }

  /* ---------- the ledger table ----------
     `upto` reveals rows; `hits` rings the cells this step produced. */
  function ledgerTable(upto, hits, opts) {
    opts = opts || {};
    var showTotals = !!opts.totals;
    var all = hits && hits.indexOf('all') !== -1;

    var grp = '<tr class="grp">' +
      '<th class="lab"></th>' +
      '<th colspan="3">ASSETS</th>' +
      '<th class="op">=</th>' +
      '<th colspan="2">LIABILITIES</th>' +
      '<th class="op">+</th>' +
      '<th colspan="4">STOCKHOLDERS&rsquo; EQUITY</th>' +
      (opts.remarks === false ? '' : '<th></th>') +
      '</tr>';

    function headCells() {
      var out = '', i;
      for (i = 0; i < COLS.length; i++) {
        if (i === 3) out += '<th class="op">=</th>';
        if (i === 5) out += '<th class="op">+</th>';
        out += '<th>' + COLS[i].head + '</th>';
      }
      return out;
    }
    var head = '<tr class="acct"><th class="lab">Trans.</th>' + headCells() +
      (opts.remarks === false ? '' : '<th style="text-align:left">Remark</th>') + '</tr>';

    var rows = LEDGER.filter(function (r) { return r.step <= upto; });
    var body = rows.map(function (r) {
      var fresh = r.step === upto ? ' class="fresh"' : '';
      var out = '<tr' + fresh + '><td class="lab">' + (r.trans || '') + '</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) out += '<td class="op"></td>';
        if (i === 5) out += '<td class="op"></td>';
        var v = r[c.k];
        var hit = (r.step === upto && hits && hits.indexOf(c.k) !== -1) ? ' class="hit"' : '';
        out += '<td' + hit + '>' + (v ? money(v) : '') + '</td>';
      });
      if (opts.remarks !== false) out += '<td class="rem">' + (r.rem || '') + '</td>';
      return out + '</tr>';
    }).join('');

    var foot = '';
    if (showTotals) {
      var t = totalsUpTo(upto);
      foot = '<tr class="totals"><td class="lab">Totals</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) foot += '<td class="op">=</td>';
        if (i === 5) foot += '<td class="op">+</td>';
        var hit = (all || (hits && hits.indexOf(c.k) !== -1)) ? ' class="hit"' : '';
        foot += '<td' + hit + '>' + (t[c.k] ? dollars(t[c.k]) : '&mdash;') + '</td>';
      });
      if (opts.remarks !== false) foot += '<td class="rem"></td>';
      foot += '</tr>';
    }

    var proof = '';
    if (showTotals) {
      var tt = totalsUpTo(upto);
      proof = '<div class="proof"><span>Assets ' + dollars(assetsOf(tt)) + '</span>' +
        '<span>=</span><span>Liabilities + Equity ' + dollars(claimsOf(tt)) + '</span>' +
        '<span>' + ICON.check + '</span></div>';
    }

    return '<div class="card pop"><div class="tbl-scroll"><table class="led"><thead>' + grp + head +
      '</thead><tbody>' + body + '</tbody>' + (foot ? '<tfoot>' + foot + '</tfoot>' : '') +
      '</table></div>' + proof + '</div>';
  }

      '<div class="step-eyebrow">Lecture ' + (cur + 1) + ' of ' + LEC + '</div>' +
      '<h1 class="step-title">' + l.title + '</h1>' +
      '<p class="lec-lede">' + l.lede + '</p>' +
      viz +
      '<div class="lec-body">' + l.body.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
      (l.key ? '<div class="keypoint">' + ICON.bulb + '<p>' + l.key + '</p></div>' : '') +
      '<div style="height:8px"></div></div>';
    $('guide').parentNode.scrollTop = 0;
  }

  function renderGuide() {
    if (inLecture()) return renderLecture();
    var s = STEPS[stepNo()];
    var impact = '';

    if (s.hits && s.hits.length) {
      impact = '<div class="box box-impact"><div class="impact-cap">' + ICON.pulse +
        (s.totals ? 'The summary so far' : 'Changes in this step') + '</div>' +
        ledgerTable(stepNo(), s.hits, { totals: !!s.totals, remarks: !s.totals }) + '</div>';
    }

    $('guide').innerHTML =
      '<div class="wrap fade">' +
      '<div class="step-eyebrow">Step ' + stepNo() + ' of ' + LAST + '</div>' +
      '<h1 class="step-title">' + s.title + '</h1>' +
      '<div class="stack">' +
      '<div class="box box-fact"><span class="box-tag">The fact</span><p>' + s.fact + '</p></div>' +
      '<div class="box box-concept"><span class="box-tag">' + ICON.bulb + 'Key concept</span>' +
      '<h2 class="concept-name">' + s.concept + '</h2>' +
      '<p>' + s.why + '</p></div>' +
      (s.eq ? equationStrip(s.eq[0], s.eq[1]) : '') +
      (s.warn ? '<div class="note-warn">' + ICON.warn + '<p>' + s.warn + '</p></div>' : '') +
      (s.doc || '') +
      (s.extra || '') +
      impact +
      (s.after || '') +
      (s.result ? '<div class="proof" style="border-radius:12px">' + ICON.check + '<span>' + s.result + '</span></div>' : '') +
      '</div><div style="height:8px"></div></div>';
    $('guide').parentNode.scrollTop = 0;
  }

  function equationStrip(left, right) {
    function side(cap, items) {
      return '<div class="eq-side"><span class="eq-cap">' + cap + '</span>' +
        items.map(function (i) { return '<span class="eq-item">' + i[0] + ' <b>' + i[1] + '</b></span>'; }).join('') +
        '</div>';
    }
    return '<div class="equation">' + side('Assets', left) + '<div class="eq-op">=</div>' +
      side('Liabilities + Equity', right) + '</div>';
  }

  /* ---------- table pane ---------- */
  function renderTable() {
    if (inLecture()) {
      $('table-slot').innerHTML =
        '<div class="hint">The lecture comes first. Once the walkthrough starts, this table will build itself one transaction at a time.</div>';
      return;
    }
    var s = STEPS[stepNo()];
    if (stepNo() === 0) {
      $('table-slot').innerHTML =
        '<div class="hint">Advance the walkthrough with the controls below and this table will build itself, one transaction at a time.</div>';
      return;
    }
    $('table-slot').innerHTML = ledgerTable(stepNo(), s.hits, { totals: !!s.totals });
    var sc = $('table-scroll');
    var fresh = $('table-slot').querySelector('tr.fresh, tr.totals');
    if (fresh) {
      window.setTimeout(function () {
        /* Honour the reduced-motion preference for programmatic scrolling too. */
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        sc.scrollTo({ top: sc.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
      }, 90);
    }
  }


  /* ---------- the worksheet ----------
     Part 1 records the nine ledger rows, Part 2 reports the five figures
     the statements need. The workpaper in the middle is built from what
     the learner typed, not from the answer key, so a wrong entry shows up
     as an out-of-balance total before anything is graded. */
  var work = { fx: {}, fld: {}, hint: {} };
  var KEY = totalsUpTo(999);          // the column totals a correct sheet reaches

  function loadWork() {
    try {
      var w = JSON.parse(window.localStorage.getItem(STORE + '.work') || '{}');
      if (w && typeof w === 'object') {
        work.fx = w.fx || {};
        work.fld = w.fld || {};
        work.hint = w.hint || {};
      }
    } catch (e) { /* private mode: run without persistence */ }
  }
  function saveWork() {
    try { window.localStorage.setItem(STORE + '.work', JSON.stringify(work)); } catch (e) {}
  }

  function fxKey(ri, n, part) { return ri + '.' + n + '.' + part; }
  function amountOf(v) {
    if (v === undefined || v === null) return NaN;
    var c = String(v).replace(/[$,\s]/g, '');
    return c === '' ? NaN : Number(c);
  }
  function signed(n) { return (n < 0 ? '&minus;' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }

  /* One entered effect, or null when the learner has not finished it. */
  function effect(ri, i) {
    var k = work.fx[fxKey(ri, i, 'k')];
    var d = work.fx[fxKey(ri, i, 'd')];
    var a = amountOf(work.fx[fxKey(ri, i, 'a')]);
    if (!k || !d || isNaN(a)) return null;
    return { k: k, d: Number(d), a: a };
  }
  function slotsFor(ri) { return expectedFor(LEDGER[ri]).length; }

  /* Column totals from what the learner entered, never from LEDGER. */
  function workTotals() {
    var t = {};
    COLS.forEach(function (c) { t[c.k] = 0; });
    LEDGER.forEach(function (r, ri) {
      for (var i = 0; i < slotsFor(ri); i++) {
        var e = effect(ri, i);
        if (e) t[e.k] += e.d * e.a;
      }
    });
    return t;
  }

  function rowRight(ri) {
    var want = expectedFor(LEDGER[ri])
      .map(function (e) { return e.k + ':' + e.dir + ':' + e.amt; }).sort().join('|');
    var got = [];
    for (var i = 0; i < slotsFor(ri); i++) {
      var e = effect(ri, i);
      if (!e) return false;
      got.push(e.k + ':' + e.d + ':' + e.a);
    }
    return got.sort().join('|') === want;
  }

  /* Name what is wrong without naming the answer. */
  function rowDiagnosis(ri) {
    var n = slotsFor(ri), left = 0, right = 0, started = 0, done = 0, amts = [];
    for (var i = 0; i < n; i++) {
      // An effect can be started without being finished, and saying
      // "nothing recorded" over a visibly chosen account is just wrong.
      if (work.fx[fxKey(ri, i, 'k')] || work.fx[fxKey(ri, i, 'd')] ||
          !isNaN(amountOf(work.fx[fxKey(ri, i, 'a')]))) started++;
      var e = effect(ri, i);
      if (!e) continue;
      done++; amts.push(e.a);
      var col = COLS.filter(function (c) { return c.k === e.k; })[0];
      if (col.grp === 'a') left += e.d * e.a;
      else right += (e.k === 'exp' || e.k === 'div' ? -1 : 1) * e.d * e.a;
    }
    if (!started) return 'Nothing recorded yet. This transaction has ' + n + ' effects.';
    if (done < n) return 'Each effect needs an account, a direction and an amount &mdash; ' + done + ' of ' + n + ' done so far.';
    if (left !== right) return 'This row leaves the equation out by ' + signed(Math.abs(left - right)) + '. Whatever happens on one side has to be matched on the other.';
    var wanted = expectedFor(LEDGER[ri]).map(function (e) { return e.amt; }).sort().join(',');
    if (amts.sort().join(',') !== wanted) return 'It balances, but the figures are not the ones in the transaction. Read the amounts again.';
    return 'It balances and the amounts are right, so at least one account is wrong. Ask what the business actually received, and what it gave up or now owes.';
  }

  /* Part 2 is graded against the real answer, not against the learner's
     own totals — otherwise a wrong workpaper would grade its own errors
     as correct. When the two disagree, say which one is the problem. */
  function fieldRight(f) { return amountOf(work.fld[f.id]) === f.answer(KEY); }
  function fieldDiagnosis(f) {
    if (isNaN(amountOf(work.fld[f.id]))) return 'Nothing entered yet.';
    if (amountOf(work.fld[f.id]) === f.answer(workTotals())) {
      return 'This follows correctly from your workpaper, but the workpaper is not right yet. Fix Part 1 and this figure will come out right on its own.';
    }
    return 'Not yet. Work it out from your own column totals above rather than from memory.';
  }

  function scoreNow() {
    var rows = 0;
    LEDGER.forEach(function (r, ri) { if (rowRight(ri)) rows++; });
    return { got: rows + WORK_FIELDS.filter(fieldRight).length, total: LEDGER.length + WORK_FIELDS.length };
  }

  function renderSolve() {
    if (tab !== 'solve') { $('solve').innerHTML = ''; return; }

    var opts = '<option value="">Choose an account&hellip;</option>' + COLS.map(function (c) {
      return '<option value="' + c.k + '">' + ACCOUNT[c.k] + '</option>';
    }).join('');

    var cards = LEDGER.map(function (r, ri) {
      var sets = '';
      for (var i = 0; i < slotsFor(ri); i++) {
        var who = 'effect ' + (i + 1) + ' of transaction ' + r.id;
        sets +=
          '<div class="ws-fx">' +
            '<div class="ws-line">' +
              '<select class="ws-sel" data-fx="' + ri + '.' + i + '" aria-label="Account for ' + who + '">' + opts + '</select>' +
            '</div>' +
            '<div class="ws-line">' +
              '<div class="ws-dir">' +
                '<button type="button" data-dir="' + ri + '.' + i + '.1" aria-label="Increase, ' + who + '">+</button>' +
                '<button type="button" data-dir="' + ri + '.' + i + '.-1" aria-label="Decrease, ' + who + '">&minus;</button>' +
              '</div>' +
              '<div class="ws-amt"><input data-amt="' + ri + '.' + i + '" inputmode="decimal" autocomplete="off" aria-label="Amount for ' + who + '" /></div>' +
            '</div>' +
          '</div>';
      }
      return '<div class="ws-tx" data-tx="' + ri + '">' +
        '<div class="ws-tx-head"><span class="ws-no">' + r.id + '</span><p class="ws-text">' + WORK_TX[r.id] + '</p></div>' +
        '<div class="ws-set">' + sets + '</div>' +
        '<div class="ws-foot"><button type="button" class="ws-hint" data-hint="' + ri + '">' + ICON.bulb + 'Hint</button></div>' +
        '<div data-note="' + ri + '"></div>' +
      '</div>';
    }).join('');

    var fields = WORK_FIELDS.map(function (f, fi) {
      return '<div class="ws-field" data-field="' + f.id + '">' +
        '<label for="ws-' + f.id + '">' + f.label + '</label>' +
        '<div class="ws-line">' +
          '<div class="ws-amt"><input id="ws-' + f.id + '" data-fld="' + f.id + '" inputmode="decimal" autocomplete="off" /></div>' +
          '<button type="button" class="ws-hint" data-fhint="' + fi + '">' + ICON.bulb + 'Hint</button>' +
        '</div>' +
        '<div data-fnote="' + f.id + '"></div>' +
      '</div>';
    }).join('');

    $('solve').innerHTML =
      '<div class="wrap">' +
        '<div class="ws-head">' +
          '<h1>Solve it yourself</h1>' +
          '<p>Seven transactions, nothing filled in. Record each one and watch your own workpaper balance &mdash; or fail to. Then report the five figures the three statements are built from. Every line has a hint, and none of them give anything away until you ask.</p>' +
        '</div>' +
        '<div class="ws-sect">Part 1 &middot; Record the transactions<i></i></div>' + cards +
        '<div class="ws-sect">Your workpaper<i></i></div><div id="solve-table"></div>' +
        '<div class="ws-sect">Part 2 &middot; Report the results<i></i></div>' +
        '<div class="ws-fields">' + fields + '</div>' +
        '<button type="button" class="ws-reset" id="ws-reset">Clear my work and start again</button>' +
      '</div>';

    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fx]'), function (el) {
      var p = el.getAttribute('data-fx').split('.');
      var v = work.fx[fxKey(p[0], p[1], 'k')];
      if (v) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-amt]'), function (el) {
      var p = el.getAttribute('data-amt').split('.');
      var v = work.fx[fxKey(p[0], p[1], 'a')];
      if (v !== undefined) el.value = v;
    });
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-fld]'), function (el) {
      var v = work.fld[el.getAttribute('data-fld')];
      if (v !== undefined) el.value = v;
    });
    Object.keys(work.hint).forEach(paintHint);
    paintDirs();
    renderSolveTable();
  }

  function paintDirs() {
    Array.prototype.forEach.call($('solve').querySelectorAll('[data-dir]'), function (b) {
      var p = b.getAttribute('data-dir').split('.');
      var on = String(work.fx[fxKey(p[0], p[1], 'd')]) === p[2];
      b.classList.toggle(p[2] === '1' ? 'on-up' : 'on-dn', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* Hint keys are the row index, or 'f' + field index. */
  function paintHint(key) {
    var lvl = work.hint[key];
    if (!lvl) return;
    var host = $('solve'), text, slot, btn, max;
    if (key.charAt(0) === 'f') {
      var f = WORK_FIELDS[Number(key.slice(1))];
      if (!f) return;
      max = f.hints.length;
      text = f.hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-fnote="' + f.id + '"]');
      btn = host.querySelector('[data-fhint="' + key.slice(1) + '"]');
    } else {
      var row = LEDGER[Number(key)];
      if (!row) return;
      var hints = WORK_HINTS[row.id] || [];
      max = hints.length;
      text = hints[Math.min(lvl, max) - 1];
      slot = host.querySelector('[data-note="' + key + '"]');
      btn = host.querySelector('[data-hint="' + key + '"]');
    }
    if (!slot || !text) return;
    slot.innerHTML = '<div class="ws-note tip">' + text + '</div>';
    if (!btn) return;
    btn.innerHTML = ICON.bulb + (lvl >= max ? 'No more hints' : 'Another hint');
    btn.disabled = lvl >= max;
  }

  /* The learner's own workpaper: their entries, their totals, their proof. */
  function renderSolveTable() {
    var t = workTotals();
    var head = '<tr class="grp"><th class="lab"></th><th colspan="3">ASSETS</th><th class="op">=</th>' +
      '<th colspan="2">LIABILITIES</th><th class="op">+</th><th colspan="4">STOCKHOLDERS&rsquo; EQUITY</th></tr>';

    var acct = '<tr class="acct"><th class="lab">Trans.</th>';
    COLS.forEach(function (c, i) {
      if (i === 3) acct += '<th class="op">=</th>';
      if (i === 5) acct += '<th class="op">+</th>';
      acct += '<th>' + c.head + '</th>';
    });
    acct += '</tr>';

    var body = LEDGER.map(function (r, ri) {
      var line = {};
      for (var i = 0; i < slotsFor(ri); i++) {
        var e = effect(ri, i);
        if (e) line[e.k] = (line[e.k] || 0) + e.d * e.a;
      }
      var out = '<tr><td class="lab">(' + r.id + ')</td>';
      COLS.forEach(function (c, i) {
        if (i === 3) out += '<td class="op"></td>';
        if (i === 5) out += '<td class="op"></td>';
        out += '<td>' + (line[c.k] ? money(line[c.k]) : '') + '</td>';
      });
      return out + '</tr>';
    }).join('');

    var foot = '<tr class="totals"><td class="lab">Totals</td>';
    COLS.forEach(function (c, i) {
      if (i === 3) foot += '<td class="op">=</td>';
      if (i === 5) foot += '<td class="op">+</td>';
      foot += '<td>' + (t[c.k] ? signed(t[c.k]) : '&mdash;') + '</td>';
    });
    foot += '</tr>';

    var A = assetsOf(t), C = claimsOf(t);
    var bar;
    if (A === 0 && C === 0) {
      bar = '<div class="proof" style="background:var(--surface-3);color:var(--muted)">' +
        '<span>Record an effect above and this workpaper fills itself in</span></div>';
    } else if (A === C) {
      bar = '<div class="proof"><span>Assets ' + signed(A) + '</span><span>=</span>' +
        '<span>Liabilities + Equity ' + signed(C) + '</span><span>' + ICON.check + '</span></div>';
    } else {
      bar = '<div class="proof" style="background:var(--bad)"><span>Assets ' + signed(A) + '</span>' +
        '<span>vs</span><span>' + signed(C) + '</span><span>out by ' + signed(Math.abs(A - C)) + '</span></div>';
    }

    $('solve-table').innerHTML =
      '<div class="card"><div class="tbl-scroll"><table class="led"><thead>' + head + acct +
      '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + bar + '</div>';
  }

  function rowTouched(ri) {
    for (var i = 0; i < slotsFor(ri); i++) {
      if (work.fx[fxKey(ri, i, 'k')] || work.fx[fxKey(ri, i, 'd')] || work.fx[fxKey(ri, i, 'a')]) return true;
    }
    return false;
  }

  function gradeSolve() {
    LEDGER.forEach(function (r, ri) {
      var card = $('solve').querySelector('[data-tx="' + ri + '"]');
      var note = $('solve').querySelector('[data-note="' + ri + '"]');
      var ok = rowRight(ri);
      var touched = rowTouched(ri);
      card.classList.toggle('right', ok);
      card.classList.toggle('wrong', !ok && touched);
      card.querySelector('.ws-no').innerHTML = ok ? ICON.check : r.id;
      if (ok || !touched) { var stale = card.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
      else if (!work.hint[ri]) note.innerHTML = '<div class="ws-note bad">' + rowDiagnosis(ri) + '</div>';
    });
    WORK_FIELDS.forEach(function (f, fi) {
      var box = $('solve').querySelector('[data-field="' + f.id + '"]');
      var note = $('solve').querySelector('[data-fnote="' + f.id + '"]');
      var ok = fieldRight(f);
      var touched = String(work.fld[f.id] === undefined ? '' : work.fld[f.id]).trim() !== '';
      box.classList.toggle('right', ok);
      box.classList.toggle('wrong', !ok && touched);
      if (ok || !touched) { var old = box.querySelector('.ws-note.bad'); if (old) old.remove(); }
      else if (!work.hint['f' + fi]) note.innerHTML = '<div class="ws-note bad">' + fieldDiagnosis(f) + '</div>';
    });
    renderControls();
    var first = $('solve').querySelector('.ws-tx.wrong, .ws-field.wrong');
    if (first) first.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'center' });
  }

  function motionOK() {
    return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* Editing a row withdraws the mark on it: a red border that survives the
     correction would be telling the learner about a mistake they just fixed. */
  function clearMark(ri) {
    var card = $('solve').querySelector('[data-tx="' + ri + '"]');
    if (!card) return;
    card.classList.remove('right', 'wrong');
    card.querySelector('.ws-no').textContent = LEDGER[ri].id;
    var bad = card.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function bindSolve() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-fx]');
      if (!sel) return;
      var p = sel.getAttribute('data-fx').split('.');
      work.fx[fxKey(p[0], p[1], 'k')] = sel.value;
      clearMark(p[0]); saveWork(); renderSolveTable(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var a = e.target.closest('[data-amt]');
      if (a) {
        var p = a.getAttribute('data-amt').split('.');
        work.fx[fxKey(p[0], p[1], 'a')] = a.value;
        clearMark(p[0]); saveWork(); renderSolveTable(); renderControls();
        return;
      }
      var f = e.target.closest('[data-fld]');
      if (!f) return;
      work.fld[f.getAttribute('data-fld')] = f.value;
      var box = f.closest('.ws-field');
      box.classList.remove('right', 'wrong');
      var bad = box.querySelector('.ws-note.bad');
      if (bad) bad.remove();
      saveWork(); renderControls();
    });

    host.addEventListener('click', function (e) {
      var d = e.target.closest('[data-dir]');
      if (d) {
        var p = d.getAttribute('data-dir').split('.');
        var cur = String(work.fx[fxKey(p[0], p[1], 'd')]);
        work.fx[fxKey(p[0], p[1], 'd')] = cur === p[2] ? '' : Number(p[2]);
        clearMark(p[0]); paintDirs(); saveWork(); renderSolveTable(); renderControls();
        return;
      }
      var h = e.target.closest('[data-hint]');
      if (h) { bumpHint(h.getAttribute('data-hint'), WORK_HINTS[LEDGER[Number(h.getAttribute('data-hint'))].id].length); return; }
      var fh = e.target.closest('[data-fhint]');
      if (fh) { bumpHint('f' + fh.getAttribute('data-fhint'), WORK_FIELDS[Number(fh.getAttribute('data-fhint'))].hints.length); return; }
      if (e.target.closest('#ws-reset')) {
        if (!window.confirm('Clear every answer and hint on this worksheet?')) return;
        work.fx = {}; work.fld = {}; work.hint = {};
        saveWork(); renderSolve(); renderControls();
        $('solve').scrollIntoView({ block: 'start' });
      }
    });
  }

  function bumpHint(key, max) {
    work.hint[key] = Math.min((work.hint[key] || 0) + 1, max);
    paintHint(key);
    saveWork();
  }

  /* ---------- chrome ---------- */
  function renderControls() {
    var solving = tab === 'solve';
    $('btn-prev').hidden = solving;
    $('btn-next').hidden = solving;
    $('prog-label').parentNode.hidden = solving;
    $('ws-score').hidden = !solving;
    $('btn-check').hidden = !solving;
    if (solving) {
      var sc = scoreNow();
      $('ws-score').querySelector('b').innerHTML = sc.got + ' of ' + sc.total;
      $('ws-score').classList.toggle('done', sc.got === sc.total);
      $('btn-check').textContent = sc.got === sc.total ? 'All correct' : 'Check my work';
      return;
    }
    $('btn-prev').disabled = cur === 0;
    $('btn-next').disabled = cur === TOTAL - 1;
    $('next-label').textContent =
      cur === TOTAL - 1 ? 'Done' : (cur === LEC - 1 ? 'Start' : 'Next');
    $('prog-label').textContent = inLecture()
      ? 'Lecture ' + (cur + 1) + ' of ' + LEC
      : 'Step ' + stepNo() + ' of ' + LAST;
    var rail = '';
    for (var i = 0; i < TOTAL; i++) {
      if (i === LEC) rail += '<i class="gap"></i>';
      rail += '<i class="' + (i < LEC ? 'lec' : 'stp') +
        (i < cur ? ' done' : '') + (i === cur ? ' now' : '') + '"></i>';
    }
    $('rail').innerHTML = rail;
  }

  function renderTabs() {
    ['guide', 'table', 'solve'].forEach(function (t) {
      $('tab-' + t).classList.toggle('on', tab === t);
      $('pane-' + t).classList.toggle('on', tab === t);
      // aria-selected needs role="tab"; aria-current is valid on a plain button.
      if (tab === t) $('tab-' + t).setAttribute('aria-current', 'true');
      else $('tab-' + t).removeAttribute('aria-current');
    });
  }

  function render() {
    renderTabs();
    if (tab === 'solve') $('guide').innerHTML = '';
    else renderGuide();
    renderTable();
    renderSolve();
    renderControls();
  }

  /* ---------- navigation ---------- */
  function hashFor(n) {
    return n < LEC ? 'lecture-' + (n + 1) : 'step-' + (n - LEC);
  }
  function indexFromHash() {
    var h = (location.hash || '').replace('#', '');
    var m = /^lecture-(\d+)$/.exec(h);
    if (m) return Math.min(LEC - 1, Math.max(0, Number(m[1]) - 1));
    m = /^step-(\d+)$/.exec(h);
    if (m) return Math.min(TOTAL - 1, LEC + Math.max(0, Number(m[1])));
    return null;
  }
  function go(n, fromHistory) {
    var next = Math.max(0, Math.min(TOTAL - 1, n));
    if (next === cur) return;
    cur = next;
    save();
    render();
    if (!fromHistory && window.history && history.pushState) {
      history.pushState({ step: cur }, '', '#' + hashFor(cur));
    }
  }
  window.addEventListener('popstate', function () {
    var n = indexFromHash();
    if (n !== null && n !== cur) { cur = n; save(); render(); }
  });

  $('btn-prev').addEventListener('click', function () { go(cur - 1); });
  $('btn-next').addEventListener('click', function () { go(cur + 1); });
  $('tab-guide').addEventListener('click', function () { tab = 'guide'; save(); render(); });
  $('tab-table').addEventListener('click', function () { tab = 'table'; save(); render(); });
  $('tab-solve').addEventListener('click', function () { tab = 'solve'; save(); render(); });
  $('btn-check').addEventListener('click', gradeSolve);

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea, select')) return;
    if (tab === 'solve') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#12141a' : '#1e3a5f');
  }
  $('btn-theme').addEventListener('click', function () {
    theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  loadWork();
  if (!theme) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  var fromUrl = indexFromHash();
  if (fromUrl !== null) cur = fromUrl;
  render();
  bindSolve();
  if (window.history && history.replaceState) {
    history.replaceState({ step: cur }, '', '#' + hashFor(cur));
  }
})();

</script>
