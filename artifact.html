  /* ---- live refreshes, so typing never rebuilds the sheet under the cursor ---- */
  function refreshProof5() {
    var host = $('solve');
    if (w5.sheet === 'a') {
      var slot = host.querySelector('.xl-legend');
      if (slot) {
        var b = slot.querySelector('b');
        if (b) b.textContent = extCount();
        var offs = [];
        var n = slot.nextSibling;
        while (n && n.classList && n.classList.contains('gl-off')) { offs.push(n); n = n.nextSibling; }
        if (offs.length) {
          var tmp = document.createElement('div');
          tmp.innerHTML = sheetAProof();
          offs.forEach(function (o, i) { if (tmp.children[i]) o.outerHTML = tmp.children[i].outerHTML; });
        }
      }
      var af = adjFoot();
      var foot = host.querySelector('.xl-foot');
      if (foot) {
        var autos = foot.querySelectorAll('.xl-c.auto');
        if (autos.length === 2) {
          autos[0].textContent = af.d ? money2(af.d) : '';
          autos[1].textContent = af.c ? money2(af.c) : '';
          var cls = af.d && af.d === af.c ? ' ok' : (af.d || af.c ? ' off' : '');
          autos[0].className = 'xl-c auto' + cls;
          autos[1].className = 'xl-c auto' + cls;
        }
      }
    }
  }

  function refreshInstr5() {
    var host = $('solve').querySelector('.instr');
    var sc = score5();
    if (host) {
      Array.prototype.forEach.call(host.querySelectorAll('.instr-row'), function (row, i) {
        var x = INSTRUCTIONS5[i], got = sc.parts[x.id], cap = sc.caps[x.id];
        var done = cap > 0 && got === cap;
        row.classList.toggle('done', done);
        row.querySelector('.instr-k').innerHTML = done ? ICON.check : x.id + '.';
        row.querySelector('.instr-n').textContent = got + '/' + cap;
      });
    }
    Array.prototype.forEach.call($('solve').querySelectorAll('.wbk-t'), function (t, i) {
      var x = INSTRUCTIONS5[i], got = sc.parts[x.id], cap = sc.caps[x.id];
      t.classList.toggle('done', cap > 0 && got === cap);
      t.classList.toggle('part', got > 0 && got < cap);
    });
    var counts = $('solve').querySelectorAll('.sw-count b');
    if (counts.length === 2) { counts[0].textContent = sc.total - sc.got; counts[1].textContent = sc.got; }
  }

  function refreshJdoc5(kind, ei) {
    var t = j5totals(kind, ei);
    var doc = $('solve').querySelector('[data-j5doc="' + kind + '.' + ei + '"]');
    if (!doc) return;
    var foot = doc.querySelectorAll('.gl-foot span');
    foot[1].innerHTML = t.d ? money2(t.d) : '&mdash;';
    foot[2].innerHTML = t.c ? money2(t.c) : '&mdash;';
    var st = jState5(kind, ei);
    var off = doc.querySelector('.gl-off');
    off.className = 'gl-off ' + (st === 'draft' ? 'idle' : ((st === 'balanced' || st === 'posted') ? 'ok' : 'off'));
    off.innerHTML = st === 'draft'
      ? '<span>Enter the debit and the credit</span><span>&mdash;</span>'
      : (st === 'balanced' || st === 'posted')
        ? '<span>In balance</span><span>' + ICON.check + '</span>'
        : '<span>Out of balance</span><span>' + dollars(Math.abs(t.off)) + '</span>';
    var pill = doc.querySelector('.pill');
    if (!isPosted5(kind, ei)) {
      pill.className = 'pill ' + (st === 'draft' ? 'draft' : (st === 'balanced' ? 'ready' : 'off'));
      pill.textContent = st === 'draft' ? 'Draft' : (st === 'balanced' ? 'Balanced' : 'Out of balance');
    }
    var post = doc.querySelector('[data-jpost5]');
    if (post) post.disabled = !canPost5(kind, ei);
    doc.classList.remove('graded-bad');
    var bad = doc.querySelector('.ws-note.bad');
    if (bad) bad.remove();
  }

  function goSheet5(id) {
    w5.sheet = id;
    saveWork5(); renderSolve5(); renderControls();
    var h = $('solve').querySelector('.wbk');
    if (h) h.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  }
  function goEntry5(kind, n) {
    var list = entries5(kind), v = Math.max(0, Math.min(list.length - 1, n));
    if (kind === 'c') w5.atC = v; else w5.atD = v;
    saveWork5(); renderSolve5(); renderControls();
  }

  function gradeSolve5() {
    w5.graded = 1;
    var host = $('solve');
    if (w5.sheet === 'a') {
      renderSolve5();
      host = $('solve');
      ADJ5.forEach(function (p) {
        ['d', 'c'].forEach(function (side) {
          var el = host.querySelector('[data-adj5="' + p[side] + '.' + side + '"]');
          if (el) el.classList.toggle('wrong', String(adjVal(p[side], side)).trim() !== '' && !adjRight(p));
        });
      });
      EXTCOLS.forEach(function (c) {
        var el = host.querySelector('[data-tot5="' + c + '"]');
        if (el) el.classList.toggle('wrong', String(w5.tot[c] || '').trim() !== '' && !totRight5(c));
        var ne = host.querySelector('[data-ni5="' + c + '"]');
        var wantHere = c === 'id' || c === 'bc';
        var typedHere = String(w5.ni[c] || '').trim() !== '';
        if (ne) ne.classList.toggle('wrong', typedHere && !(wantHere && niRight(c)));
      });
    }
    if (w5.sheet === 'b') {
      BS_FIELDS.forEach(function (f) {
        var box = host.querySelector('[data-bsf="' + f.id + '"]');
        if (!box) return;
        var ok = bsRight(f), touched = String(w5.bs[f.id] === undefined ? '' : w5.bs[f.id]).trim() !== '';
        box.classList.toggle('right', ok);
        box.classList.toggle('wrong', !ok && touched);
        var note = host.querySelector('[data-note5="b' + f.id + '"]');
        var old = note.querySelector('.ws-note.bad');
        if (old) old.remove();
        if (ok || !touched || w5.hint['b' + f.id]) return;
        note.innerHTML = '<div class="ws-note bad">Not yet. ' + f.hints[0] + '</div>';
      });
    }
    if (w5.sheet === 'c' || w5.sheet === 'd') {
      var kind = w5.sheet;
      entries5(kind).forEach(function (e, ei) {
        var doc = host.querySelector('[data-j5doc="' + kind + '.' + ei + '"]');
        if (!doc) return;
        var note = host.querySelector('[data-note5="' + kind + ei + '"]');
        var ok = j5Right(kind, ei), touched = j5Touched(kind, ei);
        doc.classList.toggle('graded-bad', !ok && touched);
        if (ok || !touched) { var stale = doc.querySelector('.ws-note.bad'); if (stale) stale.remove(); }
        else if (!w5.hint[kind + ei]) note.innerHTML = '<div class="ws-note bad">' + j5Diag(kind, ei) + '</div>';
      });
      Array.prototype.forEach.call(host.querySelectorAll('[data-j5]'), function (c) {
        var parts = c.getAttribute('data-j5').split('.');
        c.classList.toggle('bad', j5Touched(parts[0], Number(parts[1])) && !j5Right(parts[0], Number(parts[1])));
      });
    }
    if (w5.sheet === 'e') {
      permanent5().forEach(function (a) {
        var row = host.querySelector('[data-trow5="' + a.k + '"]');
        if (!row) return;
        var ok = tbRight5(a.k), touched = tbTouched5(a.k);
        row.classList.toggle('right', ok);
        row.classList.toggle('wrong', !ok && touched);
        var note = host.querySelector('[data-note5="t' + a.k + '"]');
        if (!note) return;
        var old = note.querySelector('.ws-note.bad');
        if (old) old.remove();
        if (ok || !touched || w5.hint['t' + a.k]) return;
        var wrongCol = (a.up === 'D' && String(tbVal5(a.k, 'c')).trim() !== '') ||
                       (a.up === 'C' && String(tbVal5(a.k, 'd')).trim() !== '');
        note.innerHTML = '<div class="ws-note bad">' + (wrongCol
          ? 'Right idea, wrong column. This account carries a ' + (a.up === 'D' ? 'debit' : 'credit') + ' balance.'
          : 'Not the balance closing left this account with.') + '</div>';
      });
    }
    refreshInstr5();
    renderControls();
    var first = $('solve').querySelector('.bsf-field.wrong, .doc-je.graded-bad, .wp-row.wrong, .xl-row.bad, .xl-in.wrong');
    if (first) first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  /* The name box and formula bar follow the selection without a re-render. */
  function selectCell5(el) {
    var ref = el.getAttribute('data-ref5');
    if (!ref) return;
    cur5 = ref;
    var n = $('solve').querySelector('#xl-name'), f = $('solve').querySelector('#xl-fx-t');
    if (n) n.textContent = ref;
    if (f) f.textContent = el.getAttribute('data-desc5') + '   ·   ' + el.getAttribute('data-formula5');
  }

  function bindSolve5() {
    var host = $('solve');

    host.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-ja5]');
      if (!sel) return;
      var parts = sel.getAttribute('data-ja5').split('.');
      w5.fx[sel.getAttribute('data-ja5') + '.k'] = sel.value;
      refreshJdoc5(parts[0], Number(parts[1]));
      saveWork5(); refreshInstr5(); renderControls();
    });

    host.addEventListener('input', function (e) {
      var t = e.target;
      var jd = t.closest('[data-jd5]'), jc = t.closest('[data-jc5]');
      if (jd || jc) {
        var el = jd || jc, key = el.getAttribute(jd ? 'data-jd5' : 'data-jc5');
        var col = jd ? 'd' : 'c', other = jd ? 'c' : 'd';
        w5.fx[key + '.' + col] = el.value;
        var twin = host.querySelector('[data-j' + other + '5="' + key + '"]');
        if (el.value && twin && twin.value) { twin.value = ''; w5.fx[key + '.' + other] = ''; }
        if (twin) twin.classList.toggle('muted', !!el.value);
        el.classList.remove('muted');
        var p = key.split('.');
        refreshJdoc5(p[0], Number(p[1]));
        saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var aj = t.closest('[data-adj5]');
      if (aj) {
        w5.adj[aj.getAttribute('data-adj5')] = t.value;
        aj.classList.remove('wrong');
        refreshProof5(); saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var to = t.closest('[data-tot5]');
      if (to) {
        w5.tot[to.getAttribute('data-tot5')] = t.value;
        to.classList.remove('wrong');
        refreshProof5(); saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var ni = t.closest('[data-ni5]');
      if (ni) {
        w5.ni[ni.getAttribute('data-ni5')] = t.value;
        ni.classList.remove('wrong');
        refreshProof5(); saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var bs = t.closest('[data-bs5]');
      if (bs) {
        w5.bs[bs.getAttribute('data-bs5')] = t.value;
        var box = bs.closest('.bsf-field');
        box.classList.remove('right', 'wrong');
        var bad = box.querySelector('.ws-note.bad');
        if (bad) bad.remove();
        var pr = host.querySelector('.sw-panel-bd .gl-off');
        if (pr) {
          var ta = amountOf(w5.bs.ta), tc = amountOf(w5.bs.tc);
          var idle = isNaN(ta) || isNaN(tc);
          pr.className = 'gl-off ' + (idle ? 'idle' : (ta === tc ? 'ok' : 'off'));
          pr.innerHTML = idle
            ? '<span>Fill in both totals to prove the statement</span><span>&mdash;</span>'
            : ta === tc
              ? '<span>Your balance sheet balances at ' + money2(ta) + '</span><span>' + ICON.check + '</span>'
              : '<span>Your two totals are out by</span><span>' + money2(Math.abs(ta - tc)) + '</span>';
        }
        saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var tb = t.closest('[data-tb5]');
      if (tb) {
        var pp = tb.getAttribute('data-tb5').split('.');
        w5.tb[pp[0] + '.' + pp[1]] = tb.value;
        var row = host.querySelector('[data-trow5="' + pp[0] + '"]');
        if (row) row.classList.remove('right', 'wrong');
        var nb = host.querySelector('[data-note5="t' + pp[0] + '"] .ws-note.bad');
        if (nb) nb.remove();
        saveWork5(); refreshInstr5(); renderControls();
        return;
      }
      var tt = t.closest('[data-ttot5]');
      if (tt) {
        w5.ttot[tt.getAttribute('data-ttot5')] = tt.value;
        var p2 = host.querySelector('.sw-panel-bd .gl-off');
        if (p2) {
          var td = amountOf(w5.ttot.d), tc2 = amountOf(w5.ttot.c);
          var idle2 = isNaN(td) && isNaN(tc2);
          p2.className = 'gl-off ' + (idle2 ? 'idle' : (td === tc2 ? 'ok' : 'off'));
          p2.innerHTML = idle2
            ? '<span>Total both columns when every row is entered</span><span>&mdash;</span>'
            : td === tc2
              ? '<span>Your columns agree at ' + dollars(td || 0) + '</span><span>' + ICON.check + '</span>'
              : '<span>Your columns are out by</span><span>' + dollars(Math.abs((td || 0) - (tc2 || 0))) + '</span>';
        }
        saveWork5(); refreshInstr5(); renderControls();
      }
    });

    /* Selecting a cell is a focus event as often as a click. */
    host.addEventListener('focusin', function (e) {
      var c = e.target.closest('[data-ref5]');
      if (c) selectCell5(c);
    });

    host.addEventListener('click', function (e) {
      var cell = e.target.closest('[data-ref5]');
      if (cell) selectCell5(cell);

      var sh = e.target.closest('[data-sheet5]');
      if (sh) { goSheet5(sh.getAttribute('data-sheet5')); return; }

      var jump = e.target.closest('[data-jump5]');
      if (jump) {
        var L = jump.getAttribute('data-jump5');
        var target = host.querySelector('[data-ref5^="' + L + '"]');
        var wrap = host.querySelector('#xl-wrap');
        if (target && wrap) {
          wrap.scrollTo({ left: target.offsetLeft - wrap.querySelector('.xl-h').offsetWidth - 4,
            behavior: reduceMotion() ? 'auto' : 'smooth' });
        }
        return;
      }

      var ex = e.target.closest('[data-ext5]');
      if (ex) {
        var bits = ex.getAttribute('data-ext5').split('.');
        if (w5.ext[bits[0]] === bits[1]) delete w5.ext[bits[0]];
        else w5.ext[bits[0]] = bits[1];
        saveWork5();
        renderSolve5(); renderControls();
        var again = host.querySelector('[data-ext5="' + bits[0] + '.' + bits[1] + '"]');
        if (again) { again.focus(); selectCell5(again); }
        return;
      }

      var j = e.target.closest('[data-j5]');
      if (j) { var b = j.getAttribute('data-j5').split('.'); goEntry5(b[0], Number(b[1])); return; }
      var jp = e.target.closest('[data-jprev5]');
      if (jp) { var kk = jp.getAttribute('data-jprev5'); goEntry5(kk, atOf(kk) - 1); return; }
      var jn = e.target.closest('[data-jnext5]');
      if (jn) { var kk2 = jn.getAttribute('data-jnext5'); goEntry5(kk2, atOf(kk2) + 1); return; }

      var po = e.target.closest('[data-jpost5]');
      if (po) {
        var pb = po.getAttribute('data-jpost5').split('.'), kind = pb[0], ei = Number(pb[1]);
        if (!canPost5(kind, ei)) return;
        w5.posted[kind + '.' + ei] = 1;
        var list = entries5(kind), next = ei;
        for (var n = 1; n <= list.length; n++) {
          var q = (ei + n) % list.length;
          if (!isPosted5(kind, q)) { next = q; break; }
        }
        if (kind === 'c') w5.atC = next; else w5.atD = next;
        saveWork5(); renderSolve5(); renderControls();
        return;
      }
      var un = e.target.closest('[data-junp5]');
      if (un) {
        delete w5.posted[un.getAttribute('data-junp5')];
        saveWork5(); renderSolve5(); renderControls();
        return;
      }

      var x = e.target.closest('[data-hclose]');
      if (x) {
        var hk = x.getAttribute('data-hclose');
        w5.shut[hk] = 1; paintHint5(hk); saveWork5();
        return;
      }
      var h = e.target.closest('[data-hint5]');
      if (h) { bump5(h.getAttribute('data-hint5')); return; }

      if (e.target.closest('#ws-reset5')) {
        if (!window.confirm('Clear the whole workbook — worksheet, balance sheet, both journals and the trial balance?')) return;
        w5.adj = {}; w5.ext = {}; w5.tot = {}; w5.ni = {}; w5.bs = {};
        w5.fx = {}; w5.posted = {}; w5.tb = {}; w5.ttot = {};
        w5.hint = {}; w5.shut = {}; w5.atC = 0; w5.atD = 0; w5.graded = 0;
        saveWork5(); renderSolve5(); renderControls();
      }
    });
  }


  /* ---------- the course home ----------
     Everything on this page is read off the modules themselves: how many
     screens each has, how many have been opened, and what the worksheet
     scores. Nothing about the course is written down twice. */

  function scoreOf(i) { return [scoreNow, score2, score3, score4, score5][i](); }
  function progressOf(i) {
    var m = MODULES[i], f = flowFor(i);
    var seen = f.filter(function (x) { return read[m.id] && read[m.id][x.id]; }).length;
    var sc = scoreOf(i);
    return { seen: seen, of: f.length, got: sc.got, total: sc.total,
      started: seen > 0 || sc.got > 0, done: (f.length === 0 || seen === f.length) && sc.got === sc.total };
  }
  function courseTotals() {
    var got = 0, total = 0, started = 0, done = 0;
    MODULES.forEach(function (m, i) {
      var p = progressOf(i);
      got += p.got; total += p.total;
      if (p.started) started++;
      if (p.done) done++;
    });
    return { got: got, total: total, started: started, done: done };
  }
  /* Where "continue" should land: the first module not yet finished. */
  function nextModule() {
    for (var i = 0; i < MODULES.length; i++) if (!progressOf(i).done) return i;
    return 0;
  }

  /* The cycle the course is named after, and the module that works each step. */
  function cycleViz() {
    var byId = {};
    MODULES.forEach(function (m, i) { byId[m.id] = { m: m, i: i }; });
    return '<ol class="cyc">' + COURSE.steps.map(function (s, i) {
      var owner = byId[s[1]];
      return '<li><i>' + (i + 1) + '</i><b>' + s[0] + '</b>' +
        '<em class="cyc-tag m' + owner.i + '">' + owner.m.code + '</em></li>';
    }).join('') + '</ol>' +
    '<p class="cyc-loop">' + ICON.next + 'and the next period starts again at one</p>';
  }

  function renderHome() {
    var t = courseTotals();
    var next = nextModule();
    var anyWork = t.got > 0 || t.started > 0;

    var cards = MODULES.map(function (m, i) {
      var p = progressOf(i);
      var bits = [];
      if (LECTURES[m.id]) bits.push('<span class="hm-bit">Lecture</span>');
      if (p.of) bits.push('<span class="hm-bit' + (p.seen === p.of ? ' on' : '') + '">' +
        p.seen + ' of ' + p.of + ' explained</span>');
      bits.push('<span class="hm-bit' + (p.got === p.total ? ' on' : '') + '">' +
        p.got + ' of ' + p.total + ' correct</span>');
      return '<button type="button" class="hm-mod' + (p.done ? ' done' : '') + '" data-open-mod="' + i + '">' +
        '<span class="hm-mod-top">' +
          '<span class="hm-code m' + i + '">' + m.code + '</span>' +
          '<b>' + m.name + '</b>' +
          '<span class="hm-go">' + (p.done ? ICON.check : ICON.next) + '</span>' +
        '</span>' +
        '<span class="hm-co">' + m.co + ' &middot; ' + m.sub + '</span>' +
        '<span class="hm-blurb">' + m.blurb + '</span>' +
        '<span class="hm-bits">' + bits.join('') + '</span>' +
        '</button>';
    }).join('');

    $('home').innerHTML =
      '<div class="wrap fade">' +
        '<div class="hm-head">' +
          '<div class="hm-eyebrow">Course</div>' +
          '<h1>' + COURSE.name + '</h1>' +
          '<p class="hm-sub">' + COURSE.sub + '</p>' +
          '<p class="hm-blurb-lg">' + COURSE.blurb + '</p>' +
        '</div>' +
        '<div class="state">' +
          '<div class="state-cap">' + ICON.pulse + (anyWork ? 'Where you are' : 'Not started yet') + '</div>' +
          '<div class="hm-stats">' +
            '<span class="hm-stat"><b>' + t.done + '</b><u>of ' + MODULES.length + ' modules finished</u></span>' +
            '<span class="hm-stat"><b>' + t.got + '</b><u>of ' + t.total + ' marks earned</u></span>' +
          '</div>' +
          '<div class="hm-meter"><i style="width:' + (t.total ? (t.got / t.total * 100).toFixed(1) : 0) + '%"></i></div>' +
        '</div>' +
        '<button type="button" class="p5-open" data-open-mod="' + next + '">' + ICON.next +
          (anyWork ? 'Continue &mdash; ' + MODULES[next].code + ' ' + MODULES[next].name
                   : 'Start the course &mdash; ' + MODULES[0].code) + '</button>' +
        '<div class="sect">The cycle, and where each step is worked<i></i></div>' +
        viz('The accounting cycle', cycleViz(),
          'The nine steps of the accounting cycle in order, each labelled with the module that works it: analysing transactions in LO 2.1, journalizing, posting and the trial balance in LO 2.2, the adjustments and the adjusted trial balance in LO 2.3, and the statements, closing entries and post-closing trial balance in LO 2.4.', true) +
        '<div class="sect">Modules<i></i></div>' +
        '<div class="hm-mods">' + cards + '</div>' +
        '<div class="sect">How a module works<i></i></div>' +
        '<div class="pr-note">' +
          '<p><b>Lecture</b> is the theory, in six topics that build on one another. ' +
            '<b>Guide</b> works the problem one step at a time with the theory applied. ' +
            '<b>Reference</b> holds the source material, never the answers. ' +
            '<b>Solve</b> asks the printed instructions and marks what you do.</p>' +
          '<p>The last module is a problem rather than a lesson: it has no lecture and explains nothing, ' +
            'because by then you have met all of it.</p>' +
        '</div>' +
        '<div style="height:10px"></div>' +
      '</div>';
    animateViz($('home'));
  }

  /* ---------- chrome ---------- */
  function renderModBtn() {
    var m = MODULES[mod];
    $('mod-name').textContent = m.co;
    $('mod-sub').innerHTML = m.code + ' &middot; ' + m.sub;
  }

  function renderSheet() {
    $('mod-list').innerHTML =
      '<button class="mod-card home" data-gohome><i>Course</i><b>' + COURSE.name + '</b>' +
      '<span>Back to the module list, the cycle and where you have got to.</span></button>' +
      MODULES.map(function (m, i) {
      var f = flowFor(i);
      var n = f.filter(function (x) { return read[m.id] && read[m.id][x.id]; }).length;
      var line = f.length ? n + ' of ' + f.length + ' explained' : m.count;
      return '<button class="mod-card' + (i === mod ? ' on' : '') + '" data-mod="' + i + '">' +
        '<i>' + m.code + '</i><b>' + m.name + '</b>' +
        '<span>' + m.blurb + '</span>' +
        '<em>' + m.co + ' &middot; ' + line + '</em>' +
        '</button>';
    }).join('');
  }

  function openSheet(on) {
    if (on) renderSheet();
    $('sheet').classList.toggle('on', on);
  }

  function renderControls() {
    if (tab === 'lecture') {
      /* One page, read top to bottom. Nothing to advance and nothing to score. */
      $('btn-prev').hidden = true;
      $('btn-next').hidden = true;
      $('prog-label').parentNode.hidden = true;
      $('ws-score').hidden = true;
      $('btn-check').hidden = true;
      $('rail').innerHTML = '';
      return;
    }
    var solving = tab === 'solve';
    $('btn-prev').hidden = solving;
    $('btn-next').hidden = solving;
    $('prog-label').parentNode.hidden = solving;
    $('ws-score').hidden = !solving;
    $('btn-check').hidden = !solving;
    if (solving) {
      var sc = [scoreNow, score2, score3, score4, score5][mod]();
      $('ws-score').querySelector('b').innerHTML = sc.got + ' of ' + sc.total;
      $('ws-score').classList.toggle('done', sc.got === sc.total);
      $('btn-check').textContent = sc.got === sc.total ? 'All correct' : 'Check my work';
      return;
    }
    var dash = view === 'dash';
    var done = readCount();
    var FLOW = flow();
    if (!FLOW.length) {
      /* A problem module has one screen. Nothing to advance to, so the pager
         and the progress rail would both be lying. */
      $('btn-prev').hidden = true;
      $('btn-next').hidden = true;
      $('prog-label').parentNode.hidden = true;
      $('rail').innerHTML = '';
      return;
    }
    $('btn-prev').hidden = dash;
    $('btn-prev').disabled = false;
    $('btn-next').disabled = false;
    $('prev-label').textContent = 'All entries';
    if (dash) {
      $('prog-label').textContent = done + ' of ' + FLOW.length + ' explained';
      $('next-label').textContent = done === 0 ? 'Start' : (done === FLOW.length ? 'Review' : 'Continue');
    } else {
      $('prog-label').textContent = (at < entryCount() ? (MODULES[mod].unit || 'Entry ') : 'Report ') + (at + 1) + ' of ' + FLOW.length;
      $('next-label').textContent = at === FLOW.length - 1 ? 'Finish' : 'Next';
    }
    $('rail').innerHTML = FLOW.map(function (f, i) {
      return '<i class="stp' + (isRead(f.id) ? ' done' : '') + (!dash && i === at ? ' now' : '') + '"></i>';
    }).join('');
  }

  function renderTabs() {
    ['lecture', 'guide', 'table', 'solve'].forEach(function (t) {
      $('tab-' + t).classList.toggle('on', tab === t);
      $('pane-' + t).classList.toggle('on', !atHome && tab === t);
      // aria-selected needs role="tab"; aria-current is valid on a plain button.
      if (tab === t) $('tab-' + t).setAttribute('aria-current', 'true');
      else $('tab-' + t).removeAttribute('aria-current');
    });
  }

  function render() {
    /* At home there is no module open, so the tabs and the pager have nothing
       to point at. Hiding them is the difference between a front door and a
       screen with three dead controls on it. */
    document.querySelector('.tabs').hidden = atHome;
    $('controls').hidden = atHome;
    $('pane-home').classList.toggle('on', atHome);
    $('mark').classList.toggle('on', atHome);
    if (atHome) {
      renderHome();
      renderTabs();
      $('mod-name').textContent = COURSE.name;
      $('mod-sub').innerHTML = COURSE.sub;
      $('mod-btn').classList.add('flat');
      $('mod-btn').setAttribute('aria-disabled', 'true');
      return;
    }
    $('home').innerHTML = '';
    $('mod-btn').classList.remove('flat');
    $('mod-btn').removeAttribute('aria-disabled');
    /* P2.12 has no lecture: it is a problem, not a topic. Falling back rather
       than showing an empty pane, in case the tab was saved from a module
       that does have one. */
    var hasLec = !!LECTURES[modId()];
    $('tab-lecture').hidden = !hasLec;
    $('tab-sep-lecture').hidden = !hasLec;
    if (tab === 'lecture' && !hasLec) tab = 'guide';
    renderTabs();
    renderModBtn();
    if (tab === 'lecture') renderLecture(); else $('lecture').innerHTML = '';
    if (tab === 'solve' || tab === 'lecture') $('guide').innerHTML = '';
    else renderGuide();
    [renderTable, renderTable2, renderTable3, renderTable4, renderTable5][mod]();
    if (tab !== 'solve') $('solve').innerHTML = '';
    else [renderSolve, renderSolve2, renderSolve3, renderSolve4, renderSolve5][mod]();
    renderControls();
  }

  /* ---------- navigation ---------- */
  function hashFor() {
    if (atHome) return 'home';
    return MODULES[mod].id + (view === 'dash' ? '' : '-' + flow()[at].id);
  }
  function stateFromHash() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'home') return { home: true };
    var m = /^(lo2[1234]|p212)(?:-(.+))?$/.exec(h);
    if (!m) return null;
    var mi = 0;
    for (var q = 0; q < MODULES.length; q++) if (MODULES[q].id === m[1]) mi = q;
    if (!m[2]) return { mod: mi, view: 'dash', at: 0 };
    var f = flowFor(mi);
    for (var i = 0; i < f.length; i++) if (f[i].id === m[2]) return { mod: mi, view: 'detail', at: i };
    return { mod: mi, view: 'dash', at: 0 };
  }
  function apply(st, fromHistory) {
    if (!st) return;
    if (st.home) {
      if (atHome) return;
      if (view === 'dash') dashScroll = $('guide').parentNode.scrollTop;
      atHome = true;
      save(); render();
      focusPane($('home'));
      if (!fromHistory && window.history && history.pushState) {
        history.pushState({ home: true }, '', '#home');
      }
      return;
    }
    if (st.mod === undefined) st.mod = mod;
    var leavingHome = atHome;
    atHome = false;
    if (!leavingHome && st.mod === mod && st.view === view && st.at === at) return;
    if (view === 'dash') dashScroll = $('guide').parentNode.scrollTop;
    if (st.mod !== mod) { mod = st.mod; dashScroll = 0; }
    view = st.view;
    at = st.at;
    if (view === 'detail') readSet()[flow()[at].id] = 1;
    save();
    render();
    if (leavingHome) focusPane($(tab === 'lecture' ? 'lecture' : 'guide'));
    else if (tab === 'guide') focusGuideHeading();
    if (!fromHistory && window.history && history.pushState) {
      history.pushState({ mod: mod, view: view, at: at }, '', '#' + hashFor());
    }
  }

  /* Arriving on a whole new screen, the heading is where a reader starts. */
  function focusPane(el) {
    var h = el.querySelector('h1');
    if (!h) return;
    h.setAttribute('tabindex', '-1');
    h.focus({ preventScroll: true });
  }
  /* Navigation replaces the whole pane, so the new heading takes focus and a
     screen reader reads from there. Announcing the pane as a live region
     instead made every Next press re-read the entire screen. Focus is moved
     only on a real navigation — never on boot or a tab switch, where the user
     already knows where they are and stealing focus would be rude. */
  function focusGuideHeading() {
    var h = $('guide').querySelector('h1');
    if (!h) return;
    h.setAttribute('tabindex', '-1');
    h.focus({ preventScroll: true });
  }

  function openAt(n) { apply({ view: 'detail', at: Math.max(0, Math.min(flow().length - 1, n)) }); }
  function toDash() { apply({ view: 'dash', at: at }); }

  window.addEventListener('popstate', function () {
    var st = stateFromHash();
    if (!st) return;
    if (st.home) {
      if (atHome) return;
      atHome = true; save(); render(); focusPane($('home'));
      return;
    }
    var wasHome = atHome;
    atHome = false;
    if (!wasHome && st.mod === mod && st.view === view && st.at === at) return;
    mod = st.mod; view = st.view; at = st.at;
    if (view === 'detail') readSet()[flow()[at].id] = 1;
    save(); render();
    if (tab === 'guide') focusGuideHeading();
  });

  /* Opening an entry from the dashboard. */
  $('lecture').addEventListener('click', function (e) {
    var jump = e.target.closest('[data-lec]');
    if (jump) {
      e.preventDefault();
      var sec = document.getElementById('lec-' + jump.getAttribute('data-lec'));
      if (sec) {
        sec.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
        sec.focus({ preventScroll: true });
      }
      return;
    }
    var go = e.target.closest('[data-gotab]');
    if (go) { tab = go.getAttribute('data-gotab'); save(); render(); }
  });

  $('guide').addEventListener('click', function (e) {
    var card = e.target.closest('[data-open]');
    if (card) { openAt(Number(card.getAttribute('data-open'))); return; }
    var go = e.target.closest('[data-gotab]');
    if (go) { tab = go.getAttribute('data-gotab'); save(); render(); }
  });

  $('mark').addEventListener('click', function () { apply({ home: true }); });
  $('home').addEventListener('click', function (e) {
    var card = e.target.closest('[data-open-mod]');
    if (!card) return;
    var i = Number(card.getAttribute('data-open-mod'));
    /* A module nobody has touched opens on its lecture; one already under way
       opens where the work is. P2.12 has no lecture, so it always opens on
       the problem. */
    var p = progressOf(i);
    tab = (LECTURES[MODULES[i].id] && !p.started) ? 'lecture' : 'guide';
    apply({ mod: i, view: 'dash', at: 0 });
  });
  $('mod-btn').addEventListener('click', function () {
    if (atHome) return;
    openSheet(true);
  });
  $('sheet').addEventListener('click', function (e) {
    if (e.target.closest('[data-gohome]')) { openSheet(false); apply({ home: true }); return; }
    var card = e.target.closest('[data-mod]');
    if (card) {
      var n = Number(card.getAttribute('data-mod'));
      openSheet(false);
      if (n !== mod) apply({ mod: n, view: 'dash', at: 0 });
      return;
    }
    if (e.target === $('sheet')) openSheet(false);   // tapping the scrim closes it
  });

  $('btn-prev').addEventListener('click', toDash);
  $('btn-next').addEventListener('click', function () {
    if (!flow().length) return;
    if (view === 'dash') {
      var f = flow(), next = 0;
      while (next < f.length && isRead(f[next].id)) next++;
      openAt(next === f.length ? 0 : next);
      return;
    }
    if (at === flow().length - 1) toDash();
    else openAt(at + 1);
  });
  $('tab-lecture').addEventListener('click', function () { tab = 'lecture'; save(); render(); });
  $('tab-guide').addEventListener('click', function () { tab = 'guide'; save(); render(); });
  $('tab-table').addEventListener('click', function () { tab = 'table'; save(); render(); });
  $('tab-solve').addEventListener('click', function () { tab = 'solve'; save(); render(); });
  $('btn-check').addEventListener('click', function () {
    [gradeSolve, gradeSolve2, gradeSolve3, gradeSolve4, gradeSolve5][mod]();
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea, select')) return;
    if (e.key === 'Escape' && $('sheet').classList.contains('on')) { openSheet(false); return; }
    if (tab === 'solve') return;
    if (view === 'dash') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); openAt(at + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); openAt(at - 1); }
    if (e.key === 'Escape') { e.preventDefault(); toDash(); }
  });

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#12141a' : '#1e3a5f');
  }
  $('btn-theme').addEventListener('click', function () {
    theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    save();
  });

  /* ---------- boot ---------- */
  load();
  loadWork();
  loadWork2();
  loadWork3();
  loadWork4();
  loadWork5();
  if (!theme) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  var fromUrl = stateFromHash();
  if (fromUrl && fromUrl.home) { atHome = true; }
  else if (fromUrl) {
    atHome = false;
    mod = fromUrl.mod; view = fromUrl.view; at = fromUrl.at;
    if (view === 'detail') readSet()[flow()[at].id] = 1;
  }
  render();
  bindSolve();
  bindSolve2();
  bindSolve3();
  bindSolve4();
  bindSolve5();
  if (window.history && history.replaceState) {
    history.replaceState({ mod: mod, view: view, at: at }, '', '#' + hashFor());
  }
})();

</script>
