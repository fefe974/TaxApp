<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Governmental Accounting — an example-first course. Lesson 1: Distinguishing Government and Not-for-Profit Organizations.">
<title>Governmental Accounting — Lesson 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  /* =====================================================================
     Design tokens — "ledger paper meets civic engraving".
     Light palette lives on bare :root; dark redefines tokens only.
     ===================================================================== */
  :root {
    color-scheme: light;

    --paper: #f3f5f0;
    --card: #fcfdfb;
    --panel: #ecefe8;
    --ink: #1d2823;
    --ink-soft: #5c6b62;
    --line: #d8ded2;
    --line-strong: #aeb9ac;

    --pine: #17453b;
    --pine-hover: #1d5747;
    --pine-ink: #eef3ec;
    --pine-glow: #c8dbd2;
    --heading: #17453b;

    --brass: #9a7827;
    --brass-ink: #7c5f1c;
    --brass-ground: #f5efdd;
    --brass-line: #ddd0a4;

    --biz-ground: #e7eef5;
    --biz-ink: #2b5d8a;
    --gov-ground: #e6efe9;
    --gov-ink: #1f6a55;
    --nfp-ground: #f5efdd;
    --nfp-ink: #7c5f1c;

    --ok: #2c6e49;
    --ok-ground: #e4efe7;
    --ok-line: #b7d2c1;
    --err: #b0413e;
    --err-ground: #f7e9e8;
    --err-line: #e3c0bd;

    --radius: 8px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;

      --paper: #131a16;
      --card: #1a231e;
      --panel: #212c26;
      --ink: #e2e9e2;
      --ink-soft: #a2b1a6;
      --line: #2d3a32;
      --line-strong: #4a5a50;

      --pine: #1e4a3e;
      --pine-hover: #276050;
      --pine-ink: #e9f1ea;
      --pine-glow: #93c3ac;
      --heading: #b6d8c6;

      --brass: #c8a548;
      --brass-ink: #d8bb6b;
      --brass-ground: #292319;
      --brass-line: #4c4126;

      --biz-ground: #1d2b38;
      --biz-ink: #8ab5dc;
      --gov-ground: #1d3229;
      --gov-ink: #8cc9ab;
      --nfp-ground: #292319;
      --nfp-ink: #d8bb6b;

      --ok: #7cc79a;
      --ok-ground: #1d3229;
      --ok-line: #315a47;
      --err: #e08a83;
      --err-ground: #392220;
      --err-line: #5d3532;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ---------- Header ---------- */
  .ga-header {
    background: var(--pine);
    color: var(--pine-ink);
    border-bottom: 3px solid var(--brass);
  }
  .ga-header-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 20px 18px;
  }
  .ga-brand {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 14px;
    width: fit-content;
  }
  .ga-seal {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--brass);
    box-shadow: inset 0 0 0 3.5px var(--pine), inset 0 0 0 4.5px rgba(200, 165, 72, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 17px;
    letter-spacing: 0.04em;
    color: #d8bb6b;
  }
  .ga-eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfae5a;
    margin: 0 0 1px;
    font-weight: 600;
  }
  .ga-course-title {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 600;
    margin: 0;
    line-height: 1.15;
    letter-spacing: 0.01em;
  }

  /* ---------- Progress bar ---------- */
  .ga-progress-wrap {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .ga-progress-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 9px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ga-progress-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .ga-progress-track {
    flex: 1;
    height: 4px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .ga-progress-fill {
    height: 100%;
    width: 0;
    background: var(--brass);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  /* ---------- Layout & type scale ---------- */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 34px 20px 80px;
  }
  h2 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.005em;
    text-wrap: balance;
    margin: 0 0 10px;
    color: var(--heading);
  }
  h3 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    margin: 30px 0 8px;
    color: var(--heading);
    text-wrap: balance;
  }
  p { margin: 0 0 15px; }
  .ga-section-kicker {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-ink);
    font-weight: 700;
    margin: 0 0 8px;
  }
  .ga-lead {
    font-size: 18.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  /* ---------- Callouts: three distinct voices ---------- */

  /* Real-world example — brass-framed panel */
  .ga-example {
    background: var(--brass-ground);
    border: 1px solid var(--brass-line);
    border-radius: var(--radius);
    padding: 15px 18px;
    margin: 20px 0;
  }
  .ga-example .ga-callout-tag { color: var(--brass-ink); }

  /* Professor's note — serif marginalia with a double rule, no fill */
  .ga-note {
    border-left: 7px double var(--line-strong);
    padding: 2px 0 2px 18px;
    margin: 22px 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--ink);
  }
  .ga-note .ga-callout-tag {
    font-family: var(--sans);
    font-style: normal;
    color: var(--ink-soft);
  }

  /* Key takeaway — the section's one bold moment: solid pine */
  .ga-takeaway {
    background: var(--pine);
    color: var(--pine-ink);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 22px 0;
  }
  .ga-takeaway .ga-callout-tag { color: var(--pine-glow); }
  .ga-takeaway strong, .ga-takeaway em { color: #fff; }

  .ga-callout-tag {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .ga-example p:last-child, .ga-note p:last-child, .ga-takeaway p:last-child { margin-bottom: 0; }

  /* ---------- Figures ---------- */
  .ga-figure {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin: 22px 0;
  }
  .ga-figure-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 auto 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  /* two compare cards (hook, scoreboards) */
  .ga-compare-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .ga-cc {
    border-radius: var(--radius);
    padding: 14px;
    font-size: 14px;
  }
  .ga-cc strong { display: block; font-size: 15px; margin-bottom: 8px; }
  .ga-cc p { margin: 10px 0 0; color: var(--ink-soft); }
  .ga-cc ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  .ga-cc li { margin-bottom: 4px; }
  .ga-cc-biz { background: var(--biz-ground); }
  .ga-cc-biz strong { color: var(--biz-ink); }
  .ga-cc-gov { background: var(--gov-ground); }
  .ga-cc-gov strong { color: var(--gov-ink); }
  .ga-cc-flow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .ga-cc-flow span {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
  }
  .ga-cc-flow .ga-arrow {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-soft);
  }
  .ga-board-line {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    font-weight: 600;
  }
  .ga-yes { color: var(--ok); }
  .ga-no { color: var(--err); }

  /* stat strip */
  .ga-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 20px 0;
  }
  .ga-stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--brass);
    border-radius: var(--radius);
    padding: 14px 12px 12px;
    text-align: center;
  }
  .ga-stat strong {
    display: block;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.15;
    color: var(--heading);
  }
  .ga-stat span {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.4;
    display: inline-block;
    margin-top: 3px;
  }

  /* entity tree */
  .ga-tree { text-align: center; }
  .ga-tree-root {
    display: inline-block;
    background: var(--pine);
    color: var(--pine-ink);
    font-weight: 600;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 14.5px;
  }
  .ga-tree-stem {
    width: 1px;
    height: 16px;
    background: var(--line-strong);
    margin: 0 auto;
  }
  .ga-tree-branches {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 14px;
    text-align: left;
  }
  .ga-tree-node {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    background: var(--panel);
  }
  .ga-tree-node > strong { display: block; font-size: 15px; color: var(--heading); font-family: var(--serif); }
  .ga-tree-node > small { display: block; color: var(--ink-soft); margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
  .ga-tree-leaves { display: grid; gap: 8px; }
  .ga-leaf {
    background: var(--gov-ground);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .ga-leaf strong { display: block; color: var(--gov-ink); }
  .ga-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ga-chips span {
    background: var(--brass-ground);
    border: 1px solid var(--brass-line);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12.5px;
    color: var(--brass-ink);
    font-weight: 600;
  }

  /* comparison table */
  .ga-table-wrap { overflow-x: auto; }
  table.ga-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    min-width: 520px;
  }
  .ga-table th, .ga-table td {
    border: 1px solid var(--line);
    padding: 10px 12px;
    text-align: left;
    vertical-align: top;
    line-height: 1.55;
  }
  .ga-table th { font-size: 13px; }
  .ga-table td:first-child, .ga-table th:first-child {
    background: var(--panel);
    font-weight: 700;
    width: 21%;
  }
  .ga-th-biz { background: var(--biz-ground); color: var(--biz-ink); }
  .ga-th-gov { background: var(--gov-ground); color: var(--gov-ink); }
  .ga-th-nfp { background: var(--nfp-ground); color: var(--nfp-ink); }

  /* GASB flow diagram */
  .ga-flow { text-align: center; }
  .ga-flow-node {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 16px;
    font-weight: 600;
    font-size: 14px;
    color: var(--heading);
  }
  .ga-flow-node small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 12px; }
  .ga-flow-people { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
  .ga-flow-people small { color: var(--pine-glow); }
  .ga-flow-arrow {
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 7px 0;
    font-weight: 700;
  }
  .ga-flow-branches {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto;
    max-width: 620px;
  }
  .ga-flow-branches .ga-flow-node { display: block; padding: 9px 8px; }
  .ga-grant-strip {
    margin-top: 16px;
    background: var(--brass-ground);
    border: 1px dashed var(--brass-line);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13.5px;
    color: var(--brass-ink);
    font-weight: 600;
  }

  /* recap list */
  .ga-five {
    counter-reset: five;
    list-style: none;
    padding: 0;
    margin: 18px 0;
    display: grid;
    gap: 10px;
  }
  .ga-five li {
    counter-increment: five;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px 12px 54px;
    position: relative;
  }
  .ga-five li::before {
    content: counter(five);
    position: absolute;
    left: 14px;
    top: 13px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--pine);
    color: var(--pine-ink);
    font-family: var(--serif);
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Home / lesson cards ---------- */
  .ga-home-intro { margin-bottom: 28px; }
  .ga-home-intro h2 { font-size: 32px; }
  .ga-lesson-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 14px;
    cursor: pointer;
    font: inherit;
    line-height: inherit;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .ga-lesson-card:hover {
    border-color: var(--line-strong);
    box-shadow: 0 2px 10px rgba(23, 69, 59, 0.08);
  }
  .ga-lesson-card .ga-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    align-items: center;
  }
  .ga-card-lo {
    background: var(--gov-ground);
    color: var(--gov-ink);
    border-radius: 999px;
    padding: 2px 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .ga-lesson-card h2 { font-size: 22px; margin: 0 0 6px; }
  .ga-lesson-card p { margin: 0; color: var(--ink-soft); font-size: 14.5px; }
  .ga-card-status {
    display: inline-block;
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gov-ink);
  }
  .ga-lesson-card.ga-locked {
    cursor: default;
    background: transparent;
    border-style: dashed;
  }
  .ga-lesson-card.ga-locked:hover { border-color: var(--line); box-shadow: none; }
  .ga-lesson-card.ga-locked h2, .ga-lesson-card.ga-locked p { color: var(--ink-soft); }
  .ga-lesson-card.ga-locked .ga-card-lo { background: var(--panel); color: var(--ink-soft); }

  /* ---------- Section navigation ---------- */
  .ga-section-nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 36px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
  .ga-btn {
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    border-radius: var(--radius);
    padding: 11px 20px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--heading);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .ga-btn:hover { background: var(--panel); }
  .ga-btn-primary {
    background: var(--pine);
    border-color: var(--pine);
    color: var(--pine-ink);
  }
  .ga-btn-primary:hover { background: var(--pine-hover); border-color: var(--pine-hover); }
  .ga-btn:disabled { opacity: 0.45; cursor: default; }
  .ga-btn:disabled:hover { background: var(--card); }
  .ga-btn-primary:disabled:hover { background: var(--pine); }

  /* ---------- Quiz ---------- */
  .ga-quiz-progress {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .ga-quiz-question {
    font-family: var(--serif);
    font-size: 21px;
    color: var(--heading);
    margin: 0 0 18px;
    line-height: 1.4;
    text-wrap: balance;
  }
  .ga-choice {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .ga-choice:hover:not(:disabled) { border-color: var(--line-strong); }
  .ga-choice:disabled { cursor: default; }
  .ga-choice-letter {
    flex: none;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--ink-soft);
    font-family: var(--serif);
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ga-choice.ga-correct { border-color: var(--ok); background: var(--ok-ground); font-weight: 600; }
  .ga-choice.ga-correct .ga-choice-letter { background: var(--ok); border-color: var(--ok); color: var(--paper); }
  .ga-choice.ga-wrong { border-color: var(--err); background: var(--err-ground); }
  .ga-choice.ga-wrong .ga-choice-letter { background: var(--err); border-color: var(--err); color: var(--paper); }
  .ga-quiz-feedback {
    border-radius: var(--radius);
    padding: 13px 16px;
    margin: 16px 0;
    font-size: 14.5px;
  }
  .ga-quiz-feedback.ga-fb-right { background: var(--ok-ground); border: 1px solid var(--ok-line); }
  .ga-quiz-feedback.ga-fb-wrong { background: var(--err-ground); border: 1px solid var(--err-line); }
  .ga-quiz-feedback strong { display: block; margin-bottom: 2px; }
  .ga-fb-right strong { color: var(--ok); }
  .ga-fb-wrong strong { color: var(--err); }
  .ga-quiz-score { text-align: center; padding: 28px 0 8px; }
  .ga-quiz-score .ga-score-big {
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
    font-size: 52px;
    font-weight: 600;
    color: var(--heading);
    line-height: 1.1;
  }
  .ga-quiz-score p {
    color: var(--ink-soft);
    max-width: 46ch;
    margin-left: auto;
    margin-right: auto;
  }
  .ga-score-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
  }

  /* ---------- Footer ---------- */
  .ga-footer {
    border-top: 1px solid var(--line);
    padding: 20px 20px 40px;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .ga-footer-inner { max-width: 560px; margin: 0 auto; }

  /* ---------- Responsive ---------- */

     ===================================================================== */

  function parseHash() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'lesson' && parts[1]) {
      var id = parseInt(parts[1], 10);
      var step = parseInt(parts[2], 10);
      return { view: 'lesson', id: id, step: isNaN(step) ? 0 : step };
    }
    return { view: 'home' };
  }

  function go(hash) { location.hash = hash; }

  function render() {
    var route = parseHash();
    if (route.view === 'lesson') {
      var lesson = null;
      for (var i = 0; i < LESSONS.length; i++) {
        if (LESSONS[i].id === route.id) { lesson = LESSONS[i]; }
      }
      if (lesson) {
        var totalSteps = lesson.sections.length + 1;
        var step = Math.min(Math.max(route.step, 0), totalSteps - 1);
        renderLesson(lesson, step);
        return;
      }
    }
    renderHome();
  }

  /* =====================================================================
     Home view
     ===================================================================== */

  function renderHome() {
    progressWrap.hidden = true;
    document.title = 'Governmental Accounting — Lessons';

    var html = [
      '<div class="ga-home-intro">',
      '  <p class="ga-section-kicker">Course home</p>',
      '  <h2>Learn it the way a professor teaches it</h2>',
      '  <p class="ga-lead">Plain language, a concrete example for every concept, and side-by-side comparisons of business, government, and not-for-profit. Pick a lesson to begin.</p>',
      '</div>'
    ];

    LESSONS.forEach(function (lesson) {
      var furthest = state.furthest[lesson.id] || 0;
      var best = state.bestScore[lesson.id];
      var status;
      if (typeof best === 'number') {
        status = 'Knowledge check best score: ' + best + ' / ' + lesson.quiz.length + ' &middot; Revisit any time';
      } else if (furthest > 0) {
        status = 'In progress &mdash; resume where you left off';
      } else {
        status = 'Start lesson &rarr;';
      }
      html.push(
        '<button type="button" class="ga-lesson-card" data-lesson="' + lesson.id + '">' +
        '  <span class="ga-card-meta"><span class="ga-card-lo">' + lesson.lo + '</span><span>Lesson ' + lesson.id + '</span><span>&middot;</span><span>About ' + lesson.minutes + ' minutes</span></span>' +
        '  <h2>' + lesson.title + '</h2>' +
        '  <p>' + lesson.blurb + '</p>' +
        '  <span class="ga-card-status">' + status + '</span>' +
        '</button>'
      );
    });

    html.push(
      '<div class="ga-lesson-card ga-locked">' +
      '  <span class="ga-card-meta"><span class="ga-card-lo">Coming soon</span><span>Lesson 2</span></span>' +
      '  <h2>Applying the foundations</h2>' +
      '  <p>The next lessons dig deep into application — funds, budgets, and journal entries built on the overview you learn here.</p>' +
      '</div>'
    );

    app.innerHTML = html.join('\n');

    var cards = app.querySelectorAll('.ga-lesson-card[data-lesson]');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () {
        var id = parseInt(this.getAttribute('data-lesson'), 10);
        var resume = state.furthest[id] || 0;
        go('#/lesson/' + id + '/' + resume);
      });
    }
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Lesson view
     ===================================================================== */

  function renderLesson(lesson, step) {
    var totalSteps = lesson.sections.length + 1;
    var isQuiz = step === lesson.sections.length;

    // track furthest step reached
    if ((state.furthest[lesson.id] || 0) < step) {
      state.furthest[lesson.id] = step;
      saveState();
    }

    progressWrap.hidden = false;
    progressLabel.textContent = isQuiz
      ? 'Knowledge check'
      : 'Section ' + (step + 1) + ' of ' + lesson.sections.length;
    progressFill.style.width = Math.round(((step + 1) / totalSteps) * 100) + '%';

    if (isQuiz) {
      renderQuiz(lesson);
      return;
    }

    var section = lesson.sections[step];
    document.title = lesson.title + ' — ' + 'Section ' + (step + 1);

    var nextLabel = step === lesson.sections.length - 1
      ? 'Knowledge check &rarr;'
      : 'Next section &rarr;';

    app.innerHTML = [
      '<p class="ga-section-kicker">' + lesson.lo + ' &middot; ' + section.kicker + '</p>',
      '<h2>' + section.title + '</h2>',
      section.html,
      '<div class="ga-section-nav">',
      '  <button type="button" class="ga-btn" id="ga-prev">' + (step === 0 ? '&larr; All lessons' : '&larr; Previous') + '</button>',
      '  <button type="button" class="ga-btn ga-btn-primary" id="ga-next">' + nextLabel + '</button>',
      '</div>'
    ].join('\n');

    document.getElementById('ga-prev').addEventListener('click', function () {
      if (step === 0) { go('#/'); } else { go('#/lesson/' + lesson.id + '/' + (step - 1)); }
    });
    document.getElementById('ga-next').addEventListener('click', function () {
      go('#/lesson/' + lesson.id + '/' + (step + 1));
    });
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Knowledge check
     ===================================================================== */

  function renderQuiz(lesson) {
    document.title = lesson.title + ' — Knowledge check';
    if (!quizRun || quizRun.lessonId !== lesson.id) {
      quizRun = { lessonId: lesson.id, index: 0, correct: 0, answered: false };
    }

    if (quizRun.index >= lesson.quiz.length) {
      renderQuizScore(lesson);
      return;
    }

    var q = lesson.quiz[quizRun.index];
    var html = [
      '<p class="ga-section-kicker">' + lesson.lo + ' &middot; Knowledge check</p>',
      '<h2>Prove you own it</h2>',
      '<p class="ga-quiz-progress">Question ' + (quizRun.index + 1) + ' of ' + lesson.quiz.length + '</p>',
      '<p class="ga-quiz-question">' + q.question + '</p>'
    ];
    q.choices.forEach(function (choice, i) {
      html.push(
        '<button type="button" class="ga-choice" data-choice="' + i + '">' +
        '<span class="ga-choice-letter" aria-hidden="true">' + String.fromCharCode(65 + i) + '</span>' +
        '<span>' + choice + '</span>' +
        '</button>'
      );
    });
    html.push('<div id="ga-quiz-feedback"></div>');
    html.push(
      '<div class="ga-section-nav">' +
      '  <button type="button" class="ga-btn" id="ga-quiz-back">&larr; Back to lesson</button>' +
      '  <button type="button" class="ga-btn ga-btn-primary" id="ga-quiz-next" disabled>' +
      (quizRun.index === lesson.quiz.length - 1 ? 'See my score &rarr;' : 'Next question &rarr;') +
      '  </button>' +
      '</div>'
    );

    app.innerHTML = html.join('\n');

    var choices = app.querySelectorAll('.ga-choice');
    var nextBtn = document.getElementById('ga-quiz-next');
    var feedbackBox = document.getElementById('ga-quiz-feedback');

    for (var i = 0; i < choices.length; i++) {
      choices[i].addEventListener('click', function () {
        if (quizRun.answered) { return; }
        quizRun.answered = true;
        var picked = parseInt(this.getAttribute('data-choice'), 10);
        var right = picked === q.answer;
        if (right) { quizRun.correct += 1; }

        for (var j = 0; j < choices.length; j++) {
          choices[j].disabled = true;
          var idx = parseInt(choices[j].getAttribute('data-choice'), 10);
          if (idx === q.answer) { choices[j].classList.add('ga-correct'); }
          else if (idx === picked && !right) { choices[j].classList.add('ga-wrong'); }
        }

        feedbackBox.innerHTML =
          '<div class="ga-quiz-feedback ' + (right ? 'ga-fb-right' : 'ga-fb-wrong') + '">' +
          '<strong>' + (right ? 'Correct.' : 'Not quite.') + '</strong>' +
          q.explain +
          '</div>';
        nextBtn.disabled = false;
      });
    }

    nextBtn.addEventListener('click', function () {
      quizRun.index += 1;
      quizRun.answered = false;
      renderQuiz(lesson);
    });
    document.getElementById('ga-quiz-back').addEventListener('click', function () {
      go('#/lesson/' + lesson.id + '/' + (lesson.sections.length - 1));
    });
    window.scrollTo(0, 0);
  }

  function renderQuizScore(lesson) {
    var total = lesson.quiz.length;
    var score = quizRun.correct;
    var prevBest = state.bestScore[lesson.id];
    if (typeof prevBest !== 'number' || score > prevBest) {
      state.bestScore[lesson.id] = score;
      saveState();
    }

    var message;
    if (score === total) {
      message = 'Perfect. You own this lesson — the foundations are set for the applied lessons ahead.';
    } else if (score >= Math.ceil(total * 0.6)) {
      message = 'Solid work. Skim the sections behind the questions you missed, and these ideas will lock in.';
    } else {
      message = 'This lesson is the foundation for the whole course, so it is worth another pass. Review the sections and try again — repetition is how it sticks.';
    }

    app.innerHTML = [
      '<p class="ga-section-kicker">' + lesson.lo + ' &middot; Knowledge check</p>',
      '<div class="ga-quiz-score">',
      '  <div class="ga-score-big">' + score + ' / ' + total + '</div>',
      '  <p>' + message + '</p>',
      '  <div class="ga-score-actions">',
      '    <button type="button" class="ga-btn" id="ga-review">Review lesson</button>',
      '    <button type="button" class="ga-btn" id="ga-retake">Retake quiz</button>',
      '    <button type="button" class="ga-btn ga-btn-primary" id="ga-home">Back to lessons</button>',
      '  </div>',
      '</div>'
    ].join('\n');

    document.getElementById('ga-review').addEventListener('click', function () {
      quizRun = null;
      go('#/lesson/' + lesson.id + '/0');
    });
    document.getElementById('ga-retake').addEventListener('click', function () {
      quizRun = { lessonId: lesson.id, index: 0, correct: 0, answered: false };
      renderQuiz(lesson);
    });
    document.getElementById('ga-home').addEventListener('click', function () {
      quizRun = null;
      go('#/');
    });
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Boot
     ===================================================================== */

  document.getElementById('ga-brand').addEventListener('click', function () { go('#/'); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
