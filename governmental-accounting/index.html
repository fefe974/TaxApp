<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Governmental Accounting — an example-first course. Lesson 1: Distinguishing Government and Not-for-Profit Organizations.">
<title>Governmental Accounting — Lesson 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  /* =====================================================================
     Tokens. Light lives on bare :root so the un-stamped (system) state
     always resolves; dark is redefined twice — once for the OS preference,
     once for the explicit toggle — so both directions win.
     ===================================================================== */
  :root {
    color-scheme: light;

    --bg: #f4f6f5;
    --bar: rgba(244, 246, 245, 0.82);
    --surface: #ffffff;
    --surface-2: #eaeeec;
    --surface-3: #dfe5e2;

    --ink: #0f1a16;
    --ink-2: #556259;
    --ink-3: #82918a;
    --line: #e2e8e5;
    --line-2: #ccd6d1;

    --accent: #0e9f6e;
    --accent-ink: #07724c;
    --accent-btn: #0b8159;
    --accent-btn-hover: #096f4c;
    --on-accent: #ffffff;
    --accent-soft: #e7f6ef;
    --accent-glow: rgba(11, 129, 89, 0.26);

    --takeaway-bg: linear-gradient(135deg, #0b8159, #065f43);
    --takeaway-ink: #e8faf2;
    --takeaway-tag: #8fd9bd;

    --biz: #2f6fed;
    --biz-ink: #1f56c4;
    --biz-soft: #eaf1fe;
    --gov: #0e9f6e;
    --gov-ink: #07724c;
    --gov-soft: #e7f6ef;
    --nfp: #b5730a;
    --nfp-ink: #92590a;
    --nfp-soft: #fdf3e2;

    --ok: #0b8159;
    --ok-soft: #e7f6ef;
    --bad: #cf4b45;
    --bad-soft: #fdecec;

    --r-xs: 8px;
    --r-sm: 12px;
    --r: 16px;
    --r-lg: 22px;
    --shadow-1: 0 1px 2px rgba(15, 26, 22, 0.05), 0 4px 14px rgba(15, 26, 22, 0.05);
    --shadow-2: 0 2px 6px rgba(15, 26, 22, 0.07), 0 16px 36px rgba(15, 26, 22, 0.10);

    --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a0f0d;
      --bar: rgba(10, 15, 13, 0.82);
      --surface: #121a17;
      --surface-2: #1a2420;
      --surface-3: #232f2a;
      --ink: #e9f0ec;
      --ink-2: #9aaba3;
      --ink-3: #74857d;
      --line: #212d28;
      --line-2: #32423b;
      --accent: #2fd39a;
      --accent-ink: #5ee0ab;
      --accent-btn: #2fd39a;
      --accent-btn-hover: #4ade9e;
      --on-accent: #04231a;
      --accent-soft: #11291f;
      --accent-glow: rgba(47, 211, 154, 0.22);
      --takeaway-bg: linear-gradient(135deg, #15382c, #0e2620);
      --takeaway-ink: #dcf5e9;
      --takeaway-tag: #61c69f;
      --biz: #7fadf5;
      --biz-ink: #9cc2f8;
      --biz-soft: #131f2e;
      --gov: #2fd39a;
      --gov-ink: #5ee0ab;
      --gov-soft: #11291f;
      --nfp: #e0b25e;
      --nfp-ink: #e8c581;
      --nfp-soft: #272013;
      --ok: #3ddb9f;
      --ok-soft: #11291f;
      --bad: #f28b84;
      --bad-soft: #2c1817;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
      --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.45), 0 18px 40px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0f0d;
    --bar: rgba(10, 15, 13, 0.82);
    --surface: #121a17;
    --surface-2: #1a2420;
    --surface-3: #232f2a;
    --ink: #e9f0ec;
    --ink-2: #9aaba3;
    --ink-3: #74857d;
    --line: #212d28;
    --line-2: #32423b;
    --accent: #2fd39a;
    --accent-ink: #5ee0ab;
    --accent-btn: #2fd39a;
    --accent-btn-hover: #4ade9e;
    --on-accent: #04231a;
    --accent-soft: #11291f;
    --accent-glow: rgba(47, 211, 154, 0.22);
    --takeaway-bg: linear-gradient(135deg, #15382c, #0e2620);
    --takeaway-ink: #dcf5e9;
    --takeaway-tag: #61c69f;
    --biz: #7fadf5;
    --biz-ink: #9cc2f8;
    --biz-soft: #131f2e;
    --gov: #2fd39a;
    --gov-ink: #5ee0ab;
    --gov-soft: #11291f;
    --nfp: #e0b25e;
    --nfp-ink: #e8c581;
    --nfp-soft: #272013;
    --ok: #3ddb9f;
    --ok-soft: #11291f;
    --bad: #f28b84;
    --bad-soft: #2c1817;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.45), 0 18px 40px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  .ga-mono {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ---------------- Top bar ---------------- */
  .ga-topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: var(--bar);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .ga-topbar-inner {
    max-width: 1140px;
    margin: 0 auto;
    padding: 11px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .ga-brand {
    display: flex;
    align-items: center;
    gap: 11px;
    background: none;
    border: 0;
    padding: 4px;
    margin: -4px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: left;
  }
  .ga-mark {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--accent-btn);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .ga-brand-text { display: block; font-size: 15px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25; }
  .ga-brand-sub { display: block; color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .ga-icon-btn {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .ga-icon-btn:hover { border-color: var(--line-2); color: var(--ink); }
  .ga-icon-btn svg { width: 17px; height: 17px; display: block; }
  .ga-sun { display: none; }
  :root[data-theme="dark"] .ga-sun { display: block; }
  :root[data-theme="dark"] .ga-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ga-sun { display: block; }
    :root:not([data-theme="light"]) .ga-moon { display: none; }
  }

  /* ---------------- Mobile stepper ---------------- */
  .ga-stepper {
    position: sticky;
    top: 59px;
    z-index: 50;
    background: var(--bar);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .ga-stepper-inner { max-width: 1140px; margin: 0 auto; padding: 10px 20px 11px; }
  .ga-seg { display: flex; gap: 4px; }
  .ga-seg button {
    flex: 1;
    height: 4px;
    padding: 8px 0;
    background: none;
    border: 0;
    cursor: pointer;
    position: relative;
  }
  .ga-seg button::after {
    content: "";
    position: absolute;
    inset: 8px 0;
    border-radius: 999px;
    background: var(--surface-3);
    transition: background 0.2s ease;
  }
  .ga-seg button[data-state="done"]::after { background: var(--accent); opacity: 0.45; }
  .ga-seg button[data-state="current"]::after { background: var(--accent); }
  .ga-step-label { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; color: var(--ink-3); }
  .ga-step-label b { color: var(--ink-2); font-weight: 500; }
  @media (min-width: 980px) { .ga-stepper { display: none; } }

  /* ---------------- Shell ---------------- */
  .ga-shell {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  main { max-width: 720px; width: 100%; padding: 30px 0 40px; }
  .ga-shell.ga-centered main { margin: 0 auto; }

  @media (min-width: 980px) {
    .ga-shell.ga-with-rail { grid-template-columns: 248px minmax(0, 1fr); gap: 48px; }
    main { padding: 40px 0 80px; }
  }

  /* ---------------- Rail ---------------- */
  /* Wins over the display rules below, which would otherwise beat the UA
     [hidden] rule and leak lesson chrome onto the home screen. */
  .ga-rail[hidden], .ga-stepper[hidden] { display: none; }
  .ga-rail { display: none; }
  @media (min-width: 980px) {
    .ga-rail {
      display: block;
      position: sticky;
      top: 84px;
      align-self: start;
      padding: 42px 0 40px;
    }
  }
  .ga-rail-lo { color: var(--accent-ink); margin-bottom: 6px; }
  .ga-rail-title {
    font-size: 14.5px;
    font-weight: 650;
    line-height: 1.35;
    letter-spacing: -0.012em;
    margin: 0 0 14px;
    color: var(--ink);
    text-wrap: balance;
  }
  .ga-rail-meter {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .ga-rail-track { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .ga-rail-fill { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 0.4s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .ga-rail-pct { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ga-rail-list { display: grid; gap: 1px; }
  .ga-rail-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: var(--r-sm);
    padding: 7px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13.5px;
    line-height: 1.4;
    color: var(--ink-2);
    transition: background 0.14s ease, color 0.14s ease;
  }
  .ga-rail-item:hover { background: var(--surface-2); color: var(--ink); }
  .ga-rail-num {
    flex: none;
    width: 19px;
    height: 19px;
    margin-top: 1px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 10.5px;
    display: grid;
    place-items: center;
  }
  .ga-rail-item[data-state="done"] .ga-rail-num { background: var(--accent-soft); color: var(--accent-ink); }
  .ga-rail-item[data-state="current"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .ga-rail-item[data-state="current"] .ga-rail-num { background: var(--accent-btn); color: var(--on-accent); }

  /* ---------------- Type ---------------- */
  h2 {
    font-size: 31px;
    font-weight: 680;
    line-height: 1.18;
    letter-spacing: -0.028em;
    text-wrap: balance;
    margin: 0 0 12px;
    color: var(--ink);
  }
  h3 {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.018em;
    margin: 32px 0 8px;
    color: var(--ink);
    text-wrap: balance;
  }
  p { margin: 0 0 15px; }
  .ga-section-kicker { color: var(--accent-ink); margin: 0 0 9px; }
  .ga-lead {
    font-size: 18px;
    line-height: 1.6;
    letter-spacing: -0.006em;
    color: var(--ink-2);
    margin: 0 0 26px;
  }

  /* ---------------- Callouts ---------------- */
  .ga-callout-tag { display: block; margin-bottom: 6px; }

  .ga-example {
    background: var(--nfp-soft);
    border-radius: var(--r);
    padding: 16px 18px;
    margin: 22px 0;
  }
  .ga-example .ga-callout-tag { color: var(--nfp-ink); }

  .ga-note {
    border-left: 2px solid var(--accent);
    padding: 2px 0 2px 16px;
    margin: 24px 0;
    color: var(--ink-2);
  }
  .ga-note .ga-callout-tag { color: var(--accent-ink); }

  .ga-takeaway {
    background: var(--takeaway-bg);
    color: var(--takeaway-ink);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    margin: 24px 0;
    box-shadow: 0 10px 30px var(--accent-glow);
  }
  .ga-takeaway .ga-callout-tag { color: var(--takeaway-tag); }
  .ga-takeaway strong, .ga-takeaway em { color: #fff; }

  .ga-example p:last-child, .ga-note p:last-child, .ga-takeaway p:last-child { margin-bottom: 0; }

  /* ---------------- Figures ---------------- */
  .ga-figure {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px;
    margin: 24px 0;
    box-shadow: var(--shadow-1);
  }
  .ga-figure-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-3);
    margin-bottom: 16px;
  }
  .ga-figure-label::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--accent);
    flex: none;
  }

  .ga-compare-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ga-cc { border-radius: var(--r); padding: 15px 16px; font-size: 14.5px; }
  .ga-cc > strong { display: block; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 10px; }
  .ga-cc p { margin: 11px 0 0; color: var(--ink-2); font-size: 13.5px; }
  .ga-cc ul { margin: 11px 0 0; padding-left: 17px; color: var(--ink-2); font-size: 13.5px; }
  .ga-cc li { margin-bottom: 5px; }
  .ga-cc-biz { background: var(--biz-soft); }
  .ga-cc-biz > strong { color: var(--biz-ink); }
  .ga-cc-gov { background: var(--gov-soft); }
  .ga-cc-gov > strong { color: var(--gov-ink); }
  .ga-cc-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 550; }
  .ga-cc-flow span { background: var(--surface); border-radius: var(--r-xs); padding: 6px 10px; }
  .ga-cc-flow .ga-arrow { background: none; padding: 0; color: var(--ink-3); }
  .ga-board-line { background: var(--surface); border-radius: var(--r-xs); padding: 9px 11px; font-size: 13.5px; font-weight: 600; }
  .ga-yes { color: var(--ok); }
  .ga-no { color: var(--bad); }

  .ga-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin: 24px 0; }
  .ga-stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    box-shadow: var(--shadow-1);
  }
  .ga-stat strong {
    display: block;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .ga-stat i {
    display: block;
    width: 22px;
    height: 2px;
    border-radius: 999px;
    background: var(--accent);
    margin: 10px 0 9px;
  }
  .ga-stat span { font-size: 13px; line-height: 1.4; color: var(--ink-2); }

  .ga-tree { text-align: center; }
  .ga-tree-root {
    display: inline-block;
    background: var(--accent-btn);
    color: var(--on-accent);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    border-radius: 999px;
    padding: 9px 18px;
  }
  .ga-tree-stem { width: 1px; height: 18px; background: var(--line-2); margin: 0 auto; }
  .ga-tree-branches { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; text-align: left; }
  .ga-tree-node { background: var(--surface-2); border-radius: var(--r); padding: 14px; }
  .ga-tree-node > strong { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -0.012em; color: var(--ink); }
  .ga-tree-node > small { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin: 3px 0 11px; }
  .ga-tree-leaves { display: grid; gap: 8px; }
  .ga-leaf { background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .ga-leaf strong { display: block; color: var(--gov-ink); font-weight: 650; }
  .ga-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ga-chips span {
    background: var(--surface);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
  }

  /* comparison table → stacked cards on phones */
  table.ga-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ga-table th, .ga-table td { padding: 11px 13px; text-align: left; vertical-align: top; line-height: 1.5; border-bottom: 1px solid var(--line); }
  .ga-table tbody tr:last-child td { border-bottom: 0; }
  .ga-table thead th { padding-top: 0; border-bottom: 1px solid var(--line-2); }
  .ga-table th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .ga-table td:first-child { font-weight: 600; color: var(--ink); width: 22%; }
  .ga-th-biz { color: var(--biz-ink); }
  .ga-th-gov { color: var(--gov-ink); }
  .ga-th-nfp { color: var(--nfp-ink); }

  @media (max-width: 719px) {
    .ga-table, .ga-table tbody, .ga-table tr, .ga-table td { display: block; }
    .ga-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .ga-table tr { background: var(--surface-2); border-radius: var(--r); padding: 4px 0; margin-bottom: 10px; }
    .ga-table tr:last-child { margin-bottom: 0; }
    .ga-table td { border-bottom: 0; padding: 7px 14px; }
    .ga-table td:first-child {
      width: auto;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-3);
      padding-top: 11px;
    }
    .ga-table td[data-label]::before {
      content: attr(data-label);
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 1px;
    }
    .ga-table td[data-label="Business"]::before { color: var(--biz-ink); }
    .ga-table td[data-label="Government"]::before { color: var(--gov-ink); }
    .ga-table td[data-label="Not-for-profit"]::before { color: var(--nfp-ink); }
  }

  .ga-flow { text-align: center; }
  .ga-flow-node {
    display: inline-block;
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .ga-flow-node small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; letter-spacing: 0; }
  .ga-flow-people { background: var(--accent-btn); color: var(--on-accent); }
  .ga-flow-people small { color: var(--on-accent); opacity: 0.75; }

<script>
(function () {
  'use strict';

  /* =====================================================================

      minutes: 20,
      blurb: 'Why governments and not-for-profits are a different world from business — who they are, what makes them different, and why “net income” cannot tell you how your city is doing.',
      sections: [

        /* ---------------- Section 1: Hook ---------------- */
        {
          id: 'welcome',
          short: 'Welcome',
          title: 'Welcome: a different kind of accounting',
          kicker: 'Setting the stage',
          html: [
            '<p class="ga-lead">You have spent your accounting life so far in the world of business — Apple, Walmart, the corner coffee shop. Before we open a single journal entry in this course, I want you to see why that world will not work here.</p>',
            '<p>Think about the last thing you bought. You handed over money, and you walked away with something you chose, at a price you agreed to. Every number in business accounting is built on that voluntary exchange. Now let me ask you a question: when you pay your property tax bill, what exactly do you walk away with?</p>',
            '<div class="ga-figure">',
            '  <div class="ga-figure-label ga-mono">The exchange you know vs. the one you are about to study</div>',
            '  <div class="ga-compare-cards">',
            '    <div class="ga-cc ga-cc-biz">',
            '      <strong>The business world</strong>',
            '      <div class="ga-cc-flow"><span>You pay Apple $999</span><span class="ga-arrow">&rarr;</span><span>You get an iPhone</span></div>',
            '      <p>A voluntary exchange. You knew the price, you wanted the product, and you received exactly what you paid for.</p>',
            '    </div>',
            '    <div class="ga-cc ga-cc-gov">',
            '      <strong>The government world</strong>',
            '      <div class="ga-cc-flow"><span>You pay $4,000 in property tax</span><span class="ga-arrow">&rarr;</span><span>You get&hellip; what, exactly?</span></div>',
            '      <p>Streets you may never drive, schools you may not use, a fire department you hope you never call. And you must pay either way.</p>',
            '    </div>',
            '  </div>',
            '</div>',
            '<p>Here is another one: you can buy a share of Ford and sell it tomorrow. Can you sell your share of the fire department? Of course not — there is no share to sell. Nobody <em>owns</em> the fire department the way shareholders own Ford.</p>',
            '<div class="ga-note"><span class="ga-callout-tag ga-mono">Professor&rsquo;s note</span><p>Whenever you feel lost this semester, come back to two simple questions: <em>Who owns this organization?</em> and <em>What do the people who fund it get back?</em> For a business, the answers are easy. For a government or a not-for-profit, those answers change everything about the accounting.</p></div>',
            '<div class="ga-takeaway"><span class="ga-callout-tag ga-mono">Key takeaway</span><p>Governments and not-for-profits are not just businesses with a different logo. The exchange between the organization and the people who fund it is fundamentally different — so the accounting must be different too.</p></div>'
          ].join('\n')
        },

        /* ---------------- Section 2: The landscape ---------------- */
        {
          id: 'landscape',
          short: 'The landscape',
          title: 'The landscape: who are these organizations?',
          kicker: 'Meet the players',
          html: [
            '<p class="ga-lead">Before we classify anything, let us appreciate how big this world is. This is not a niche topic — it is a huge slice of the economy.</p>',
            '<div class="ga-stats">',
            '  <div class="ga-stat"><strong>50</strong><i></i><span>state governments, plus the federal government</span></div>',
            '  <div class="ga-stat"><strong>90,056</strong><i></i><span>local governments per the census of governments</span></div>',
            '  <div class="ga-stat"><strong>&asymp;1.6M</strong><i></i><span>tax-exempt not-for-profit organizations</span></div>',
            '</div>',
            '<p>Those 90,056 local governments include 3,031 counties, 19,519 municipalities, 16,360 towns and townships, 12,880 independent school districts, and 38,266 special district governments. Now, we do not memorize a phone book — we organize it. Governments come in two flavors:</p>',
            '<h3>General purpose governments</h3>',
            '<p>These are states, counties, municipalities (cities, towns, villages), and townships. The key word is <strong>general</strong>: they provide a <em>wide range</em> of services to their residents — police and fire protection, sanitation, streets, roads and bridges, parks, culture and recreation.</p>',
            '<h3>Special purpose governments</h3>',
            '<p>These are independent school districts, public colleges and universities, and special districts. The key word is <strong>special</strong>: they exist to do <em>one job</em> (or a limited number of jobs) — education, drainage and flood control, irrigation, fire protection, water supply. And here is the part students miss: state law still gives them real governmental power, including the power to levy and collect taxes.</p>',
            '<div class="ga-example"><span class="ga-callout-tag ga-mono">Real-world example</span><p>Think about one address in Chicago. The <strong>City of Chicago</strong> sends police when you call 911, fixes the street, and runs the parks — that is a general purpose government doing many jobs. The <strong>school district</strong> serving that same address does exactly one thing: educate children. Same house, two governments, and both of them can show up on your property tax bill.</p></div>',
            '<h3>And the not-for-profits?</h3>',
            '<p>Not-for-profit organizations are private, not governmental — but they are not businesses either. Private colleges and universities, community service and health care organizations, certain libraries and museums, professional and trade associations, fraternal and social organizations, religious organizations. Nearly 1.6 million of them hold tax-exempt status.</p>',
            '<div class="ga-figure">',
            '  <div class="ga-figure-label ga-mono">The map of the territory</div>',
            '  <div class="ga-tree" role="img" aria-label="Tree diagram: government and not-for-profit organizations split into governments (general purpose and special purpose) and not-for-profits">',
            '    <div class="ga-tree-root">Government &amp; not-for-profit organizations</div>',
            '    <div class="ga-tree-stem"></div>',
            '    <div class="ga-tree-branches">',
            '      <div class="ga-tree-node">',
            '        <strong>Governments</strong>',
            '        <small>1 federal &middot; 50 states &middot; 90,056 local</small>',
            '        <div class="ga-tree-leaves">',
            '          <div class="ga-leaf"><strong>General purpose</strong>States, counties, municipalities, townships &mdash; a wide range of services</div>',
            '          <div class="ga-leaf"><strong>Special purpose</strong>School districts, public universities, special districts &mdash; one job or a few</div>',
            '        </div>',
            '      </div>',
            '      <div class="ga-tree-node">',
            '        <strong>Not-for-profits</strong>',
            '        <small>&asymp;1.6 million tax-exempt</small>',
            '        <div class="ga-chips"><span>Private colleges</span><span>Hospitals</span><span>Museums</span><span>Charities</span><span>Religious organizations</span><span>Trade associations</span></div>',
            '      </div>',
            '    </div>',
            '  </div>',
            '</div>',
            '<div class="ga-note"><span class="ga-callout-tag ga-mono">Professor&rsquo;s note</span><p>Ask yourself: is your school district a business? It has employees, buildings, payroll, a budget&hellip; so why doesn&rsquo;t it report like Walmart? Hold that question — the next section answers it.</p></div>',
            '<div class="ga-takeaway"><span class="ga-callout-tag ga-mono">Key takeaway</span><p><strong>General purpose</strong> governments do many jobs; <strong>special purpose</strong> governments do one job — but both are real governments with the power to tax. Not-for-profits are private organizations that also do not exist to earn a profit.</p></div>'
          ].join('\n')
        },

        /* ---------------- Section 3: FASB three characteristics ---------------- */
        {
          id: 'fasb',
          short: 'FASB’s three tests',
          title: 'The FASB&rsquo;s three distinguishing characteristics',
          kicker: 'What makes them different',
          html: [
            '<p class="ga-lead">In its <em>Statement of Financial Accounting Concepts No. 4</em>, the FASB named three characteristics that separate governments and not-for-profits from business organizations. Let us take them one at a time — with an example for each, because a rule without an example is just words.</p>',
            '<h3>(a) Resource providers do not expect a proportionate return</h3>',
            '<p>Significant resources come from people who expect neither repayment nor economic benefits proportionate to what they gave.</p>',
            '<div class="ga-example"><span class="ga-callout-tag ga-mono">Real-world example</span><p>Give a food bank $10,000 and you expect&hellip; nothing back. Not the money, not $10,000 worth of groceries. Now lend a corporation $10,000 by buying its bond, and you expect every penny back <em>plus interest</em>. Same $10,000, completely different expectation — that is characteristic (a).</p></div>',
            '<h3>(b) The operating purpose is something other than profit</h3>',
            '<p>These organizations exist to provide services, not to sell goods or services at a profit or a profit equivalent.</p>',
            '<div class="ga-example"><span class="ga-callout-tag ga-mono">Real-world example</span><p>An art museum runs a free school-visit program it <em>knows</em> loses money — and it keeps running it, on purpose, because educating students <strong>is the mission</strong>. If Walmart found a store that reliably lost money, how long would that store stay open?</p></div>',
            '<h3>(c) There are no ownership interests</h3>',
            '<p>There are no defined ownership interests that can be sold, transferred, or redeemed, and none that entitle anyone to a share of the leftovers if the organization ever liquidates.</p>',
            '<div class="ga-example"><span class="ga-callout-tag ga-mono">Real-world example</span><p>You can buy a share of Ford this afternoon and sell it tomorrow. You cannot buy a share of the American Red Cross, and you cannot buy a share of the State of Ohio. And if a city ever dissolved, no &ldquo;shareholder&rdquo; would line up for a slice of the city hall — because there are no shareholders.</p></div>',
            '<div class="ga-figure">',
            '  <div class="ga-figure-label ga-mono">Three questions, three worlds</div>',
            '  <table class="ga-table">',
            '    <thead><tr><th></th><th class="ga-th-biz">Business</th><th class="ga-th-gov">Government</th><th class="ga-th-nfp">Not-for-profit</th></tr></thead>',
            '    <tbody>',
            '      <tr><td>Who provides resources, and what do they get back?</td><td data-label="Business">Customers and investors — goods, repayment, dividends in proportion to what they paid</td><td data-label="Government">Taxpayers — services, with no link between the tax paid and the benefit received</td><td data-label="Not-for-profit">Donors — nothing back except the mission being carried out</td></tr>',
            '      <tr><td>What is the goal?</td><td data-label="Business">Earn a profit for the owners</td><td data-label="Government">Provide public services</td><td data-label="Not-for-profit">Carry out a charitable, educational, or social mission</td></tr>',
            '      <tr><td>Who owns it?</td><td data-label="Business">Shareholders or proprietors, with interests they can sell</td><td data-label="Government">No one — no ownership interests exist</td><td data-label="Not-for-profit">No one — no ownership interests exist</td></tr>',
            '    </tbody>',
            '  </table>',
            '</div>',
            '<div class="ga-takeaway"><span class="ga-callout-tag ga-mono">Key takeaway</span><p>Three tests: no proportionate return for resource providers, no profit motive, no ownership interests. Fail all three the way a city or a charity does, and business-style accounting stops making sense.</p></div>'
          ].join('\n')

        {
          id: 'gasb',

  /* =====================================================================
     State & persistence
     ===================================================================== */

  var STORAGE_KEY = 'govacct:v1';
  var app = document.getElementById('app');
  var shell = document.getElementById('ga-shell');
  var rail = document.getElementById('ga-rail');
  var stepper = document.getElementById('ga-stepper');
  var seg = document.getElementById('ga-seg');
  var stepName = document.getElementById('ga-step-name');
  var stepCount = document.getElementById('ga-step-count');

  var state = loadState();
  var quizRun = null; // in-memory state for the current quiz attempt

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        parsed.furthest = parsed.furthest || {};
        parsed.bestScore = parsed.bestScore || {};
        return parsed;
      }
    } catch (err) { /* private mode etc. — run without persistence */ }
    return { furthest: {}, bestScore: {} };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { /* ignore */ }
  }

  /* ---------------- Theme ---------------- */

  if (state.theme === 'light' || state.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', state.theme);
  }

  function currentTheme() {
    var stamped = document.documentElement.getAttribute('data-theme');
    if (stamped) { return stamped; }
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  document.getElementById('ga-theme').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    state.theme = next;
    saveState();
  });

  /* =====================================================================
     Router: '' or '#/' -> home, '#/lesson/1/3' -> lesson 1, step 3.
     Steps 0..sections.length-1 are content; step sections.length is the quiz.
     ===================================================================== */

  function findLesson(id) {
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === id) { return LESSONS[i]; }
    }
    return null;
  }

  function parseHash() {
    var hash = location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'lesson' && parts[1]) {
      var id = parseInt(parts[1], 10);
      var step = parseInt(parts[2], 10);
      return { view: 'lesson', id: id, step: isNaN(step) ? 0 : step };
    }
    return { view: 'home' };
  }

  function go(hash) { location.hash = hash; }

  function currentPosition() {
    var route = parseHash();
    if (route.view !== 'lesson') { return null; }
    var lesson = findLesson(route.id);
    if (!lesson) { return null; }
    var total = lesson.sections.length + 1;
    return { lesson: lesson, step: Math.min(Math.max(route.step, 0), total - 1), total: total };
  }

  function render() {
    var pos = currentPosition();
    if (pos) { renderLesson(pos.lesson, pos.step); } else { renderHome(); }
  }

  /* =====================================================================
     Home view
     ===================================================================== */

  function renderHome() {
    shell.classList.add('ga-centered');
    shell.classList.remove('ga-with-rail');
    rail.hidden = true;
    stepper.hidden = true;
    document.title = 'Governmental Accounting — Lessons';

    var html = [
      '<div class="ga-view">',
      '<div class="ga-hero">',
      '  <p class="ga-section-kicker ga-mono">Course home</p>',
      '  <h2>Learn it the way a professor teaches it</h2>',
      '  <p class="ga-lead">Plain language, a concrete example for every concept, and side-by-side comparisons of business, government, and not-for-profit. Pick a lesson to begin.</p>',
      '</div>'
    ];

    LESSONS.forEach(function (lesson) {
      var furthest = state.furthest[lesson.id] || 0;
      var best = state.bestScore[lesson.id];
      var status;
      if (typeof best === 'number') {
        status = 'Best score ' + best + ' / ' + lesson.quiz.length + ' &middot; Revisit any time';
      } else if (furthest > 0) {
        status = 'In progress &mdash; resume where you left off';
      } else {
        status = 'Start lesson';
      }
      html.push(
        '<button type="button" class="ga-lesson-card" data-lesson="' + lesson.id + '">' +
        '  <span class="ga-card-meta ga-mono"><span class="ga-card-lo">' + lesson.lo + '</span><span>Lesson ' + lesson.id + '</span><span>&middot;</span><span>' + lesson.sections.length + ' sections</span><span>&middot;</span><span>' + lesson.minutes + ' min</span></span>' +
        '  <h2>' + lesson.title + '</h2>' +
        '  <p>' + lesson.blurb + '</p>' +
        '  <span class="ga-card-foot"><span class="ga-card-status">' + status + '</span><span class="ga-card-go" aria-hidden="true">&rarr;</span></span>' +
        '</button>'
      );
    });

    html.push(
      '<div class="ga-lesson-card ga-locked">' +
      '  <span class="ga-card-meta ga-mono"><span class="ga-card-lo">Coming soon</span><span>Lesson 2</span></span>' +
      '  <h2>Applying the foundations</h2>' +
      '  <p>The next lessons dig deep into application — funds, budgets, and journal entries built on the overview you learn here.</p>' +
      '</div>',
      '</div>'
    );

    app.innerHTML = html.join('\n');

    var cards = app.querySelectorAll('.ga-lesson-card[data-lesson]');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () {
        var id = parseInt(this.getAttribute('data-lesson'), 10);
        go('#/lesson/' + id + '/' + (state.furthest[id] || 0));
      });
    }
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Progress chrome: desktop rail + mobile stepper
     ===================================================================== */

  function stepState(step, current) {
    if (step === current) { return 'current'; }
    return step < current ? 'done' : 'todo';
  }

  function renderChrome(lesson, step) {
    var total = lesson.sections.length + 1;
    var pct = Math.round(((step + 1) / total) * 100);

    var railHtml = [
      '<p class="ga-rail-lo ga-mono">' + lesson.lo + ' &middot; Lesson ' + lesson.id + '</p>',
      '<p class="ga-rail-title">' + lesson.title + '</p>',
      '<div class="ga-rail-meter">',
      '  <span class="ga-rail-track"><span class="ga-rail-fill" style="width:' + pct + '%"></span></span>',
      '  <span class="ga-rail-pct">' + pct + '%</span>',
      '</div>',
      '<div class="ga-rail-list">'
    ];
    lesson.sections.forEach(function (section, i) {
      railHtml.push(
        '<button type="button" class="ga-rail-item" data-step="' + i + '" data-state="' + stepState(i, step) + '">' +
        '<span class="ga-rail-num">' + (i < step ? '&#10003;' : (i + 1)) + '</span>' +
        '<span>' + section.short + '</span>' +
        '</button>'
      );
    });
    railHtml.push(
      '<button type="button" class="ga-rail-item" data-step="' + lesson.sections.length + '" data-state="' + stepState(lesson.sections.length, step) + '">' +
      '<span class="ga-rail-num">&#9733;</span><span>Knowledge check</span></button>',
      '</div>'
    );
    rail.innerHTML = railHtml.join('\n');
    rail.hidden = false;

    var segHtml = [];
    for (var i = 0; i < total; i++) {
      var label = i < lesson.sections.length ? lesson.sections[i].short : 'Knowledge check';
      segHtml.push('<button type="button" data-step="' + i + '" data-state="' + stepState(i, step) + '" aria-label="Go to ' + label + '"></button>');
    }
    seg.innerHTML = segHtml.join('');
    stepName.textContent = step < lesson.sections.length ? lesson.sections[step].short : 'Knowledge check';
    stepCount.textContent = step < lesson.sections.length
      ? (step + 1) + ' / ' + lesson.sections.length
      : 'Final step';
    stepper.hidden = false;

    var jump = function () { go('#/lesson/' + lesson.id + '/' + this.getAttribute('data-step')); };
    var targets = rail.querySelectorAll('[data-step]');
    for (var j = 0; j < targets.length; j++) { targets[j].addEventListener('click', jump); }
    var segs = seg.querySelectorAll('[data-step]');
    for (var k = 0; k < segs.length; k++) { segs[k].addEventListener('click', jump); }
  }

  /* =====================================================================
     Lesson view
     ===================================================================== */

  function renderLesson(lesson, step) {
    if ((state.furthest[lesson.id] || 0) < step) {
      state.furthest[lesson.id] = step;
      saveState();
    }

    shell.classList.remove('ga-centered');
    shell.classList.add('ga-with-rail');
    renderChrome(lesson, step);

    if (step === lesson.sections.length) {
      renderQuiz(lesson);
      return;
    }

    var section = lesson.sections[step];
    document.title = lesson.title + ' — ' + section.short;

    app.innerHTML = [
      '<div class="ga-view">',
      '<p class="ga-section-kicker ga-mono">' + lesson.lo + ' &middot; ' + section.kicker + '</p>',
      '<h2>' + section.title + '</h2>',
      section.html,
      '<div class="ga-section-nav">',
      '  <button type="button" class="ga-btn" id="ga-prev">' + (step === 0 ? '&larr; All lessons' : '&larr; Previous') + '</button>',
      '  <button type="button" class="ga-btn ga-btn-primary" id="ga-next">' +
      (step === lesson.sections.length - 1 ? 'Knowledge check &rarr;' : 'Next section &rarr;') +
      '</button>',
      '</div>',
      '</div>'
    ].join('\n');

    document.getElementById('ga-prev').addEventListener('click', function () {
      if (step === 0) { go('#/'); } else { go('#/lesson/' + lesson.id + '/' + (step - 1)); }
    });
    document.getElementById('ga-next').addEventListener('click', function () {
      go('#/lesson/' + lesson.id + '/' + (step + 1));
    });
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Knowledge check
     ===================================================================== */

  function renderQuiz(lesson) {
    document.title = lesson.title + ' — Knowledge check';
    if (!quizRun || quizRun.lessonId !== lesson.id) {
      quizRun = { lessonId: lesson.id, index: 0, correct: 0, answered: false };
    }

    if (quizRun.index >= lesson.quiz.length) {
      renderQuizScore(lesson);
      return;
    }

    var q = lesson.quiz[quizRun.index];
    var html = [
      '<div class="ga-view">',
      '<p class="ga-section-kicker ga-mono">' + lesson.lo + ' &middot; Knowledge check</p>',
      '<p class="ga-quiz-progress ga-mono">Question ' + (quizRun.index + 1) + ' of ' + lesson.quiz.length + '</p>',
      '<p class="ga-quiz-question">' + q.question + '</p>'
    ];
    q.choices.forEach(function (choice, i) {
      html.push(
        '<button type="button" class="ga-choice" data-choice="' + i + '">' +
        '<span class="ga-choice-letter" aria-hidden="true">' + String.fromCharCode(65 + i) + '</span>' +
        '<span class="ga-choice-text">' + choice + '</span>' +
        '<span class="ga-choice-mark" aria-hidden="true"></span>' +
        '</button>'
      );
    });
    html.push(
      '<div id="ga-quiz-feedback"></div>',
      '<div class="ga-section-nav">',
      '  <button type="button" class="ga-btn" id="ga-quiz-back">&larr; Back to lesson</button>',
      '  <button type="button" class="ga-btn ga-btn-primary" id="ga-quiz-next" disabled>' +
      (quizRun.index === lesson.quiz.length - 1 ? 'See my score &rarr;' : 'Next question &rarr;') +
      '</button>',
      '</div>',
      '</div>'
    );

    app.innerHTML = html.join('\n');

    var choices = app.querySelectorAll('.ga-choice');
    var nextBtn = document.getElementById('ga-quiz-next');
    var feedbackBox = document.getElementById('ga-quiz-feedback');

    for (var i = 0; i < choices.length; i++) {
      choices[i].addEventListener('click', function () {
        if (quizRun.answered) { return; }
        quizRun.answered = true;
        var picked = parseInt(this.getAttribute('data-choice'), 10);
        var right = picked === q.answer;
        if (right) { quizRun.correct += 1; }

        for (var j = 0; j < choices.length; j++) {
          choices[j].disabled = true;
          var idx = parseInt(choices[j].getAttribute('data-choice'), 10);
          var mark = choices[j].querySelector('.ga-choice-mark');
          if (idx === q.answer) {
            choices[j].classList.add('ga-correct');
            mark.innerHTML = '&#10003;';
          } else if (idx === picked && !right) {
            choices[j].classList.add('ga-wrong');
            mark.innerHTML = '&#10007;';
          }
        }

        feedbackBox.innerHTML =
          '<div class="ga-quiz-feedback ' + (right ? 'ga-fb-right' : 'ga-fb-wrong') + '">' +
          '<strong>' + (right ? 'Correct.' : 'Not quite.') + '</strong>' +
          q.explain +
          '</div>';
        nextBtn.disabled = false;
        nextBtn.focus();
      });
    }

    nextBtn.addEventListener('click', function () {
      quizRun.index += 1;
      quizRun.answered = false;
      renderQuiz(lesson);
    });
    document.getElementById('ga-quiz-back').addEventListener('click', function () {
      go('#/lesson/' + lesson.id + '/' + (lesson.sections.length - 1));
    });
    window.scrollTo(0, 0);
  }

  function renderQuizScore(lesson) {
    var total = lesson.quiz.length;
    var score = quizRun.correct;
    var prevBest = state.bestScore[lesson.id];
    if (typeof prevBest !== 'number' || score > prevBest) {
      state.bestScore[lesson.id] = score;
      saveState();
    }

    var heading, message;
    if (score === total) {
      heading = 'You own this lesson';
      message = 'Perfect score. The foundations are set for the applied lessons ahead.';
    } else if (score >= Math.ceil(total * 0.6)) {
      heading = 'Solid work';
      message = 'Skim the sections behind the questions you missed, and these ideas will lock in.';
    } else {
      heading = 'Worth another pass';
      message = 'This lesson is the foundation for the whole course. Review the sections and try again — repetition is how it sticks.';
    }

    app.innerHTML = [
      '<div class="ga-view">',
      '<p class="ga-section-kicker ga-mono">' + lesson.lo + ' &middot; Knowledge check</p>',
      '<div class="ga-quiz-score">',
      '  <div class="ga-ring" style="--pct:' + Math.round((score / total) * 100) + '" role="img" aria-label="Score ' + score + ' out of ' + total + '">',
      '    <div class="ga-ring-inner">' + score + '<span>/' + total + '</span></div>',
      '  </div>',
      '  <h2>' + heading + '</h2>',
      '  <p>' + message + '</p>',
      '  <div class="ga-score-actions">',
      '    <button type="button" class="ga-btn" id="ga-review">Review lesson</button>',
      '    <button type="button" class="ga-btn" id="ga-retake">Retake quiz</button>',
      '    <button type="button" class="ga-btn ga-btn-primary" id="ga-home">Back to lessons</button>',
      '  </div>',
      '</div>',
      '</div>'
    ].join('\n');

    document.getElementById('ga-review').addEventListener('click', function () {
      quizRun = null;
      go('#/lesson/' + lesson.id + '/0');
    });
    document.getElementById('ga-retake').addEventListener('click', function () {
      quizRun = { lessonId: lesson.id, index: 0, correct: 0, answered: false };
      renderQuiz(lesson);
    });
    document.getElementById('ga-home').addEventListener('click', function () {
      quizRun = null;
      go('#/');
    });
    window.scrollTo(0, 0);
  }

  /* =====================================================================
     Boot
     ===================================================================== */

  document.getElementById('ga-brand').addEventListener('click', function () { go('#/'); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') { return; }
    var pos = currentPosition();
    if (!pos) { return; }
    if (e.key === 'ArrowRight' && pos.step < pos.total - 1) {
      go('#/lesson/' + pos.lesson.id + '/' + (pos.step + 1));
    } else if (e.key === 'ArrowLeft' && pos.step > 0) {
      go('#/lesson/' + pos.lesson.id + '/' + (pos.step - 1));
    }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
