name: Deploy web app to GitHub Pages

# Publishes the self-contained PWA (index.html + manifest + service worker + icons)
# to GitHub Pages. One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/financial-accounting-app-l7ddti
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp ledger-lab.html ledger-lab.webmanifest _site/
          cp -r icons/* _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
