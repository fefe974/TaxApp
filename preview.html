:root{
  --lienzo:#0B1A29;
  --cabecera-1:#122B42;
  --cabecera-2:#1A3A57;
  --fondo:#F2F5F8;
  --panel:#FFFFFF;
  --panel-2:#F4F7FA;
  --borde:#D8E0E9;
  --borde-suave:#E1E8EF;
  --acento:#2F6FAD;
  --acento-claro:#8FC1EA;
  --acento-tinte:#EAF2FA;
  --acento-borde:#C6DCEF;

  --debe-borde:#F0C9C3;
  --haber:#1E7A4D;
  --haber-tinte:#E7F4EC;
  --haber-borde:#BFE3CD;

  --texto-suave:#5B6B7B;
  --sombra:0 1px 3px rgba(16,35,55,.08), 0 8px 24px rgba(16,35,55,.07);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--lienzo);
  font-family:'IBM Plex Sans',system-ui,sans-serif;

  display:flex;justify-content:center;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47,111,173,.28), transparent 60%);
}
.telefono{
  width:100%;max-width:430px;min-height:100dvh;
  background:var(--fondo);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.5);
}

  .telefono{min-height:auto;height:min(880px,94vh);margin:3vh 0;border-radius:34px;border:1px solid rgba(255,255,255,.08)}
}

/* ---------- cabecera ---------- */
header.app{
  background:linear-gradient(160deg,var(--cabecera-1) 0%, var(--cabecera-2) 100%);
  color:#fff;
  padding:22px 22px 18px;
  position:relative;
  flex-shrink:0;
}
header.app::after{
  content:&quot;&quot;;position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--acento-claro) 20%,var(--acento-claro) 80%,transparent);
  opacity:.8;
}
.marca{display:flex;align-items:baseline;gap:10px}
.marca h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.marca h1 em{color:var(--acento-claro);font-style:normal}
.folio{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.5);text-transform:uppercase}
.subtitulo{margin-top:3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}

/* ---------- barra de ecuación ---------- */
.ecuacion-viva{
  margin-top:16px;background:rgba(255,255,255,.06);
  border:1px solid rgba(143,193,234,.28);
  border-radius:10px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;
}
.ecuacion-viva .celda{text-align:center}
.ecuacion-viva .etiqueta{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
.ecuacion-viva .cifra{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.ecuacion-viva .signo{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--acento-claro)}

/* ---------- contenido ---------- */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.pantalla{display:none;padding:20px 18px 28px;animation:aparecer .3s ease both}
.pantalla.activa{display:block}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.ojal{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--texto-suave);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ojal::after{content:&quot;&quot;;flex:1;height:1px;background:var(--borde)}
h2.titulo{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:6px}
h2.titulo em{font-style:normal;color:var(--acento)}
p.intro{font-size:13px;line-height:1.55;color:var(--texto-suave);margin-bottom:16px;max-width:38ch}

/* ---------- paneles tipo software ---------- */
.panel{
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  box-shadow:var(--sombra);overflow:hidden;
}
.panel-tit{
  display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border-bottom:1px solid var(--borde-suave);
  padding:8px 12px;font-size:9.5px;letter-spacing:.1em;font-weight:700;
  color:var(--texto-suave);text-transform:uppercase;
}
.panel-tit .chip{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;
  padding:2px 8px;border-radius:999px;letter-spacing:.06em;
  background:var(--acento-tinte);color:var(--acento);border:1px solid var(--acento-borde);

.panel-cuerpo{padding:14px}

/* ecuación héroe */

.eq-hero .termino{text-align:center}

.eq-hero .termino span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-suave);font-weight:600}
.eq-hero .op{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--acento);font-weight:600}
.doble-regla{margin:12px 0 0;border-top:2px solid var(--texto);border-bottom:1px solid var(--texto);height:4px}

/* ---------- tarjetas de principios ---------- */
.principios{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.principio{
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  padding:13px 14px;display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 1px 3px rgba(16,35,55,.06);
}
.principio .icono{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:var(--acento-tinte);border:1px solid var(--acento-borde);
  display:flex;align-items:center;justify-content:center;color:var(--acento);
}
.principio h3{font-size:13.5px;font-weight:700;margin-bottom:2px}
.principio p{font-size:12.5px;line-height:1.5;color:var(--texto-suave)}

.nota-pie{
  margin-top:14px;font-size:12px;color:#33506B;line-height:1.55;
  background:var(--acento-tinte);border:1px solid var(--acento-borde);
  border-radius:9px;padding:10px 12px;
}
.nota-pie b{color:var(--texto)}

/* ---------- módulos (asientos) ---------- */
.asiento{
  background:var(--panel);border:1px solid var(--borde);border-radius:10px;
  margin-bottom:10px;overflow:hidden;transition:opacity .3s, border-color .3s;

.asiento .desc{font-size:13px;font-weight:600;line-height:1.35}
.asiento .lineas{padding:0 13px 11px 13px}

.asiento .accion{border-top:1px solid var(--borde-suave);padding:9px 13px;display:flex;justify-content:flex-end}
.btn-registrar{
  font-family:inherit;font-size:12.5px;font-weight:600;
  background:var(--acento);color:#fff;border:none;border-radius:8px;
  padding:9px 18px;cursor:pointer;transition:transform .15s, background .2s;
}
.btn-registrar:active{transform:scale(.97)}
.asiento .sello-ok{
  display:inline-block;margin-left:auto;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;font-weight:600;
  color:var(--haber);background:var(--haber-tinte);border:1px solid var(--haber-borde);
  border-radius:999px;padding:3px 9px;
}
.asiento.bloqueado{opacity:.5;pointer-events:none}
.asiento.bloqueado .sello-ok{color:var(--texto-suave);background:var(--panel-2);border-color:var(--borde)}

/* ---------- tarjeta resumen ---------- */
.comprobacion{
  margin-top:16px;background:linear-gradient(160deg,var(--cabecera-1),var(--cabecera-2));
  color:#fff;border-radius:12px;padding:18px;position:relative;overflow:hidden;
  animation:aparecer .35s ease both;
}
.comprobacion h3{font-size:16px;font-weight:700;margin-bottom:12px;max-width:70%}
.comp-fila{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.comp-fila b{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}
.comp-fila.total{border-bottom:none;border-top:2px solid var(--acento-claro);margin-top:6px;padding-top:10px;font-weight:600}
.estampa{
  position:absolute;right:14px;top:14px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;font-weight:600;
  color:#7ED9A7;background:rgba(30,122,77,.28);border:1px solid rgba(126,217,167,.45);
  border-radius:999px;padding:5px 10px;
}

/* ---------- barra de pestañas ---------- */
nav.pestanas{
  flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--lienzo);padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(143,193,234,.2);
}
.pestana{
  font-family:inherit;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:7px 4px;border-radius:10px;color:rgba(255,255,255,.42);
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  transition:color .2s, background .2s;
}
.pestana svg{width:21px;height:21px}
.pestana.activa{color:var(--acento-claro);background:rgba(143,193,234,.12)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<style>
:root{
  --lienzo:#0B1A29;--cabecera-1:#122B42;--cabecera-2:#1A3A57;--fondo:#F2F5F8;--panel:#FFFFFF;--panel-2:#F4F7FA;
  --borde:#D8E0E9;--borde-suave:#E1E8EF;--acento:#2F6FAD;--acento-claro:#8FC1EA;--acento-tinte:#EAF2FA;--acento-borde:#C6DCEF;
  --debe:#A93226;--debe-tinte:#FBEAE7;--debe-borde:#F0C9C3;--haber:#1E7A4D;--haber-tinte:#E7F4EC;--haber-borde:#BFE3CD;
  --texto:#16283A;--texto-suave:#5B6B7B;--sombra:0 1px 3px rgba(16,35,55,.08), 0 8px 24px rgba(16,35,55,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--lienzo);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--texto);display:flex;justify-content:center;background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47,111,173,.28), transparent 60%)}
.telefono{width:100%;max-width:430px;min-height:100dvh;background:var(--fondo);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.5)}
@media(min-width:480px){.telefono{min-height:auto;height:min(880px,94vh);margin:3vh 0;border-radius:34px;border:1px solid rgba(255,255,255,.08)}}

header.app{background:linear-gradient(160deg,var(--cabecera-1) 0%, var(--cabecera-2) 100%);color:#fff;padding:22px 22px 18px;position:relative;flex-shrink:0}
header.app::after{content:&quot;&quot;;position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--acento-claro) 20%,var(--acento-claro) 80%,transparent);opacity:.8}
.marca{display:flex;align-items:baseline;gap:10px}
.marca h1{font-size:20px;font-weight:700;letter-spacing:-.01em;cursor:pointer}
.marca h1 em{color:var(--acento-claro);font-style:normal}
.folio{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.5);text-transform:uppercase}
.subtitulo{margin-top:3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}
.ecuacion-viva{margin-top:16px;background:rgba(255,255,255,.06);border:1px solid rgba(143,193,234,.28);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.ecuacion-viva .celda{text-align:center}
.ecuacion-viva .etiqueta{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600}
.ecuacion-viva .cifra{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;transition:color .3s}
.ecuacion-viva .signo{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--acento-claro)}
.ecuacion-viva.parpadeo .cifra{color:var(--acento-claro)}
.ecuacion-viva.rota .cifra{color:#F0A9A0}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.pantalla{display:none;padding:20px 18px 30px;animation:aparecer .3s ease both}
.pantalla.activa{display:block}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* concepto */
.ojal{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--texto-suave);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ojal .num-c{font-family:'IBM Plex Mono',monospace;color:var(--acento);background:var(--acento-tinte);border:1px solid var(--acento-borde);border-radius:5px;padding:2px 7px}
.ojal::after{content:&quot;&quot;;flex:1;height:1px;background:var(--borde)}
h2.titulo{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.18;margin-bottom:6px}
h2.titulo em{font-style:normal;color:var(--acento)}
p.intro{font-size:13px;line-height:1.55;color:var(--texto-suave);margin-bottom:6px;max-width:38ch}

/* etiqueta de parte (1 explanation / 2 illustration / 3 tool) */
.parte-eti{display:flex;align-items:center;gap:9px;margin:24px 0 11px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--texto-suave)}
.parte-eti .paso{width:22px;height:22px;border-radius:6px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex-shrink:0}
.parte-eti.ilu .paso{background:#5B6B7B}
.parte-eti.tool .paso{background:var(--haber)}
.parte-eti::after{content:&quot;&quot;;flex:1;height:1px;background:var(--borde)}

/* explicación */
.explicacion{font-size:13.5px;line-height:1.6;color:#2A3E50}
.explicacion p + p{margin-top:9px}
.lista-def{list-style:none;margin:11px 0 0;display:flex;flex-direction:column;gap:8px}
.lista-def li{position:relative;padding-left:20px;font-size:13px;line-height:1.5;color:#2A3E50}
.lista-def li::before{content:&quot;&quot;;position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--acento)}
.lista-def li b{color:var(--texto)}
.clave{margin-top:12px;font-size:12.5px;color:#33506B;line-height:1.55;background:var(--acento-tinte);border:1px solid var(--acento-borde);border-radius:9px;padding:10px 12px}
.clave b{color:var(--texto)}

/* paneles */
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);overflow:hidden}
.panel-tit{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-bottom:1px solid var(--borde-suave);padding:8px 12px;font-size:9.5px;letter-spacing:.1em;font-weight:700;color:var(--texto-suave);text-transform:uppercase}
.panel-tit .chip{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.06em;background:var(--acento-tinte);color:var(--acento);border:1px solid var(--acento-borde)}
.panel-tit .chip.fig{background:#EEF1F4;color:#5B6B7B;border-color:var(--borde)}
.panel-cuerpo{padding:14px}

/* cuenta T */
.cuentaT .cabezaT{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--borde-suave)}
.cuentaT .cabezaT b{font-size:13.5px;font-weight:700}
.cuentaT .codigo{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:var(--texto-suave);background:var(--panel-2);border:1px solid var(--borde-suave);border-radius:6px;padding:2px 7px}
.cuentaT .colsCab{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border-bottom:1px solid var(--borde-suave)}
.cuentaT .colsCab div{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;color:var(--texto-suave);text-align:center;padding:6px 4px}
.cuentaT .colsCab div:first-child{border-right:1px solid var(--borde-suave);color:var(--debe)}
.cuentaT .colsCab div:last-child{color:var(--haber)}
.cuentaT .cuerpoT{display:grid;grid-template-columns:1fr 1fr;min-height:96px}
.cuentaT .lado{padding:14px 10px;text-align:center}
.cuentaT .lado:first-child{border-right:1px solid var(--borde-suave)}
.cuentaT .pieT{border-top:1px solid var(--borde-suave);background:var(--panel-2);padding:8px 12px;text-align:center;font-size:11.5px;color:var(--texto-suave)}
.cuentaT .pieT b{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em}
.montos{list-style:none;min-height:40px}
.montos li{font-family:'IBM Plex Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;padding:1.5px 0;animation:aparecer .25s ease both}
.insignia{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:7px 11px;border-radius:7px}
.insignia.neutra{background:var(--acento-tinte);color:var(--acento);border:1px solid var(--acento-borde)}

/* Illustration 2.2 */
.ilus22{display:flex;flex-direction:column;gap:12px}
.caja-nb{border:1.5px solid;border-radius:10px;padding:12px}
.caja-nb.debe-caja{border-color:var(--debe-borde);background:var(--debe-tinte)}
.caja-nb.haber-caja{border-color:var(--haber-borde);background:var(--haber-tinte)}
.nb-tit{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px}
.nb-cuenta{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.nb-cuenta:last-child{margin-bottom:0}
.nb-nombre{font-size:12px;font-weight:600;margin-bottom:6px}
.nb-t{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--borde-suave);border-radius:6px;overflow:hidden}
.nb-col{padding:5px 6px;text-align:center}
.nb-col:first-child{border-right:1px solid var(--borde-suave)}
.nb-h{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.04em}
.nb-s{display:block;font-size:10px;color:var(--texto-suave);margin-top:1px}

/* double-entry diagram */
.de-flujo{display:flex;flex-direction:column;align-items:center;gap:9px}
.de-caja{background:var(--panel-2);border:1px solid var(--borde);border-radius:8px;padding:10px 14px;text-align:center;font-size:12.5px;font-weight:600;width:100%}
.de-caja small{display:block;font-weight:400;color:var(--texto-suave);font-size:11px;margin-top:2px}
.de-flecha{color:var(--acento);font-size:13px}
.de-entradas{width:100%;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
.de-linea{display:grid;grid-template-columns:1fr auto;padding:8px 12px;font-size:12px}
.de-linea span:last-child{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.de-linea.cargo{color:var(--debe)}
.de-linea.abono{padding-left:26px;color:var(--haber);border-top:1px solid var(--borde-suave)}
.de-balance{width:100%;background:var(--haber-tinte);border:1px solid var(--haber-borde);color:var(--haber);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;text-align:center;font-family:'IBM Plex Mono',monospace}

/* tool: botones y drill */
.respuestas{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px 13px 13px}
.btn-lado{font-family:inherit;font-size:12.5px;font-weight:600;background:var(--panel);border-radius:8px;padding:11px 8px;cursor:pointer;transition:transform .15s}
.btn-lado:active{transform:scale(.97)}
.btn-lado.debe{border:1px solid var(--debe-borde);color:var(--debe)}
.btn-lado.haber{border:1px solid var(--haber-borde);color:var(--haber)}
.btn-lado span{display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-suave);margin-top:2px;font-weight:600}
.btn-fantasma{width:100%;font-family:inherit;font-size:12px;font-weight:600;background:transparent;border:1px solid var(--borde);color:var(--texto-suave);border-radius:8px;padding:9px;cursor:pointer}
.marcador{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--texto-suave);text-transform:uppercase;margin:12px 2px;display:flex;justify-content:space-between}
.asiento{background:var(--panel);border:1px solid var(--borde);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(16,35,55,.06);transition:opacity .3s, border-color .3s}
.asiento .encabezado{display:flex;align-items:center;gap:10px;padding:12px 13px 8px}
.asiento .num{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;flex-shrink:0;background:var(--acento-tinte);color:var(--acento);border:1px solid var(--acento-borde)}
.asiento .desc{font-size:13px;font-weight:600;line-height:1.35}
.asiento .lineas{padding:2px 13px 8px}
.linea-diario{display:grid;grid-template-columns:1fr 74px 74px;gap:6px;align-items:baseline;font-size:12px;padding:3px 0}
.linea-diario.cab{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-suave);font-weight:600;border-bottom:1px solid var(--borde-suave);padding-bottom:5px;margin-bottom:2px}
.linea-diario.cab span:nth-child(2),.linea-diario.cab span:nth-child(3){text-align:right}
.linea-diario .cuenta{color:var(--texto)}
.linea-diario .cuenta.abono{padding-left:16px;color:var(--texto-suave)}
.linea-diario .monto{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.linea-diario .monto.cargo{color:var(--debe)}
.linea-diario .monto.abono{color:var(--haber)}
.asiento .accion{border-top:1px solid var(--borde-suave);padding:9px 13px;display:flex;justify-content:flex-end}
.btn-registrar{font-family:inherit;font-size:12.5px;font-weight:600;background:var(--acento);color:#fff;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;transition:transform .15s}
.btn-registrar:active{transform:scale(.97)}
.btn-registrar:disabled{background:#B9C6D2;cursor:default}
.asiento.registrado{border-color:var(--haber-borde)}
.asiento.registrado .accion{display:none}
.asiento .sello-ok{display:none}
.asiento.registrado .sello-ok{display:inline-block;margin-left:auto;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;font-weight:600;color:var(--haber);background:var(--haber-tinte);border:1px solid var(--haber-borde);border-radius:999px;padding:3px 9px}
.asiento.bloqueado{opacity:.5;pointer-events:none}
.veredicto{margin:0 13px 12px;font-size:12px;line-height:1.5;border-radius:8px;padding:9px 11px}
.veredicto.bien{background:var(--haber-tinte);color:var(--haber);border:1px solid var(--haber-borde)}
.veredicto.mal{background:var(--debe-tinte);color:var(--debe);border:1px solid var(--debe-borde)}
.temblor{animation:temblor .3s ease}
@keyframes temblor{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* trial balance */
.reng{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:baseline;font-size:12.5px;padding:6px 13px}
.reng + .reng{border-top:1px solid var(--borde-suave)}
.reng .c{color:var(--texto-suave)}
.reng .m{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.reng .m.debe-c{color:var(--debe)}
.reng .m.haber-c{color:var(--haber)}
.reng.granTotal{border-top:2px solid var(--texto);font-weight:600;background:var(--panel-2)}
.reng.granTotal .c{color:var(--texto)}
.reng.granTotal .m{border-bottom:3px double var(--texto);padding-bottom:2px}

.comprobacion{margin-top:16px;background:linear-gradient(160deg,var(--cabecera-1),var(--cabecera-2));color:#fff;border-radius:12px;padding:18px;position:relative;overflow:hidden;display:none;animation:aparecer .35s ease both}
.comprobacion.visible{display:block}
.comprobacion h3{font-size:16px;font-weight:700;margin-bottom:12px;max-width:70%}
.comp-fila{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.comp-fila b{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}
.comp-fila.total{border-bottom:none;border-top:2px solid var(--acento-claro);margin-top:6px;padding-top:10px;font-weight:600}
.estampa{position:absolute;right:14px;top:14px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;font-weight:600;color:#7ED9A7;background:rgba(30,122,77,.28);border:1px solid rgba(126,217,167,.45);border-radius:999px;padding:5px 10px}

.btn-siguiente{margin-top:24px;width:100%;font-family:inherit;font-size:12.5px;font-weight:600;background:var(--acento);color:#fff;border:none;border-radius:9px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn-siguiente:active{transform:scale(.98)}

nav.pestanas{flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--lienzo);padding:8px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(143,193,234,.2)}
.pestana{font-family:inherit;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:10px;color:rgba(255,255,255,.42);font-size:9px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;transition:color .2s, background .2s}
.pestana svg{width:21px;height:21px}
.pestana.activa{color:var(--acento-claro);background:rgba(143,193,234,.12)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class=&quot;telefono&quot;>

  <header class=&quot;app&quot;>
    <div class=&quot;marca&quot;>
      <h1 id=&quot;volverIntro&quot; title=&quot;Back to course&quot;>Ledger<em>Lab</em></h1>
      <span class=&quot;folio&quot;>Module 2.1</span>
    </div>
    <div class=&quot;subtitulo&quot;>Debits and Credits</div>
    <div class=&quot;ecuacion-viva&quot; id=&quot;ecuacionViva&quot;>
      <div class=&quot;celda&quot;><div class=&quot;etiqueta&quot;>Total Debits</div><div class=&quot;cifra&quot; id=&quot;evD&quot;>$0</div></div>
      <div class=&quot;signo&quot;>=</div>
      <div class=&quot;celda&quot;><div class=&quot;etiqueta&quot;>Total Credits</div><div class=&quot;cifra&quot; id=&quot;evC&quot;>$0</div></div>
    </div>
  </header>

  <main id=&quot;principal&quot;>

    <!-- ============ CONCEPT 1 ============ -->
    <section class=&quot;pantalla activa&quot; id=&quot;p-c1&quot;>
      <div class=&quot;ojal&quot;><span class=&quot;num-c&quot;>Concept 1 / 3</span></div>
      <h2 class=&quot;titulo&quot;>Debits and Credits</h2>
      <p class=&quot;intro&quot;>Debit means left; credit means right. They describe where an entry goes — not whether it is good or bad.</p>

      <div class=&quot;parte-eti&quot;><span class=&quot;paso&quot;>1</span> Explanation</div>
      <div class=&quot;explicacion&quot;>
        <p>The terms <b>debit</b> (Dr.) and <b>credit</b> (Cr.) mean <b>left</b> and <b>right</b>, respectively. They do not mean increase or decrease — they describe <b>where</b> a company makes an entry.</p>
        <ul class=&quot;lista-def&quot;>
          <li>An entry on the left side of an account is a <b>debit to</b> the account.</li>
          <li>An entry on the right side is a <b>credit to</b> the account.</li>
          <li>An account shows a <b>debit balance</b> if total debits exceed the credits.</li>
          <li>An account shows a <b>credit balance</b> if total credits exceed the debits.</li>
        </ul>
        <div class=&quot;clave&quot;>Debits on the left and credits on the right is simply an accounting <b>custom</b> — like driving on the right-hand side of the road. The custom is now the rule, and it applies to <b>all</b> accounts.</div>
      </div>

      <div class=&quot;parte-eti ilu&quot;><span class=&quot;paso&quot;>2</span> Illustration</div>
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-tit&quot;>Anatomy of a T-account<span class=&quot;chip fig&quot;>FIGURE</span></div>
        <div class=&quot;cuentaT&quot;>
          <div class=&quot;cabezaT&quot;><b>Account Title</b><span class=&quot;codigo&quot;>GL-XXXX</span></div>
          <div class=&quot;colsCab&quot;><div>Debit · Dr · left</div><div>Credit · Cr · right</div></div>
          <div class=&quot;cuerpoT&quot;>
            <div class=&quot;lado&quot;><span class=&quot;insignia neutra&quot;>enter on the left</span></div>
            <div class=&quot;lado&quot;><span class=&quot;insignia neutra&quot;>enter on the right</span></div>
          </div>
          <div class=&quot;pieT&quot;>Balance sits on the side with the larger total — <b style=&quot;color:var(--debe)&quot;>debit</b> or <b style=&quot;color:var(--haber)&quot;>credit</b>.</div>
        </div>
      </div>

      <div class=&quot;parte-eti tool&quot;><span class=&quot;paso&quot;>3</span> Apply it</div>
      <p class=&quot;intro&quot;>Post amounts to Cash, then read which side wins.</p>
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-tit&quot;>Account register<span class=&quot;chip&quot;>LIVE</span></div>
        <div class=&quot;cuentaT&quot;>
          <div class=&quot;cabezaT&quot;><b>Cash</b><span class=&quot;codigo&quot;>GL-1010</span></div>
          <div class=&quot;colsCab&quot;><div>Debit (Dr)</div><div>Credit (Cr)</div></div>
          <div class=&quot;cuerpoT&quot;>
            <div class=&quot;lado&quot;><ul class=&quot;montos&quot; id=&quot;montosDebe&quot;></ul></div>
            <div class=&quot;lado&quot;><ul class=&quot;montos&quot; id=&quot;montosHaber&quot;></ul></div>
          </div>
          <div class=&quot;pieT&quot; id=&quot;pieBalance&quot;>No entries yet — post something below.</div>
        </div>

    <!-- ============ CONCEPT 2 ============ -->
    <section class=&quot;pantalla&quot; id=&quot;p-c2&quot;>
      <div class=&quot;ojal&quot;><span class=&quot;num-c&quot;>Concept 2 / 3</span></div>
      <h2 class=&quot;titulo&quot;>Debit &amp;amp; Credit Rules</h2>
      <p class=&quot;intro&quot;>Each account type increases on one specific side. That side is its normal balance.</p>

      <div class=&quot;parte-eti&quot;><span class=&quot;paso&quot;>1</span> Explanation</div>
      <div class=&quot;explicacion&quot;>
        <p>Increases to all <b>asset</b> and <b>expense</b> accounts occur on the left (debit) side; decreases on the right (credit) side.</p>
        <p>Conversely, increases to all <b>liability</b>, <b>revenue</b>, and most <b>stockholders' equity</b> accounts occur on the right (credit) side; decreases on the left.</p>
        <div class=&quot;clave&quot;>An account's <b>normal balance</b> is the side that increases it. One exception in the equity family: <b>Dividends</b> increases on the <b>debit</b> side.</div>
      </div>

      <div class=&quot;parte-eti ilu&quot;><span class=&quot;paso&quot;>2</span> Illustration</div>

              <div class=&quot;nb-cuenta&quot;><div class=&quot;nb-nombre&quot;>Expense Accounts</div><div class=&quot;nb-t&quot;><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--debe)&quot;>Debit</span><span class=&quot;nb-s&quot;>+ increase</span></div><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--haber)&quot;>Credit</span><span class=&quot;nb-s&quot;>− decrease</span></div></div></div>
            </div>
            <div class=&quot;caja-nb haber-caja&quot;>
              <div class=&quot;nb-tit&quot;>Normal Balance — <span style=&quot;color:var(--haber)&quot;>Credit</span></div>
              <div class=&quot;nb-cuenta&quot;><div class=&quot;nb-nombre&quot;>Liability Accounts</div><div class=&quot;nb-t&quot;><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--debe)&quot;>Debit</span><span class=&quot;nb-s&quot;>− decrease</span></div><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--haber)&quot;>Credit</span><span class=&quot;nb-s&quot;>+ increase</span></div></div></div>
              <div class=&quot;nb-cuenta&quot;><div class=&quot;nb-nombre&quot;>Stockholders' Equity Accounts</div><div class=&quot;nb-t&quot;><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--debe)&quot;>Debit</span><span class=&quot;nb-s&quot;>− decrease</span></div><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--haber)&quot;>Credit</span><span class=&quot;nb-s&quot;>+ increase</span></div></div></div>
              <div class=&quot;nb-cuenta&quot;><div class=&quot;nb-nombre&quot;>Revenue Accounts</div><div class=&quot;nb-t&quot;><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--debe)&quot;>Debit</span><span class=&quot;nb-s&quot;>− decrease</span></div><div class=&quot;nb-col&quot;><span class=&quot;nb-h&quot; style=&quot;color:var(--haber)&quot;>Credit</span><span class=&quot;nb-s&quot;>+ increase</span></div></div></div>
            </div>
          </div>

      </div>

      <div class=&quot;parte-eti tool&quot;><span class=&quot;paso&quot;>3</span> Apply it</div>
      <p class=&quot;intro&quot;>Eight changes — post each to the correct side.</p>
      <div class=&quot;marcador&quot;><span id=&quot;drillPos&quot;>Item 1 of 8</span><span id=&quot;drillPuntos&quot;>0 first-try correct</span></div>
      <div id=&quot;cartaDrill&quot;></div>
      <div class=&quot;comprobacion&quot; id=&quot;compDrill&quot;>
        <div class=&quot;estampa&quot; id=&quot;estampaDrill&quot;>MASTERED ✓</div>
        <h3>Rules applied</h3>
        <div class=&quot;comp-fila&quot;><span>First-try correct</span><b id=&quot;resumenPuntos&quot;>0 / 8</b></div>

        <button class=&quot;btn-fantasma&quot; id=&quot;btnDrillReset&quot; style=&quot;border-color:rgba(255,255,255,.3);color:#fff;margin-top:14px&quot;>Run the drill again</button>
      </div>

      <button class=&quot;btn-siguiente&quot; data-goto=&quot;p-c3&quot;>Next concept · The Double-Entry System ▸</button>

    <!-- ============ CONCEPT 3 ============ -->
    <section class=&quot;pantalla&quot; id=&quot;p-c3&quot;>
      <div class=&quot;ojal&quot;><span class=&quot;num-c&quot;>Concept 3 / 3</span></div>
      <h2 class=&quot;titulo&quot;>The Double-Entry System</h2>
      <p class=&quot;intro&quot;>Every transaction is recorded with equal debits and credits — which lets the books prove themselves.</p>

      <div class=&quot;parte-eti&quot;><span class=&quot;paso&quot;>1</span> Explanation</div>
      <div class=&quot;explicacion&quot;>
        <p>Under the <b>double-entry</b> system, a company records the dual (two-sided) effect of each transaction in appropriate accounts.</p>
        <ul class=&quot;lista-def&quot;>
          <li>This system offers a means of <b>proving the accuracy</b> of the recorded amounts.</li>
          <li>If every transaction is recorded with equal debits and credits, then the <b>sum of all debits must equal the sum of all credits</b>.</li>
        </ul>
      </div>

      <div class=&quot;parte-eti ilu&quot;><span class=&quot;paso&quot;>2</span> Illustration</div>
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-tit&quot;>One transaction, two entries<span class=&quot;chip fig&quot;>FIGURE</span></div>
        <div class=&quot;panel-cuerpo&quot;>

              <div class=&quot;de-linea cargo&quot;><span>Dr · Cash</span><span>$1,500</span></div>

            </div>
            <div class=&quot;de-flecha&quot;>▼</div>

      <p class=&quot;intro&quot;>Post four transactions and watch total debits stay equal to total credits — in the register and the header bar.</p>
      <div id=&quot;listaPrueba&quot;></div>
      <div class=&quot;panel&quot; style=&quot;margin-top:6px&quot;>
        <div class=&quot;panel-tit&quot;>Trial balance · running totals<span class=&quot;chip&quot; id=&quot;chipPrueba&quot;>0 / 4 POSTED</span></div>
        <div class=&quot;reng&quot;><span class=&quot;c&quot;>Total debits</span><span class=&quot;m debe-c&quot; id=&quot;totalDebe&quot;>$0</span></div>
        <div class=&quot;reng&quot;><span class=&quot;c&quot;>Total credits</span><span class=&quot;m haber-c&quot; id=&quot;totalHaber&quot;>$0</span></div>
        <div class=&quot;reng granTotal&quot;><span class=&quot;c&quot;>Difference</span><span class=&quot;m&quot; id=&quot;totalDif&quot;>$0</span></div>
      </div>
      <div class=&quot;comprobacion&quot; id=&quot;compPrueba&quot;>
        <div class=&quot;estampa&quot;>BALANCED ✓</div>
        <h3>Accuracy, demonstrated</h3>
        <div class=&quot;comp-fila&quot;><span>Sum of all debits</span><b id=&quot;pruebaDebe&quot;>$0</b></div>
        <div class=&quot;comp-fila&quot;><span>Sum of all credits</span><b id=&quot;pruebaHaber&quot;>$0</b></div>
        <div class=&quot;comp-fila total&quot;><span>Total debits = Total credits</span><b>✓</b></div>
        <button class=&quot;btn-fantasma&quot; id=&quot;btnPruebaReset&quot; style=&quot;border-color:rgba(255,255,255,.3);color:#fff;margin-top:14px&quot;>Reset the proof</button>
      </div>

      <button class=&quot;btn-siguiente&quot; id=&quot;btnNextLesson&quot;>Next lesson · The Accounting Equation ▸</button>
    </section>
  </main>

      Debit·Credit

      <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M12 3v18M3 7h18M7 7l-3.5 6a3.5 3.5 0 0 0 7 0L7 7ZM17 7l-3.5 6a3.5 3.5 0 0 0 7 0L17 7Z&quot;/></svg>
      The Rules

      <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M4 20V10M10 20V4M16 20v-7M21 20H3&quot;/></svg>
      Double-Entry

<script>
const fmt = n => (n<0?&quot;-&quot;:&quot;&quot;) + &quot;$&quot; + Math.abs(n).toLocaleString(&quot;en-US&quot;);
const $ = id => document.getElementById(id);
$(&quot;volverIntro&quot;).addEventListener(&quot;click&quot;,()=>{top.__nav('intro')});
$(&quot;btnNextLesson&quot;).addEventListener(&quot;click&quot;,()=>{top.__nav('l22')});

/* header Dr = Cr */
let totDebe = 0, totHaber = 0;
const ecuacionViva = $(&quot;ecuacionViva&quot;);
function pintaEcuacion(){
  $(&quot;evD&quot;).textContent = fmt(totDebe); $(&quot;evC&quot;).textContent = fmt(totHaber);
  ecuacionViva.classList.toggle(&quot;rota&quot;, totDebe !== totHaber);
  ecuacionViva.classList.add(&quot;parpadeo&quot;); setTimeout(()=>ecuacionViva.classList.remove(&quot;parpadeo&quot;), 500);
}

/* navegación por conceptos */
const pestanas = document.querySelectorAll(&quot;.pestana&quot;);
function irA(dest){
  pestanas.forEach(x=>{const on=x.dataset.destino===dest;x.classList.toggle(&quot;activa&quot;,on);x.setAttribute(&quot;aria-selected&quot;,on)});
  document.querySelectorAll(&quot;.pantalla&quot;).forEach(p=>p.classList.toggle(&quot;activa&quot;, p.id===dest));
  $(&quot;principal&quot;).scrollTo({top:0});
}
pestanas.forEach(b=>b.addEventListener(&quot;click&quot;,()=>irA(b.dataset.destino)));
document.querySelectorAll(&quot;.btn-siguiente[data-goto]&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>irA(b.dataset.goto)));

/* ===== C1 tool: Cash register ===== */
const AMOUNTS = [300,200,500,150,400,250]; let idx = 0;
const efectivo = {debe:[], haber:[]};
function pintaBalance(){
  $(&quot;montosDebe&quot;).innerHTML  = efectivo.debe.map(m=>`<li>${fmt(m)}</li>`).join(&quot;&quot;);
  $(&quot;montosHaber&quot;).innerHTML = efectivo.haber.map(m=>`<li>${fmt(m)}</li>`).join(&quot;&quot;);
  const d = efectivo.debe.reduce((a,b)=>a+b,0), h = efectivo.haber.reduce((a,b)=>a+b,0);
  const pie = $(&quot;pieBalance&quot;);
  if(!d &amp;&amp; !h){ pie.innerHTML = &quot;No entries yet — post something below.&quot;; return; }
  if(d>h)      pie.innerHTML = `Debits exceed credits → <b style=&quot;color:var(--debe)&quot;>DEBIT BALANCE ${fmt(d-h)}</b>`;
  else if(h>d) pie.innerHTML = `Credits exceed debits → <b style=&quot;color:var(--haber)&quot;>CREDIT BALANCE ${fmt(h-d)}</b>`;
  else         pie.innerHTML = `Both columns equal → <b style=&quot;color:var(--acento)&quot;>NO BALANCE</b>`;
}
$(&quot;btnPostDebe&quot;).addEventListener(&quot;click&quot;,()=>{ efectivo.debe.push(AMOUNTS[idx++ % AMOUNTS.length]); pintaBalance(); });
$(&quot;btnPostHaber&quot;).addEventListener(&quot;click&quot;,()=>{ efectivo.haber.push(AMOUNTS[idx++ % AMOUNTS.length]); pintaBalance(); });
$(&quot;btnLimpiar&quot;).addEventListener(&quot;click&quot;,()=>{ efectivo.debe=[]; efectivo.haber=[]; idx=0; pintaBalance(); });

/* ===== C2 tool: rules drill ===== */
const PREGUNTAS = [
  {q:&quot;Cash increases after a customer pays.&quot;, tipo:&quot;an asset&quot;, r:&quot;debe&quot;, regla:&quot;Assets increase on the debit (left) side.&quot;},
  {q:&quot;Accounts Payable increases on a purchase on account.&quot;, tipo:&quot;a liability&quot;, r:&quot;haber&quot;, regla:&quot;Liabilities increase on the credit (right) side.&quot;},
  {q:&quot;Service Revenue is earned this period.&quot;, tipo:&quot;a revenue account&quot;, r:&quot;haber&quot;, regla:&quot;Revenues increase on the credit (right) side.&quot;},
  {q:&quot;Rent Expense is incurred for the month.&quot;, tipo:&quot;an expense&quot;, r:&quot;debe&quot;, regla:&quot;Expenses increase on the debit (left) side.&quot;},
  {q:&quot;Cash decreases when the company pays a bill.&quot;, tipo:&quot;an asset decreasing&quot;, r:&quot;haber&quot;, regla:&quot;Assets decrease on the credit (right) side.&quot;},
  {q:&quot;Common Stock increases when shares are issued.&quot;, tipo:&quot;stockholders' equity&quot;, r:&quot;haber&quot;, regla:&quot;Equity accounts increase on the credit side.&quot;},
  {q:&quot;Dividends are declared and paid.&quot;, tipo:&quot;the exception&quot;, r:&quot;debe&quot;, regla:&quot;Dividends is the equity account that increases by debit.&quot;},
  {q:&quot;Notes Payable decreases when the loan is repaid.&quot;, tipo:&quot;a liability decreasing&quot;, r:&quot;debe&quot;, regla:&quot;Liabilities decrease on the debit (left) side.&quot;},
];
let qi = 0, puntos = 0, fallado = false;
function pintaDrill(){
  if(qi >= PREGUNTAS.length){
    $(&quot;cartaDrill&quot;).innerHTML = &quot;&quot;;
    $(&quot;drillPos&quot;).textContent = &quot;Drill finished&quot;;
    $(&quot;resumenPuntos&quot;).textContent = `${puntos} / ${PREGUNTAS.length}`;
    $(&quot;estampaDrill&quot;).textContent = puntos === PREGUNTAS.length ? &quot;MASTERED ✓&quot; : &quot;COMPLETE&quot;;
    $(&quot;compDrill&quot;).classList.add(&quot;visible&quot;);
    setTimeout(()=>$(&quot;compDrill&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;end&quot;}), 200);
    return;
  }
  const p = PREGUNTAS[qi]; fallado = false;
  $(&quot;drillPos&quot;).textContent = `Item ${qi+1} of ${PREGUNTAS.length}`;
  $(&quot;cartaDrill&quot;).innerHTML = `
    <div class=&quot;asiento&quot; id=&quot;cartaActiva&quot;>
      <div class=&quot;encabezado&quot;><span class=&quot;num&quot;>Q-${qi+1}</span><span class=&quot;desc&quot;>${p.q}</span><span class=&quot;sello-ok&quot;>POSTED ✓</span></div>
      <div class=&quot;lineas&quot; style=&quot;color:var(--texto-suave);font-size:12px&quot;>This is ${p.tipo} — which column records it?</div>
      <div class=&quot;respuestas&quot;>
        <button class=&quot;btn-lado debe&quot; data-r=&quot;debe&quot;>Debit<span>left column</span></button>
        <button class=&quot;btn-lado haber&quot; data-r=&quot;haber&quot;>Credit<span>right column</span></button>
      </div>
      <div id=&quot;feedbackDrill&quot;></div>
    </div>`;
  document.querySelectorAll(&quot;#cartaDrill .btn-lado&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>responde(b.dataset.r)));
}
function responde(r){
  const p = PREGUNTAS[qi], fb = $(&quot;feedbackDrill&quot;);
  if(r === p.r){
    if(!fallado) puntos++;
    $(&quot;drillPuntos&quot;).textContent = `${puntos} first-try correct`;
    $(&quot;cartaActiva&quot;).classList.add(&quot;registrado&quot;);
    fb.innerHTML = `<div class=&quot;veredicto bien&quot;><b>Correct.</b> ${p.regla}</div>`;
    totDebe += 100; totHaber += 100; pintaEcuacion();
    qi++; setTimeout(pintaDrill, 1300);
  }else{
    fallado = true;
    fb.innerHTML = `<div class=&quot;veredicto mal&quot;><b>Not quite.</b> ${p.regla} Try the other side.</div>`;
    $(&quot;cartaActiva&quot;).classList.remove(&quot;temblor&quot;); void $(&quot;cartaActiva&quot;).offsetWidth; $(&quot;cartaActiva&quot;).classList.add(&quot;temblor&quot;);
  }
}
$(&quot;btnDrillReset&quot;).addEventListener(&quot;click&quot;,()=>{
  qi=0; puntos=0; $(&quot;drillPuntos&quot;).textContent=&quot;0 first-try correct&quot;; $(&quot;compDrill&quot;).classList.remove(&quot;visible&quot;);
  pintaDrill(); irA(&quot;p-c2&quot;);
});
pintaDrill();

/* ===== C3 tool: journal → trial balance ===== */
const TRANS = [
  {desc:&quot;Stockholders invest $10,000 cash in the business&quot;, diario:[[&quot;Cash&quot;,10000,&quot;cargo&quot;],[&quot;Common Stock&quot;,10000,&quot;abono&quot;]]},
  {desc:&quot;Equipment is purchased for $3,000 on account&quot;, diario:[[&quot;Equipment&quot;,3000,&quot;cargo&quot;],[&quot;Accounts Payable&quot;,3000,&quot;abono&quot;]]},
  {desc:&quot;Services are performed for $1,500 cash&quot;, diario:[[&quot;Cash&quot;,1500,&quot;cargo&quot;],[&quot;Service Revenue&quot;,1500,&quot;abono&quot;]]},
  {desc:&quot;Rent of $800 is paid in cash&quot;, diario:[[&quot;Rent Expense&quot;,800,&quot;cargo&quot;],[&quot;Cash&quot;,800,&quot;abono&quot;]]},
];
let paso = 0, pDebe = 0, pHaber = 0;
function pintaPrueba(){
  const lista = $(&quot;listaPrueba&quot;); lista.innerHTML = &quot;&quot;;
  TRANS.forEach((t,i)=>{
    const d = document.createElement(&quot;div&quot;);
    d.className = &quot;asiento&quot; + (i<paso?&quot; registrado&quot;:&quot;&quot;) + (i>paso?&quot; bloqueado&quot;:&quot;&quot;);
    const lineas = t.diario.map(([cta,m,tipo])=>`
      <div class=&quot;linea-diario&quot;>
        <span class=&quot;cuenta ${tipo}&quot;>${cta}</span>
        <span class=&quot;monto cargo&quot;>${tipo===&quot;cargo&quot; ? m.toLocaleString(&quot;en-US&quot;) : &quot;&quot;}</span>
        <span class=&quot;monto abono&quot;>${tipo===&quot;abono&quot; ? m.toLocaleString(&quot;en-US&quot;) : &quot;&quot;}</span>
      </div>`).join(&quot;&quot;);
    d.innerHTML = `
      <div class=&quot;encabezado&quot;><span class=&quot;num&quot;>JE-${i+1}</span><span class=&quot;desc&quot;>${t.desc}</span><span class=&quot;sello-ok&quot;>POSTED ✓</span></div>
      <div class=&quot;lineas&quot;>
        <div class=&quot;linea-diario cab&quot;><span>Account</span><span>Debit</span><span>Credit</span></div>
        ${lineas}
      </div>
      <div class=&quot;accion&quot;><button class=&quot;btn-registrar&quot; data-i=&quot;${i}&quot; ${i!==paso?&quot;disabled&quot;:&quot;&quot;}>Post entry</button></div>`;
    lista.appendChild(d);
  });
  lista.querySelectorAll(&quot;.btn-registrar&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>registra(+b.dataset.i)));
}
function registra(i){
  TRANS[i].diario.forEach(([,m,tipo])=>{ if(tipo===&quot;cargo&quot;){pDebe+=m;totDebe+=m;}else{pHaber+=m;totHaber+=m;} });
  paso++;
  $(&quot;totalDebe&quot;).textContent=fmt(pDebe); $(&quot;totalHaber&quot;).textContent=fmt(pHaber); $(&quot;totalDif&quot;).textContent=fmt(pDebe-pHaber);
  $(&quot;chipPrueba&quot;).textContent = `${paso} / ${TRANS.length} POSTED`;
  pintaEcuacion(); pintaPrueba();
  if(paso === TRANS.length){
    $(&quot;pruebaDebe&quot;).textContent=fmt(pDebe); $(&quot;pruebaHaber&quot;).textContent=fmt(pHaber);
    $(&quot;compPrueba&quot;).classList.add(&quot;visible&quot;);
    setTimeout(()=>$(&quot;compPrueba&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;end&quot;}), 200);
  }
}
$(&quot;btnPruebaReset&quot;).addEventListener(&quot;click&quot;,()=>{

      <div class=&quot;ojal&quot;><span class=&quot;num-c&quot;>Concept 1 / 3</span></div>
      <h2 class=&quot;titulo&quot;>The Basic Equation</h2>
      <p class=&quot;intro&quot;>Because every debit has a matching credit, what a company owns always equals the claims against it.</p>

      <div class=&quot;parte-eti&quot;><span class=&quot;paso&quot;>1</span> Explanation</div>
      <div class=&quot;explicacion&quot;>
        <p>In a double-entry system, for every debit there must be a credit, and vice versa. This leads to the basic accounting equation:</p>
        <p><b>Assets = Liabilities + Stockholders' Equity.</b> The left side lists what the company owns; the right side shows the claims against those assets — first creditors, then owners.</p>
        <div class=&quot;clave&quot;>Assets carry <b>debit</b> balances; liabilities and equity carry <b>credit</b> balances. So the equation is really just <b>total debits = total credits</b>, written another way.</div>
      </div>

            <div class=&quot;eq-op&quot;>+</div>
            <div class=&quot;eq-caja e&quot;><b>Equity</b><span>Credit bal.</span></div>
          </div>

<script>

const ev = $(&quot;ecuacionViva&quot;);

/* ===== C1 tool: equation solver ===== */
const PROBLEMAS = [
  {a:90000, l:40000, e:50000, x:&quot;e&quot;, ops:[50000,130000,40000]},
  {a:85000, l:25000, e:60000, x:&quot;a&quot;, ops:[60000,85000,110000]},
  {a:120000, l:50000, e:70000, x:&quot;l&quot;, ops:[190000,70000,50000]},
];
let si = 0, sPuntos = 0, sFallado = false;
function pintaSolver(){
  if(si >= PROBLEMAS.length){
    $(&quot;svPos&quot;).textContent = &quot;Solver finished&quot;;
    $(&quot;svResumen&quot;).textContent = `${sPuntos} / ${PROBLEMAS.length}`;
    $(&quot;svCuerpo&quot;).innerHTML = `<p style=&quot;font-size:12.5px;color:var(--texto-suave);text-align:center;padding:8px 0&quot;>All three solved. The third element is always fixed by the other two.</p>`;
    $(&quot;compSv&quot;).classList.add(&quot;visible&quot;);
    setTimeout(()=>$(&quot;compSv&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;end&quot;}),200);
    return;
  }
  const p = PROBLEMAS[si]; sFallado = false;
  $(&quot;svPos&quot;).textContent = `Problem ${si+1} of ${PROBLEMAS.length}`;
  const cel = (k,name)=>`<div class=&quot;sv-cel ${p.x===k?&quot;incognita&quot;:&quot;&quot;}&quot;><div class=&quot;lbl&quot;>${name}</div><div class=&quot;val&quot; id=&quot;sv-${k}&quot;>${p.x===k?&quot;?&quot;:&quot;$&quot;+p[k].toLocaleString(&quot;en-US&quot;)}</div></div>`;
  const opts = p.ops.map(v=>`<button class=&quot;btn-sv&quot; data-v=&quot;${v}&quot;>$${v.toLocaleString(&quot;en-US&quot;)}</button>`).join(&quot;&quot;);
  $(&quot;svCuerpo&quot;).innerHTML = `
    <div class=&quot;solver-eq&quot;>
      ${cel(&quot;a&quot;,&quot;Assets&quot;)}<div class=&quot;sv-op&quot;>=</div>${cel(&quot;l&quot;,&quot;Liab.&quot;)}<div class=&quot;sv-op&quot;>+</div>${cel(&quot;e&quot;,&quot;Equity&quot;)}
    </div>
    <div class=&quot;sv-ops&quot;>${opts}</div>
    <div id=&quot;svFb&quot;></div>`;
  document.querySelectorAll(&quot;#svCuerpo .btn-sv&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>respondeSv(b)));
}
function respondeSv(btn){
  const p = PROBLEMAS[si], v = +btn.dataset.v;
  if(v === p[p.x]){
    if(!sFallado) sPuntos++;
    $(&quot;svPuntos&quot;).textContent = `${sPuntos} first-try correct`;
    document.querySelectorAll(&quot;#svCuerpo .btn-sv&quot;).forEach(b=>{b.disabled=true; if(+b.dataset.v===v) b.classList.add(&quot;correcta&quot;)});
    $(&quot;sv-&quot;+p.x).textContent = &quot;$&quot;+p[p.x].toLocaleString(&quot;en-US&quot;);
    $(&quot;sv-&quot;+p.x).parentElement.classList.remove(&quot;incognita&quot;);
    setHeader(p.a, p.l, p.e);
    $(&quot;svFb&quot;).innerHTML = `<div class=&quot;veredicto bien&quot; style=&quot;margin-top:11px&quot;><b>Correct.</b> $${p.a.toLocaleString()} = $${p.l.toLocaleString()} + $${p.e.toLocaleString()}.</div><button class=&quot;btn-next&quot; id=&quot;svNext&quot;>${si===PROBLEMAS.length-1?&quot;Finish ▸&quot;:&quot;Next problem ▸&quot;}</button>`;
    $(&quot;svNext&quot;).addEventListener(&quot;click&quot;,()=>{ si++; pintaSolver(); });
  }else{
    sFallado = true; btn.disabled = true; btn.classList.add(&quot;incorrecta&quot;);
    if(!$(&quot;svFb&quot;).querySelector(&quot;.veredicto&quot;)) $(&quot;svFb&quot;).innerHTML = `<div class=&quot;veredicto mal&quot; style=&quot;margin:11px 0 0&quot;><b>Not balanced.</b> Rearrange: the unknown side must make both sides equal.</div>`;
  }
}
$(&quot;btnSvReset&quot;).addEventListener(&quot;click&quot;,()=>{ si=0; sPuntos=0; $(&quot;svPuntos&quot;).textContent=&quot;0 first-try correct&quot;; $(&quot;compSv&quot;).classList.remove(&quot;visible&quot;); setHeader(0,0,0); pintaSolver(); irA(&quot;p-c1&quot;); });
pintaSolver();

/* ===== C2 illustration + tool ===== */
const I23 = [
  {n:&quot;Assets&quot;, dr:&quot;+&quot;, cr:&quot;−&quot;}, {op:&quot;=&quot;},

const EFECTO = [
  {n:&quot;Revenues earned from services&quot;, r:&quot;up&quot;, regla:&quot;Revenues increase stockholders' equity (credit balance).&quot;},
  {n:&quot;Rent Expense for the period&quot;, r:&quot;down&quot;, regla:&quot;Expenses decrease stockholders' equity (debit balance).&quot;},
  {n:&quot;Common Stock issued to owners&quot;, r:&quot;up&quot;, regla:&quot;Common Stock increases stockholders' equity (credit balance).&quot;},
  {n:&quot;Dividends declared to stockholders&quot;, r:&quot;down&quot;, regla:&quot;Dividends decrease stockholders' equity (debit balance).&quot;},

let ei = 0, ePuntos = 0, eFallado = false;
function pintaEq(){
  if(ei >= EFECTO.length){
    $(&quot;eqPos&quot;).textContent = &quot;Finished&quot;; $(&quot;eqResumen&quot;).textContent = `${ePuntos} / ${EFECTO.length}`;
    $(&quot;cartaEq&quot;).innerHTML = &quot;&quot;; $(&quot;compEq&quot;).classList.add(&quot;visible&quot;);
    setTimeout(()=>$(&quot;compEq&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;end&quot;}),200); return;
  }
  const p = EFECTO[ei]; eFallado = false;
  $(&quot;eqPos&quot;).textContent = `Account ${ei+1} of ${EFECTO.length}`;
  $(&quot;cartaEq&quot;).innerHTML = `
    <div class=&quot;asiento&quot; id=&quot;cartaEqAct&quot;>

        <button class=&quot;btn-clas up&quot; data-r=&quot;up&quot;>▲ Increases equity</button>

  document.querySelectorAll(&quot;#cartaEq .btn-clas&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>respondeEq(b)));
}
function respondeEq(btn){
  const p = EFECTO[ei];
  if(btn.dataset.r === p.r){
    if(!eFallado) ePuntos++;
    $(&quot;eqPuntos&quot;).textContent = `${ePuntos} first-try correct`;
    document.querySelectorAll(&quot;#cartaEq .btn-clas&quot;).forEach(b=>{b.disabled=true; if(b.dataset.r===p.r) b.classList.add(&quot;correcta&quot;); else b.classList.add(&quot;atenuada&quot;)});
    $(&quot;eqFb&quot;).innerHTML = `<div class=&quot;reveal&quot;><div class=&quot;veredicto bien&quot;><b>Correct.</b> ${p.regla}</div><button class=&quot;btn-next&quot; id=&quot;eqNext&quot;>${ei===EFECTO.length-1?&quot;Finish ▸&quot;:&quot;Next account ▸&quot;}</button></div>`;
    $(&quot;eqNext&quot;).addEventListener(&quot;click&quot;,()=>{ ei++; pintaEq(); });

/* ===== C3 tool: Perez analyzer + worksheet ===== */
const CLASES = {A:&quot;Assets only&quot;, AL:&quot;Assets &amp; Liabilities&quot;, AE:&quot;Assets &amp; Equity&quot;, LE:&quot;Liabilities &amp; Equity&quot;};
const PEREZ = [
  {desc:&quot;Owners invest $40,000 in exchange for common stock.&quot;, clase:&quot;AE&quot;, a:40000,l:0,e:40000, nota:&quot;Cash comes in and common stock is issued — equity rises.&quot;},
  {desc:&quot;Disburse $600 cash for administrative wages.&quot;, clase:&quot;AE&quot;, a:-600,l:0,e:-600, nota:&quot;Wages are an expense; the expense reduces equity.&quot;},
  {desc:&quot;Purchase office equipment priced at $5,200, giving a 10% promissory note.&quot;, clase:&quot;AL&quot;, a:5200,l:5200,e:0, nota:&quot;An asset (equipment) rises and a note payable rises with it.&quot;},
  {desc:&quot;Receive $4,000 cash for services performed.&quot;, clase:&quot;AE&quot;, a:4000,l:0,e:4000, nota:&quot;Service revenue increases equity.&quot;},
  {desc:&quot;Pay off a short-term liability of $7,000.&quot;, clase:&quot;AL&quot;, a:-7000,l:-7000,e:0, nota:&quot;Cash falls and the payable is cleared.&quot;},
  {desc:&quot;Declare a cash dividend of $5,000.&quot;, clase:&quot;LE&quot;, a:0,l:5000,e:-5000, nota:&quot;A dividend payable is created; equity falls. Assets change only when it is paid.&quot;},
  {desc:&quot;Convert a long-term liability of $80,000 into common stock.&quot;, clase:&quot;LE&quot;, a:0,l:-80000,e:80000, nota:&quot;Debt is swapped for equity — liabilities down, equity up.&quot;},
  {desc:&quot;Pay cash of $16,000 for a delivery van.&quot;, clase:&quot;A&quot;, a:0,l:0,e:0, aCells:[&quot;−16,000&quot;,&quot;+16,000&quot;], nota:&quot;One asset for another: Cash down $16,000, Equipment up $16,000 — total assets unchanged.&quot;},
];
let ai = 0, balanced = 0; const applied = [];
function pintaAna(){
  if(ai >= PEREZ.length){
    $(&quot;anaPos&quot;).textContent = &quot;All 8 analyzed&quot;;
    $(&quot;cartaAna&quot;).innerHTML = `<div class=&quot;veredicto bien&quot; style=&quot;margin:0&quot;><b>Done —</b> all eight transactions kept the equation balanced. The worksheet proof is below.</div>`;
    return;
  }
  const t = PEREZ[ai];
  $(&quot;anaPos&quot;).textContent = `Transaction ${ai+1} of 8`;
  const opts = [&quot;A&quot;,&quot;AL&quot;,&quot;AE&quot;,&quot;LE&quot;].map(k=>`<button class=&quot;btn-clas&quot; data-k=&quot;${k}&quot;>${CLASES[k]}</button>`).join(&quot;&quot;);
  $(&quot;cartaAna&quot;).innerHTML = `
    <div class=&quot;asiento&quot; id=&quot;cartaActiva&quot;>
      <div class=&quot;encabezado&quot;><span class=&quot;num&quot;>TXN ${ai+1}</span><span class=&quot;desc&quot;>${t.desc}</span></div>
      <div class=&quot;lineas&quot;>Which two elements of the equation does this transaction move?</div>
      <div class=&quot;opciones&quot;>${opts}</div>
      <div id=&quot;revealAna&quot;></div>
    </div>`;
  document.querySelectorAll(&quot;#cartaAna .btn-clas&quot;).forEach(b=>b.addEventListener(&quot;click&quot;,()=>clasifica(b)));
}
function clasifica(btn){
  const t = PEREZ[ai], k = btn.dataset.k;
  if(k === t.clase){
    document.querySelectorAll(&quot;#cartaAna .btn-clas&quot;).forEach(b=>{b.disabled=true; if(b.dataset.k===k) b.classList.add(&quot;correcta&quot;); else b.classList.add(&quot;atenuada&quot;)});
    const aCell = t.aCells
      ? `<span class=&quot;dv dbl&quot;><span class=&quot;neg&quot;>${t.aCells[0]}</span><br><span class=&quot;pos&quot;>${t.aCells[1]}</span></span>`
      : `<span class=&quot;dv ${t.a>0?&quot;pos&quot;:t.a<0?&quot;neg&quot;:&quot;&quot;}&quot;>${signed(t.a)}</span>`;
    $(&quot;revealAna&quot;).innerHTML = `
      <div class=&quot;reveal&quot;>
        <div class=&quot;delta-strip&quot;>
          <div class=&quot;delta-cel&quot;><div class=&quot;dl&quot;>Δ Assets</div>${aCell}</div>
          <div class=&quot;delta-cel&quot;><div class=&quot;dl&quot;>Δ Liabilities</div><span class=&quot;dv ${t.l>0?&quot;pos&quot;:t.l<0?&quot;neg&quot;:&quot;&quot;}&quot;>${signed(t.l)}</span></div>
          <div class=&quot;delta-cel&quot;><div class=&quot;dl&quot;>Δ Equity</div><span class=&quot;dv ${t.e>0?&quot;pos&quot;:t.e<0?&quot;neg&quot;:&quot;&quot;}&quot;>${signed(t.e)}</span></div>
        </div>
        <div class=&quot;veredicto bien&quot;><b>In balance.</b> ${t.nota}</div>
        <button class=&quot;btn-next&quot; id=&quot;btnNextAna&quot;>${ai===PEREZ.length-1?&quot;Finish ▸&quot;:&quot;Next transaction ▸&quot;}</button>
      </div>`;
    setHeader(t.a,t.l,t.e);
    balanced++; $(&quot;anaBal&quot;).textContent = `${balanced} balanced`;
    applied.push(t); pintaWorksheet();
    $(&quot;btnNextAna&quot;).addEventListener(&quot;click&quot;,()=>{ ai++; pintaAna(); });
  }else{
    btn.classList.add(&quot;incorrecta&quot;); btn.disabled = true;
    const card = $(&quot;cartaActiva&quot;); card.classList.remove(&quot;temblor&quot;); void card.offsetWidth; card.classList.add(&quot;temblor&quot;);
    if(!$(&quot;revealAna&quot;).querySelector(&quot;.veredicto.mal&quot;))
      $(&quot;revealAna&quot;).innerHTML = `<div class=&quot;veredicto mal&quot;><b>Not that pair.</b> Trace the cash and what it turns into — which two elements actually change?</div>`;
  }
}
function pintaWorksheet(){
  $(&quot;chipWs&quot;).textContent = `${applied.length} / 8`;
  if(!applied.length){ $(&quot;wsWrap&quot;).innerHTML = `<div class=&quot;ws-vacia&quot;>Classify and apply a transaction to add its first row.</div>`; return; }
  let sa=0,sl=0,se=0;
  const filas = applied.map((t,i)=>{
    sa+=t.a; sl+=t.l; se+=t.e;
    const aCell = t.aCells
      ? `<td><span class=&quot;par&quot; style=&quot;color:var(--debe)&quot;>${t.aCells[0]}</span><span class=&quot;par&quot; style=&quot;color:var(--haber)&quot;>${t.aCells[1]}</span></td>`
      : `<td class=&quot;${t.a>0?&quot;pos&quot;:t.a<0?&quot;neg&quot;:&quot;&quot;}&quot;>${t.a===0?&quot;—&quot;:signed(t.a)}</td>`;
    return `<tr class=&quot;fila-nueva&quot;><td>Txn ${i+1}</td>${aCell}<td class=&quot;${t.l>0?&quot;pos&quot;:t.l<0?&quot;neg&quot;:&quot;&quot;}&quot;>${t.l===0?&quot;—&quot;:signed(t.l)}</td><td class=&quot;${t.e>0?&quot;pos&quot;:t.e<0?&quot;neg&quot;:&quot;&quot;}&quot;>${t.e===0?&quot;—&quot;:signed(t.e)}</td><td class=&quot;ok&quot;>✓</td></tr>`;
  }).join(&quot;&quot;);
  $(&quot;wsWrap&quot;).innerHTML = `<table class=&quot;worksheet&quot;><thead><tr><th>Txn</th><th>Assets</th><th>Liab.</th><th>Equity</th><th>Bal.</th></tr></thead><tbody>${filas}</tbody><tfoot><tr><td>Net</td><td>${signed(sa)}</td><td>${signed(sl)}</td><td>${signed(se)}</td><td class=&quot;ok&quot;>✓</td></tr></tfoot></table>`;
  if(applied.length === 8){
    $(&quot;sumA&quot;).textContent=signed(sa); $(&quot;sumL&quot;).textContent=signed(sl); $(&quot;sumE&quot;).textContent=signed(se);
    $(&quot;compPrueba&quot;).classList.add(&quot;visible&quot;);
  }
}
$(&quot;btnReset&quot;).addEventListener(&quot;click&quot;,()=>{
  ai=0; balanced=0; applied.length=0; $(&quot;anaBal&quot;).textContent=&quot;0 balanced&quot;; setHeader(0,0,0);
  $(&quot;compPrueba&quot;).classList.remove(&quot;visible&quot;); pintaAna(); pintaWorksheet(); irA(&quot;p-c3&quot;);
});
pintaAna(); pintaWorksheet();
</script>
